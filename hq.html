    var ign = g.sim || !x.okGi, picked = g.use && g.use.team === x.team && (g.status === 'picked' || g.status === 'played');
    var nm = who(cl, x.team) || teamName(L, x.team);
    var parts = [el('span', {class:ign ? 'strike' : ''}, nm + ' (' + teamName(L, x.team) + '): ' + x.sc[0] + ' - ' + x.sc[1] + ' at ' + hhmm(x.t)), g.valid.length > 1 && g.valid[0] === x ? tag('EARLIER', 'bk') : null,
      g.sim ? tag('IGNORED: SIM', 'bk') : (!x.okGi ? tag('IGNORED: WRONG GAME', 'bk') : null), picked && g.status === 'picked' ? tag('CHOSEN', 'st') : null];
    if (isC && !state.busy){
      if (g.status === 'conflict' || g.status === 'picked') parts.push(el('button', {type:'button', class:'btn', 'data-use':g.gi + ':' + x.team, disabled:g.status === 'picked' && picked, onclick:function(){ w.picks[g.gi] = x.team; render(); }}, 'USE THIS ONE'));
      var k = 'void:' + x.team;
      if (w.confirm === k) parts.push(el('button', {type:'button', class:'btn danger', 'data-void-yes':String(x.team), onclick:function(){ doVoid(cl, x.team, ctx.wkNo); }}, 'YES, VOID IT'), el('button', {type:'button', class:'btn', onclick:function(){ w.confirm = null; render(); }}, 'KEEP'));
      else parts.push(el('button', {type:'button', class:'btn', 'data-void':String(x.team), onclick:function(){ w.confirm = k; render(); }}, 'VOID'));
    }
    return el('div', {class:'subline'}, parts);
  }
  main.appendChild(table([
    {h:'#', v:function(g){ return String(g.gi + 1); }, n:true},
    {h:'HOME', v:function(g){ return [teamName(L, g.h), who(cl, g.h) ? tag('PERSON: ' + who(cl, g.h), 'me') : null]; }},
    {h:'AWAY', v:function(g){ return [teamName(L, g.a), who(cl, g.a) ? tag('PERSON: ' + who(cl, g.a), 'me') : null]; }},
    {h:'STATUS', v:function(g){ return statusTag(g); }},
    {h:'SUBMISSIONS', v:function(g){ return g.subs.length ? g.subs.map(function(x){ return subLine(g, x); }) : (g.status === 'ai' ? '-' : 'none yet'); }},
    {h:'SIM', v:function(g){
      if (g.status === 'ai') return '-';
      if (!isC) return g.sim ? 'MARKED' : '-';
      return el('button', {type:'button', class:'btn', 'data-sim':String(g.gi), disabled:!!state.busy, onclick:function(){ doSim(cl, g.gi, !g.sim, ctx.wkNo); }}, g.sim ? 'CLEAR SIM' : 'MARK SIM'); }}
  ], sit.games));
  if (sit.strays.length) main.appendChild(el('p', {class:'note'}, 'Submissions that match no game of this round (ignored): from ' + sit.strays.map(function(t){ return teamName(L, t); }).join(', ') + '.'));
  /* ADVANCE */
  var pend = STD.pendingGames(L, sit.hum, {humans:humans}).filter(function(p){ return sit.games[p.gi].status !== 'sim' && sit.games[p.gi].status !== 'conflict'; });
  var adv = el('div', {class:'panel', id:'advancePanel'}, [el('h2', null, 'ADVANCE')]);
  if (pend.length){
    adv.appendChild(el('p', null, 'NOT PLAYED YET (' + pend.length + '):'));
    adv.appendChild(el('ul', {id:'pendingList'}, pend.map(function(p){ return el('li', null, teamName(L, p.h) + ' v ' + teamName(L, p.a) + ' (' + [who(cl, p.h), who(cl, p.a)].filter(Boolean).join(' and ') + ')'); })));
  } else adv.appendChild(el('p', {id:'nothingPending'}, 'Every game with a person is played or marked SIM.'));
  var block = null;
  if (sit.conflicts.length) block = 'Two players sent different scores for ' + sit.conflicts.map(function(gi){ return 'game ' + (gi + 1); }).join(', ') + '. Press USE THIS ONE on the result that counts (or VOID one) before advancing.';
  else if (sit.ties.length) block = 'A playoff game cannot end in a tie: ' + scoreText(L, sit.games[sit.ties[0]], sit.games[sit.ties[0]].use.sc) + '. VOID that result and ask the players to check the score.';
  if (block) adv.appendChild(el('div', {class:'msg warn', id:'advBlock'}, block));
  if (isC){
    var off = !!state.busy || !!block, btns = [];
    if (!pend.length) btns.push(el('button', {type:'button', class:'btn pri', id:'btnAdvance', disabled:off, onclick:function(){ doAdvance(cl, 'sim'); }}, 'ADVANCE'));
    else {
      btns.push(el('button', {type:'button', class:'btn pri', id:'btnAdvanceSim', disabled:off, onclick:function(){ doAdvance(cl, 'sim'); }}, 'ADVANCE AND SIM THE MISSING GAMES'));
      if (!meta.hold) btns.push(el('button', {type:'button', class:'btn', id:'btnWait', disabled:off, onclick:function(){ doAdvance(cl, 'hold'); }}, 'WAIT'));
    }
    if (meta.hold && !pend.length) btns.push(el('button', {type:'button', class:'btn', id:'btnUnhold', disabled:!!state.busy, onclick:function(){ doAdvance(cl, 'unhold'); }}, 'CLEAR THE WAIT'));
    btns.push(el('button', {type:'button', class:'btn', id:'btnWeekRefresh', disabled:!!state.busy, onclick:function(){ reloadWeek(); refreshLeague(cl, null); }}, 'REFRESH THE WEEK'));
    adv.appendChild(el('div', {class:'row'}, btns));
    adv.appendChild(el('p', {class:'note'}, 'Pressing ADVANCE reads all 8 team chunks again (friends spend credits between weeks), plays the week once and writes the week and the new league record together. If another window advanced first, nothing is written.'));
  }
  main.appendChild(adv);
}

/* ---------- AUDIT ---------- */
function baselineFor(cl, i){
  var d = cl.teamDocs[i];
  if (d.bl) return d.bl;
  if (cl.meta.season !== 1) return null;                                       /* a league made by HQ 0.3: season 1 can be made again from rs */
  if (!cl.regenBl){ var R = STD.makeLeague(cl.meta.rs, rulesOf(cl.meta)); cl.regenBl = R.teams.map(function(t){ return blOf(t.ro, R.rules); }); }
  return cl.regenBl[i];
}
function vAudit(main){
  var cl = state.cl, L = cl.L, rules = L.rules;
  add(main, [el('h1', null, 'AUDIT: CREDIT UPGRADES'), el('p', {class:'sub'}, 'Every friend writes a line into his team\'s `up` list when he spends credits. HQ compares each roster with the ratings the commissioner wrote (the baseline) and flags any change that no line explains. This is an honor system: the cloud cannot look inside a roster.')]);
  if (state.msg) main.appendChild(el('div', {class:'msg ' + state.msg.kind, role:'alert'}, state.msg.text));
  var res = [], bad = 0, nob = 0;
  for (var i = 0; i < NTEAMS; i++){
    var bl = baselineFor(cl, i), au = auditTeam(cl.teamDocs[i], rules, bl);
    var flagged = au.changes.filter(function(c){ return !c.explained; }).length + au.unmatched.length;
    res.push({i:i, au:au, flagged:flagged}); bad += flagged; if (au.noBaseline) nob++;
  }
  main.appendChild(cards([['TEAMS WITH SOMETHING TO CHECK', String(res.filter(function(r){ return r.flagged; }).length)], ['RATING CHANGES NO LINE EXPLAINS', String(bad)], ['TEAMS WITHOUT A BASELINE', String(nob)]]));
  res.forEach(function(r){
    var d = cl.teamDocs[r.i], au = r.au, owner = who(cl, r.i);
    var verdict = au.noBaseline ? tag('NO BASELINE: CANNOT CHECK', 'bk') : (r.flagged ? tag(r.flagged + ' TO CHECK', 'rd') : (au.changes.length ? tag('ALL EXPLAINED', 'st') : tag('NO CHANGES', 'st')));
    var box = el('div', {class:'panel', 'data-audit':String(r.i)}, [el('h2', null, [teamName(L, r.i), ' ', owner ? tag('PERSON: ' + owner, 'me') : tag('OPEN', 'bk'), ' ', verdict])]);
    if (au.changes.length) box.appendChild(table([{h:'PLAYER', v:function(c){ return c.nm; }}, {h:'POS', v:function(c){ return c.ps; }}, {h:'RATING', v:function(c){ return c.k; }},
      {h:'BASELINE', v:function(c){ return c.from == null ? '-' : rv(c.from); }, n:true}, {h:'NOW', v:function(c){ return c.to == null ? '-' : rv(c.to); }, n:true}, {h:'', v:function(c){ return c.explained ? tag('EXPLAINED', 'st') : tag('NOT EXPLAINED', 'rd'); }}], au.changes));
    if (au.entries.length) box.appendChild(table([{h:'SEASON', v:function(e){ return str(e.s); }, n:true}, {h:'WEEK', v:function(e){ return str(e.w); }, n:true},
      {h:'PLAYER', v:function(e){ var q = (d.ro || []).filter(function(x){ return x.id === e.id; })[0]; return q ? q.nm : str(e.id, '?'); }}, {h:'RATING', v:function(e){ return str(e.k, '?'); }},
      {h:'FROM', v:function(e){ return rv(e.from); }, n:true}, {h:'TO', v:function(e){ return rv(e.to); }, n:true}], au.entries));
    else box.appendChild(el('p', {class:'note'}, 'No upgrade lines on this team.'));
    if (au.unmatched.length) box.appendChild(el('p', {class:'note'}, 'A line says a rating was changed to a value the roster does not show: ' + au.unmatched.map(function(e){ return str(e.k, '?') + ' of ' + str(e.id, '?') + ' to ' + rv(e.to); }).join('; ') + '.'));
    main.appendChild(box);
  });
  main.appendChild(el('p', {class:'note'}, 'Line format HQ expects in `up`: { s: season, w: week, id: player id, k: rating, from: old value, to: new value }. The game build that lets friends upgrade must write exactly this.'));
}

/* ===================================================================================================================
   MILESTONE 3 screens: OFFSEASON, the people, CHAMPIONS AND HISTORY, ABOUT THIS LEAGUE
   =================================================================================================================== */
function doOffseason(cl){
  return doWeekAction('Running the offseason...', async function(){
    var names = cl.L.teams.map(function(t){ return t.nm; });
    var r = await runOffseason(FB.ad, cl.lg, {uid:state.auth.uid, expect:expectNow(cl), cache:cl.cache});
    state.offReport = {names:names, season:r.season, report:r.report, retired:r.retired, row:r.row, reads:r.reads, writes:r.writes};
    state.wkReport = null; reloadWeek();
    await refreshLeague(cl, r.meta);
  });
}
function offseasonReport(o){
  var box = el('div', {class:'panel', id:'offReport'}, [el('h2', null, 'OFFSEASON DONE: SEASON ' + o.season + ' IS IN THE HISTORY')]);
  box.appendChild(el('p', null, 'Champion: ' + o.names[o.row.ch] + '. Runner-up: ' + o.names[o.row.ru] + '. ' + o.retired + ' players retired and were replaced by rookies. Season ' + (o.season + 1) + ' starts now.'));
  box.appendChild(table([{h:'TEAM', v:function(r){ return o.names[r.team]; }},
    {h:'RETIRED', v:function(r){ return r.retired.length ? r.retired.map(function(p){ return p.ps + ' ' + p.nm + ' (' + p.ag + ')'; }).join(', ') : '-'; }},
    {h:'ROOKIES', v:function(r){ return r.rookies.length ? r.rookies.map(function(p){ return p.ps + ' ' + p.nm + ' (' + p.ag + ')'; }).join(', ') : '-'; }}], o.report));
  box.appendChild(el('p', {class:'note'}, 'Written in one commit: ' + o.writes + ' documents (8 team chunks with a fresh baseline, the league record, the history entry). ' + o.reads + ' documents were read inside the transaction.'));
  box.appendChild(el('button', {type:'button', class:'btn', id:'btnOffOk', onclick:function(){ state.offReport = null; render(); }}, 'OK'));
  return box;
}

/* ---------- the people: slots ---------- */
function slotButtons(cl, k){
  var s = cl.slots[String(k)], ed = state.slotEdit;
  if (!s) return el('button', {type:'button', class:'btn', 'data-take':String(k), disabled:!!state.busy, onclick:function(){
    doWeekAction('Taking the team...', async function(){ await takeSlot(FB.ad, cl.lg, k, state.auth.uid, state.auth.name || 'COMMISSIONER'); await refreshLeague(cl, null); setMsg('ok', 'You now own ' + cl.L.teams[k].nm + '.'); }); }}, 'TAKE THIS TEAM MYSELF');
  if (ed && ed.i === k && ed.free) return [el('button', {type:'button', class:'btn danger', 'data-free-yes':String(k), disabled:!!state.busy, onclick:function(){
    doWeekAction('Freeing the team...', async function(){ await freeSlot(FB.ad, cl.lg, k); state.slotEdit = null; await refreshLeague(cl, null); setMsg('ok', cl.L.teams[k].nm + ' is open again.'); }); }}, 'YES, FREE IT'),
    el('button', {type:'button', class:'btn', onclick:function(){ state.slotEdit = null; render(); }}, 'KEEP')];
  return [el('button', {type:'button', class:'btn', 'data-edit':String(k), onclick:function(){ state.slotEdit = {i:k, nm:s.nm, g:s.g || '', uid:s.uid, free:false}; render(); }}, 'EDIT'),
    el('button', {type:'button', class:'btn', 'data-free':String(k), onclick:function(){ state.slotEdit = {i:k, free:true}; render(); }}, 'FREE THIS TEAM')];
}
function peopleTools(main, cl){
  var ed = state.slotEdit;
  if (ed && !ed.free && cl.slots[String(ed.i)]){
    var cur = cl.slots[String(ed.i)];
    main.appendChild(el('div', {class:'panel', id:'slotEdit'}, [el('h2', null, 'EDIT ' + cl.L.teams[ed.i].nm),
      el('p', {class:'note'}, 'PLAYER NAME'), el('input', {type:'text', id:'seNm', class:'name-in', maxlength:'40', value:ed.nm, oninput:function(e){ ed.nm = e.target.value; }}),
      el('p', {class:'note'}, 'GOOGLE EMAIL (leave empty for none). A friend who signs in with this email can take the team over on a new phone.'), el('input', {type:'text', id:'seG', class:'name-in', maxlength:'100', value:ed.g, oninput:function(e){ ed.g = e.target.value; }}),
      el('p', {class:'note'}, 'PLAYER ID (uid). Only change this if you know the new id; to move a team to another person it is easier to set the email above, or FREE THIS TEAM.'), el('input', {type:'text', id:'seUid', class:'name-in', maxlength:'128', value:ed.uid, oninput:function(e){ ed.uid = e.target.value; }}),
      el('div', {class:'row'}, [el('button', {type:'button', class:'btn pri', id:'btnSlotSave', disabled:!!state.busy, onclick:function(){
        doWeekAction('Saving...', async function(){ await saveSlot(FB.ad, cl.lg, ed.i, cur, {nm:ed.nm, g:ed.g, uid:ed.uid}); state.slotEdit = null; await refreshLeague(cl, null); setMsg('ok', 'Saved.'); }); }}, 'SAVE'),
        el('button', {type:'button', class:'btn', onclick:function(){ state.slotEdit = null; render(); }}, 'CANCEL')])]));
  }
  var nameBox = el('input', {type:'text', id:'renameBox', class:'name-in', maxlength:'40', value:cl.meta.nm});
  main.appendChild(el('div', {class:'panel', id:'renamePanel'}, [el('h2', null, 'LEAGUE NAME'), nameBox,
    el('div', {class:'row'}, el('button', {type:'button', class:'btn', id:'btnRename', disabled:!!state.busy, onclick:function(){
      var typed = nameBox.value;        /* read before the screen is redrawn */
      doWeekAction('Renaming...', async function(){ var nm = await renameLeague(FB.ad, cl.lg, {uid:state.auth.uid, expect:expectNow(cl), name:typed}); await refreshLeague(cl, nm); listTouch({lg:cl.lg, nm:nm.nm, code:cl.code, role:cl.role}); setMsg('ok', 'The league is now called ' + nm.nm + '.'); }); }}, 'RENAME'))]));
  main.appendChild(el('div', {class:'panel', id:'joinPanel'}, [el('h2', null, 'JOINING'),
    el('p', null, 'Anybody who has the code can take an OPEN team. The current cloud rules have no switch to close joining, so HQ does not offer one: to stop new people, take the open teams yourself (TAKE THIS TEAM MYSELF) or keep the code to your friends. A rule change is requested in the report (REQUEST 2).')]));
}

/* ---------- CHAMPIONS AND HISTORY ---------- */
function vChamps(main){
  var cl = state.cl, L = cl.L, c = championsOf(L);
  add(main, [el('h1', null, 'CHAMPIONS AND HISTORY'), el('p', {class:'sub'}, 'From the history documents the commissioner writes at the end of every season.')]);
  if (!c.rows.length){ main.appendChild(el('p', {id:'noHistory'}, 'No season has been finished yet. The first row appears after the first OFFSEASON.')); return; }
  main.appendChild(table([{h:'SEASON', v:function(r){ return String(r.s); }, n:true}, {h:'CHAMPION', v:function(r){ return teamName(L, r.ch); }}, {h:'RUNNER-UP', v:function(r){ return teamName(L, r.ru); }},
    {h:'CHAMPION RECORD', v:function(r){ var x = r.st[r.ch]; return x ? x[0] + '-' + x[1] + '-' + x[2] + '  (' + x[3] + '-' + x[4] + ')' : '-'; }}], c.rows));
  var teams = []; for (var i = 0; i < NTEAMS; i++) teams.push(i);
  teams.sort(function(a, b){ return (c.titles[b] || 0) - (c.titles[a] || 0) || (c.runner[b] || 0) - (c.runner[a] || 0) || a - b; });
  main.appendChild(el('h2', null, 'TITLES'));
  main.appendChild(table([{h:'TEAM', v:function(i){ return [teamName(L, i), who(cl, i) ? tag('PERSON: ' + who(cl, i), 'me') : null]; }}, {h:'TITLES', v:function(i){ return String(c.titles[i] || 0); }, n:true}, {h:'FINALS LOST', v:function(i){ return String(c.runner[i] || 0); }, n:true}], teams));
}

/* ---------- ABOUT THIS LEAGUE ---------- */
function aboutText(cl){
  return ['LEAGUE: ' + cl.meta.nm, 'CODE: ' + (cl.code || '(not known on this device; open the league by its code)'), '',
    'HOW TO JOIN: open Pixel Pigskin on your phone. In a later version of the game there will be a JOIN LEAGUE button: type this code, pick an OPEN team and play.',
    'Until that version is released the code is only for watching the league on the HQ page.', '',
    'HOW IT WORKS: you play your game of the week by hand in the game and send the result. The commissioner advances the league once the week is played. A friend who cannot play can be simulated by the commissioner.', '',
    'HONOR SYSTEM: the league cannot check a score or a rating. Results and upgrades are on the honor of the players; the commissioner can void any result and the AUDIT screen shows every rating change.'].join('\n');
}
function vAbout(main){
  var cl = state.cl, txt = aboutText(cl);
  add(main, [el('h1', null, 'ABOUT THIS LEAGUE'), el('p', {class:'sub'}, 'A text you can send to your friends.')]);
  main.appendChild(el('div', {class:'row'}, [el('span', {class:'note'}, 'LEAGUE CODE'), el('span', {class:'codebig'}, cl.code || '-')]));
  main.appendChild(el('pre', {id:'aboutText', class:'aboutbox'}, txt));
  if (navigator.clipboard) main.appendChild(el('button', {type:'button', class:'btn', id:'btnCopyAbout', onclick:function(){ try { navigator.clipboard.writeText(txt); } catch (e){} }}, 'COPY THIS TEXT'));
}

/* =====================================================================
   6. START
   ===================================================================== */
state.list = listRead();
render();

</script>
