/* the card pictures are drawn once per scheme on an off-screen canvas and copied onto the page's canvases (as the game does) */
var DFCACHE = {};
function dfCardCanvas(id){
  if (DFCACHE[id]) return DFCACHE[id];
  var d = DF.DEFD.filter(function(x){ return x.id === id; })[0]; if (!d) return null;
  var cv = document.createElement('canvas'); cv.width = DF.DD_W; cv.height = DF.DD_H;
  var cx = cv.getContext && cv.getContext('2d'); if (cx) DF.drawDefCard(cx, d);
  return DFCACHE[id] = cv;
}
function dfPaint(cv, id){
  var src = dfCardCanvas(id), c = cv.getContext && cv.getContext('2d');
  if (!src || !c) return;
  c.imageSmoothingEnabled = false; c.clearRect(0, 0, DF.DD_W, DF.DD_H); c.drawImage(src, 0, 0);
}
function dfCanvas(id, label, cls){ var cv = el('canvas', {width:DF.DD_W, height:DF.DD_H, class:'dfcv' + (cls ? ' ' + cls : ''), role:'img', 'aria-label':label, 'data-dcv':id}); dfPaint(cv, id); return cv; }
var DF_FAMNAME = {Z:'ZONE', M:'MAN', P:'PRESSURE', B:'SPECIAL', V:'SPECIAL'};
var DF_SHELL = ['NO DEEP SAFETY', 'ONE DEEP SAFETY', 'TWO DEEP SAFETIES'];
function dfSide(y){ return y < 14 ? 'LEFT' : (y > 26 ? 'RIGHT' : 'MIDDLE'); }
function dfJob(as){
  if (!as) return 'RUSHES THE QUARTERBACK';
  if (as.m != null) return 'MAN ON ' + PB.PL[as.m] + (as.m === 4 ? ' (ONLY WHEN NO ZONE COVERS HIM)' : '');
  return 'ZONE ' + as.z[0] + ' YD DEEP, ' + dfSide(as.z[1]) + ', ' + (as.z[2] * 2) + ' YD WIDE';
}
function dfRushers(d){ return 4 + d.lb.concat(d.db).filter(function(s){ return !s.as; }).length; }
function dfKey(){
  return el('ul', {class:'dfkey'}, ['SQUARE = LINEMAN, CIRCLE = LINEBACKER, TRIANGLE = BACK', 'RING = ZONE', 'DASHED LINE AND BOX = MAN', 'ARROW = EXTRA RUSHER',
    'RED WITH GOLD OUTLINE = DEFENSE, WHITE SQUARE = OFFENSE, YELLOW = QB', 'A LINEBACKER MAY PICK UP THE RB OR TE'].map(function(t){ return el('li', null, t); }));
}
function vDefenseBook(main, pb){
  var list = DF.DEFD, cur = pb.dsel ? list.filter(function(d){ return d.id === pb.dsel; })[0] : null;
  if (cur){
    var at = list.indexOf(cur), t = DF.dcTags(cur.id), lay = DF.ddLayout(cur), det = el('div', {class:'pbdet', id:'dfDetail'});
    add(det, el('h2', null, cur.name + ' '));
    det.firstChild.appendChild(tag(DF_FAMNAME[DF.DC_FAM[cur.id]] || ''));
    det.firstChild.appendChild(document.createTextNode(' '));
    det.firstChild.appendChild(tag(DF_SHELL[cur.hi] || ''));
    add(det, el('div', {class:'row'}, [
      el('button', {type:'button', class:'btn', id:'dfBack', onclick:function(){ pb.dsel = ''; render(); }}, 'BACK TO ALL DEFENSES'),
      el('button', {type:'button', class:'btn', id:'dfPrev', disabled:at <= 0, onclick:function(){ pb.dsel = list[at - 1].id; render(); }}, 'PREVIOUS'),
      el('button', {type:'button', class:'btn', id:'dfNext', disabled:at >= list.length - 1, onclick:function(){ pb.dsel = list[at + 1].id; render(); }}, 'NEXT')]));
    var big = el('div', {class:'dfbig'}, dfCanvas(cur.id, cur.name, 'big'));
    var ov = sv_('svg', {viewBox:'0 0 ' + DF.DD_W + ' ' + DF.DD_H, class:'dfov', 'aria-hidden':'true'});
    lay.mv.forEach(function(o, i){
      var tx = sv_('text', {x:o.x, y:o.y - 5, 'text-anchor':'middle', 'font-size':6, 'font-weight':700, fill:'#fff', stroke:'#0b0f1a', 'stroke-width':1.2, 'paint-order':'stroke'});
      tx.textContent = i < 3 ? 'L' + (i + 1) : 'D' + (i - 2); ov.appendChild(tx);
    });
    big.appendChild(ov); add(det, big);
    var rows = [{w:'DL 1-4', p:'ON THE LINE', j:'RUSH THE QUARTERBACK (ALWAYS)'}];
    cur.lb.forEach(function(s, i){ var a = s.al(0, lay.R); rows.push({w:'L' + (i + 1) + '  LINEBACKER', p:Math.round(a.x * 10) / 10 + ' YD OFF, ' + dfSide(a.y), j:dfJob(s.as)}); });
    cur.db.forEach(function(s, i){ var a = s.al(0, lay.R); rows.push({w:'D' + (i + 1) + '  BACK', p:Math.round(a.x * 10) / 10 + ' YD OFF, ' + dfSide(a.y), j:dfJob(s.as)}); });
    add(det, table([{h:'DEFENDER', v:function(r){ return r.w; }}, {h:'LINES UP', v:function(r){ return r.p; }}, {h:'JOB', v:function(r){ return r.j; }}], rows));
    var nr = dfRushers(cur);
    add(det, kv([['RUSHERS', nr + (nr === 4 ? ' (THE FOUR LINEMEN)' : ' (THE FOUR LINEMEN AND ' + (nr - 4) + ' MORE)')],
      ['BEST VS', t[0]], ['WEAK VS', t[1]]]));
    add(det, el('h3', null, 'KEY')); add(det, dfKey());
    add(det, el('p', {class:'note'}, 'Before the snap the game may show a different look and rotate into this one at the snap. Which defense is called is up to the game (it picks at random, smarter on higher difficulty) or, with CALL YOUR DEFENSE on, up to you.'));
    add(main, det); return;
  }
  add(main, el('p', {class:'note'}, 'The defenses the phone game plays, drawn the way its own cards draw them (these are the game\'s 14 schemes). Tap one to see who rushes, who covers whom and where each zone sits. Viewing only.'));
  add(main, el('details', {id:'dfKeyBox'}, [el('summary', null, 'KEY'), dfKey()]));
  DF.DC_GRP.forEach(function(g){
    var L = list.filter(function(d){ return g[1].indexOf(DF.DC_FAM[d.id] || '?') >= 0; }); if (!L.length) return;
    add(main, el('h3', null, g[0]));
    var grid = el('div', {class:'pbgrid dfgrid', 'data-grp':g[0]});
    L.forEach(function(d){ var t = DF.dcTags(d.id);
      grid.appendChild(el('button', {type:'button', class:'pbcard dfcard', 'data-def':d.id, 'aria-label':'Open ' + d.name, onclick:function(){ pb.dsel = d.id; render(); window.scrollTo(0, 0); }},
        [dfCanvas(d.id, d.name), el('span', {class:'pbname'}, d.name), el('span', {class:'pbkind'}, 'BEST VS: ' + t[0]), el('span', {class:'pbkind'}, 'WEAK VS: ' + t[1])])); });
    add(main, grid);
  });
}
function sv_(tag, attrs){ var n = document.createElementNS('http://www.w3.org/2000/svg', tag); Object.keys(attrs).forEach(function(k){ n.setAttribute(k, attrs[k]); }); return n; }
