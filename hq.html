<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Pigskin HQ</title>
<style>
/* Pixel Pigskin HQ v0.3: plain dark theme, system fonts only. */
:root{
  --bg:#0e1424; --panel:#18213a; --panel2:#222d4d; --line:#33437a;
  --text:#eef2ff; --muted:#a9b9e6; --yel:#ffd400; --grn:#4ee08a; --amb:#ffb020; --red:#ff8a8a;
  --fs:16px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:var(--fs);line-height:1.45}
#app{display:flex;min-height:100vh}
#menu{width:12.5em;flex:none;background:var(--panel);border-right:2px solid var(--line);
  padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
#menu .brand{font-weight:700;letter-spacing:.08em;color:var(--yel);margin-bottom:8px;font-size:1.05em}
#menu button{display:block;width:100%;text-align:left;padding:10px 12px;min-height:44px;
  background:var(--bg);color:var(--text);border:2px solid var(--line);font:inherit;cursor:pointer}
#menu button:hover:not([disabled]){background:var(--panel2)}
#menu button.on{background:var(--yel);color:#111;border-color:var(--yel);font-weight:700}
#menu button[disabled]{opacity:.4;cursor:not-allowed}
#menu .lgname{color:var(--muted);font-size:13px;margin-top:auto;padding-top:12px;word-break:break-word}
#right{flex:1;min-width:0;display:flex;flex-direction:column}
main{flex:1;padding:20px 28px 28px;max-width:1800px;width:100%}
footer{padding:10px 28px;color:var(--muted);font-size:.85em;border-top:1px solid var(--line)}
h1{font-size:1.65em;margin:0 0 4px;letter-spacing:.04em}
h2{font-size:1.2em;margin:22px 0 8px;color:var(--yel);letter-spacing:.04em}
h3{font-size:1em;margin:18px 0 6px;color:var(--muted);letter-spacing:.04em}
p,.note{margin:6px 0}
.note{color:var(--muted);font-size:.92em}
.sub{color:var(--muted);margin-bottom:14px}
button,select,textarea,input{font:inherit}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.btn{background:var(--panel2);color:var(--text);border:2px solid var(--line);padding:9px 16px;min-height:44px;cursor:pointer}
.btn:hover{background:var(--line)}
.btn.pri{background:var(--yel);color:#111;border-color:var(--yel);font-weight:700}
.btn.pri:hover{background:#ffe55c}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
select{background:var(--bg);color:var(--text);border:2px solid var(--line);padding:8px 10px;min-height:40px}
textarea{width:100%;min-height:110px;background:var(--bg);color:var(--text);border:2px solid var(--line);padding:10px;
  font-family:Consolas,Menlo,monospace;font-size:.85em;resize:vertical}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(24em,100%),1fr));gap:16px}
.panel{background:var(--panel);border:2px solid var(--line);padding:16px}
.panel h2{margin-top:0}
.drop{border:2px dashed var(--line);padding:14px;text-align:center;color:var(--muted);margin-top:10px}
.drop.over{border-color:var(--yel);color:var(--text)}
.msg{padding:10px 14px;border:2px solid;margin:12px 0}
.msg.err{border-color:var(--red);background:#3a1c26}
.msg.warn{border-color:var(--amb);background:#3a2e14}
.msg.ok{border-color:var(--grn);background:#17301f}
.tag{display:inline-block;padding:0 .5em;border:2px solid var(--line);font-size:.75em;vertical-align:middle;letter-spacing:.06em;margin-left:6px;color:var(--text)}
.tag.me{border-color:var(--yel);color:var(--yel)}
.tag.st{border-color:var(--grn);color:var(--grn)}
.tag.bk{color:var(--muted)}
.tag.rt{border-color:var(--amb);color:var(--amb)}
.tag.rd{border-color:var(--red);color:var(--red)}
.tag.star{border-color:var(--yel);background:var(--yel);color:#111;font-weight:700}
.tag.hs{border-color:var(--line);color:var(--muted);margin-left:.4em}
.wrap{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;background:var(--panel)}
.tbl th,.tbl td{padding:.45em .7em;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{background:var(--panel2);color:var(--muted);font-weight:600;font-size:.82em;letter-spacing:.04em;position:sticky;top:0}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.me td{background:#2b2a14}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--panel2)}
.tbl tr.sec td{background:var(--panel2);color:var(--yel);font-weight:700;letter-spacing:.05em}
a.lnk,button.lnk{color:#9cc4ff;background:none;border:0;padding:0;font:inherit;cursor:pointer;text-decoration:underline}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 22px;margin:8px 0;background:var(--panel);padding:14px 18px;border:2px solid var(--line)}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0}
.split{display:grid;grid-template-columns:17em minmax(0,1fr);gap:18px;align-items:start}
.tlist{background:var(--panel);border:2px solid var(--line);max-height:76vh;overflow:auto}
.tlist button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:8px 10px;min-height:40px;
  background:none;color:var(--text);border:0;border-bottom:1px solid var(--line);cursor:pointer}
.tlist button:hover{background:var(--panel2)}
.tlist button.on{background:var(--yel);color:#111;font-weight:700}
.tlist .gh{padding:6px 10px;background:var(--panel2);color:var(--muted);font-size:.75em;letter-spacing:.06em}
.sw{display:inline-block;width:22px;height:22px;border:2px solid #fff;vertical-align:middle;margin-right:6px}
.big{font-size:1.4em;font-weight:700}
.bar{display:inline-block;width:6em;height:.7em;background:var(--bg);border:1px solid var(--line);vertical-align:middle}
.bar i{display:block;height:100%;background:var(--grn)}
.cards{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0}
.card{background:var(--panel);border:2px solid var(--line);padding:10px 16px;min-width:110px}
.card b{display:block;font-size:1.4em} .card span{color:var(--muted);font-size:.82em}
details.key{margin-top:18px;background:var(--panel);border:2px solid var(--line);padding:8px 14px}
details.key summary{cursor:pointer;color:var(--yel)}
details.key dl{display:grid;grid-template-columns:max-content 1fr;gap:3px 18px;margin:8px 0 2px}
details.key dt{color:var(--yel)} details.key dd{margin:0;color:var(--muted)}
pre{background:var(--panel);border:2px solid var(--line);padding:10px;overflow:auto;max-height:260px;font-size:.8em}
/* big screens: larger type so it reads from across a room */
@media (min-width:1500px){ :root{--fs:19px} }
@media (min-width:1800px){ :root{--fs:21px} }
/* narrow windows: the menu becomes a row on top */
@media (max-width:1000px){
  main{padding:14px 14px 22px}
  .split{grid-template-columns:1fr}
  .tlist{max-height:30vh}
}
@media (max-width:900px){
  #app{flex-direction:column}
  #menu{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:2px solid var(--line);padding:10px;align-items:center}
  #menu .brand{margin:0 8px 0 0}
  #menu button{width:auto;min-height:40px;padding:6px 10px}
  #menu .lgname{margin:0 0 0 auto;padding:0}
}

/* v0.3: online parts */
#menu .who{color:var(--muted);font-size:13px;padding-top:10px;display:flex;flex-direction:column;gap:2px;word-break:break-word}
#menu .who b{color:var(--text);font-weight:600}
input[type=text]{background:var(--bg);color:var(--text);border:2px solid var(--line);padding:8px 10px;min-height:44px;font:inherit}
input.code-in{text-transform:uppercase;letter-spacing:.2em;width:9em;font-family:Consolas,Menlo,monospace}
input.name-in{width:min(24em,100%)}
.codebig{display:inline-block;font-family:Consolas,Menlo,monospace;font-size:2.6em;font-weight:700;letter-spacing:.3em;color:var(--yel);background:var(--panel);border:2px solid var(--yel);padding:.1em .45em .1em .75em}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.danger{border-color:var(--red);color:var(--red)}

.strike{text-decoration:line-through;color:var(--muted)}
.subline{margin:.2em 0}
.subline .btn{margin-left:.5em;padding:0 .6em}
.aboutbox{white-space:pre-wrap;border:2px solid var(--line);padding:.8em;margin:.6em 0;max-width:46em;font:inherit}
</style>
</head>
<body>
<div id="app">
  <nav id="menu" aria-label="Screens"></nav>
  <div id="right">
    <main id="main"></main>
    <footer id="foot"></footer>
  </div>
</div>

<script id="src-lg-engine">/* lg-engine.js (v2.22): THE SHARED LEAGUE ENGINE. Pure: no S, G, DOM, localStorage or window, no UI function. Everything comes in as arguments
   (the league object L, the season, a function rt(id) that returns a team's {off,def}, the human result(s) of the week).
   The game build includes this text inside its IIFE before lg.js; Node, the league tool and HQ load the same text with require() (the guard at the end).
   Every random draw that decides a league game comes from ONE stream per game: lgMulberry32(lgSeedFor(leagueSeed, season, week, gameIndex)).
   One game's draws depend ONLY on those four numbers (never on call order, on how many games ran before it, or on the human's result).
   gameIndex = the pair's position in L.sched[week]; playoffs: week = 100 + round, gameIndex = the game's position in lgPoGames(L).
   leagueSeed = lgLeagueSeed(L): a numeric L.seed if there is one, otherwise a hash of this season's schedule (nothing is saved).
   League CREATION (names, ratings, colors, the schedule) is not here: it keeps Math.random in the game's lg.js. */
const LGE=(function(){
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
/* v1.63: two league formats. NFL = 32 teams / 2 conferences / 8 divisions / 17 games / 14-team playoff.
   COLLEGE = 60 teams / 6 conferences of 10 / 12 games (9 conference + 3 non-conference) / 12-team playoff
   (6 conference champions + 6 at-large, the 4 best champions get a bye, reseeded each round). L.fmt picks the format (old saves have none = NFL).
   Team ids: id = conf*perConf + div*per + slot. */
const LGF={
 NFL:{id:'NFL',tag:'NFL FORMAT',btn:'NFL: 32 TEAMS',nc:2,dv:4,per:4,games:17,byes:1,homeRds:3,noTie:false,spread:1,
  conf:['PIXEL CONF','GRIDIRON CONF'],div:['NORTH','SOUTH','EAST','WEST'],
  rnd:['WILD CARD','DIVISIONAL','CONF FINAL','PIGSKIN BOWL'],champ:'PIGSKIN BOWL CHAMPIONS!',
  info:'2 CONFERENCES - 8 DIVISIONS - 17 GAMES - 14 TEAM PLAYOFF.',
  poTxt:'7 TEAMS PER CONFERENCE: 4 DIVISION WINNERS AND 3 WILD CARDS. SEED 1 GETS A BYE.',miss:'ONLY 7 TEAMS PER CONFERENCE GET IN.',
  help:'17 GAMES - PLAY EACH WEEK OR SIM IT. 4 DIVISION WINNERS + 3 WILD CARDS PER CONFERENCE MAKE THE PLAYOFFS, SEED 1 GETS A BYE. WIN THE PIGSKIN BOWL.'},
 COL:{id:'COL',tag:'COLLEGE FORMAT',btn:'COLLEGE: 60 TEAMS',nc:6,dv:1,per:10,games:12,byes:4,homeRds:1,noTie:true,spread:1.3,
  conf:['ATLANTIC','LAKES','MOUNTAIN','PACIFIC','SOUTHERN','PLAINS'],div:[''],
  rnd:['FIRST ROUND','QUARTERFINAL','SEMIFINAL','NATIONAL TITLE'],champ:'NATIONAL CHAMPIONS!',
  info:'6 CONFERENCES OF 10 - 12 GAMES (9 CONFERENCE + 3 NON-CONFERENCE) - 12 TEAM PLAYOFF.',
  poTxt:'12 TEAMS: THE 6 CONFERENCE CHAMPIONS (BEST CONFERENCE RECORD) + 6 AT-LARGE TEAMS. THE 4 BEST CHAMPIONS GET A BYE.',miss:'ONLY 12 OF THE 60 TEAMS GET IN.',
  help:'12 GAMES - 9 IN YOUR CONFERENCE, 3 NON-CONFERENCE. THE 6 CONFERENCE CHAMPIONS + 6 AT-LARGE TEAMS MAKE THE 12-TEAM PLAYOFF, THE 4 BEST CHAMPIONS GET A BYE. WIN THE NATIONAL TITLE.'}};
const lgCfg=L=>LGF[(L&&L.fmt)||'NFL'],lgN=c=>c.nc*c.dv*c.per;

/* ----- the seeded generator and the per-game seed ----- */
/* mulberry32: a 32-bit seed in, a function out that returns numbers in [0,1) */
function lgMulberry32(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
/* seedFor: four numbers in, one 32-bit seed out (a murmur-style mix; the same on every device) */
function lgSeedFor(leagueSeed,season,week,gameIndex){
 let h=(leagueSeed>>>0)^0x9E3779B9;
 for(const v of[season,week,gameIndex]){h^=(v|0)+0x7F4A7C15;h=Math.imul(h^(h>>>16),0x85EBCA6B);h=Math.imul(h^(h>>>13),0xC2B2AE35);h^=h>>>16}
 return h>>>0}
/* the league's seed number: a numeric L.seed if the league has one (the game's L.seed is the playoff seed MAP, an object, so it never counts), else an FNV-1a hash of the team count and this season's schedule. Never saved. */
function lgLeagueSeed(L){
 if(typeof L.seed==='number'&&isFinite(L.seed))return L.seed>>>0;
 let h=0x811C9DC5;const add=v=>{v|=0;h=Math.imul(h^(v&255),0x01000193);h=Math.imul(h^((v>>>8)&255),0x01000193)};
 add(L.teams.length);const S=L.sched||[];for(const rd of S){add(1000+rd.length);for(const g of rd){add(g[0]);add(g[1])}}
 return h>>>0}

/* ----- the game ----- */
const lgGauss=rng=>(rng()+rng()+rng()-1.5)*2;     /* about N(0,1), fed by a stream; as the game always had it */
/* A, B = {off,def}; noTie = playoffs or a no-tie format; hfa: true = A is the home team, false = B is, null/undefined = neutral (v1.56) */
function lgSim(A,B,noTie,hfa,rng){
 const mu=(o,d)=>clamp(22+(o-d)*2.4,6,40),h=hfa===true?1.2:hfa===false?-1.2:0;
 let pa=clamp(Math.round(mu(A.off,B.def)+h+lgGauss(rng)*6),0,56),pb=clamp(Math.round(mu(B.off,A.def)-h+lgGauss(rng)*6),0,56);
 if(noTie&&pa===pb){if(rng()<.5)pa+=3;else pb+=3}
 return[pa,pb]}
/* one league game with its own stream (a = first team of the pair, b = second) */
function lgGame(L,ls,season,week,gi,rt,a,b,po,hfa){
 return lgSim(rt(a),rt(b),!!(po||lgCfg(L).noTie),hfa,lgMulberry32(lgSeedFor(ls,season,week,gi)))}

/* ----- records and standings ----- */
function lgRecGame(L,a,b,pa,pb){const R=L.rec;R[a].pf+=pa;R[a].pa+=pb;R[b].pf+=pb;R[b].pa+=pa;
 if(pa>pb){R[a].w++;R[b].l++}else if(pb>pa){R[b].w++;R[a].l++}else{R[a].t++;R[b].t++}
 if(L.teams[a].conf===L.teams[b].conf){if(pa>pb){R[a].cw=(R[a].cw||0)+1;R[b].cl=(R[b].cl||0)+1}else if(pb>pa){R[b].cw=(R[b].cw||0)+1;R[a].cl=(R[a].cl||0)+1}}}
const lgPct=r=>{const g=r.w+r.l+r.t;return g?(r.w+r.t/2)/g:0};
const lgCP=r=>{const g=(r.cw||0)+(r.cl||0);return g?(r.cw||0)/g:0};
function lgOrder(L,ids,ov){const R=L.rec,cf=!ov&&lgCfg(L).id==='COL';return ids.slice().sort((a,b)=>(cf?lgCP(R[b])-lgCP(R[a]):0)||lgPct(R[b])-lgPct(R[a])||(R[b].pf-R[b].pa)-(R[a].pf-R[a].pa)||R[b].pf-R[a].pf||a-b)}
const lgDivIds=(cf,c,d)=>Array.from({length:cf.per},(_,i)=>c*cf.per*cf.dv+d*cf.per+i);

/* ----- a regular-season week ----- */
/* hum = the human results of the week as a list of [a,b,pa,pb] (empty, one, or several). They are recorded as given; every other game of L.sched[week] is simulated from its own stream. Returns the week's games, human games first, then the others in schedule order. rt(id) returns {off,def}. */
function lgPlayWeek(L,w,season,rt,hum){
 hum=hum||[];const games=[],busy=new Set(),ls=lgLeagueSeed(L);
 for(const[a,b,pa,pb]of hum){lgRecGame(L,a,b,pa,pb);games.push([a,b,pa,pb]);busy.add(a);busy.add(b)}
 L.sched[w].forEach(([a,b],i)=>{if(busy.has(a)||busy.has(b))return;const[pa,pb]=lgGame(L,ls,season,w,i,rt,a,b,false,true);lgRecGame(L,a,b,pa,pb);games.push([a,b,pa,pb])});
 return games}

/* ----- playoffs: 7 seeds per conference, seed 1 gets a bye (college: 12 teams) ----- */
function lgSeedPO(L){
 const cf=lgCfg(L),seeds=[[],[]];L.seed={};
 if(cf.id==='COL'){
  const champs=lgOrder(L,Array.from({length:cf.nc},(_,k)=>lgOrder(L,lgDivIds(cf,k,0))[0]),true);
  const rest=lgOrder(L,L.teams.map(t=>t.id).filter(i=>!champs.includes(i)),true).slice(0,12-cf.nc);
  const sd=[...champs.slice(0,cf.byes),...lgOrder(L,[...champs.slice(cf.byes),...rest],true)];
  sd.forEach((id,i)=>L.seed[id]=i+1);L.po={seeds:[sd],alive:[sd.slice()],round:0,cc:champs};return}
 for(let c=0;c<2;c++){
  const win=[0,1,2,3].map(d=>lgOrder(L,lgDivIds(cf,c,d))[0]),ws=lgOrder(L,win);
  const rest=lgOrder(L,Array.from({length:16},(_,i)=>c*16+i).filter(i=>!win.includes(i)));
  seeds[c]=[...ws,...rest.slice(0,3)];seeds[c].forEach((id,i)=>L.seed[id]=i+1)}
 L.po={seeds,alive:[seeds[0].slice(),seeds[1].slice()],round:0}}
function lgPoGames(L){
 const P=L.po,r=P.round,a=P.alive,o=[];
 if(lgCfg(L).id==='COL'){const x=a[0],n=x.length,k=r===0?4:n/2;for(let i=0;i<k;i++)o.push(r===0?[x[4+i],x[11-i]]:[x[i],x[n-1-i]]);return o}
 if(r===3)o.push([a[0][0],a[1][0]]);
 else for(let c=0;c<2;c++){const x=a[c];if(r===0)o.push([x[1],x[6]],[x[2],x[5]],[x[3],x[4]]);else if(r===1)o.push([x[0],x[3]],[x[1],x[2]]);else o.push([x[0],x[1]])}
 return o}
/* play one whole round. hum = the human decisions as a list of {id,win}: a game with a human team is decided by that entry (win = the human team wins); every other game is simulated from its own stream (week key 100+round). */
function lgPoRound(L,season,rt,hum){
 const P=L.po,cf=lgCfg(L),win=new Set(),ls=lgLeagueSeed(L);hum=hum||[];
 lgPoGames(L).forEach(([a,b],i)=>{const h=hum.find(x=>x.id===a||x.id===b);
  if(h)win.add(h.win?h.id:(h.id===a?b:a));
  else{const[pa,pb]=lgGame(L,ls,season,100+P.round,i,rt,a,b,true,P.round<cf.homeRds?true:null);win.add(pa>pb?a:b)}});
 if(P.round===3){L.champ=[...win][0];L.hist.push({s:season,id:L.champ})}
 else for(let c=0;c<P.alive.length;c++)P.alive[c]=P.alive[c].filter((i,ix)=>win.has(i)||(P.round===0&&ix<cf.byes)).sort((x,y)=>L.seed[x]-L.seed[y])
 P.round++}
function lgSimRestPo(L,season,rt,hum){while(L.po.round<=3)lgPoRound(L,season,rt,hum)}

return{LGF,cfg:lgCfg,n:lgN,mulberry32:lgMulberry32,seedFor:lgSeedFor,leagueSeed:lgLeagueSeed,gauss:lgGauss,sim:lgSim,game:lgGame,recGame:lgRecGame,pct:lgPct,cp:lgCP,order:lgOrder,divIds:lgDivIds,playWeek:lgPlayWeek,seedPO:lgSeedPO,poGames:lgPoGames,poRound:lgPoRound,simRestPo:lgSimRestPo}})();
if(typeof module!=='undefined'&&module.exports)module.exports=LGE;   /* Node, the league tool and HQ load this same text; inside the game's IIFE `module` does not exist and this line does nothing */
</script>

<script id="src-lg-std">// =============================================================================
// lg-std.js  -  the rules of the 8-team STANDARD league, in one file.   (round 4)
//
// What is in here: the league maker (with its 10 hidden burn-in seasons), a
// team's strength worked out from its starters (the game's lgRt formula) plus
// the team edge, the 14-week schedule, standings, the top-four playoff, and
// the offseason (aging, growth toward potential, XP, retirement, rookies, edge).
// Plus the checks that need no files.
//
// Rules of this file:
//  * Pure and seeded. Every random number comes from a stream made with the
//    game's engine (mulberry32 + seedFor). No Math.random, Math.log or Math.cos.
//  * Nothing Node-only (no fs, process, require), so a browser page can load it.
//  * The rules object (rules.json) and the engine are handed in; this file
//    reads no files. The command line (pigskin-league.mjs) does that.
//  * A game's SCORE is made by the engine's own lgGame (E.game): it gets the rating
//    function rt(team) -> {off, def} and makes its own stream from
//    E.seedFor(rs, season, week, gameIndex). The team edge is added HERE, to the
//    strength numbers the rating function returns, before the engine sees them.
//
// How to use:   const STD = LGSTD.make(LGE);      // LGE = the game's engine
//               const L = STD.makeLeague(918273, rules);
//               STD.playSeason(L); STD.offseason(L, STD.newCtx());
// =============================================================================
const LGSTD = (function () {
  const VERSION = 'lg-std 1.2 (round 5)';

  // ------------------------------------------------------------ small helpers
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const mean = (a) => a.reduce((s, x) => s + x, 0) / (a.length || 1);
  const round3 = (x) => Math.round(x * 1000) / 1000;
  const overall = (p) => { const v = Object.values(p.rt); return v.reduce((s, x) => s + x, 0) / v.length; };

  // Conventions copied from the game's engine (claude/pixel-pigskin-updates-v222.md):
  //  regular season: week = the week's position in the schedule list (0, 1, 2 ...), gameIndex = the pair's position in that week
  //  playoffs:       week = 100 + round, gameIndex = the game's position in that round's list
  // ASSUMPTION (could not check, the real engine file was not available): rounds count from 0.
  const PO_WEEK_BASE = 100, PO_FIRST_ROUND = 0;
  // Reserved "week" numbers for everything that is NOT a game (names, growth, retirement ...).
  // Real game weeks are below 200, so these streams can never collide with a game's stream.
  const K = { MAKER: 1001, SCHED: 1002, GROWTH: 1003, RETIRE: 1004, EDGE: 1005, TIEBREAK: 1006, ID: 1007 };

  // The engine's lgGame only looks at the league object to ask lgCfg(L).noTie. The REAL engine knows only the game's own
  // formats (NFL, COL) and fails for our "p8", so every game call is given this stub: NFL = ties allowed in the regular
  // season (the playoff games say so themselves with po = true).
  const GAME_STUB = { fmt: 'NFL' };
  // The small ADAPTER: a Standard league seen in the game's own league shape (L.teams, L.sched, L.rec, numeric L.seed),
  // so the engine's own playWeek can run it. The league seed is our rs. (Used by the tests and by whoever glues this into the game.)
  function engineLeague(L) {
    return { fmt: 'NFL', seed: L.rs, teams: L.teams.map((t) => ({ id: t.id, conf: t.cf })), sched: L.sch,
      rec: L.teams.map(() => ({ w: 0, l: 0, t: 0, pf: 0, pa: 0 })), hist: [] };
  }

  // ------------------------------------------------------------ names, teams
  const SURNAMES = ('ADAMS AIKEN ALVAREZ ARCHER BAILEY BANKS BARNES BELL BENSON BISHOP BLAKE BOYD BRADY BROOKS BRYANT BURKE CALLOWAY CAMPOS CARTER CHASE CLARK COLE CONWAY COOPER CRUZ DALTON DAVIS DEAN DIAZ DIXON DUNN EASTON ELLIS EVANS FARRELL FIELDS FLYNN FORD FOSTER FOWLER FRANK GALLO GARCIA GIBBS GRANT GREEN HALE HAMMOND HARPER HART HAYES HENDRIX HOLT HOWARD HUDSON HUNT IVES JACOBS JENSEN JONES KANE KELLER KING KNOX LAMB LANE LEWIS LOGAN LOWE MACK MARSH MASON MEYER MILES MOORE MORAN NASH NOLAN OAKES OWENS PAGE PARKER PAYNE PIERCE PRICE QUINN RAMOS REED RILEY ROSS RUSSO SANDERS SHAW SIMMS SMITH SPENCER STONE TATE TODD TRAVIS VANCE WADE WARD WEBB WELLS WEST WOLFE WOOD YOUNG ZIMMER').split(' ');
  const TEAM_DEFS = [
    ['HARBOR HAWKS', '#cc3333', '#222222'], ['RIVER KINGS', '#2255cc', '#dddddd'], ['DESERT VIPERS', '#cc8822', '#331100'], ['PINE BARONS', '#1f7a3a', '#e8e8d0'],
    ['LAKE STORM', '#2a9bd6', '#102040'], ['CEDAR WOLVES', '#7a4a2a', '#f0e6d0'], ['PRAIRIE FOXES', '#d8651a', '#ffffff'], ['SUMMIT ROCKETS', '#7a2fb0', '#ffd400'],
  ];
  const B36 = '0123456789abcdefghijklmnopqrstuvwxyz';

  // ------------------------------------------------------------ pieces that need no engine
  // A new 8-character id, never one that is live or on the retired list.
  function mintId(rng, used, ctx) {
    for (;;) {
      let id = ''; for (let i = 0; i < 8; i++) id += B36[Math.floor(rng() * 36)];
      if (used.has(id)) continue;
      used.add(id);
      if (ctx) { ctx.minted++; if (ctx.ever.has(id)) ctx.reused++; ctx.ever.add(id); }   // the soak tracks every id ever made
      return id;
    }
  }
  function makeName(rng, taken) {
    for (let n = 0; ; n++) {
      const nm = String.fromCharCode(65 + Math.floor(rng() * 26)) + '. ' + rng.pick(SURNAMES);
      if (!taken.has(nm) || n > 200) { taken.add(nm); return nm; }
    }
  }
  // round to one decimal, but randomly up or down in proportion, so small yearly changes are not lost
  function stochRound(x, rng) { const t = x * 10, f = Math.floor(t); return (f + (rng() < t - f ? 1 : 0)) / 10; }

  // potential (the ceiling): most players about 4 to 6.5, a few stars 7.5 to 9.4
  function drawPotential(rng, rules, pos) {
    const P = rules.potential;
    if (rng() < P.star.chance[pos]) return Math.round((P.star.min + (P.star.max - P.star.min) * Math.pow(rng(), P.star.curve)) * 10) / 10;
    const v = P.mean + (P.posShift[pos] || 0) + P.sd * (P.posSdMult[pos] ?? 1) * rng.gauss();
    return Math.round(clamp(v, P.min, P.max) * 10) / 10;
  }
  // a young player's starting ratings: low, a little higher when the potential is high
  function rookieRatings(rng, rules, pos, pt) {
    const R = rules.rookie, base = R.ratingMin + (R.ratingMax - R.ratingMin) * rng() + R.potentialPull * (pt - 5);
    const rt = {};
    for (const k of rules.ratingKeys[pos]) rt[k] = clamp(stochRound(base + R.jitter * (rng() * 2 - 1), rng), Math.min(R.floor, pt), pt);
    return rt;
  }
  function newRookie(rng, rules, pos, sl, used, taken, ctx) {
    const pt = drawPotential(rng, rules, pos);
    return { id: mintId(rng, used, ctx), nm: makeName(rng, taken), ps: pos, sl, rt: rookieRatings(rng, rules, pos, pt),
      ag: rng.int(rules.rookie.ageMin, rules.rookie.ageMax), pt, xp: 0, st: 0, cr: [] };
  }

  // ONE offseason of change for one player (his age is already +1).
  // Before the peak age: each rating closes a share of the gap to potential; XP makes the share bigger.
  // After the peak: it falls by the decline table. Small seeded noise. Never above potential.
  function applyYear(p, rules, xpEarned, rng) {
    const G = rules.growth, eff = p.ag - (G.lateShift[p.ps] || 0);
    let share = 0;
    if (eff < G.peakAge) {
      share = eff <= G.startAge ? G.maxShare : G.maxShare * clamp((G.peakAge - eff) / (G.peakAge - G.startAge), 0, 1);
      share *= 1 + G.ptLift * Math.max(0, p.pt - G.ptLiftFrom);        // high-potential players close the gap faster
      const boost = clamp(xpEarned / 100 * rules.xp.boostPer100, 0, rules.xp.maxBoost);
      share = Math.min(G.shareCap, share * (1 + boost));
    }
    const dec = rules.decline.perYearPastPeak, k = eff - G.peakAge;
    for (const key of Object.keys(p.rt)) {
      const r = p.rt[key];
      let d = eff < G.peakAge ? share * (p.pt - r) : (k <= 0 ? 0 : -dec[Math.min(k, dec.length - 1)]);
      d += rng.gauss() * G.noiseSd;
      p.rt[key] = clamp(stochRound(r + d, rng), Math.min(rules.decline.floor, p.pt), p.pt);
    }
  }

  // A team's offense and defense from its starters: the game's own formula (lgRt).
  // Not stored in the file, worked out when needed.
  function derive(team) {
    const by = {};
    for (const p of team.ro) (by[p.ps] = by[p.ps] || []).push(p);
    for (const k in by) by[k].sort((a, b) => a.sl - b.sl);
    const qb = by.QB[0], rb = by.RB[0], te = by.TE[0], wr = by.WR.slice(0, 3);
    const q = (qb.rt.arm + qb.rt.acc) / 2;
    const rc = (wr.reduce((s, w) => s + w.rt.spd + w.rt.cat, 0) + te.rt.spd + te.rt.cat) / 8;
    const ol = mean(by.OL.slice(0, 5).map((p) => p.rt.blk));
    const off = (q + rc + rb.rt.run + ol) / 4;
    const def = mean([...by.DL.slice(0, 4), ...by.LB.slice(0, 3), ...by.DB.slice(0, 4)].map((p) => p.rt.def));
    return { off, def };
  }
  // THE EDGE STEP (kept here, not in the engine): the team edge (times edge.scale) is added to both.
  // This is the pair of numbers the engine's sim is given.
  function effective(team, rules) {
    const d = derive(team), e = (team.ed || 0) * rules.edge.scale;
    return { off: d.off + e, def: d.def + e };
  }

  // 14 weeks: everyone plays everyone twice, 7 home and 7 away (circle method, then the same weeks with home and away swapped)
  function makeSchedule(rng) {
    const order = rng.shuffle([0, 1, 2, 3, 4, 5, 6, 7]), weeks = [];
    let rest = order.slice(1);
    for (let r = 0; r < 7; r++) {
      const row = [order[0], ...rest], games = [];
      for (let i = 0; i < 4; i++) { const a = row[i], b = row[7 - i]; games.push((i + r) % 2 === 0 ? [a, b] : [b, a]); }
      weeks.push(games);
      rest = [rest[rest.length - 1], ...rest.slice(0, -1)];
    }
    return [...weeks, ...weeks.map((g) => g.map(([h, a]) => [a, h]))];
  }

  const newCtx = () => ({ ever: new Set(), minted: 0, reused: 0 });
  const usedIds = (L) => { const s = new Set(); for (const t of L.teams) for (const p of t.ro) s.add(p.id); for (const [, id] of L.rtd) s.add(id); return s; };

  // Games and wins per team index, from the results of the season so far (regular season and playoffs).
  // XP is never stored: the league record keeps every player's xp at 0 and the offseason works it out from this.
  function tally(L) {
    const games = L.teams.map(() => 0), wins = L.teams.map(() => 0);
    for (const r of L.res) { games[r.h]++; games[r.a]++; if (r.sc[0] > r.sc[1]) wins[r.h]++; else if (r.sc[0] < r.sc[1]) wins[r.a]++; }
    return { games, wins };
  }

  // The checks that need no files. Returns a list of problems (empty = fine).
  function checkLeague(L) {
    const bad = [], rules = L.rules, ids = new Set();
    for (const t of L.teams) {
      if (t.ro.length !== 23) bad.push(`${t.nm} has ${t.ro.length} players`);
      for (const [pos, n] of rules.positions) {
        const ps = t.ro.filter((p) => p.ps === pos).sort((a, b) => a.sl - b.sl);
        if (ps.length !== n || ps.some((p, i) => p.sl !== i)) bad.push(`${t.nm} ${pos} slots wrong`);
      }
      for (const p of t.ro) {
        if (ids.has(p.id)) bad.push('duplicate id ' + p.id); ids.add(p.id);
        for (const [k, v] of Object.entries(p.rt)) {
          if (!(v >= 1 && v <= 10)) bad.push(`${p.id} ${k} ${v} outside 1 to 10`);
          if (v > p.pt + 1e-9) bad.push(`${p.id} ${k} ${v} above potential ${p.pt}`);
          if (Math.abs(v * 10 - Math.round(v * 10)) > 1e-6) bad.push(`${p.id} ${k} ${v} not one decimal`);
        }
      }
    }
    for (const [, id] of L.rtd) if (ids.has(id)) bad.push('retired id is live: ' + id);
    return bad;
  }

  // ------------------------------------------------------------ everything that needs the engine
  function make(E) {
    if (!E || !E.mulberry32 || !E.seedFor || !E.gauss || !E.game) throw new Error('lg-std: the engine is missing mulberry32, seedFor, gauss or game');

    // A random stream for one purpose: always E.mulberry32(E.seedFor(rs, season, kind, n)).
    // The normal draw is the engine's gauss, fed by the same stream.
    function stream(rs, season, kind, n = 0) {
      const r = E.mulberry32(E.seedFor(rs, season, kind, n));
      r.gauss = () => E.gauss(r);
      r.int = (a, b) => a + Math.floor(r() * (b - a + 1));
      r.pick = (arr) => arr[Math.floor(r() * arr.length)];
      r.shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
      return r;
    }

    // ---- one game. The ONLY place a score is made: the engine's lgGame. Draws depend only on rs, season, week, gameIndex.
    // The home team is first (hfa true = home advantage for it); playoff = no ties (the engine adds 3 for a random side).
    // The engine is handed a small stub in place of the league record (see GAME_STUB); the seed is passed as rs.
    function scoreGame(L, rt, week, gi, h, a, playoff) {
      return E.game(GAME_STUB, L.rs, L.ssn, week, gi, rt, h, a, playoff, true);
    }
    // the rating function handed to the engine: team id -> { off, def } with the edge already added
    function ratingFn(L) { const eff = L.teams.map((t) => effective(t, L.rules)); return (id) => eff[id]; }

    // ---- standings
    function record(L, wk, h, a, sc, playoff, src = 'sim') {
      L.res.push({ wk, h, a, sc: [sc[0], sc[1]], src });
      if (playoff) return;
      const H = L.teams[h].rc, A = L.teams[a].rc;
      H[3] += sc[0]; H[4] += sc[1]; A[3] += sc[1]; A[4] += sc[0];
      if (sc[0] > sc[1]) { H[0]++; A[1]++; } else if (sc[0] < sc[1]) { H[1]++; A[0]++; } else { H[2]++; A[2]++; }
    }
    // team ids, best first: win share (ties count half), then points difference, then a seeded draw
    function rank(L, tag) {
      const rng = stream(L.rs, L.ssn, K.TIEBREAK, tag), draw = L.teams.map(() => rng());
      const key = (t, i) => [(t.rc[0] + 0.5 * t.rc[2]) / Math.max(1, t.rc[0] + t.rc[1] + t.rc[2]), t.rc[3] - t.rc[4], draw[i]];
      return L.teams.map((t, i) => [i, key(t, i)]).sort((a, b) => b[1][0] - a[1][0] || b[1][1] - a[1][1] || b[1][2] - a[1][2]).map((x) => x[0]);
    }

    // ---- play: one regular-season week, the playoffs, a whole season
    function playWeek(L, w) {
      const rt = ratingFn(L);
      L.sch[w].forEach(([h, a], g) => record(L, w, h, a, scoreGame(L, rt, w, g, h, a, false), false));
      L.wk = w + 1; L.ph = 'reg';
    }
    // the score of one regular-season game on its own (for tests): same as inside playWeek
    function gameAt(L, w, g) { const [h, a] = L.sch[w][g]; return scoreGame(L, ratingFn(L), w, g, h, a, false); }

    // top four by record; 1 v 4 and 2 v 3 (round 0), then the winners (round 1), played at the better seed
    function playPlayoffs(L) {
      const rt = ratingFn(L), seeds = rank(L, 0).slice(0, L.rules.league.playoffTeams), wkP = L.sch.length;
      const play = (x, y, round, g) => {
        const [h, a] = seeds.indexOf(x) < seeds.indexOf(y) ? [x, y] : [y, x];
        const sc = scoreGame(L, rt, PO_WEEK_BASE + PO_FIRST_ROUND + round, g, h, a, true);
        record(L, wkP + round, h, a, sc, true);
        return sc[0] > sc[1] ? h : a;
      };
      const w1 = play(seeds[0], seeds[3], 0, 0), w2 = play(seeds[1], seeds[2], 0, 1), ch = play(w1, w2, 1, 0);
      L.po = { seeds, ch, ru: ch === w1 ? w2 : w1 };
      L.ph = 'done'; L.wk = wkP + 2;
    }
    function playSeason(L) {
      L.res = []; L.teams.forEach((t) => { t.rc = [0, 0, 0, 0, 0]; });
      for (let w = 0; w < L.sch.length; w++) playWeek(L, w);
      playPlayoffs(L);
    }

    // ---- the offseason
    function offseason(L, ctx) {
      const rules = L.rules, s = L.ssn, R = rules.retire;
      // 1. this season's games and wins per team (regular season and playoffs), from the results
      const { games, wins } = tally(L);
      const report = L.teams.map((t, i) => ({ team: i, retired: [], rookies: [] }));
      L.hist.push({ s, ch: L.po.ch, ru: L.po.ru, st: L.teams.map((t) => t.rc.slice()) });
      // 2. fold career lines, age +1, yearly change (XP speeds up growth)
      const rngG = stream(L.rs, s, K.GROWTH);
      L.teams.forEach((t, ti) => t.ro.forEach((p) => {
        p.cr.push([s, games[ti]]); p.ag++;
        applyYear(p, rules, rules.xp.perGame * games[ti] + rules.xp.perWin * wins[ti], rngG);
      }));
      // 3. retire: age-based chance, higher if below the league median at his position; sure at 36 (QB, K 39)
      const med = {};
      for (const [pos] of rules.positions) { const v = L.teams.flatMap((t) => t.ro.filter((p) => p.ps === pos).map(overall)).sort((a, b) => a - b); med[pos] = v[Math.floor(v.length / 2)]; }
      const rngR = stream(L.rs, s, K.RETIRE), used = usedIds(L);
      let retired = 0;
      const taken = L.teams.map((t) => new Set(t.ro.map((p) => p.nm)));
      L.teams.forEach((t, ti) => t.ro.forEach((p, i) => {
        const late = R.lateShift[p.ps] || 0, eff = p.ag - late;
        let chance = p.ag >= (late ? R.forceAgeLate : R.forceAge) ? 1 : (R.chanceByAge[eff] || 0);
        if (chance < 1 && overall(p) < med[p.ps]) chance = Math.min(1, chance * R.belowMedianMultiplier);
        if (rngR() < chance) {
          // 4. the starter's slot is filled at once by a new rookie (there are no backups yet)
          L.rtd.push([s, p.id]); taken[ti].delete(p.nm);
          t.ro[i] = newRookie(rngR, rules, p.ps, p.sl, used, taken[ti], ctx);
          report[ti].retired.push({ id: p.id, nm: p.nm, ps: p.ps, sl: p.sl, ag: p.ag, ov: round3(overall(p)) });
          report[ti].rookies.push({ id: t.ro[i].id, nm: t.ro[i].nm, ps: t.ro[i].ps, sl: t.ro[i].sl, ag: t.ro[i].ag, ov: round3(overall(t.ro[i])), pt: t.ro[i].pt });
          retired++;
        }
      }));
      L.rtd = L.rtd.filter(([rs]) => rs > s - 10);
      // 5. team edge: pulled back toward 0, plus noise
      const rngE = stream(L.rs, s, K.EDGE), E_ = rules.edge;
      for (const t of L.teams) t.ed = round3(clamp(E_.keep * t.ed + E_.sd * rngE.gauss(), -E_.clamp, E_.clamp));
      // 6. next season
      L.ssn = s + 1; L.wk = 0; L.ph = 'reg'; L.po = null; L.res = [];
      L.teams.forEach((t) => { t.rc = [0, 0, 0, 0, 0]; });
      L.sch = makeSchedule(stream(L.rs, L.ssn, K.SCHED));
      return { retired, report };
    }

    // ---- the league maker
    // Makes the league, then runs `burnIn` hidden seasons so ages and retirements are steady
    // before season 1 is handed back. The season counter starts at 1 (hidden seasons are -9 to 0).
    // `rs` is the league's random seed (a number). It is NOT the game's L.seed (that is the playoff seed map).
    function makeLeague(rs, rules, ctx = newCtx()) {
      rules = clone(rules);
      const rng = stream(rs, 0, K.MAKER), used = new Set();
      const L = { v: 2, dp: 'std', fmt: 'p8', nm: 'PROOF 8', id: 'L' + E.seedFor(rs, 0, K.ID, 0).toString(36).slice(0, 5), cmr: null,
        ssn: 1 - rules.league.burnIn, wk: 0, ph: 'reg', burn: rules.league.burnIn, sch: [], po: null, hist: [], res: [], rs, rules, rtd: [], teams: [] };
      TEAM_DEFS.forEach(([nm, c, d], i) => {
        const taken = new Set(), ro = [];
        for (const [pos, n] of rules.positions) for (let sl = 0; sl < n; sl++) {
          // start as a rookie, then live through the same yearly change up to a random age 21 to 34
          const p = newRookie(rng, rules, pos, sl, used, taken, ctx), target = rng.int(21, 34);
          while (p.ag < target) { p.ag++; applyYear(p, rules, 35, rng); }
          ro.push(p);
        }
        L.teams.push({ id: i, nm, cf: 0, dv: i < 4 ? 0 : 1, ow: 'ai', lk: { c, d }, cr: 0, ed: 0, rc: [0, 0, 0, 0, 0], ro });
      });
      L.sch = makeSchedule(stream(rs, L.ssn, K.SCHED));
      for (let k = 0; k < rules.league.burnIn; k++) { playSeason(L); offseason(L, ctx); }
      // hand back season 1: no history, no career lines from the hidden seasons
      L.ssn = 1; L.hist = []; L.res = [];
      for (const t of L.teams) for (const p of t.ro) p.cr = [];
      return L;
    }


    // =========================================================================================================
    // ROUND 4: the shared WEEK / PLAYOFF / HUMAN logic. Everything is keyed by team INDEX (no "my team" here).
    // A human result is {a, b, pa, pb, src}: a and b are team indexes (either order), pa and pb their points, src 'hand' | 'pc' | 'sub'.
    // A finished game as stored (and as given to applyWeek / applyPlayoffRound) is {wk, h, a, sc: [home points, away points], src}
    // (the array form [h, a, homePoints, awayPoints, src] is accepted too). All errors are plain Errors that start with "lg-std:".
    // =========================================================================================================
    const HUMAN_SRC = ['hand', 'pc', 'sub'], ANY_SRC = ['sim', 'hand', 'pc', 'sub'];
    const bad = (msg) => { throw new Error('lg-std: ' + msg); };
    const isScore = (x) => Number.isInteger(x) && x >= 0;
    const teamIx = (L, x) => Number.isInteger(x) && x >= 0 && x < L.teams.length;

    // the XP a team earned for one game: 2 for starting it, 1 more for a win (rules.xp; never stored)
    function xpFor(L, won) { return L.rules.xp.perGame + (won ? L.rules.xp.perWin : 0); }
    // XP earned so far this season per team index (regular season and playoffs), worked out from the results. Same numbers the offseason uses.
    function xpSoFar(L) { const { games, wins } = tally(L); return L.teams.map((t, i) => L.rules.xp.perGame * games[i] + L.rules.xp.perWin * wins[i]); }

    // the pairs still to play: { kind: 'reg' | 'po' | 'done', week, round, pairs: [[home, away], ...] }
    //  'reg'  : regular season, week = L.wk, pairs = L.sch[week]
    //  'po'   : a playoff round (round 0 = semifinals 1 v 4 and 2 v 3, round 1 = the final), better seed at home; the seeds are drawn from
    //           the standings when the playoffs have not been opened yet (nothing is changed here)
    //  'done' : the playoffs are over (champion known): next is the offseason
    function nextGames(L) {
      const nG = L.sch.length;
      if (L.po && L.po.ch != null) return { kind: 'done', week: null, round: null, pairs: [] };
      if (!L.po && L.wk < nG) return { kind: 'reg', week: L.wk, round: null, pairs: L.sch[L.wk].map(([h, a]) => [h, a]) };
      const seeds = L.po ? L.po.seeds : rank(L, 0).slice(0, L.rules.league.playoffTeams);
      const r0 = L.res.filter((r) => r.wk === nG);
      if (r0.length < 2) return { kind: 'po', week: nG, round: 0, seeds, pairs: [[seeds[0], seeds[3]], [seeds[1], seeds[2]]] };
      const w = r0.map((r) => (r.sc[0] > r.sc[1] ? r.h : r.a)).sort((x, y) => seeds.indexOf(x) - seeds.indexOf(y));
      return { kind: 'po', week: nG + 1, round: 1, seeds, pairs: [[w[0], w[1]]] };
    }

    // the human entries checked and turned into a map "pair index" -> row. Throws on anything that is not a game of this week / round.
    function matchHum(L, hum, pairs, playoff) {
      const byGame = new Map();
      for (const e of hum || []) {

    // The final sets champion and runner-up (L.po.ch, L.po.ru), ph 'done' and the week counter; the history row is added by the offseason, as always.

        if (playoff && g.sc[0] === g.sc[1]) bad(`a playoff game cannot end in a tie (${g.h} v ${g.a})`);
        const gi = pairs.findIndex(([h, a]) => h === g.h && a === g.a);
        if (gi < 0) bad(`${g.h} (home) v ${g.a} is not a game of this ${playoff ? 'playoff round' : 'week'}`);
        if (slot[gi]) bad(`the game ${g.h} v ${g.a} is given twice`);

      }

    }

    // The result is exactly what playWeekWith would have stored for the same games. Returns { week, games, xp }.
    function applyWeek(L, given) {

    function applyPlayoffRound(L, given) {

/* ---------- the league's own tie-break draw (read only) ----------
   The Standard league orders teams by win share, then points difference, then a seeded draw. The draw is
   lgMulberry32(lgSeedFor(rs, season, 1006, 0)), one number per team in team order. Both functions are copied
   character for character from the game's lg-engine.js (v2.22); selftest values: seedFor(1,2,3,4) = 3875807029. */
function lgMulberry32(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}

/* recs = [{w,l,t,pf,pa}] by team position. Returns {order:[team positions, best first], keys:[[share, diff, draw]], tied:[true when the draw had to decide]} */
function stdRank(rs, season, recs){

  else recs.forEach(function(x, i){ draw.push(-i); });

  var tied = order.map(function(x, i){
    var n = order[i + 1], p = order[i - 1];
    return (n != null && keys[x][0] === keys[n][0] && keys[x][1] === keys[n][1]) || (p != null && keys[x][0] === keys[p][0] && keys[x][1] === keys[p][1]);

}
/* a rating shown exactly as stored: one decimal (3 is shown as 3.0, 3.9 as 3.9); anything with more decimals is shown as is */

/* the game's own strength formula applied to the starters; each part is null when a starter is missing */

  function g(p, k){ return p && isNum(p.rt[k]) ? p.rt[k] : null; }

  if (qb && isNum(g(qb,'arm')) && isNum(g(qb,'acc'))) out.q = (g(qb,'arm') + g(qb,'acc')) / 2;
  if (te && wr.length === 3){

    if (rv8.every(isNum)) out.rc = rv8.reduce(function(s, x){ return s + x; }, 0) / 8;

async function openText(text){

    var obj, warn = null, from = 'a backup code';
    if (text.indexOf('PPSAVE1:') >= 0){ var r = await unpackCode(text); obj = r.obj; warn = r.warn; }

function readFile(file){
  return new Promise(function(res, rej){
    if (file.size > 30 * 1024 * 1024) return rej(new Error('That file is too big to be a save.'));
    var fr = new FileReader();
    fr.onload = function(){ res(String(fr.result)); };
    fr.onerror = function(){ rej(fr.error || new Error('Cannot read that file.')); };
    fr.readAsText(file);
  });
}
async function openFile(file){
  if (!file) return;
  try { await openText(await readFile(file)); }
  catch (e){ setMsg('err', e.message || 'Cannot read that file.'); render(); }
}

function bar(pctv){
  var w = Math.max(0, Math.min(100, pctv));
  return el('span', {class:'bar', title:Math.round(w) + '%'}, el('i', {style:'width:' + w + '%'}));
}
function srcTag(src){
  if (src === 'hand') return el('span', {class:'tag hs', title:'hand-played by me'}, 'H');
  if (src === 'pc') return el('span', {class:'tag hs', title:'played by the PC'}, 'PC');
  if (src && src !== 'sim') return el('span', {class:'tag hs', title:'source: ' + src}, String(src));
  return null;
}
function resLine(r, tid){          /* 'W 24-17' or 'L 17-24' for team tid in result row r (scores are home first) */
  var mine = r.h === tid ? r.sc[0] : r.sc[1], opp = r.h === tid ? r.sc[1] : r.sc[0];
  return (mine > opp ? 'W ' : (mine < opp ? 'L ' : 'T ')) + mine + '-' + opp;
}
function stdPhaseText(m){
  var nG = m.sched.length, P = m.po, wp = Math.max(0, num(m.L.wk));
  if (P && P.ch != null) return 'Season complete (the champion is decided)';
  if (P) return 'Playoffs in progress: ' + (P.round === 0 ? 'semifinals' : 'the final');
  if (!m.played) return 'Regular season not started (week 1 is next)';
  if (wp >= nG) return 'Regular season finished, playoffs not started';
  return 'Regular season: ' + Math.min(wp, nG) + ' of ' + nG + ' weeks played';
}

/* ===== HQ CLOUD LAYER BEGIN =====
   Plain JavaScript: no DOM, no SDK import. It needs these globals, set by the page (or by the emulator test):
   LGE (lg-engine.js), LGSTD (lg-std.js), STD = LGSTD.make(LGE), STD_RULES (the rules object the game embeds).
   Three parts: (1) a thin ADAPTER over Firestore, (2) PURE functions that turn a Standard league into cloud documents and back,
   (3) the CLOUD OPERATIONS (create, resume, read) written against the adapter only. */

var CLOUD_SDK_VERSION = '10.14.1';           /* the same Firebase web SDK version the game loads */
var CLOUD_FORMAT = 1;                        /* meta.v: the format of the cloud documents written by HQ */
/* the league code: 6 characters. The rules accept [A-HJKMNP-Z2-9]; HQ also leaves out B, S and Z (look like 8, 5 and 2) */
var CODE_ALPHABET = 'ACDEFGHJKMNPQRTUVWXY23456789';
var CODE_RULE = /^[A-HJKMNP-Z2-9]{6}$/;
var LG_ALPHABET = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
var NTEAMS = 8;

var ENV = {
  now: function(){ return Date.now(); },
  ints: function(n){ var a = new Uint32Array(n); globalThis.crypto.getRandomValues(a); return a; }
};
function randStr(alpha, n){
  var out = '', lim = 4294967296 - (4294967296 % alpha.length);
  while (out.length < n){ var a = ENV.ints(n); for (var i = 0; i < a.length && out.length < n; i++) if (a[i] < lim) out += alpha.charAt(a[i] % alpha.length); }
  return out;
}
ENV.code = function(){ return randStr(CODE_ALPHABET, 6); };
ENV.lg = function(){ return randStr(LG_ALPHABET, 20); };
ENV.rs = function(){ return ENV.ints(1)[0] >>> 0; };

/* ---------- errors ---------- */
function CloudError(kind, text, cause){ var e = new Error(text); e.kind = kind; e.cause = cause || null; e.cloud = true; return e; }
function classify(e){
  if (e && e.cloud) return e.kind;
  var c = String((e && (e.code || e.name)) || ''), m = String((e && e.message) || '');
  if (/permission-denied|PERMISSION_DENIED/i.test(c + ' ' + m)) return 'denied';
  if (/resource-exhausted|quota/i.test(c + ' ' + m)) return 'quota';
  if (/already-exists/i.test(c)) return 'exists';
  if (/unauthenticated/i.test(c)) return 'denied';
  if (/unavailable|deadline-exceeded|network|offline|failed to fetch|timeout/i.test(c + ' ' + m)) return 'net';
  return 'other';
}
function kindText(kind){
  if (kind === 'denied') return 'The cloud refused this. Either you are not signed in the right way (the commissioner tools need a Google sign-in), or the rules for linked leagues are not published yet, or this change is not allowed.';
  if (kind === 'quota') return 'The free daily limit of the cloud was reached. Nothing is lost; try again tomorrow.';
  if (kind === 'net') return 'The connection to the cloud failed. Check the internet connection and try again.';
  return 'The cloud reported a problem.';
}
function cloudMsg(e){ return e && e.cloud && e.kind !== 'other' && e.message ? e.message : (kindText(classify(e)) + (e && e.message && classify(e) === 'other' ? ' (' + e.message + ')' : '')); }

/* ---------- (1) the adapter over the Firestore SDK (modular API: X = firebase-firestore) ---------- */
/* paths are plain strings 'lgs/ID/teams/3'. Every call returns plain data: { id, exists, data } and so on. */
function makeSdkAdapter(X, db){
  function ref(p){ return X.doc(db, p); }
  function snap(s){ var ex = s.exists(); return { id: s.id, exists: ex, data: ex ? s.data() : null }; }
  function applyOp(w, o){
    if (o.op === 'set') w.set(ref(o.path), o.data);
    else if (o.op === 'update') w.update(ref(o.path), o.data);
    else if (o.op === 'delete') w.delete(ref(o.path));
    else throw new Error('hq: unknown batch op ' + o.op);
    return w;
  }
  return {
    get: function(p){ return X.getDoc(ref(p)).then(snap); },
    list: function(p){ return X.getDocs(X.collection(db, p)).then(function(s){ return s.docs.map(function(d){ return { id: d.id, data: d.data() }; }); }); },
    set: function(p, data){ return X.setDoc(ref(p), data); },
    update: function(p, data){ return X.updateDoc(ref(p), data); },
    del: function(p){ return X.deleteDoc(ref(p)); },
    batch: function(ops){ var b = X.writeBatch(db); ops.forEach(function(o){ applyOp(b, o); }); return b.commit(); },
    transaction: function(fn){
      return X.runTransaction(db, function(t){
        return fn({
          get: function(p){ return t.get(ref(p)).then(snap); },
          set: function(p, data){ t.set(ref(p), data); },
          update: function(p, data){ t.update(ref(p), data); },
          del: function(p){ t.delete(ref(p)); }
        });
      });
    },
    onSnapshot: function(p, cb, errCb){ return X.onSnapshot(ref(p), function(s){ cb(snap(s)); }, errCb || function(){}); }
  };
}

/* ---------- (2) pure functions: Standard league <-> cloud documents ---------- */
function bad(msg){ return CloudError('data', 'hq: ' + msg); }
function cleanName(s){
  s = String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
  if (!s) throw CloudError('bad', 'Give the league a name.');
  if (s.length > 40) throw CloudError('bad', 'A league name can have at most 40 characters.');
  return s;
}
/* a player in the cloud: the same fields, but the career lines `cr` are FLAT [season, games, season, games ...]
   (Firestore does not allow a list inside a list) */
function encPlayer(p){
  var cr = []; p.cr.forEach(function(x){ cr.push(x[0], x[1]); });
  return { id: p.id, nm: p.nm, ps: p.ps, sl: p.sl, rt: Object.assign({}, p.rt), ag: p.ag, pt: p.pt, xp: p.xp, st: p.st, cr: cr };
}
function decPlayer(q, rules){
  var keys = rules.ratingKeys[q.ps];
  if (!keys || !q.rt || !Array.isArray(q.cr)) throw bad('a player record is damaged (' + q.id + ')');
  var rt = {};
  keys.forEach(function(k){ if (typeof q.rt[k] !== 'number') throw bad('a rating is missing (' + q.id + ' ' + k + ')'); rt[k] = q.rt[k]; });
  var cr = []; for (var i = 0; i + 1 < q.cr.length; i += 2) cr.push([q.cr[i], q.cr[i + 1]]);
  return { id: q.id, nm: q.nm, ps: q.ps, sl: q.sl, rt: rt, ag: q.ag, pt: q.pt, xp: q.xp, st: q.st, cr: cr };
}
/* a team chunk. id is a STRING in the cloud (the candidate rules need it); rc is always the season-start zeros (the season's
   results come from the week documents); rtd = ["season:playerId", ...] the retired ids this chunk keeps for the league */
/* bl = the BASELINE ratings of every player as the commissioner wrote them: { playerId: [rating values in rules.ratingKeys order] }.
   The slot owner may change only ro, cr and up (candidate rules), so bl is what the audit compares the roster with. */
function blOf(ro, rules){
  var bl = {};
  ro.forEach(function(p){ bl[p.id] = rules.ratingKeys[p.ps].map(function(k){ return p.rt[k]; }); });
  return bl;
}
function encTeam(t, rtd, up, rules){
  rules = rules || STD_RULES;
  var d = { id: String(t.id), nm: t.nm, cf: t.cf, dv: t.dv, ow: t.ow, lk: { c: t.lk.c, d: t.lk.d }, cr: t.cr, ed: t.ed,
    rc: [0, 0, 0, 0, 0], ro: t.ro.map(encPlayer), rtd: (rtd || []).slice(), bl: blOf(t.ro, rules) };
  if (up && up.length) d.up = up.slice();
  return d;
}
function decTeam(d, rules, idx){
  if (!d || String(d.id) !== String(idx) || !Array.isArray(d.ro) || !d.lk) throw bad('team chunk ' + idx + ' is damaged or missing');
  return { id: idx, nm: d.nm, cf: d.cf, dv: d.dv, ow: d.ow, lk: { c: d.lk.c, d: d.lk.d }, cr: d.cr, ed: d.ed, rc: [0, 0, 0, 0, 0],
    ro: d.ro.map(function(q){ return decPlayer(q, rules); }) };
}
function rtdStrings(pairs){ return pairs.map(function(x){ return x[0] + ':' + x[1]; }); }
function rulesOf(meta){
  var r = typeof meta.rules === 'string' ? JSON.parse(meta.rules) : meta.rules;
  if (!r || !r.ratingKeys) throw bad('the league rules are missing');
  return r;
}
function metaOf(L, uid, now){
  return { v: CLOUD_FORMAT, nm: L.nm, rs: L.rs, season: L.ssn, wk: L.wk, ph: L.ph, rules: JSON.stringify(L.rules), commish: uid,
    opts: {}, hold: false, ovr: [], updatedAt: now };
}
function weekKey(season, wk){ return season + '-' + wk; }
/* a finished week or playoff round as stored: rows are MAPS { a: home team, b: away team, pa: home points, pb: away points, src } */
function weekDocOf(rows, uid, now){
  return { games: rows.map(function(r){ return { a: r.h, b: r.a, pa: r.sc[0], pb: r.sc[1], src: r.src }; }), by: uid, t: now };
}
function gamesOfDoc(d){
  if (!d || !Array.isArray(d.games)) throw bad('a week document is damaged');
  return d.games.map(function(g){ return { h: g.a, a: g.b, sc: [g.pa, g.pb], src: g.src }; });
}
/* hist: one doc per finished season: { ch, ru, st: [ {w,l,t,pf,pa} x8 ], t } */
function histDocOf(row, now){
  return { ch: row.ch, ru: row.ru, st: row.st.map(function(x){ return { w: x[0], l: x[1], t: x[2], pf: x[3], pa: x[4] }; }), t: now };
}
function histRowOf(season, d){
  if (!d || !Array.isArray(d.st)) throw bad('a history document is damaged (season ' + season + ')');
  return { s: season, ch: d.ch, ru: d.ru, st: d.st.map(function(x){ return [x.w, x.l, x.t, x.pf, x.pa]; }) };
}

/* Rebuild the league record L (the shape of lg-std 1.2) from the cloud documents. Nothing is simulated: the stored weeks are applied.
   meta = the meta doc; teamDocs = 8 chunks (array, index = team); weekDocs = { 'season-week': doc }; histDocs = { 'season': doc } */
function buildLeague(meta, teamDocs, weekDocs, histDocs){
  var rules = rulesOf(meta), K = LGSTD.parts.K, season = meta.season;
  weekDocs = weekDocs || {}; histDocs = histDocs || {};
  var teams = [], rtdAll = [];
  for (var i = 0; i < NTEAMS; i++){
    var d = teamDocs[i];
    teams.push(decTeam(d, rules, i));
    (d.rtd || []).forEach(function(s){ var j = s.indexOf(':'); rtdAll.push({ s: Number(s.slice(0, j)), id: s.slice(j + 1), ti: teams.length - 1, n: rtdAll.length }); });
  }
  rtdAll.sort(function(a, b){ return a.s - b.s || a.ti - b.ti || a.n - b.n; });
  var L = { v: 2, dp: 'std', fmt: 'p8', nm: meta.nm, id: 'L' + LGE.seedFor(meta.rs, 0, K.ID, 0).toString(36).slice(0, 5), cmr: null,
    ssn: season, wk: 0, ph: 'reg', burn: rules.league.burnIn,
    sch: LGSTD.parts.makeSchedule(STD.stream(meta.rs, season, K.SCHED)), po: null, hist: [], res: [], rs: meta.rs, rules: rules,
    rtd: rtdAll.map(function(x){ return [x.s, x.id]; }), teams: teams };
  Object.keys(histDocs).map(Number).sort(function(a, b){ return a - b; }).forEach(function(s){ L.hist.push(histRowOf(s, histDocs[s])); });
  var nG = L.sch.length, w, applied = 0;
  for (w = 0; w < nG; w++){ var wd = weekDocs[weekKey(season, w)]; if (!wd) break; STD.applyWeek(L, gamesOfDoc(wd)); applied++; }
  for (w = applied; w < nG; w++) if (weekDocs[weekKey(season, w)]) throw bad('week ' + (applied + 1) + ' of season ' + season + ' is missing but a later week is stored');
  var r0 = weekDocs[weekKey(season, 100)], r1 = weekDocs[weekKey(season, 101)];
  if ((r0 || r1) && applied < nG) throw bad('a playoff round is stored before the regular season is complete');
  if (r0) STD.applyPlayoffRound(L, gamesOfDoc(r0));
  if (r1 && !r0) throw bad('the final is stored without the semifinals');
  if (r1) STD.applyPlayoffRound(L, gamesOfDoc(r1));
  if (L.wk !== meta.wk || L.ph !== meta.ph) throw bad('the league says week ' + meta.wk + ' (' + meta.ph + ') but the stored weeks give week ' + L.wk + ' (' + L.ph + ')');
  return L;
}

/* ---------- (3) cloud operations ---------- */
var PATH = {
  meta: function(lg){ return 'lgs/' + lg; },
  team: function(lg, i){ return 'lgs/' + lg + '/teams/' + i; },
  slots: function(lg){ return 'lgs/' + lg + '/slots'; },
  slot: function(lg, i){ return 'lgs/' + lg + '/slots/' + i; },
  week: function(lg, season, wk){ return 'lgs/' + lg + '/weeks/' + weekKey(season, wk); },
  sub: function(lg, season, wk, team){ return 'lgs/' + lg + '/subs/' + season + '-' + wk + '-' + team; },
  hist: function(lg, season){ return 'lgs/' + lg + '/hist/' + season; },
  code: function(code){ return 'leagueCodes/' + code; }
};
function normCode(s){ return String(s == null ? '' : s).toUpperCase().replace(/[\s-]+/g, ''); }

/* a new league, planned but not written: a random rs, the league made by the shared lg-std, the meta and the 8 chunks */
function planCreate(name, uid){
  name = cleanName(name);
  var rs = ENV.rs(), L = STD.makeLeague(rs, STD_RULES);
  L.nm = name;
  return planOf(L, uid, ENV.lg(), ENV.now());
}
function planOf(L, uid, lg, now){
  return { lg: lg, name: L.nm, rs: L.rs, uid: uid, code: null, done: false,
    meta: metaOf(L, uid, now),
    chunks: L.teams.map(function(t, i){ return encTeam(t, i === 0 ? rtdStrings(L.rtd) : [], null, L.rules); }) };
}
/* a plan for a league whose meta is already in the cloud (to finish an interrupted creation): the same league, made again from rs */
function planFromMeta(meta, lg, uid, code){
  var L = STD.makeLeague(meta.rs, rulesOf(meta));
  L.nm = meta.nm;
  var p = planOf(L, uid, lg, meta.updatedAt);
  p.meta = meta; p.code = code || null;
  return p;
}
function createOps(plan, withMeta, teamIdx, withCode){
  var ops = [];
  if (withMeta) ops.push({ op: 'set', path: PATH.meta(plan.lg), data: plan.meta });
  teamIdx.forEach(function(i){ ops.push({ op: 'set', path: PATH.team(plan.lg, i), data: plan.chunks[i] }); });
  if (withCode) ops.push({ op: 'set', path: PATH.code(plan.code), data: { lg: plan.lg, commish: plan.uid } });
  return ops;
}
async function freeCode(ad){
  for (var i = 0; i < 12; i++){
    var c = ENV.code(), g = await ad.get(PATH.code(c));
    if (!g.exists) return c;
  }
  throw CloudError('exists', 'No free league code was found after 12 tries. Please try again.');
}
/* look at what already exists for this plan: { meta, teams:[bool x8], code, codeTaken } */
async function inspectCreate(ad, plan){
  var m = await ad.get(PATH.meta(plan.lg)), ts = [];
  for (var i = 0; i < NTEAMS; i++) ts.push(await ad.get(PATH.team(plan.lg, i)));
  var c = plan.code ? await ad.get(PATH.code(plan.code)) : { exists: false, data: null };
  return { meta: m.exists, teams: ts.map(function(t){ return t.exists; }), code: !!(c.exists && c.data && c.data.lg === plan.lg),
    codeTaken: !!(c.exists && c.data && c.data.lg !== plan.lg) };
}
function failed(plan, err, wrote){
  var e = CloudError(classify(err) === 'other' ? 'other' : classify(err), cloudMsg(err), err);
  e.plan = plan; e.wrote = wrote; return e;
}
/* ONE atomic batch: meta + 8 team chunks + the code (10 writes, 8 getAfter() calls in the rules). Either all of it is there or none.
   On a collision of the code (someone made the same code a moment ago) a new code is drawn and the batch is tried again. */
async function createLeague(ad, plan){
  var attempt = 0;
  for (;;){
    if (!plan.code){ try { plan.code = await freeCode(ad); } catch (e){ throw failed(plan, e, 'nothing'); } }
    try { await ad.batch(createOps(plan, true, [0, 1, 2, 3, 4, 5, 6, 7], true)); plan.done = true; return plan; }
    catch (err){
      var c;
      try { c = await ad.get(PATH.code(plan.code)); } catch (e2){ throw failed(plan, err, 'unknown'); }
      if (c.exists && c.data && c.data.lg === plan.lg){ plan.done = true; return plan; }          /* it was written; only the answer was lost */
      if (c.exists && ++attempt < 6){ plan.code = null; continue; }                             /* the code was taken: draw another */
      throw failed(plan, err, 'nothing');
    }
  }
}
/* finish a league: write only what is missing (idempotent). Safe to press any number of times. */
async function resumeCreate(ad, plan){
  var attempt = 0;
  for (;;){
    var info = await inspectCreate(ad, plan);
    if (!plan.code || info.codeTaken){ plan.code = await freeCode(ad); info.code = false; }
    var missing = []; info.teams.forEach(function(ok, i){ if (!ok) missing.push(i); });
    var ops = createOps(plan, !info.meta, missing, !info.code);
    if (!ops.length){ plan.done = true; return { wrote: 0, already: 2 + NTEAMS, plan: plan }; }
    try { await ad.batch(ops); plan.done = true; return { wrote: ops.length, already: 2 + NTEAMS - ops.length, plan: plan }; }
    catch (err){
      var c; try { c = await ad.get(PATH.code(plan.code)); } catch (e2){ throw failed(plan, err, 'unknown'); }
      if (c.exists && c.data && c.data.lg !== plan.lg && ++attempt < 6){ plan.code = null; continue; }
      throw failed(plan, err, 'unknown');
    }
  }
}
/* a code -> { lg, commish } or null */
async function readCode(ad, code){
  code = normCode(code);
  if (!CODE_RULE.test(code)) throw CloudError('bad', 'A league code has 6 letters and digits (for example K7M2QX).');
  var g = await ad.get(PATH.code(code));
  return g.exists ? { code: code, lg: g.data.lg, commish: g.data.commish } : null;
}
/* everything needed to rebuild the league after the meta doc is known. cache = { weeks, hist } keeps documents that never change. */
async function readParts(ad, lg, meta, cache){
  cache = cache || { weeks: {}, hist: {} };
  var season = meta.season, i, p = [];
  for (i = 0; i < NTEAMS; i++) p.push(ad.get(PATH.team(lg, i)));
  var slotsP = ad.list(PATH.slots(lg));
  function want(key, path){ if (cache.weeks[key]) return null; return ad.get(path).then(function(g){ if (g.exists) cache.weeks[key] = g.data; }); }
  var wp = [], nG = 14;
  for (i = 0; i < Math.min(meta.wk, nG); i++) wp.push(want(weekKey(season, i), PATH.week(lg, season, i)));
  if (meta.wk >= nG) wp.push(want(weekKey(season, 100), PATH.week(lg, season, 100)));
  if (meta.wk >= nG + 2) wp.push(want(weekKey(season, 101), PATH.week(lg, season, 101)));
  for (var s = 1; s < season; s++) (function(s){
    if (!cache.hist[s]) wp.push(ad.get(PATH.hist(lg, s)).then(function(g){ if (g.exists) cache.hist[s] = g.data; }));
  })(s);
  var teamSnaps = await Promise.all(p), slotList = await slotsP;
  await Promise.all(wp.filter(Boolean));
  var teamDocs = teamSnaps.map(function(g, k){ if (!g.exists) throw CloudError('data', 'Team ' + (k + 1) + ' of this league is missing in the cloud. The creation of the league was probably interrupted: if you are the commissioner, press RESUME.'); return g.data; });
  var slots = {}; slotList.forEach(function(d){ slots[d.id] = d.data; });
  return { teamDocs: teamDocs, slots: slots, weeks: cache.weeks, hist: cache.hist };
}

/* ===================================================================================================================
   MILESTONE 2: the week. Submissions, SIM marks, void, hold and ADVANCE (one transaction), and the AUDIT of rating changes.
   =================================================================================================================== */
/* the week number used in document keys: a regular week is its own number, a playoff round is 100 + round (semifinals 100, final 101) */
function planWeekNo(plan){ return plan.kind === 'reg' ? plan.week : (plan.kind === 'po' ? 100 + plan.round : null); }
function ovrKey(season, wkNo, gi){ return season + '-' + wkNo + '-' + gi; }
function nextStamp(old){ return Math.max(ENV.now(), (old || 0) + 1); }
function humansOf(slots){ var h = []; for (var i = 0; i < NTEAMS; i++) if (slots[String(i)]) h.push(i); return h; }
function roundName(plan){
  if (plan.kind === 'reg') return 'WEEK ' + (plan.week + 1) + ' OF ' + 14;
  if (plan.kind === 'po') return plan.round === 0 ? 'PLAYOFFS: SEMIFINALS' : 'PLAYOFFS: THE FINAL';
  return 'SEASON OVER';
}
/* the submissions of one week or round: the sub documents of the teams that play in it (a read per team, at most 8) */
async function readSubs(g, lg, season, wkNo, plan){
  var teams = []; plan.pairs.forEach(function(p){ teams.push(p[0], p[1]); });
  var snaps = await Promise.all(teams.map(function(t){ return g.get(PATH.sub(lg, season, wkNo, t)); }));
  var out = []; snaps.forEach(function(sn, i){ if (sn.exists) out.push({ team: teams[i], data: sn.data }); });
  return out;
}
/* PURE: what is going on in this week. For every game: who is human, the valid submissions, the SIM mark, the result that will be used.
   picks = { gameIndex: teamIndexOfTheSubmitterTheCommissionerChose }.
   status: ai | played | conflict (two humans sent different scores and nothing is picked) | picked | missing | sim */
function weekSituation(L, plan, subs, humans, ovr, season, wkNo, picks){
  picks = picks || {};
  var marks = {}; (ovr || []).forEach(function(x){ marks[x] = 1; });
  var hs = {}; humans.forEach(function(i){ hs[i] = 1; });
  var out = { games: [], hum: [], missing: [], conflicts: [], ties: [], strays: [] };
  plan.pairs.forEach(function(pr, gi){
    var h = pr[0], a = pr[1];
    var g = { gi: gi, h: h, a: a, humanH: !!hs[h], humanA: !!hs[a], sim: !!marks[ovrKey(season, wkNo, gi)], subs: [], status: 'ai', use: null };
    subs.forEach(function(s){
      var d = s.data, fwd = d.a === h && d.b === a, rev = d.a === a && d.b === h;
      if (!fwd && !rev) return;
      g.subs.push({ team: s.team, uid: d.uid, t: d.t, sc: fwd ? [d.pa, d.pb] : [d.pb, d.pa], okGi: d.gi === gi });
    });
    var valid = g.subs.filter(function(x){ return x.okGi; });
    valid.sort(function(x, y){ return x.t - y.t || x.team - y.team; });
    g.valid = valid;
    if (!g.humanH && !g.humanA){ g.status = 'ai'; }
    else if (g.sim){ g.status = 'sim'; }
    else if (!valid.length){ g.status = 'missing'; out.missing.push(gi); }
    else {
      var diff = valid.some(function(x){ return x.sc[0] !== valid[0].sc[0] || x.sc[1] !== valid[0].sc[1]; });
      if (!diff){ g.status = 'played'; g.use = valid[0]; }
      else {
        var pick = valid.filter(function(x){ return x.team === picks[gi]; })[0];
        if (pick){ g.status = 'picked'; g.use = pick; } else { g.status = 'conflict'; out.conflicts.push(gi); }
      }
    }
    if (g.use){
      out.hum.push({ a: h, b: a, pa: g.use.sc[0], pb: g.use.sc[1], src: 'sub' });
      if (plan.kind === 'po' && g.use.sc[0] === g.use.sc[1]) out.ties.push(gi);
    }
    out.games.push(g);
  });
  subs.forEach(function(s){ if (!out.games.some(function(g){ return g.subs.some(function(x){ return x.team === s.team; }); })) out.strays.push(s.team); });
  return out;
}
/* every document the advance needs, read through g.get (a transaction or the adapter); past weeks and history come from the cache */
async function readForAdvance(g, lg, m, cache, noSlots){
  cache = cache || { weeks: {}, hist: {} };
  var season = m.season, i, tp = [], sp = [];
  for (i = 0; i < NTEAMS; i++){ tp.push(g.get(PATH.team(lg, i))); if (!noSlots) sp.push(g.get(PATH.slot(lg, i))); }
  var wp = [];
