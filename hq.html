<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Pigskin HQ v0.15</title>
<style>
/* Pixel Pigskin HQ v0.3: plain dark theme, system fonts only. */
:root{
  --bg:#0e1424; --panel:#18213a; --panel2:#222d4d; --line:#33437a;
  --text:#eef2ff; --muted:#a9b9e6; --cream:#f3ead2; --sel:#2b3a55; --ink:#10142a; --focus:#4ea3ff; --yel:#ffd400; --grn:#4ee08a; --amb:#ffb020; --red:#ff8a8a;
  --fs:16px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:var(--fs);line-height:1.45}
#app{display:flex;min-height:100vh;align-items:flex-start}
#menu{width:12.5em;flex:none;background:var(--panel);border-right:2px solid var(--line);
  padding:16px 12px;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;display:flex;flex-direction:column;gap:8px;align-self:flex-start}
#menu .brand{font-weight:700;letter-spacing:.08em;color:var(--cream);font-size:1.05em}
#menu .mtop{margin-bottom:8px}
#menu .mbtns{display:flex;flex-direction:column;gap:8px}
#menu button{display:block;width:100%;text-align:left;padding:10px 12px;min-height:44px;
  background:var(--bg);color:var(--text);border:2px solid var(--line);font:inherit;cursor:pointer}
#menu button:hover:not([disabled]){background:var(--panel2)}
/* HQ 0.12: the current page = lighter navy, white text, a 4 px white bar on the outer edge. It wins over hover and focus (the text stays white). */
#menu button.on,#menu button.on:hover:not([disabled]),#menu button.on:focus,#menu button.on:focus-visible{background:var(--sel);color:#fff;border-color:var(--sel);box-shadow:inset 4px 0 0 #fff;font-weight:700}
#menu button[disabled]{opacity:.4;cursor:not-allowed}
#menu .lgname.top{margin-top:0;padding:4px 2px 2px;display:flex;flex-direction:column;gap:1px;font-size:13px;color:var(--muted);word-break:break-word}
#menu .lgname.top b{color:var(--text);font-size:1.05em}
#menu .grp{margin:14px 0 4px;padding-top:8px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;letter-spacing:.08em}
#menu .lgname{color:var(--muted);font-size:13px;margin-top:auto;padding-top:12px;word-break:break-word}
#right{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh;align-self:stretch}
main{flex:1;padding:20px 28px 28px;max-width:1800px;width:100%}
footer{padding:10px 28px;color:var(--muted);font-size:.85em;border-top:1px solid var(--line)}
h1{font-size:1.65em;margin:0 0 4px;letter-spacing:.04em;color:var(--cream)}
h2{font-size:1.2em;margin:22px 0 8px;color:var(--cream);letter-spacing:.04em}
h3{font-size:1em;margin:18px 0 6px;color:var(--muted);letter-spacing:.04em}
p,.note{margin:6px 0}
.note{color:var(--muted);font-size:.92em}
.sub{color:var(--muted);margin-bottom:14px}
button,select,textarea,input{font:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn{background:var(--panel2);color:var(--text);border:2px solid var(--line);padding:9px 16px;min-height:44px;cursor:pointer}
.btn:hover{background:var(--line)}
.btn.pri{background:var(--yel);color:#111;border-color:var(--yel);font-weight:700}
.btn.pri:hover{background:#ffe55c}
/* HQ 0.12: a selected choice (conference tabs, OFFENSE/DEFENSE, the playbook filters, the source buttons) = white fill, dark text. Yellow is only for the one action on a page and for what is yours. */
.btn[aria-selected="true"],.btn[aria-pressed="true"],.btn[aria-selected="true"]:hover,.btn[aria-pressed="true"]:hover{background:#fff;color:var(--ink);border-color:#fff;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
select{background:var(--bg);color:var(--text);border:2px solid var(--line);padding:8px 10px;min-height:40px}
textarea{width:100%;min-height:110px;background:var(--bg);color:var(--text);border:2px solid var(--line);padding:10px;
  font-family:Consolas,Menlo,monospace;font-size:.85em;resize:vertical}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(24em,100%),1fr));gap:16px}
.panel{background:var(--panel);border:2px solid var(--line);padding:16px}
.panel h2{margin-top:0}
.drop{border:2px dashed var(--line);padding:14px;text-align:center;color:var(--muted);margin-top:10px}
.drop.over{border-color:var(--yel);color:var(--text)}
.msg{padding:10px 14px;border:2px solid;margin:12px 0}
.msg.err{border-color:var(--red);background:#3a1c26}
.msg.warn{border-color:var(--amb);background:#3a2e14}
.msg.ok{border-color:var(--grn);background:#17301f}
.tag{display:inline-block;padding:0 .5em;border:2px solid var(--line);font-size:.75em;vertical-align:middle;letter-spacing:.06em;margin-left:6px;color:var(--text)}
.tag.me{border-color:var(--yel);color:var(--yel)}
.tag.st{border-color:var(--grn);color:var(--grn)}
.tag.bk{color:var(--muted)}
.tag.rt{border-color:var(--amb);color:var(--amb)}
.tag.rd{border-color:var(--red);color:var(--red)}
.tag.star{border-color:var(--cream);background:var(--cream);color:var(--ink);font-weight:700}
.tag.hs{border-color:var(--line);color:var(--muted);margin-left:.4em}
.wrap{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;background:var(--panel)}
.tbl th,.tbl td{padding:.45em .7em;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{background:var(--panel2);color:var(--muted);font-weight:600;font-size:.82em;letter-spacing:.04em;position:sticky;top:0}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.me td{background:#2b2a14}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--panel2)}
.tbl tr.sec td{background:var(--panel2);color:var(--cream);font-weight:700;letter-spacing:.05em}
a.lnk,button.lnk{color:#9cc4ff;background:none;border:0;padding:0;font:inherit;cursor:pointer;text-decoration:underline}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 22px;margin:8px 0;background:var(--panel);padding:14px 18px;border:2px solid var(--line)}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0}
.split{display:grid;grid-template-columns:17em minmax(0,1fr);gap:18px;align-items:start}
.tlist{background:var(--panel);border:2px solid var(--line);max-height:76vh;overflow:auto}
.tlist button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:8px 10px;min-height:40px;
  background:none;color:var(--text);border:0;border-bottom:1px solid var(--line);cursor:pointer}
.tlist button:hover{background:var(--panel2)}
.tlist button.on{background:var(--sel);color:#fff;box-shadow:inset 4px 0 0 #fff;font-weight:700}
.tlist .gh{padding:6px 10px;background:var(--panel2);color:var(--muted);font-size:.75em;letter-spacing:.06em}
.sw{display:inline-block;width:22px;height:22px;border:2px solid #fff;vertical-align:middle;margin-right:6px}
.big{font-size:1.4em;font-weight:700}
.bar{display:inline-block;width:6em;height:.7em;background:var(--bg);border:1px solid var(--line);vertical-align:middle}
.bar i{display:block;height:100%;background:var(--grn)}
.cards{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0}
.card{background:var(--panel);border:2px solid var(--line);padding:10px 16px;min-width:110px}
.card b{display:block;font-size:1.4em} .card span{color:var(--muted);font-size:.82em}
details.key{margin-top:18px;background:var(--panel);border:2px solid var(--line);padding:8px 14px}
details.key summary{cursor:pointer;color:var(--cream)}
details.key dl{display:grid;grid-template-columns:max-content 1fr;gap:3px 18px;margin:8px 0 2px}
details.key dt{color:var(--cream)} details.key dd{margin:0;color:var(--muted)}
pre{background:var(--panel);border:2px solid var(--line);padding:10px;overflow:auto;max-height:260px;font-size:.8em}
/* big screens: larger type so it reads from across a room */
@media (min-width:1500px){ :root{--fs:19px} }
@media (min-width:1800px){ :root{--fs:21px} }
/* narrow windows: the menu becomes a row on top */
@media (max-width:1000px){
  main{padding:14px 14px 22px}
  .split{grid-template-columns:1fr}
  .tlist{max-height:30vh}
}
@media (max-width:900px){
  #app{flex-direction:column;align-items:stretch}
  #menu{width:auto;height:auto;align-self:stretch;position:static;border-right:0;border-bottom:2px solid var(--line);padding:8px 10px;gap:4px}
  #menu .mtop{display:flex;align-items:baseline;gap:10px;margin:0;min-width:0}
  #menu .mtop .brand{display:none}
  #menu .lgname.top{padding:0;flex-direction:row;gap:8px;align-items:baseline;min-width:0;white-space:nowrap;overflow:hidden}
  #menu .lgname.top span{overflow:hidden;text-overflow:ellipsis}
  #menu .mbtns{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;gap:6px;padding-bottom:6px;align-items:center;-webkit-overflow-scrolling:touch}
  #menu button{width:auto;flex:none;min-height:44px;padding:6px 12px;white-space:nowrap}
  #menu button.on,#menu button.on:hover:not([disabled]),#menu button.on:focus,#menu button.on:focus-visible{box-shadow:inset 0 -4px 0 #fff}
  #menu .grp{display:none}
  #menu .who{display:none}
  #right{min-height:0;align-self:auto}
}

/* v0.3: online parts */
#menu .who{color:var(--muted);font-size:13px;padding-top:10px;display:flex;flex-direction:column;gap:2px;word-break:break-word}
#menu .who b{color:var(--text);font-weight:600}
input[type=text]{background:var(--bg);color:var(--text);border:2px solid var(--line);padding:8px 10px;min-height:44px;font:inherit}
input.code-in{text-transform:uppercase;letter-spacing:.2em;width:12.5em;max-width:100%;font-family:Consolas,Menlo,monospace}
input.name-in{width:min(24em,100%)}
.codebig{display:inline-block;font-family:Consolas,Menlo,monospace;font-size:2.6em;font-weight:700;letter-spacing:.3em;color:var(--yel);background:var(--panel);border:2px solid var(--yel);padding:.1em .45em .1em .75em}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.danger{border-color:var(--red);color:var(--red)}

.strike{text-decoration:line-through;color:var(--muted)}
.subline{margin:.2em 0}
.subline .btn{margin-left:.5em;padding:0 .6em}
.aboutbox{white-space:pre-wrap;border:2px solid var(--line);padding:.8em;margin:.6em 0;max-width:46em;font:inherit}

/* HQ 0.9: the home screen's collapsed extras */
details.more{margin-top:20px;border:1px solid var(--line);border-radius:6px;padding:0 12px 12px}
details.more summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--muted);font-weight:700;letter-spacing:.04em;font-size:13px}

/* HQ 0.9: uniforms */
#lookCard canvas.uni{display:block;background:#2a7030;width:100%;max-width:340px;height:auto}
#lookCard .pvrow{margin:8px 0}#lookCard .pvrow b{display:block;margin-bottom:4px}
.btn.swb{display:inline-flex;align-items:center;gap:8px;min-height:48px;text-align:left}
.btn.swb.on{outline:3px solid var(--yel)}
.btn.swb .swbox{display:block;width:26px;height:26px;border:2px solid #fff;flex:none}
.btn.swb small{color:var(--muted);font-size:11px}
#lookCard .pal{background:#0a0f1d;padding:8px;margin:8px 0}
#lookCard .palg{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin:6px 0}
#lookCard .palg button.pk{min-width:44px;min-height:44px;padding:0;font-weight:700;font-size:18px;border:2px solid #fff;cursor:pointer}
/* HQ 0.10: PLAYBOOK */
.pbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin:12px 0}
.pbcard{display:flex;flex-direction:column;gap:4px;align-items:stretch;background:var(--panel);color:var(--text);border:2px solid var(--line);padding:6px;min-height:44px;cursor:pointer;text-align:left}
.pbcard:hover,.pbcard:focus-visible{border-color:var(--yel)}
.pbdia{display:block;width:100%;height:auto;max-width:100%}
.pbname{font-weight:700;letter-spacing:.04em}
.pbkind{color:var(--muted);font-size:.8em}
.pbbig{max-width:560px;margin:10px 0}
/* HQ 0.11: PLAYBOOK, DEFENSE */
.dfcv{display:block;width:100%;height:auto;image-rendering:pixelated;background:#2a6034}
.dfcard .dfcv{max-width:240px;margin:0 auto}
.dfbig{position:relative;max-width:480px;margin:10px 0}
.dfbig .dfcv{width:100%}
.dfov{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.dfkey{margin:6px 0 10px 18px;padding:0;color:var(--muted);font-size:.9em}
#dfKeyBox{margin:8px 0}
#dfKeyBox summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700}

/* ===== HQ 0.12: phone (under about 700 px) ===== */
@media (max-width:700px){
  #main{padding:12px 10px}
  h1{font-size:1.35em}
  .tbl th,.tbl td{white-space:normal;padding:.4em .45em}
  .tbl .hm,.tbl th.hm,.tbl td.hm{display:none}
  table.tbl.fixed{table-layout:auto}
  .tbl .pbarw{display:none}
  .cards{gap:8px}
  .card{flex:1 1 40%;min-width:0;padding:8px 10px}
  .row>select,.row>input[type=text]{max-width:100%}
  .pbgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .pbcard svg{width:100%;height:auto;max-height:110px}
  #menu .mbtns::-webkit-scrollbar{height:4px}
  #foot{padding:8px 10px}
}
</style>

<script id="src-lg-engine">/* lg-engine.js (v2.22): THE SHARED LEAGUE ENGINE. Pure: no S, G, DOM, localStorage or window, no UI function. Everything comes in as arguments
   (the league object L, the season, a function rt(id) that returns a team's {off,def}, the human result(s) of the week).
   The game build includes this text inside its IIFE before lg.js; Node, the league tool and HQ load the same text with require() (the guard at the end).
   Every random draw that decides a league game comes from ONE stream per game: lgMulberry32(lgSeedFor(leagueSeed, season, week, gameIndex)).
   One game's draws depend ONLY on those four numbers (never on call order, on how many games ran before it, or on the human's result).
   gameIndex = the pair's position in L.sched[week]; playoffs: week = 100 + round, gameIndex = the game's position in lgPoGames(L).
   leagueSeed = lgLeagueSeed(L): a numeric L.seed if there is one, otherwise a hash of this season's schedule (nothing is saved).
   League CREATION (names, ratings, colors, the schedule) is not here: it keeps Math.random in the game's lg.js. */
const LGE=(function(){
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
/* v1.63: two league formats. NFL = 32 teams / 2 conferences / 8 divisions / 17 games / 14-team playoff.
   COLLEGE = 60 teams / 6 conferences of 10 / 12 games (9 conference + 3 non-conference) / 12-team playoff
   (6 conference champions + 6 at-large, the 4 best champions get a bye, reseeded each round). L.fmt picks the format (old saves have none = NFL).
   Team ids: id = conf*perConf + div*per + slot. */
const LGF={
 NFL:{id:'NFL',tag:'NFL FORMAT',btn:'NFL: 32 TEAMS',nc:2,dv:4,per:4,games:17,byes:1,homeRds:3,noTie:false,spread:1,
  conf:['PIXEL CONF','GRIDIRON CONF'],div:['NORTH','SOUTH','EAST','WEST'],
  rnd:['WILD CARD','DIVISIONAL','CONF FINAL','PIGSKIN BOWL'],champ:'PIGSKIN BOWL CHAMPIONS!',
  info:'2 CONFERENCES - 8 DIVISIONS - 17 GAMES - 14 TEAM PLAYOFF.',
  poTxt:'7 TEAMS PER CONFERENCE: 4 DIVISION WINNERS AND 3 WILD CARDS. SEED 1 GETS A BYE.',miss:'ONLY 7 TEAMS PER CONFERENCE GET IN.',
  help:'17 GAMES - PLAY EACH WEEK OR SIM IT. 4 DIVISION WINNERS + 3 WILD CARDS PER CONFERENCE MAKE THE PLAYOFFS, SEED 1 GETS A BYE. WIN THE PIGSKIN BOWL.'},
 COL:{id:'COL',tag:'COLLEGE FORMAT',btn:'COLLEGE: 60 TEAMS',nc:6,dv:1,per:10,games:12,byes:4,homeRds:1,noTie:true,spread:1.3,
  conf:['ATLANTIC','LAKES','MOUNTAIN','PACIFIC','SOUTHERN','PLAINS'],div:[''],
  rnd:['FIRST ROUND','QUARTERFINAL','SEMIFINAL','NATIONAL TITLE'],champ:'NATIONAL CHAMPIONS!',
  info:'6 CONFERENCES OF 10 - 12 GAMES (9 CONFERENCE + 3 NON-CONFERENCE) - 12 TEAM PLAYOFF.',
  poTxt:'12 TEAMS: THE 6 CONFERENCE CHAMPIONS (BEST CONFERENCE RECORD) + 6 AT-LARGE TEAMS. THE 4 BEST CHAMPIONS GET A BYE.',miss:'ONLY 12 OF THE 60 TEAMS GET IN.',
  help:'12 GAMES - 9 IN YOUR CONFERENCE, 3 NON-CONFERENCE. THE 6 CONFERENCE CHAMPIONS + 6 AT-LARGE TEAMS MAKE THE 12-TEAM PLAYOFF, THE 4 BEST CHAMPIONS GET A BYE. WIN THE NATIONAL TITLE.'}};
const lgCfg=L=>LGF[(L&&L.fmt)||'NFL'],lgN=c=>c.nc*c.dv*c.per;

/* ----- the seeded generator and the per-game seed ----- */
/* mulberry32: a 32-bit seed in, a function out that returns numbers in [0,1) */
function lgMulberry32(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
/* seedFor: four numbers in, one 32-bit seed out (a murmur-style mix; the same on every device) */
function lgSeedFor(leagueSeed,season,week,gameIndex){
 let h=(leagueSeed>>>0)^0x9E3779B9;
 for(const v of[season,week,gameIndex]){h^=(v|0)+0x7F4A7C15;h=Math.imul(h^(h>>>16),0x85EBCA6B);h=Math.imul(h^(h>>>13),0xC2B2AE35);h^=h>>>16}
 return h>>>0}
/* the league's seed number: a numeric L.seed if the league has one (the game's L.seed is the playoff seed MAP, an object, so it never counts), else an FNV-1a hash of the team count and this season's schedule. Never saved. */
function lgLeagueSeed(L){
 if(typeof L.seed==='number'&&isFinite(L.seed))return L.seed>>>0;
 let h=0x811C9DC5;const add=v=>{v|=0;h=Math.imul(h^(v&255),0x01000193);h=Math.imul(h^((v>>>8)&255),0x01000193)};
 add(L.teams.length);const S=L.sched||[];for(const rd of S){add(1000+rd.length);for(const g of rd){add(g[0]);add(g[1])}}
 return h>>>0}

/* ----- the game ----- */
const lgGauss=rng=>(rng()+rng()+rng()-1.5)*2;     /* about N(0,1), fed by a stream; as the game always had it */
/* A, B = {off,def}; noTie = playoffs or a no-tie format; hfa: true = A is the home team, false = B is, null/undefined = neutral (v1.56) */
function lgSim(A,B,noTie,hfa,rng){
 const mu=(o,d)=>clamp(22+(o-d)*2.4,6,40),h=hfa===true?1.2:hfa===false?-1.2:0;
 let pa=clamp(Math.round(mu(A.off,B.def)+h+lgGauss(rng)*6),0,56),pb=clamp(Math.round(mu(B.off,A.def)-h+lgGauss(rng)*6),0,56);
 if(noTie&&pa===pb){if(rng()<.5)pa+=3;else pb+=3}
 return[pa,pb]}
/* one league game with its own stream (a = first team of the pair, b = second) */
function lgGame(L,ls,season,week,gi,rt,a,b,po,hfa){
 return lgSim(rt(a),rt(b),!!(po||lgCfg(L).noTie),hfa,lgMulberry32(lgSeedFor(ls,season,week,gi)))}

/* ----- records and standings ----- */
function lgRecGame(L,a,b,pa,pb){const R=L.rec;R[a].pf+=pa;R[a].pa+=pb;R[b].pf+=pb;R[b].pa+=pa;
 if(pa>pb){R[a].w++;R[b].l++}else if(pb>pa){R[b].w++;R[a].l++}else{R[a].t++;R[b].t++}
 if(L.teams[a].conf===L.teams[b].conf){if(pa>pb){R[a].cw=(R[a].cw||0)+1;R[b].cl=(R[b].cl||0)+1}else if(pb>pa){R[b].cw=(R[b].cw||0)+1;R[a].cl=(R[a].cl||0)+1}}}
const lgPct=r=>{const g=r.w+r.l+r.t;return g?(r.w+r.t/2)/g:0};
const lgCP=r=>{const g=(r.cw||0)+(r.cl||0);return g?(r.cw||0)/g:0};
function lgOrder(L,ids,ov){const R=L.rec,cf=!ov&&lgCfg(L).id==='COL';return ids.slice().sort((a,b)=>(cf?lgCP(R[b])-lgCP(R[a]):0)||lgPct(R[b])-lgPct(R[a])||(R[b].pf-R[b].pa)-(R[a].pf-R[a].pa)||R[b].pf-R[a].pf||a-b)}
const lgDivIds=(cf,c,d)=>Array.from({length:cf.per},(_,i)=>c*cf.per*cf.dv+d*cf.per+i);

/* ----- a regular-season week ----- */
/* hum = the human results of the week as a list of [a,b,pa,pb] (empty, one, or several). They are recorded as given; every other game of L.sched[week] is simulated from its own stream. Returns the week's games, human games first, then the others in schedule order. rt(id) returns {off,def}. */
function lgPlayWeek(L,w,season,rt,hum){
 hum=hum||[];const games=[],busy=new Set(),ls=lgLeagueSeed(L);
 for(const[a,b,pa,pb]of hum){lgRecGame(L,a,b,pa,pb);games.push([a,b,pa,pb]);busy.add(a);busy.add(b)}

        const ids = T.order.filter((i) => L.teams[i].cf === c);
        conf.push(S.dv || S.nc === 1 ? ids : ids.slice().sort(T.cmpConf));
        div.push(S.dv ? Array.from({ length: S.dv }, (_, d) => ids.filter((i) => L.teams[i].dv === d)) : [ids.slice()]);
      }
      return { overall: T.order, conf, div };
    }
    // the playoff field: a list of brackets, each a list of team ids in seed order.
    //  divisions: the division winners first (best record first), then the best of the rest (wild cards);
    //  no divisions, several conferences: the conference champions (best conference record) + at-large, the best champions take the byes;
    //  one conference and no divisions: simply the best records.   br 2 = a bracket per conference.
    function seedBrackets(L, tag) {
      const S = L.shape, T = shapeTable(L, tag), perB = S.po / S.br, out = [];
      for (let c = 0; c < S.br; c++) {
        const pool = T.order.filter((i) => S.br === 1 || L.teams[i].cf === c);
        let autos = [];
        if (S.dv) {
          const groups = new Map(); for (const i of pool) { const k = L.teams[i].cf * 10 + L.teams[i].dv; if (!groups.has(k)) groups.set(k, i); }   // pool is already in order: first = winner
          autos = [...groups.values()].sort(T.cmp);
        } else if (S.nc > 1) {
          const groups = new Map(); for (const i of pool.slice().sort(T.cmpConf)) { if (!groups.has(L.teams[i].cf)) groups.set(L.teams[i].cf, i); }
          autos = [...groups.values()].sort(T.cmp);
        }
        autos = autos.slice(0, perB);
        const rest = pool.filter((i) => !autos.includes(i)).slice(0, perB - autos.length);
        if (S.dv || !autos.length) out.push([...autos, ...rest]);
        else out.push([...autos.slice(0, S.by), ...[...autos.slice(S.by), ...rest].sort(T.cmp)]);
      }
      return out;
    }
    // the next playoff round of a shaped league, worked out from the seeds and the results so far
    function shapePoPlan(L) {
      const S = L.shape, nG = L.sch.length, perB = S.po / S.br, P = pow2up(perB), total = poRounds(S), nbr = log2i(P), b = P - perB;
      const seeds = L.po ? L.po.seeds : seedBrackets(L, 0), alive = seeds.map((x) => x.slice());
      for (let r = 0; r < total; r++) {
        const pairs = [];
        if (r < nbr) for (const x of alive) { if (r === 0) for (let i = 0; i < (perB - b) / 2; i++) pairs.push([x[b + i], x[perB - 1 - i]]); else for (let i = 0; i < x.length / 2; i++) pairs.push([x[i], x[x.length - 1 - i]]); }
        else pairs.push([alive[0][0], alive[1][0]]);
        const rows = L.res.filter((x) => x.wk === nG + r);
        if (rows.length < pairs.length) return { kind: 'po', week: nG + r, round: r, seeds, pairs, hfa: r < S.hr ? true : null, last: r === total - 1, total };
        const won = new Set(rows.map((x) => (x.sc[0] > x.sc[1] ? x.h : x.a)));
        if (r < nbr) for (let c = 0; c < alive.length; c++) alive[c] = alive[c].filter((id, ix) => won.has(id) || (r === 0 && ix < b));
      }
      return { kind: 'done', week: null, round: null, pairs: [] };
    }

    // ---- injuries: between games only. Called once after every regular-season week and every playoff round but the last.
    // Everyone who was out sits one game off his count; every starter who was fit has a small seeded chance (INJ[L.inj]) to be out 1 to 4 games.
    // Stream: kind HURT (1008), n = the week (0, 1, 2 ...) or 100 + round. Two draws for EVERY starter, hurt or not, in team and roster order,
    // so the numbers never depend on who is already hurt. A league with no L.inj does nothing at all (not even a draw).
    function injuryStep(L, n) {
      if (!L.inj) return;
      const rate = INJ[L.inj], rng = stream(L.rs, L.ssn, K.HURT, n);
      for (const t of L.teams) for (const p of t.ro) {
        if (!(STARTERS[p.ps] > p.sl)) continue;
        const a = rng(), b = rng();
        if (p.ou) { p.ou--; if (!p.ou) delete p.ou; } else if (a < rate) p.ou = 1 + Math.floor(b * INJ.maxWeeks);
      }
    }
    // the league setting: 'OFF' | 'LOW' | 'NORMAL' (a league made with no setting is OFF: the record has no inj field). Turning it OFF makes everyone fit.
    function setInjuries(L, level) {
      const v = level == null ? 'OFF' : String(level).toUpperCase();
      if (v !== 'OFF' && v !== 'LOW' && v !== 'NORMAL') bad('injuries must be OFF, LOW or NORMAL (got ' + level + ')');
      if (v === 'OFF') { delete L.inj; healAll(L); } else L.inj = v;
      return L;
    }

    // ---- play: one regular-season week, the playoffs, a whole season
    function playWeek(L, w) {
      const rt = ratingFn(L);
      L.sch[w].forEach(([h, a], g) => record(L, w, h, a, scoreGame(L, rt, w, g, h, a, false), false));
      L.wk = w + 1; L.ph = 'reg';
      injuryStep(L, w);
    }
    // the score of one regular-season game on its own (for tests): same as inside playWeek
    function gameAt(L, w, g) { const [h, a] = L.sch[w][g]; return scoreGame(L, ratingFn(L), w, g, h, a, false); }

    // top four by record; 1 v 4 and 2 v 3 (round 0), then the winners (round 1), played at the better seed
    function playPlayoffs(L) {
      if (L.shape) {    // shaped league: the same rounds the human flow plays, every game from the engine
        for (let guard = 0; guard < 8; guard++) { const plan = nextGames(L); if (plan.kind !== 'po') break; playRoundSim(L, plan); }
        return;
      }
      const rt = ratingFn(L), seeds = rank(L, 0).slice(0, L.rules.league.playoffTeams), wkP = L.sch.length;
      const play = (x, y, round, g) => {
        const [h, a] = seeds.indexOf(x) < seeds.indexOf(y) ? [x, y] : [y, x];
        const sc = scoreGame(L, rt, PO_WEEK_BASE + PO_FIRST_ROUND + round, g, h, a, true);
        record(L, wkP + round, h, a, sc, true);
        return sc[0] > sc[1] ? h : a;
      };
      const w1 = play(seeds[0], seeds[3], 0, 0), w2 = play(seeds[1], seeds[2], 0, 1);
      injuryStep(L, PO_WEEK_BASE + 0);
      const ch = play(w1, w2, 1, 0);
      L.po = { seeds, ch, ru: ch === w1 ? w2 : w1 };
      L.ph = 'done'; L.wk = wkP + 2;
    }
    function playSeason(L) {
      L.res = []; L.teams.forEach((t) => { t.rc = [0, 0, 0, 0, 0]; });
      for (let w = 0; w < L.sch.length; w++) playWeek(L, w);
      playPlayoffs(L);
    }

    // ---- the offseason
    function offseason(L, ctx) {
      const rules = L.rules, s = L.ssn, R = rules.retire;
      healAll(L);     // injuries do not carry into the next season
      // 1. this season's games and wins per team (regular season and playoffs), from the results
      const { games, wins } = tally(L);
      const report = L.teams.map((t, i) => ({ team: i, retired: [], rookies: [] }));
      L.hist.push({ s, ch: L.po.ch, ru: L.po.ru, st: L.teams.map((t) => t.rc.slice()) });
      // 2. fold career lines, age +1, yearly change (XP speeds up growth)
      const rngG = stream(L.rs, s, K.GROWTH);
      L.teams.forEach((t, ti) => t.ro.forEach((p) => {
        p.cr.push([s, games[ti]]); p.ag++;
        applyYear(p, rules, rules.xp.perGame * games[ti] + rules.xp.perWin * wins[ti], rngG);
      }));
      // 3. retire: age-based chance, higher if below the league median at his position; sure at 36 (QB, K 39)
      const med = {};
      for (const [pos] of rules.positions) { const v = L.teams.flatMap((t) => t.ro.filter((p) => p.ps === pos).map(overall)).sort((a, b) => a - b); med[pos] = v[Math.floor(v.length / 2)]; }
      const rngR = stream(L.rs, s, K.RETIRE), used = usedIds(L);
      let retired = 0;
      const taken = L.teams.map((t) => new Set(t.ro.map((p) => p.nm)));
      L.teams.forEach((t, ti) => t.ro.forEach((p, i) => {
        const late = R.lateShift[p.ps] || 0, eff = p.ag - late;
        let chance = p.ag >= (late ? R.forceAgeLate : R.forceAge) ? 1 : (R.chanceByAge[eff] || 0);
        if (chance < 1 && overall(p) < med[p.ps]) chance = Math.min(1, chance * R.belowMedianMultiplier);
        if (rngR() < chance) {
          // 4. the starter's slot is filled at once by a new rookie (there are no backups yet)
          L.rtd.push([s, p.id]); taken[ti].delete(p.nm);
          t.ro[i] = newRookie(rngR, rules, p.ps, p.sl, used, taken[ti], ctx);
          report[ti].retired.push({ id: p.id, nm: p.nm, ps: p.ps, sl: p.sl, ag: p.ag, ov: round3(overall(p)) });
          report[ti].rookies.push({ id: t.ro[i].id, nm: t.ro[i].nm, ps: t.ro[i].ps, sl: t.ro[i].sl, ag: t.ro[i].ag, ov: round3(overall(t.ro[i])), pt: t.ro[i].pt });
          retired++;
        }
      }));
      L.rtd = L.rtd.filter(([rs]) => rs > s - 10);
      // 5. team edge: pulled back toward 0, plus noise
      const rngE = stream(L.rs, s, K.EDGE), E_ = rules.edge;
      for (const t of L.teams) t.ed = round3(clamp(E_.keep * t.ed + E_.sd * rngE.gauss(), -E_.clamp, E_.clamp));
      // 6. next season
      L.ssn = s + 1; L.wk = 0; L.ph = 'reg'; L.po = null; L.res = [];
      L.teams.forEach((t) => { t.rc = [0, 0, 0, 0, 0]; });
      L.sch = scheduleFor(L.shape, stream(L.rs, L.ssn, K.SCHED));
      return { retired, report };
    }

    // ---- the league maker (8 teams first; shaped leagues are makeShapedLeague below)
    // Makes the league, then runs `burnIn` hidden seasons so ages and retirements are steady
    // before season 1 is handed back. The season counter starts at 1 (hidden seasons are -9 to 0).
    // `rs` is the league's random seed (a number). It is NOT the game's L.seed (that is the playoff seed map).
    // shape (4th argument): undefined / null / '8' = the 8-team league (the record has no "shape" field); 'NFL', 'COLLEGE', a custom spec
    // { teams, conferences, divisions, games, playoff } or a finished shape record. A shape that cannot work throws Error('lg-std: <plain message>').
    // opts (5th argument, new in 1.4): { injuries: 'OFF' | 'LOW' | 'NORMAL' } (default OFF). The setting is put in the record AFTER the hidden seasons, so
    // the players, ratings and history of a league are the same whatever the setting; with OFF there is no field at all.
    function makeLeague(rs, rules, ctx = newCtx(), shapeSpec, opts) {
      const sh = shapeOf(shapeSpec); if (!sh.ok) bad(sh.msg);
      const inj = opts && opts.injuries; if (inj != null && !['OFF', 'LOW', 'NORMAL'].includes(String(inj).toUpperCase())) bad('injuries must be OFF, LOW or NORMAL (got ' + inj + ')');
      if (sh.shape) return setInjuries(makeShapedLeague(rs, rules, ctx, sh.shape), inj);

      const L = { v: 2, dp: 'std', fmt: 'p8', nm: 'PROOF 8', id: 'L' + E.seedFor(rs, 0, K.ID, 0).toString(36).slice(0, 5), cmr: null,
        ssn: 1 - rules.league.burnIn, wk: 0, ph: 'reg', burn: rules.league.burnIn, sch: [], po: null, hist: [], res: [], rs, rules, rtd: [], teams: [] };
      TEAM_DEFS.forEach(([nm, c, d], i) => {
        const taken = new Set(), ro = [];
        for (const [pos, n] of rules.positions) for (let sl = 0; sl < n; sl++) {
          // start as a rookie, then live through the same yearly change up to a random age 21 to 34
          const p = newRookie(rng, rules, pos, sl, used, taken, ctx), target = rng.int(21, 34);

        L.teams.push({ id: i, nm, cf: 0, dv: i < 4 ? 0 : 1, ow: 'ai', lk: { c, d }, cr: 0, ed: 0, rc: [0, 0, 0, 0, 0], ro });
      });
      L.sch = makeSchedule(stream(rs, L.ssn, K.SCHED));
      for (let k = 0; k < rules.league.burnIn; k++) { playSeason(L); offseason(L, ctx); }
      // hand back season 1: no history, no career lines from the hidden seasons
      L.ssn = 1; L.hist = []; L.res = [];
      for (const t of L.teams) for (const p of t.ro) p.cr = [];
      return setInjuries(L, inj);
    }


    // A league of any shape. Players are made by exactly the same code as in the 8-team league (same stream, same order, per team);
    // only the teams' names and places in the league, the schedule and the playoffs come from the shape.
    function makeShapedLeague(rs, rules, ctx, S) {
      rules = clone(rules);
      const rng = stream(rs, 0, K.MAKER), used = new Set(), teamRows = shapeTeamDefs(S, stream(rs, 0, K.MAKER, 1));
      const L = { v: 2, dp: 'std', fmt: 'p' + S.n, shape: S, nm: 'PROOF ' + S.n, id: 'L' + E.seedFor(rs, 0, K.ID, 0).toString(36).slice(0, 5), cmr: null,
        ssn: 1 - rules.league.burnIn, wk: 0, ph: 'reg', burn: rules.league.burnIn, sch: [], po: null, hist: [], res: [], rs, rules, rtd: [], teams: [] };
      teamRows.forEach(([nm, c, d], i) => {

        for (const [pos, n] of rules.positions) for (let sl = 0; sl < n; sl++) {
          const p = newRookie(rng, rules, pos, sl, used, taken, ctx), target = rng.int(21, 34);
          while (p.ag < target) { p.ag++; applyYear(p, rules, 35, rng); }
          ro.push(p);
        }
        const pl = teamOfId(S, i);
        L.teams.push({ id: i, nm, cf: pl.cf, dv: pl.dv, ow: 'ai', lk: { c, d }, cr: 0, ed: 0, rc: [0, 0, 0, 0, 0], ro });
      });
      L.sch = shapeSchedule(S, stream(rs, L.ssn, K.SCHED));
      for (let k = 0; k < rules.league.burnIn; k++) { playSeason(L); offseason(L, ctx); }
      L.ssn = 1; L.hist = []; L.res = [];

    }


    // =========================================================================================================
    // ROUND 4: the shared WEEK / PLAYOFF / HUMAN logic. Everything is keyed by team INDEX (no "my team" here).
    // A human result is {a, b, pa, pb, src}: a and b are team indexes (either order), pa and pb their points, src 'hand' | 'pc' | 'sub'.
    // A finished game as stored (and as given to applyWeek / applyPlayoffRound) is {wk, h, a, sc: [home points, away points], src}
    // (the array form [h, a, homePoints, awayPoints, src] is accepted too). All errors are plain Errors that start with "lg-std:".
    // =========================================================================================================
    const HUMAN_SRC = ['hand', 'pc', 'sub'], ANY_SRC = ['sim', 'hand', 'pc', 'sub'];
    const bad = (msg) => { throw new Error('lg-std: ' + msg); };
    const isScore = (x) => Number.isInteger(x) && x >= 0;
    const teamIx = (L, x) => Number.isInteger(x) && x >= 0 && x < L.teams.length;

    // the XP a team earned for one game: 2 for starting it, 1 more for a win (rules.xp; never stored)
    function xpFor(L, won) { return L.rules.xp.perGame + (won ? L.rules.xp.perWin : 0); }
    // XP earned so far this season per team index (regular season and playoffs), worked out from the results. Same numbers the offseason uses.
    function xpSoFar(L) { const { games, wins } = tally(L); return L.teams.map((t, i) => L.rules.xp.perGame * games[i] + L.rules.xp.perWin * wins[i]); }

    // the pairs still to play: { kind: 'reg' | 'po' | 'done', week, round, pairs: [[home, away], ...] }
    //  'reg'  : regular season, week = L.wk, pairs = L.sch[week]
    //  'po'   : a playoff round (round 0 = semifinals 1 v 4 and 2 v 3, round 1 = the final), better seed at home; the seeds are drawn from
    //           the standings when the playoffs have not been opened yet (nothing is changed here)
    //  'done' : the playoffs are over (champion known): next is the offseason
    function nextGames(L) {
      const nG = L.sch.length;
      if (L.po && L.po.ch != null) return { kind: 'done', week: null, round: null, pairs: [] };
      if (!L.po && L.wk < nG) return { kind: 'reg', week: L.wk, round: null, pairs: L.sch[L.wk].map(([h, a]) => [h, a]) };
      if (L.shape) return shapePoPlan(L);

      const r0 = L.res.filter((r) => r.wk === nG);
      if (r0.length < 2) return { kind: 'po', week: nG, round: 0, seeds, pairs: [[seeds[0], seeds[3]], [seeds[1], seeds[2]]] };
      const w = r0.map((r) => (r.sc[0] > r.sc[1] ? r.h : r.a)).sort((x, y) => seeds.indexOf(x) - seeds.indexOf(y));
      return { kind: 'po', week: nG + 1, round: 1, seeds, pairs: [[w[0], w[1]]] };
    }

    // the human entries checked and turned into a map "pair index" -> row. Throws on anything that is not a game of this week / round.
    function matchHum(L, hum, pairs, playoff) {
      const byGame = new Map();
      for (const e of hum || []) {
        if (!e || !teamIx(L, e.a) || !teamIx(L, e.b) || e.a === e.b) bad('a human result needs two different team indexes a and b');
        if (!isScore(e.pa) || !isScore(e.pb)) bad(`the score of the game ${e.a} v ${e.b} must be two whole numbers, 0 or more`);
        if (!HUMAN_SRC.includes(e.src)) bad(`the source of the game ${e.a} v ${e.b} must be hand, pc or sub (got ${e.src})`);
        if (playoff && e.pa === e.pb) bad(`a playoff game cannot end in a tie (${e.a} v ${e.b})`);
        const gi = pairs.findIndex(([h, a]) => (h === e.a && a === e.b) || (h === e.b && a === e.a));
        if (gi < 0) bad(`team ${e.a} v team ${e.b} is not a game of this ${playoff ? 'playoff round' : 'week'}`);
        if (byGame.has(gi)) bad(`the game ${e.a} v ${e.b} is given twice`);
        const [h] = pairs[gi];
        byGame.set(gi, { sc: h === e.a ? [e.pa, e.pb] : [e.pb, e.pa], src: e.src });
      }

    }
    // the human teams = every team whose owner is not 'ai' (the team record's own field) plus opts.humans (a list of team indexes)
    function humanSet(L, opts) {
      const set = new Set((opts && opts.humans) || []);
      L.teams.forEach((t, i) => { if (t.ow !== 'ai') set.add(i); });
      return set;
    }
    // which games of this week / round have a human team but no entry: [{gi, h, a}]
    function pendingOf(L, byGame, pairs, opts) {
      const hu = humanSet(L, opts), out = [];
      pairs.forEach(([h, a], gi) => { if (!byGame.has(gi) && (hu.has(h) || hu.has(a))) out.push({ gi, h, a }); });
      return out;
    }
    // the games of the plan, in pair order, ready to record: human ones as given, every other one from the engine (src 'sim')
    function resolve(L, pairs, byGame, pending, wkEngine, playoff, hfa) {
      const rt = ratingFn(L), skip = new Set(pending.map((p) => p.gi)), out = [];
      pairs.forEach(([h, a], gi) => {
        if (skip.has(gi)) return;
        const m = byGame.get(gi);
        out.push(m ? { gi, h, a, sc: m.sc, src: m.src } : { gi, h, a, sc: scoreGame(L, rt, wkEngine, gi, h, a, playoff, hfa), src: 'sim' });
      });
      return out;
    }
    const xpOfGames = (L, games) => { const xp = L.teams.map(() => 0); for (const g of games) { xp[g.h] += xpFor(L, g.sc[0] > g.sc[1]); xp[g.a] += xpFor(L, g.sc[0] < g.sc[1]); } return xp; };
    const rows = (wk, games) => games.map((g) => ({ wk, h: g.h, a: g.a, sc: [g.sc[0], g.sc[1]], src: g.src }));

    // what a finished playoff round does to the league (the semifinal results only go into L.res)
    function openPlayoffs(L, seeds) { if (!L.po) L.po = { seeds, ch: null, ru: null }; }
    const isLast = (plan) => (plan.last !== undefined ? plan.last : plan.round === 1);
    function playRoundSim(L, plan) {
      const games = resolve(L, plan.pairs, new Map(), [], PO_WEEK_BASE + PO_FIRST_ROUND + plan.round, true, plan.hfa);
      openPlayoffs(L, plan.seeds);
      for (const g of games) record(L, plan.week, g.h, g.a, g.sc, true, g.src);
      closeRound(L, plan, games);
    }
    function closeRound(L, plan, games) {
      const nG = L.sch.length;
      if (isLast(plan)) {
        const f = games[0], ch = f.sc[0] > f.sc[1] ? f.h : f.a;
        L.po.ch = ch; L.po.ru = ch === f.h ? f.a : f.h; L.ph = 'done'; L.wk = nG + (plan.total || 2);
      } else { L.ph = 'reg'; L.wk = nG; injuryStep(L, PO_WEEK_BASE + plan.round); }   // after every round but the last (the offseason clears them)
    }

    // ONE regular-season week (the week L.wk). hum = human results; opts = { humans: [team indexes], hold: bool }.
    // Human results are recorded as given; every other game is the engine's (week = schedule position, game = pair position).
    // A game with a human team and no entry is simulated with src 'sim'; with opts.hold it is NOT, and if any such game exists NOTHING is changed:
    // you get { held: true, pending: [{gi, h, a}] } back and can call again when the missing results are in.
    // Returns { held, week, games: [{wk, h, a, sc, src}], pending, autoSim, xp: [XP earned this week per team index] }
    // (autoSim = the human-team games that had no entry and were simulated; they are in games with src 'sim').
    function playWeekWith(L, hum, opts = {}) {
      const plan = nextGames(L);
      if (plan.kind !== 'reg') bad(plan.kind === 'done' ? 'the playoffs are over: run the offseason' : 'the regular season is over: play the playoffs');
      const w = plan.week, byGame = matchHum(L, hum, plan.pairs, false), pending = pendingOf(L, byGame, plan.pairs, opts);
      if (opts.hold && pending.length) return { held: true, week: w, games: [], pending, xp: L.teams.map(() => 0) };
      const games = resolve(L, plan.pairs, byGame, [], w, false);
      for (const g of games) record(L, w, g.h, g.a, g.sc, false, g.src);
      L.wk = w + 1; L.ph = 'reg';
      injuryStep(L, w);
      return { held: false, week: w, games: rows(w, games), pending: [], autoSim: pending, xp: xpOfGames(L, games) };
    }

    // ONE playoff round (round 0 = semifinals, round 1 = the final), the same way. Opens the playoffs (seeds from the standings) when needed.
    // The final sets champion and runner-up (L.po.ch, L.po.ru), ph 'done' and the week counter; the history row is added by the offseason, as always.
    // Returns { held, round, games, pending, autoSim, xp, done, ch, ru }.
    function playoffRoundWith(L, hum, opts = {}) {
      const plan = nextGames(L);

        for (let i = 0; i < D.classSize; i++) {
          while (left <= 0 && tier < D.tiers.length - 1) { tier++; left = D.tiers[tier].n; }
          const pos = rd.pick(mix); cls.push(P.newRookie(rd, newRules(rules, D.tiers[tier]), pos, 99, used, taken, opts.ctx)); left--;
        }
        const dd = STD.stream(L.rs, s, KIND.DRAFTORDER, 0), draw = L.teams.map(() => dd());
        const key = (t, i) => [(t.rc[0] + 0.5 * t.rc[2]) / Math.max(1, t.rc[0] + t.rc[1] + t.rc[2]), t.rc[3] - t.rc[4], draw[i]];
        const ord = L.teams.map((t, i) => [i, key(t, i)]).sort((a, b) => a[1][0] - b[1][0] || a[1][1] - b[1][1] || a[1][2] - b[1][2]).map((x) => x[0]);
        L.dr = { s, ord, cls, pk: [], dn: [] }; L.ph = 'dr';
        return { retired, report, pool: before - L.fa.length, class: cls.map((p) => clone(p)), order: ord.slice() };
      });
    }

    // ------------------------------------------------------------ stage 2: the draft
    // humanPicks = [{t, id}] (id = a prospect's id, or null = "pick for me"); a team with entries uses them in order, one per turn.
    // opts = { humans: [team indexes], hold, ctx }. A team is human when it is in opts.humans or its team.ow is not 'ai'.
    // The AI teams pick the prospect with the biggest gain (design section 4). A human team with no entry: with hold the draft STOPS there
    // (everything before it is done and saved in L.dr; calling again with the same state and no new entry changes nothing), without hold it is picked for.
    // Returns { held, done, picks: [{n, round, t, src: 'ai'|'human'|'auto', id, nm, ps, ag, ov, pt}], pending: [{t, n, round}] }.
    function draftWith(L, humanPicks = [], opts = {}) {
      if (L.dp !== 'full') bad('this is not a Full league');
      if (L.ph !== 'dr') bad('there is no draft open (phase ' + L.ph + ')');
      return tx(L, () => {
        const hu = humanSet(L, opts), dr = L.dr, nT = L.teams.length, total = FR(L).draft.rounds * nT, out = [], entries = [], wishes = new Map();
        for (const e of humanPicks || []) {
          if (!e || !Number.isInteger(e.t) || e.t < 0 || e.t >= nT) bad('a pick needs a team index t');
          if (!hu.has(e.t)) bad(`team ${e.t} is not a human team (it has no turn to choose)`);
          if (e.wish !== undefined) {      // 1.4: a wish list: prospect ids, best first
            if (!Array.isArray(e.wish) || e.wish.some((x) => typeof x !== 'string')) bad('a wish list is a list of prospect ids');
            if (e.id !== undefined) bad('a draft entry is either an id or a wish list, not both');
            if (wishes.has(e.t)) bad(`team ${e.t} has two wish lists`);
            wishes.set(e.t, e.wish); continue;
          }
          if (e.id !== null && typeof e.id !== 'string') bad('a pick needs the prospect id (or null to pick for me)');
          entries.push({ t: e.t, id: e.id, used: false });
        }
        const picked = () => new Set(dr.pk.map((x) => x[1]));
        let pending = [];
        while (dr.pk.length < total && dr.cls.length) {
          const n = dr.pk.length, round = Math.floor(n / nT), ti = dr.ord[n % nT];
          let cand = null, src = 'ai';
          if (hu.has(ti)) {
            const done = picked(), e = entries.find((x) => x.t === ti && !x.used && (x.id === null || !done.has(x.id)));
            if (e) {
              e.used = true;
              if (e.id === null) src = 'auto';
              else { cand = dr.cls.find((p) => p.id === e.id); if (!cand) bad(`prospect ${e.id} is not available at pick ${n + 1}`); src = 'human'; }
            } else if (wishes.has(ti)) {       // 1.4: the first one on his wish list that is still there, else the pick-for-me choice
              const w = wishes.get(ti), taken = picked(); src = 'auto';
              for (const id of w) { if (taken.has(id)) continue; const c = dr.cls.find((p) => p.id === id); if (c) { cand = c; src = 'wish'; break; } }
            } else if (opts.hold) { pending = [{ t: ti, n, round }]; break; } else src = 'auto';
          }
          if (!cand) cand = bestBy(dr.cls, (p) => gain(L, ti, p), () => STD.stream(L.rs, dr.s, KIND.AIPICK, n));
          dr.cls.splice(dr.cls.indexOf(cand), 1); addPlayer(L.teams[ti], cand); dr.pk.push([ti, cand.id]);
          out.push({ n, round, t: ti, src, ...sum(cand) });
        }
        const done = !pending.length;
        if (done) { L.fa.push(...dr.cls); dr.cls = []; dr.dn = []; L.ph = 'fa'; }
        return { held: !done, done, picks: out, pending };
      });
    }

    // ------------------------------------------------------------ stage 3: free agency
    // humanSigns = [{t, ids: [player ids from the pool]}] (an empty list = no signing). A team may sign as many players as it has holes
    // (positions under their minimum) plus fulfil full.fa.signs (2) extra. Turns go in reverse order of finish (L.dr.ord).
    // The AI team: first its holes from the pool (best value), then up to 2 with gain above full.fa.minGain.
    // A human team with no entry: with hold the stage STOPS there, without hold it is signed for like an AI team.
    // Returns { held, done, signed: [{t, src, id, nm, ps, ag, ov, pt}], pending: [{t, holes, max}] }.
    function freeAgencyWith(L, humanSigns = [], opts = {}) {
      if (L.dp !== 'full') bad('this is not a Full league');
      if (L.ph !== 'fa') bad('free agency is not open (phase ' + L.ph + ')');
      return tx(L, () => {
        const hu = humanSet(L, opts), dr = L.dr, F = FR(L).fa, m = minOf(L.rules), out = [], by = new Map(), wishBy = new Map();
        for (const e of humanSigns || []) {
          if (!e || !Number.isInteger(e.t) || e.t < 0 || e.t >= L.teams.length) bad('a signing entry needs a team index t');
          if (!hu.has(e.t)) bad(`team ${e.t} is not a human team`);
          if (e.wish !== undefined) {      // 1.4: a wish list of pool player ids, best first: the first ones still in the pool, up to his limit
            if (!Array.isArray(e.wish) || e.wish.some((x) => typeof x !== 'string')) bad('a wish list is a list of player ids');
            if (e.ids !== undefined) bad('a signing entry is either ids or a wish list, not both');
            if (wishBy.has(e.t) || by.has(e.t)) bad(`team ${e.t} has two signing entries`);
            wishBy.set(e.t, e.wish); continue;
          }
          if (!Array.isArray(e.ids)) bad('a signing entry needs a list ids');
          by.set(e.t, e.ids);
        }
        let pending = [];
        for (const ti of dr.ord) {
          if (dr.dn.includes(ti)) continue;
          const t = L.teams[ti], h = holes(L, t);
          let src = 'ai';
          if (hu.has(ti)) {
            if (by.has(ti)) {
              const ids = by.get(ti);
              if (new Set(ids).size !== ids.length) bad(`team ${ti}: a player is listed twice`);
              if (ids.length > h + F.signs) bad(`team ${ti}: at most ${h + F.signs} signings (${h} holes + ${F.signs}), got ${ids.length}`);
              for (const id of ids) {
                const p = L.fa.find((x) => x.id === id); if (!p) bad(`team ${ti}: ${id} is not in the pool`);
                L.fa.splice(L.fa.indexOf(p), 1); addPlayer(t, p); out.push({ t: ti, src: 'human', ...sum(p) });
              }
              dr.dn.push(ti); continue;
            }
            if (wishBy.has(ti)) {
              const seen = new Set(); let k = 0;
              for (const id of wishBy.get(ti)) {
                if (k >= h + F.signs) break; if (seen.has(id)) continue; seen.add(id);
                const p = L.fa.find((x) => x.id === id); if (!p) continue;
                L.fa.splice(L.fa.indexOf(p), 1); addPlayer(t, p); out.push({ t: ti, src: 'wish', ...sum(p) }); k++;
              }
              dr.dn.push(ti); continue;
            }
            if (opts.hold) { pending = [{ t: ti, holes: h, max: h + F.signs }]; break; }
            src = 'auto';
          }
          const mkRng = () => STD.stream(L.rs, dr.s, KIND.AIPICK, 100 + ti), sign = (p) => { L.fa.splice(L.fa.indexOf(p), 1); addPlayer(t, p); out.push({ t: ti, src, ...sum(p) }); };
          for (const pos in m) while (count(t, pos) < m[pos]) {                              // 1. holes: the best value at the position
            const c = bestBy(L.fa.filter((p) => p.ps === pos), (p) => value(p, L.rules), mkRng); if (!c) break; sign(c);
          }
          for (let k = 0; k < F.signs; k++) {                                               // 2. up to 2 more, if they help enough
            const c = bestBy(L.fa, (p) => gain(L, ti, p), mkRng);
            if (!c || gain(L, ti, c) <= F.minGain) break; sign(c);
          }
          dr.dn.push(ti);
        }
        const done = !pending.length;
        if (done) { dr.dn = []; L.ph = 'cut'; }
        return { held: !done, done, signed: out, pending };
      });
    }

    // ------------------------------------------------------------ stage 4: the roster check
    // humanCuts = [{t, ids}]: the players a human team cuts. A team that is over its size (the sum over positions of the larger of its count
    // and its minimum, minus 40) must cut exactly that many, only from positions that are above their minimum. Cut players go to the pool.
    // Then every hole is filled from the pool (best value), then from a walk-on (kind 1011, team index as n). Turns in reverse order of finish.
    // A human team with nothing to cut needs no entry. A human team over its size with no entry: with hold the stage STOPS, without hold the
    // lowest-value players are cut like an AI team's. When all teams are done: the pool is trimmed to full.fa.poolSize (best value stay),
    // every depth chart is set best rating first, the team edge moves, and the new season starts (ph 'reg', week 0, new schedule).
    // Returns { held, done, cut: [{t, id, nm, ps}], filled: [{t, from: 'pool'|'walkon', id, nm, ps}], pending: [{t, surplus, holes}], season }.
    function cutWith(L, humanCuts = [], opts = {}) {
      if (L.dp !== 'full') bad('this is not a Full league');
      if (L.ph !== 'cut') bad('the roster check is not open (phase ' + L.ph + ')');
      return tx(L, () => {
        const rules = L.rules, hu = humanSet(L, opts), dr = L.dr, m = minOf(rules), SIZE = rosterSize(rules), by = new Map(), cut = [], filled = [];
        for (const e of humanCuts || []) {
          if (!e || !Number.isInteger(e.t) || e.t < 0 || e.t >= L.teams.length) bad('a cut entry needs a team index t');
          if (!hu.has(e.t)) bad(`team ${e.t} is not a human team`);
          if (!Array.isArray(e.ids)) bad('a cut entry needs a list ids');
          by.set(e.t, e.ids);
        }
        const surplusOf = (t) => { let s = -SIZE; for (const pos in m) s += Math.max(count(t, pos), m[pos]); return s; };
        let pending = [];
        for (const ti of dr.ord) {
          if (dr.dn.includes(ti)) continue;
          const t = L.teams[ti], sur = surplusOf(t), h = holes(L, t);
          let victims = null;
          if (hu.has(ti) && sur === 0 && by.has(ti) && by.get(ti).length) bad(`team ${ti} has nothing to cut but gave ${by.get(ti).length} players`);
          if (hu.has(ti) && sur > 0) {
            if (by.has(ti)) {
              const ids = by.get(ti);
              if (new Set(ids).size !== ids.length) bad(`team ${ti}: a player is listed twice`);
              if (ids.length !== sur) bad(`team ${ti} must cut exactly ${sur} players, got ${ids.length}`);
              const left = {}; for (const pos in m) left[pos] = count(t, pos);
              victims = ids.map((id) => {
                const p = t.ro.find((x) => x.id === id); if (!p) bad(`team ${ti}: ${id} is not on the roster`);
                if (left[p.ps] <= m[p.ps]) bad(`team ${ti}: ${p.nm} (${p.ps}) cannot be cut: the position is at its minimum`);
                left[p.ps]--; return p;
              });
            } else if (opts.hold) { pending = [{ t: ti, surplus: sur, holes: h }]; break; }
          }
          if (!victims) {                                                                    // the AI rule: cut the lowest value above the minimum
            victims = []; const left = {}; for (const pos in m) left[pos] = count(t, pos);
            for (let k = 0; k < sur; k++) {
              const c = t.ro.filter((p) => left[p.ps] > m[p.ps] && !victims.includes(p)).sort((a, b) => value(a, rules) - value(b, rules) || byId(a, b))[0];
              victims.push(c); left[c.ps]--;
            }
          }
          for (const p of victims) { removePlayer(t, p); L.fa.push(p); cut.push({ t: ti, id: p.id, nm: p.nm, ps: p.ps }); }
          let wr = null;
          for (const pos in m) while (count(t, pos) < m[pos]) {                              // holes: the pool first, then a walk-on
            const pool = L.fa.filter((p) => p.ps === pos).sort((a, b) => value(b, rules) - value(a, rules) || byId(a, b));
            let p, from;
            if (pool.length) { p = pool[0]; L.fa.splice(L.fa.indexOf(p), 1); from = 'pool'; }
            else { wr = wr || STD.stream(L.rs, dr.s, KIND.FAWALK, ti); p = P.newRookie(wr, newRules(rules), pos, 99, usedAll(L), takenAll(L), opts.ctx); from = 'walkon'; }
            addPlayer(t, p); filled.push({ t: ti, from, id: p.id, nm: p.nm, ps: p.ps });
          }
          fixDepth(t); dr.dn.push(ti);
        }
        const done = !pending.length;
        if (done) closeOffseason(L);
        return { held: !done, done, cut, filled, pending, season: L.ssn };
      });
    }

    // the last step: pool trimmed, team edge, next season
    function closeOffseason(L) {
      const rules = L.rules, s = L.dr.s, E_ = rules.edge;
      L.fa = L.fa.sort((a, b) => value(b, rules) - value(a, rules) || byId(a, b)).slice(0, FR(L).fa.poolSize);
      const rngE = STD.stream(L.rs, s, P.K.EDGE);
      for (const t of L.teams) t.ed = round3(clamp(E_.keep * t.ed + E_.sd * rngE.gauss(), -E_.clamp, E_.clamp));
      L.ssn = s + 1; L.wk = 0; L.ph = 'reg'; L.po = null; L.res = []; L.dr = null;
      L.teams.forEach((t) => { t.rc = [0, 0, 0, 0, 0]; });
      L.sch = P.scheduleFor(L.shape, STD.stream(L.rs, L.ssn, P.K.SCHED));
    }

    // ------------------------------------------------------------ depth chart
    // orders = [{t, auto: true}] (best rating first) or [{t, order: {QB: [ids best first], WR: [...]}}] (each listed position must name
    // every player of the team at that position exactly once). Allowed before the first game of a season (phase 'reg', week 0, no results):
    // XP follows the depth chart of the season that was played, so it cannot be changed during the season.
    // Returns { changed: [team indexes] }.
    function depthWith(L, orders = [], opts = {}) {
      if (L.dp !== 'full') bad('this is not a Full league');
      if (!(L.ph === 'reg' && L.wk === 0 && L.res.length === 0 && !L.po)) bad('the depth chart can only be set before the first game of a season');
      return tx(L, () => {
        const changed = [];
        for (const e of orders || []) {
          if (!e || !Number.isInteger(e.t) || e.t < 0 || e.t >= L.teams.length) bad('a depth entry needs a team index t');
          const t = L.teams[e.t];
          if (e.auto) fixDepth(t);
          else {
            if (!e.order || typeof e.order !== 'object') bad(`team ${e.t}: give auto: true or an order`);
            for (const pos of Object.keys(e.order)) {
              const ids = e.order[pos], have = t.ro.filter((p) => p.ps === pos);
              if (!have.length) bad(`team ${e.t}: unknown position ${pos}`);
              if (!Array.isArray(ids) || ids.length !== have.length || new Set(ids).size !== ids.length || ids.some((id) => !have.some((p) => p.id === id))) bad(`team ${e.t}: the ${pos} list must name each of the team's ${have.length} players once`);
              ids.forEach((id, i) => { have.find((p) => p.id === id).sl = i; });
            }
          }
          changed.push(e.t);
        }
        return { changed };
      });
    }

    // ------------------------------------------------------------ the whole offseason
    // Runs every stage that is open: opens the offseason (ph 'done'), the draft, free agency, the roster check. opts = { humans, hold, ctx,
    // picks: [{t,id}], signs: [{t,ids}], cuts: [{t,ids}] }. With no humans (and no hold) it runs by itself. With humans and hold it stops at the
    // first human turn that has no entry: held true, stage 'dr' | 'fa' | 'cut', pending [...]. Call again with more entries to go on.
    // Returns { held, stage, retired, report, picks, signed, cut, filled, pending, season }.
    function offseasonFull(L, opts = {}) {
      const out = { held: false, stage: null, retired: null, report: null, picks: [], signed: [], cut: [], filled: [], pending: [], season: null };
      if (L.ph === 'done') { const o = openOffseason(L, opts); out.retired = o.retired; out.report = o.report; }
      if (L.ph === 'dr') { const r = draftWith(L, opts.picks || [], opts); out.picks = r.picks; if (r.held) return Object.assign(out, { held: true, stage: 'dr', pending: r.pending }); }
      if (L.ph === 'fa') { const r = freeAgencyWith(L, opts.signs || [], opts); out.signed = r.signed; if (r.held) return Object.assign(out, { held: true, stage: 'fa', pending: r.pending }); }
      if (L.ph === 'cut') { const r = cutWith(L, opts.cuts || [], opts); out.cut = r.cut; out.filled = r.filled; if (r.held) return Object.assign(out, { held: true, stage: 'cut', pending: r.pending }); }
      out.season = L.ssn; return out;
    }

    // where the offseason stands (changes nothing): { stage: 'play' | 'done' | 'dr' | 'fa' | 'cut', next: {t, ...} | null, human: bool }
    function offseasonStatus(L, opts = {}) {
      const hu = humanSet(L, opts);
      if (L.ph === 'reg') return { stage: 'play', next: null, human: false };
      if (L.ph === 'done') return { stage: 'done', next: null, human: false };
      const dr = L.dr, nT = L.teams.length;
      if (L.ph === 'dr') { const n = dr.pk.length, t = dr.ord[n % nT]; return { stage: 'dr', next: { t, n, round: Math.floor(n / nT) }, human: hu.has(t) }; }
      const t = dr.ord.find((x) => !dr.dn.includes(x));
      return { stage: L.ph, next: { t }, human: hu.has(t) };
    }

    // ------------------------------------------------------------ checks (no files)
    // Returns a list of problems (empty = fine). Rosters are checked at 40 / every position at its minimum in phases 'reg' and 'done'.
    function checkFull(L) {
      const bad_ = [], rules = L.rules, m = minOf(rules), SIZE = rosterSize(rules), ids = new Set(), names = new Set();
      if (L.dp !== 'full') bad_.push('dp is not full');
      if (!PHASES.includes(L.ph)) bad_.push('phase ' + L.ph);
      if (!Array.isArray(L.fa)) bad_.push('no pool'); if (L.dr === undefined) bad_.push('no dr field');
      const chk = (p, where) => {
        if (ids.has(p.id)) bad_.push('duplicate id ' + p.id); ids.add(p.id);
        for (const [k, v] of Object.entries(p.rt)) {
          if (!(v >= 1 && v <= 10)) bad_.push(`${p.id} ${k} ${v} outside 1 to 10`);
          if (v > p.pt + 1e-9) bad_.push(`${p.id} ${k} ${v} above potential ${p.pt}`);
          if (Math.abs(v * 10 - Math.round(v * 10)) > 1e-6) bad_.push(`${p.id} ${k} ${v} not one decimal`);
        }
        if (!(p.xp === 0)) bad_.push(`${p.id} xp stored`);
      };
      const settled = L.ph === 'reg' || L.ph === 'done';
      for (const t of L.teams) {
        if (settled && t.ro.length !== SIZE) bad_.push(`${t.nm} has ${t.ro.length} players`);
        for (const [pos] of rules.positions) {
          const ps = t.ro.filter((p) => p.ps === pos).sort((a, b) => a.sl - b.sl);
          if (settled && ps.length !== m[pos]) bad_.push(`${t.nm} has ${ps.length} ${pos}, minimum ${m[pos]}`);
          if (ps.some((p, i) => p.sl !== i)) bad_.push(`${t.nm} ${pos} slots wrong`);
        }
        const own = new Set();        // 1.3: a name must be unique within its team in EVERY shape (the Standard rule; Standard 8-team leagues may repeat a name on two teams, and an upgraded one keeps it)
        for (const p of t.ro) { chk(p, t.nm); if (own.has(p.nm)) bad_.push('duplicate name ' + p.nm); own.add(p.nm); }
      }
      for (const p of L.fa) chk(p, 'pool');
      if (L.dr) for (const p of L.dr.cls) chk(p, 'class');
      if (settled && L.fa.length > FR(L).fa.poolSize) bad_.push('pool too big: ' + L.fa.length);
      for (const [, id] of L.rtd) if (ids.has(id)) bad_.push('retired id is live: ' + id);
      if (settled && L.dr !== null) bad_.push('dr is not null in a season');
      if (L.shape) P.checkShape(L, bad_);
      P.checkInj(L, bad_);
      return bad_;
    }
    // depth charts best rating first (ties id) for the teams in `teams` (default all): the AI default
    function depthIsBestFirst(L, teams) {
      const bad_ = [];
      for (const ti of teams || L.teams.map((t, i) => i)) {
        const t = L.teams[ti], by = {}; for (const p of t.ro) (by[p.ps] = by[p.ps] || []).push(p);
        for (const pos in by) { const s = by[pos].slice().sort((a, b) => a.sl - b.sl); for (let i = 1; i < s.length; i++) if (overall(s[i - 1]) < overall(s[i]) - 1e-12) bad_.push(`${t.nm} ${pos} not best first`); }
      }
      return bad_;
    }

    return { STD, makeFullLeague, upgradeToFull, openOffseason, draftWith, freeAgencyWith, cutWith, depthWith, offseasonFull, offseasonStatus,
      value, gain, checkFull, depthIsBestFirst, rosterSize, minOf, version: VERSION, KIND, RESERVED, STAGES, PHASES };
  }

  return { make, version: VERSION, KIND, RESERVED, STAGES, PHASES };
})();

function readFile(file){

function srcTag(src){
  if (src === 'hand') return el('span', {class:'tag hs', title:'hand-played by me'}, 'H');
  if (src === 'pc') return el('span', {class:'tag hs', title:'played by the PC'}, 'PC');
  if (src && src !== 'sim') return el('span', {class:'tag hs', title:'source: ' + src}, String(src));
  return null;
}
function resLine(r, tid){          /* 'W 24-17' or 'L 17-24' for team tid in result row r (scores are home first) */
  var mine = r.h === tid ? r.sc[0] : r.sc[1], opp = r.h === tid ? r.sc[1] : r.sc[0];
  return (mine > opp ? 'W ' : (mine < opp ? 'L ' : 'T ')) + mine + '-' + opp;
}
function stdPhaseText(m){
  var nG = m.sched.length, P = m.po, wp = Math.max(0, num(m.L.wk));
  if (P && P.ch != null) return 'Season complete (the champion is decided)';
  if (P && P.shaped) return 'Playoffs in progress: ' + (P.rounds[P.round] ? P.rounds[P.round].name.toLowerCase() : 'the final');
  if (P) return 'Playoffs in progress: ' + (P.round === 0 ? 'semifinals' : 'the final');
  if (!m.played) return 'Regular season not started (week 1 is next)';
  if (wp >= nG) return 'Regular season finished, playoffs not started';
  return 'Regular season: ' + Math.min(wp, nG) + ' of ' + nG + ' weeks played';
}

/* ===== HQ CLOUD LAYER BEGIN =====
   lg-cloud.js - ONE shared file: HQ (hq.html) and the phone game embed it byte for byte. Version string just below.
   Plain JavaScript: no DOM, no SDK import. It needs these globals, set by the page (or by the emulator test):
   LGE (lg-engine.js), LGSTD (lg-std.js), STD = LGSTD.make(LGE), STD_RULES (the rules object the game embeds).
   1.2 (a linked FULL league) also needs FULL = LGFULL.make(LGSTD, LGE) (lg-full 1.4) for runFullStep; reading a Full league needs no lg-full.
   Three parts: (1) a thin ADAPTER over Firestore, (2) PURE functions that turn a Standard league into cloud documents and back,
   (3) the CLOUD OPERATIONS (create, resume, read) written against the adapter only. */

var LG_CLOUD_VERSION = 'lg-cloud 1.2 (HQ 0.15: linked FULL leagues: pool, draft, wish lists, the offseason steps; 1.1 = every field of a phone Standard league)';
var CLOUD_SDK_VERSION = '10.14.1';           /* the same Firebase web SDK version the game loads */
var CLOUD_FORMAT = 1;                        /* meta.v of the OLD layout (one document per team, 8 teams) */
var CLOUD_FORMAT_BIG = 2;                    /* meta.v of the NEW layout (meta.lay === 2): one league document + one document per HUMAN team */
/* the league code: 6 characters. The rules accept [A-HJKMNP-Z2-9]; HQ also leaves out B, S and Z (look like 8, 5 and 2) */
var CODE_ALPHABET = 'ACDEFGHJKMNPQRTUVWXY23456789';
var CODE_RULE = /^[A-HJKMNP-Z2-9]{6}$/;
var LG_ALPHABET = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
var NTEAMS = 8;                              /* the OLD layout's team count (and the default of a league without meta.n) */
var NG_OLD = 14;                             /* regular-season weeks of the 8-team league */

var ENV = {
  now: function(){ return Date.now(); },
  ints: function(n){ var a = new Uint32Array(n); globalThis.crypto.getRandomValues(a); return a; }
};
function randStr(alpha, n){
  var out = '', lim = 4294967296 - (4294967296 % alpha.length);
  while (out.length < n){ var a = ENV.ints(n); for (var i = 0; i < a.length && out.length < n; i++) if (a[i] < lim) out += alpha.charAt(a[i] % alpha.length); }
  return out;
}
ENV.code = function(){ return randStr(CODE_ALPHABET, 6); };
ENV.lg = function(){ return randStr(LG_ALPHABET, 20); };
ENV.rs = function(){ return ENV.ints(1)[0] >>> 0; };

/* ---------- errors ---------- */
function CloudError(kind, text, cause){ var e = new Error(text); e.kind = kind; e.cause = cause || null; e.cloud = true; return e; }
function classify(e){
  if (e && e.cloud) return e.kind;
  var c = String((e && (e.code || e.name)) || ''), m = String((e && e.message) || '');
  if (/permission-denied|PERMISSION_DENIED/i.test(c + ' ' + m)) return 'denied';
  if (/resource-exhausted|quota/i.test(c + ' ' + m)) return 'quota';
  if (/already-exists/i.test(c)) return 'exists';
  if (/unauthenticated/i.test(c)) return 'denied';
  if (/unavailable|deadline-exceeded|network|offline|failed to fetch|timeout/i.test(c + ' ' + m)) return 'net';
  return 'other';
}
function kindText(kind){
  if (kind === 'denied') return 'The cloud refused this. Either you are not signed in the right way (the commissioner tools need a Google sign-in), or the rules for linked leagues are not published yet, or this change is not allowed.';
  if (kind === 'quota') return 'The free daily limit of the cloud was reached. Nothing is lost; try again tomorrow.';
  if (kind === 'net') return 'The connection to the cloud failed. Check the internet connection and try again.';
  return 'The cloud reported a problem.';
}
function cloudMsg(e){ return e && e.cloud && e.kind !== 'other' && e.message ? e.message : (kindText(classify(e)) + (e && e.message && classify(e) === 'other' ? ' (' + e.message + ')' : '')); }

/* ---------- (1) the adapter over the Firestore SDK (modular API: X = firebase-firestore) ---------- */
/* paths are plain strings 'lgs/ID/teams/3'. Every call returns plain data: { id, exists, data } and so on. */
function makeSdkAdapter(X, db){
  function ref(p){ return X.doc(db, p); }
  function snap(s){ var ex = s.exists(); return { id: s.id, exists: ex, data: ex ? s.data() : null }; }
  function applyOp(w, o){
    if (o.op === 'set') w.set(ref(o.path), o.data);
    else if (o.op === 'update') w.update(ref(o.path), o.data);
    else if (o.op === 'delete') w.delete(ref(o.path));
    else throw new Error('hq: unknown batch op ' + o.op);
    return w;
  }
  return {
    get: function(p){ return X.getDoc(ref(p)).then(snap); },
    list: function(p){ return X.getDocs(X.collection(db, p)).then(function(s){ return s.docs.map(function(d){ return { id: d.id, data: d.data() }; }); }); },
    listWhere: function(p, field, value){ return X.getDocs(X.query(X.collection(db, p), X.where(field, '==', value))).then(function(s){ return s.docs.map(function(d){ return { id: d.id, data: d.data() }; }); }); },
    set: function(p, data){ return X.setDoc(ref(p), data); },
    update: function(p, data){ return X.updateDoc(ref(p), data); },
    del: function(p){ return X.deleteDoc(ref(p)); },
    batch: function(ops){ var b = X.writeBatch(db); ops.forEach(function(o){ applyOp(b, o); }); return b.commit(); },
    transaction: function(fn){
      return X.runTransaction(db, function(t){
        return fn({
          get: function(p){ return t.get(ref(p)).then(snap); },
          set: function(p, data){ t.set(ref(p), data); },
          update: function(p, data){ t.update(ref(p), data); },
          del: function(p){ t.delete(ref(p)); }
        });
      });
    },
    onSnapshot: function(p, cb, errCb){ return X.onSnapshot(ref(p), function(s){ cb(snap(s)); }, errCb || function(){}); }
  };
}

/* ---------- (2) pure functions: Standard league <-> cloud documents ---------- */
function bad(msg){ return CloudError('data', 'hq: ' + msg); }
function cleanName(s){
  s = String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
  if (!s) throw CloudError('bad', 'Give the league a name.');
  if (s.length > 40) throw CloudError('bad', 'A league name can have at most 40 characters.');
  return s;
}
/* a player in the cloud: the same fields, but the career lines `cr` are FLAT [season, games, season, games ...]
   (Firestore does not allow a list inside a list) */
function encPlayer(p){
  var cr = []; p.cr.forEach(function(x){ cr.push(x[0], x[1]); });
  return { id: p.id, nm: p.nm, ps: p.ps, sl: p.sl, rt: Object.assign({}, p.rt), ag: p.ag, pt: p.pt, xp: p.xp, st: p.st, cr: cr };
}
function decPlayer(q, rules){
  var keys = rules.ratingKeys[q.ps];
  if (!keys || !q.rt || !Array.isArray(q.cr)) throw bad('a player record is damaged (' + q.id + ')');
  var rt = {};
  keys.forEach(function(k){ if (typeof q.rt[k] !== 'number') throw bad('a rating is missing (' + q.id + ' ' + k + ')'); rt[k] = q.rt[k]; });
  var cr = []; for (var i = 0; i + 1 < q.cr.length; i += 2) cr.push([q.cr[i], q.cr[i + 1]]);
  return { id: q.id, nm: q.nm, ps: q.ps, sl: q.sl, rt: rt, ag: q.ag, pt: q.pt, xp: q.xp, st: q.st, cr: cr };
}
/* a team chunk. id is a STRING in the cloud (the candidate rules need it); rc is always the season-start zeros (the season's
   results come from the week documents); rtd = ["season:playerId", ...] the retired ids this chunk keeps for the league */
/* bl = the BASELINE ratings of every player as the commissioner wrote them: { playerId: [rating values in rules.ratingKeys order] }.

  var attempt = 0;

    try { await ad.batch(createOps(plan, true, planTeamIdx(plan), true)); plan.done = true; return plan; }
    catch (err){
      var c;

      if (c.exists && c.data && c.data.lg === plan.lg){ plan.done = true; return plan; }          /* it was written; only the answer was lost */
      if (c.exists && ++attempt < 6){ plan.code = null; continue; }                             /* the code was taken: draw another */

/* finish a league: write only what is missing (idempotent). Safe to press any number of times. */

    var missing = []; info.teams.forEach(function(ok, i){ if (!ok) missing.push(i); });
    var ops = createOps(plan, !info.meta, missing, !info.code);
    var total = 2 + planTeamIdx(plan).length;
    if (!ops.length){ plan.done = true; return { wrote: 0, already: total, plan: plan }; }
    try { await ad.batch(ops); plan.done = true; return { wrote: ops.length, already: total - ops.length, plan: plan }; }
    catch (err){
      var c; try { c = await ad.get(PATH.code(plan.code)); } catch (e2){ throw failed(plan, err, 'unknown'); }

/* layout 2: the n teams in index order. A team with a slot is read from its own document; a computer team from the league document (ts); a team with

/* layout 2, the tidy-up the commissioner's next write does: a team a person now owns leaves ts (its own document is the truth), an orphan goes back

/* everything needed to rebuild the league after the meta doc is known. cache = { weeks, hist } keeps documents that never change. */

/* ===================================================================================================================
   MILESTONE 2: the week. Submissions, SIM marks, void, hold and ADVANCE (one transaction), and the AUDIT of rating changes.
   =================================================================================================================== */
/* the week number used in document keys: a regular week is its own number, a playoff round is 100 + round (semifinals 100, final 101) */
function planWeekNo(plan){ return plan.kind === 'reg' ? plan.week : (plan.kind === 'po' ? 100 + plan.round : null); }

function roundName(plan, shape){

  if (plan.kind === 'po'){

/* the submissions of one week or round: the sub documents of the teams that play in it (a read per team, at most 8).

async function readSubs(g, lg, season, wkNo, plan, humans){
  var teams = [], hs = null;

  plan.pairs.forEach(function(p){ if (!hs || hs[p[0]] || hs[p[1]]) teams.push(p[0], p[1]); });

}
/* PURE: what is going on in this week. For every game: who is human, the valid submissions, the SIM mark, the result that will be used.
   picks = { gameIndex: teamIndexOfTheSubmitterTheCommissionerChose }.

function weekSituation(L, plan, subs, humans, ovr, season, wkNo, picks){
  picks = picks || {};

  var hs = {}; humans.forEach(function(i){ hs[i] = 1; });
  var out = { games: [], hum: [], missing: [], conflicts: [], ties: [], strays: [] };
  plan.pairs.forEach(function(pr, gi){

    subs.forEach(function(s){

    });
    var valid = g.subs.filter(function(x){ return x.okGi; });
    valid.sort(function(x, y){ return x.t - y.t || x.team - y.team; });
    g.valid = valid;
    if (!g.humanH && !g.humanA){ g.status = 'ai'; }
    else if (g.sim){ g.status = 'sim'; }
    else if (!valid.length){ g.status = 'missing'; out.missing.push(gi); }
    else {
      var diff = valid.some(function(x){ return x.sc[0] !== valid[0].sc[0] || x.sc[1] !== valid[0].sc[1]; });
      if (!diff){ g.status = 'played'; g.use = valid[0]; }

      if (plan.kind === 'po' && g.use.sc[0] === g.use.sc[1]) out.ties.push(gi);
    }
    out.games.push(g);
  });
  subs.forEach(function(s){ if (!out.games.some(function(g){ return g.subs.some(function(x){ return x.team === s.team; }); })) out.strays.push(s.team); });

}
/* every document the advance needs, read through g.get (a transaction or the adapter); past weeks and history come from the cache.

  for (i = 0; i < Math.min(m.wk, nG); i++) want(weekKey(season, i), PATH.week(lg, season, i));
  if (lay2){ if (m.wk >= nG) for (i = 0; i < roundsOf(m); i++) want(weekKey(season, 100 + i), PATH.week(lg, season, 100 + i)); }
  else {

function staleMeta(m, e){ return !e || m.updatedAt !== e.updatedAt || m.wk !== e.wk || m.season !== e.season || m.ph !== e.ph; }

/* ADVANCE, HOLD or UNHOLD in ONE transaction.
   o = { uid, expect: {season, wk, ph, updatedAt}, picks, mode: 'sim' | 'hold' | 'unhold', cache }

   week document (it must not exist yet) and the submissions, rebuild L, call playWeekWith / playoffRoundWith ONCE, then write the week document and

async function advanceWeek(ad, lg, o){

    reads = 0; result = null;
    var g = { get: function(p){ reads++; return tx.get(p); } };
    var mg = await g.get(PATH.meta(lg));
    if (!mg.exists) throw CloudError('missing', 'This league does not exist in the cloud.');
    var m = mg.data;

    if (staleMeta(m, o.expect)) throw CloudError('stale', STALE_TEXT);
    if (o.mode === 'unhold'){ var u = Object.assign({}, m, { hold: false, updatedAt: nextStamp(m.updatedAt) }); tx.set(PATH.meta(lg), u); result = { kind: 'unheld', meta: u, reads: reads }; return; }

    if (sit.ties.length){ var tg = sit.games[sit.ties[0]]; throw CloudError('bad', 'A playoff game cannot end in a tie (' + L.teams[tg.h].nm + ' ' + tg.use.sc[0] + ' - ' + tg.use.sc[1] + ' ' + L.teams[tg.a].nm + '). Ask the players to check the score, or VOID that result.'); }

    if (o.mode === 'hold'){ var hm = Object.assign({}, m, { hold: true, updatedAt: now }); tx.set(PATH.meta(lg), hm); result = { kind: 'held', meta: hm, missing: sit.missing.slice(), reads: reads }; return; }
    if (sit.missing.length && o.mode !== 'sim') throw CloudError('bad', 'Some games with a person in them have not been played. Choose ADVANCE AND SIM THE MISSING GAMES or WAIT.');
    var res = plan.kind === 'reg' ? STD.playWeekWith(L, sit.hum, { humans: humans }) : STD.playoffRoundWith(L, sit.hum, { humans: humans });

  });

}
/* turn the SIM mark of one game on or off (meta.ovr, at most 20 marks). Marks from other weeks are dropped. */
async function setSimMark(ad, lg, o){
  var out = null;

/* PICK A SCORE (HQ 0.13): when two players sent different scores for one game, the commissioner chooses whose counts. The choice is kept in the league document

/* ---------- AUDIT: the credit upgrades a friend wrote into his own chunk against the rating changes the chunk really shows ----------
   An `up` entry is a map { s: season, w: week, id: playerId, k: ratingKey, from: old value, to: new value }.
   This shape is HQ's proposal: the game build that lets friends upgrade must write exactly this. A rating that differs from the baseline
   (chunk.bl, written by the commissioner) is EXPLAINED when the entries for that player and rating chain from the baseline to the current value. */

  var up = Array.isArray(doc.up) ? doc.up : [];

      });
    });
    Object.keys(bl).forEach(function(id){ if (!ro.some(function(q){ return q.id === id; })) out.changes.push({ id: id, nm: id, ps: '', k: '(player missing from the roster)', from: null, to: null, explained: false }); });

/* ===================================================================================================================
   MILESTONE 3: the offseason, the people (slots), the name of the league.
   =================================================================================================================== */
/* The OFFSEASON, in ONE transaction: re-read the league (meta, 8 chunks, the season's weeks), refuse unless the playoffs are over, run

   (9 rule lookups at commit, limit 20). The chunks are written whole, with a fresh baseline `bl` and without `up`.

    var mg = await g.get(PATH.meta(lg));
    if (!mg.exists) throw CloudError('missing', 'This league does not exist in the cloud.');
    var m = mg.data;
    if (m.commish !== o.uid) throw CloudError('denied', 'Only the commissioner can do this.');
