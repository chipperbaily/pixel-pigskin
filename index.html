/* v2.00 UI step 1: design tokens (claude/pixel-pigskin-ui-rules.md section 1). Menu screens (#app.mn, see fit() in p4.js) read these; the 16:9 game box keeps its own em sizes.

/* ===== v2.06 UI step 6 part A: the game screen. The field fills the window under a short DOM banner (score, clock, PAUSE, down and distance); one big corner button on the offense's side; the PLAYS and PAUSE sheets. Atkinson Hyperlegible (latin 400 and 700, embedded above). All of it sits inside the safe areas (--pt --pr --pb --pl set by fit()). Not for menus (#app.mn) or the designer. ===== */
#app.gm{box-shadow:none;font-size:16px;background:#000;--k:.9;--kb:1;--bh:31px;--pt:0px;--pr:0px;--pb:0px;--pl:0px;--pbg:rgba(8,13,28,.93);--tx1:#fff;--lab:#a9b9e6;--y:#ffd400;--bt:#ffd400;--btx:#10142a;--bb:#1a2547;--bbx:#fff}
#app:not(.gm) :is(#gh,#bPlay,#gpl,#gpz,#lvtag,#pbp){display:none!important}
#app.gm #c,#app.gm #cfg,#app.gm #ctp{position:absolute;left:0;top:var(--ct,var(--bh));width:100%;height:var(--ch,calc(100% - var(--bh)))}
#cbg{display:none;pointer-events:none}#app.gm #cbg{display:block;position:absolute;left:0;width:100%}#cfg,#ctp{pointer-events:none}#cfg{image-rendering:auto}#app:not(.gm) #cfg,#app:not(.gm) #ctp{display:none}
.gh,.gh *,#bPlay,.shb,.shb *{font-family:'Atk',sans-serif;font-weight:700;letter-spacing:0}
.gh{position:absolute;left:0;right:0;top:0;height:var(--bh);display:flex;align-items:center;justify-content:space-between;gap:calc(10px*var(--k));padding:var(--pt) calc(var(--pr) + 8px) 0 calc(var(--pl) + 8px);background:var(--pbg);color:var(--tx1);font-size:calc(18px*var(--k))}
.gh.u1{box-shadow:inset 0 -3px 0 #ffb52e}.gh.u2{box-shadow:inset 0 -3px 0 #ff5a5a}
.gh .bsc{display:flex;align-items:center;gap:calc(8px*var(--k));flex:1 1 0;min-width:0}
.gh .ch{display:block;flex:none;width:calc(10px*var(--k));height:calc(22px*var(--k));border:2px solid #fff;background:#888}
.gh .ab{font-size:calc(14px*var(--k)*1.1)}
.gh .n{font-size:calc(21px*var(--k));font-variant-numeric:tabular-nums;min-width:2ch;text-align:right;margin-right:calc(8px*var(--k))}
.gh .n.us{color:var(--y)}
.gh .bmid{display:flex;align-items:center;gap:calc(22px*var(--k));flex:none}
.gh .bck{display:flex;align-items:center;gap:calc(10px*var(--k));background:#000;padding:calc(3px*var(--k)) calc(14px*var(--k));--clk:#fff;color:var(--clk)}
.gh .bck .lab{color:var(--lab);font-size:calc(14px*var(--k))}
.gh .bck .t{font-size:calc(28px*var(--k));line-height:.9;font-variant-numeric:tabular-nums;color:var(--clk)}
.gh .dot{display:block;flex:none;width:calc(10px*var(--k));height:calc(10px*var(--k));background:#4ee08a;border-radius:50%}.gh .dot.off{background:transparent;border:3px solid var(--lab);border-radius:0}
.gh .bck.u1{--clk:#ffb52e;box-shadow:inset 0 0 0 3px #ffb52e}.gh .bck.u2{--clk:#ff5a5a;box-shadow:inset 0 0 0 3px #ff5a5a}

// =============================================================================
// lg-std.js  -  the rules of the 8-team STANDARD league, in one file.   (round 4)
//
// What is in here: the league maker (with its 10 hidden burn-in seasons), a
// team's strength worked out from its starters (the game's lgRt formula) plus
// the team edge, the 14-week schedule, standings, the top-four playoff, and
// the offseason (aging, growth toward potential, XP, retirement, rookies, edge).
// Plus the checks that need no files.
//
// Rules of this file:
//  * Pure and seeded. Every random number comes from a stream made with the
//    game's engine (mulberry32 + seedFor). No Math.random, Math.log or Math.cos.
//  * Nothing Node-only (no fs, process, require), so a browser page can load it.
//  * The rules object (rules.json) and the engine are handed in; this file
//    reads no files. The command line (pigskin-league.mjs) does that.
//  * A game's SCORE is made by the engine's own lgGame (E.game): it gets the rating
//    function rt(team) -> {off, def} and makes its own stream from
//    E.seedFor(rs, season, week, gameIndex). The team edge is added HERE, to the
//    strength numbers the rating function returns, before the engine sees them.
//
// How to use:   const STD = LGSTD.make(LGE);      // LGE = the game's engine
//               const L = STD.makeLeague(918273, rules);
//               STD.playSeason(L); STD.offseason(L, STD.newCtx());
// =============================================================================
const LGSTD = (function () {
  const VERSION = 'lg-std 1.2 (round 5)';

  // ------------------------------------------------------------ small helpers
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const mean = (a) => a.reduce((s, x) => s + x, 0) / (a.length || 1);
  const round3 = (x) => Math.round(x * 1000) / 1000;
  const overall = (p) => { const v = Object.values(p.rt); return v.reduce((s, x) => s + x, 0) / v.length; };

  // Conventions copied from the game's engine (claude/pixel-pigskin-updates-v222.md):
  //  regular season: week = the week's position in the schedule list (0, 1, 2 ...), gameIndex = the pair's position in that week
  //  playoffs:       week = 100 + round, gameIndex = the game's position in that round's list
  // ASSUMPTION (could not check, the real engine file was not available): rounds count from 0.
  const PO_WEEK_BASE = 100, PO_FIRST_ROUND = 0;
  // Reserved "week" numbers for everything that is NOT a game (names, growth, retirement ...).
  // Real game weeks are below 200, so these streams can never collide with a game's stream.
  const K = { MAKER: 1001, SCHED: 1002, GROWTH: 1003, RETIRE: 1004, EDGE: 1005, TIEBREAK: 1006, ID: 1007 };

  // The engine's lgGame only looks at the league object to ask lgCfg(L).noTie. The REAL engine knows only the game's own
  // formats (NFL, COL) and fails for our "p8", so every game call is given this stub: NFL = ties allowed in the regular
  // season (the playoff games say so themselves with po = true).
  const GAME_STUB = { fmt: 'NFL' };
  // The small ADAPTER: a Standard league seen in the game's own league shape (L.teams, L.sched, L.rec, numeric L.seed),
  // so the engine's own playWeek can run it. The league seed is our rs. (Used by the tests and by whoever glues this into the game.)
  function engineLeague(L) {
    return { fmt: 'NFL', seed: L.rs, teams: L.teams.map((t) => ({ id: t.id, conf: t.cf })), sched: L.sch,
      rec: L.teams.map(() => ({ w: 0, l: 0, t: 0, pf: 0, pa: 0 })), hist: [] };
  }

  // ------------------------------------------------------------ names, teams
  const SURNAMES = ('ADAMS AIKEN ALVAREZ ARCHER BAILEY BANKS BARNES BELL BENSON BISHOP BLAKE BOYD BRADY BROOKS BRYANT BURKE CALLOWAY CAMPOS CARTER CHASE CLARK COLE CONWAY COOPER CRUZ DALTON DAVIS DEAN DIAZ DIXON DUNN EASTON ELLIS EVANS FARRELL FIELDS FLYNN FORD FOSTER FOWLER FRANK GALLO GARCIA GIBBS GRANT GREEN HALE HAMMOND HARPER HART HAYES HENDRIX HOLT HOWARD HUDSON HUNT IVES JACOBS JENSEN JONES KANE KELLER KING KNOX LAMB LANE LEWIS LOGAN LOWE MACK MARSH MASON MEYER MILES MOORE MORAN NASH NOLAN OAKES OWENS PAGE PARKER PAYNE PIERCE PRICE QUINN RAMOS REED RILEY ROSS RUSSO SANDERS SHAW SIMMS SMITH SPENCER STONE TATE TODD TRAVIS VANCE WADE WARD WEBB WELLS WEST WOLFE WOOD YOUNG ZIMMER').split(' ');
  const TEAM_DEFS = [
    ['HARBOR HAWKS', '#cc3333', '#222222'], ['RIVER KINGS', '#2255cc', '#dddddd'], ['DESERT VIPERS', '#cc8822', '#331100'], ['PINE BARONS', '#1f7a3a', '#e8e8d0'],
    ['LAKE STORM', '#2a9bd6', '#102040'], ['CEDAR WOLVES', '#7a4a2a', '#f0e6d0'], ['PRAIRIE FOXES', '#d8651a', '#ffffff'], ['SUMMIT ROCKETS', '#7a2fb0', '#ffd400'],
  ];
  const B36 = '0123456789abcdefghijklmnopqrstuvwxyz';

  // ------------------------------------------------------------ pieces that need no engine
  // A new 8-character id, never one that is live or on the retired list.
  function mintId(rng, used, ctx) {
    for (;;) {

  // ONE offseason of change for one player (his age is already +1).
  // Before the peak age: each rating closes a share of the gap to potential; XP makes the share bigger.
  // After the peak: it falls by the decline table. Small seeded noise. Never above potential.
  function applyYear(p, rules, xpEarned, rng) {
    const G = rules.growth, eff = p.ag - (G.lateShift[p.ps] || 0);
    let share = 0;
    if (eff < G.peakAge) {

      share *= 1 + G.ptLift * Math.max(0, p.pt - G.ptLiftFrom);        // high-potential players close the gap faster

  // A team's offense and defense from its starters: the game's own formula (lgRt).
  // Not stored in the file, worked out when needed.
  function derive(team) {
    const by = {};
    for (const p of team.ro) (by[p.ps] = by[p.ps] || []).push(p);
    for (const k in by) by[k].sort((a, b) => a.sl - b.sl);
    const qb = by.QB[0], rb = by.RB[0], te = by.TE[0], wr = by.WR.slice(0, 3);

  function makeSchedule(rng) {

  function tally(L) {

  function checkLeague(L) {

      for (const [pos, n] of rules.positions) {
        const ps = t.ro.filter((p) => p.ps === pos).sort((a, b) => a.sl - b.sl);
        if (ps.length !== n || ps.some((p, i) => p.sl !== i)) bad.push(`${t.nm} ${pos} slots wrong`);
      }
      for (const p of t.ro) {
        if (ids.has(p.id)) bad.push('duplicate id ' + p.id); ids.add(p.id);
        for (const [k, v] of Object.entries(p.rt)) {
          if (!(v >= 1 && v <= 10)) bad.push(`${p.id} ${k} ${v} outside 1 to 10`);
          if (v > p.pt + 1e-9) bad.push(`${p.id} ${k} ${v} above potential ${p.pt}`);
          if (Math.abs(v * 10 - Math.round(v * 10)) > 1e-6) bad.push(`${p.id} ${k} ${v} not one decimal`);
        }
      }
    }
    for (const [, id] of L.rtd) if (ids.has(id)) bad.push('retired id is live: ' + id);
    return bad;
  }

  // ------------------------------------------------------------ everything that needs the engine
  function make(E) {
    if (!E || !E.mulberry32 || !E.seedFor || !E.gauss || !E.game) throw new Error('lg-std: the engine is missing mulberry32, seedFor, gauss or game');

    // A random stream for one purpose: always E.mulberry32(E.seedFor(rs, season, kind, n)).
    // The normal draw is the engine's gauss, fed by the same stream.
    function stream(rs, season, kind, n = 0) {
      const r = E.mulberry32(E.seedFor(rs, season, kind, n));
      r.gauss = () => E.gauss(r);
      r.int = (a, b) => a + Math.floor(r() * (b - a + 1));
      r.pick = (arr) => arr[Math.floor(r() * arr.length)];
      r.shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
      return r;
    }

    // ---- one game. The ONLY place a score is made: the engine's lgGame. Draws depend only on rs, season, week, gameIndex.
    // The home team is first (hfa true = home advantage for it); playoff = no ties (the engine adds 3 for a random side).
    // The engine is handed a small stub in place of the league record (see GAME_STUB); the seed is passed as rs.
    function scoreGame(L, rt, week, gi, h, a, playoff) {
      return E.game(GAME_STUB, L.rs, L.ssn, week, gi, rt, h, a, playoff, true);
    }
    // the rating function handed to the engine: team id -> { off, def } with the edge already added
    function ratingFn(L) { const eff = L.teams.map((t) => effective(t, L.rules)); return (id) => eff[id]; }

    // ---- standings
    function record(L, wk, h, a, sc, playoff, src = 'sim') {
      L.res.push({ wk, h, a, sc: [sc[0], sc[1]], src });
      if (playoff) return;
      const H = L.teams[h].rc, A = L.teams[a].rc;
      H[3] += sc[0]; H[4] += sc[1]; A[3] += sc[1]; A[4] += sc[0];
      if (sc[0] > sc[1]) { H[0]++; A[1]++; } else if (sc[0] < sc[1]) { H[1]++; A[0]++; } else { H[2]++; A[2]++; }
    }
    // team ids, best first: win share (ties count half), then points difference, then a seeded draw
    function rank(L, tag) {
      const rng = stream(L.rs, L.ssn, K.TIEBREAK, tag), draw = L.teams.map(() => rng());
      const key = (t, i) => [(t.rc[0] + 0.5 * t.rc[2]) / Math.max(1, t.rc[0] + t.rc[1] + t.rc[2]), t.rc[3] - t.rc[4], draw[i]];
      return L.teams.map((t, i) => [i, key(t, i)]).sort((a, b) => b[1][0] - a[1][0] || b[1][1] - a[1][1] || b[1][2] - a[1][2]).map((x) => x[0]);
    }

    // ---- play: one regular-season week, the playoffs, a whole season
    function playWeek(L, w) {
      const rt = ratingFn(L);
      L.sch[w].forEach(([h, a], g) => record(L, w, h, a, scoreGame(L, rt, w, g, h, a, false), false));
      L.wk = w + 1; L.ph = 'reg';
    }
    // the score of one regular-season game on its own (for tests): same as inside playWeek
    function gameAt(L, w, g) { const [h, a] = L.sch[w][g]; return scoreGame(L, ratingFn(L), w, g, h, a, false); }

    // top four by record; 1 v 4 and 2 v 3 (round 0), then the winners (round 1), played at the better seed
    function playPlayoffs(L) {
      const rt = ratingFn(L), seeds = rank(L, 0).slice(0, L.rules.league.playoffTeams), wkP = L.sch.length;
      const play = (x, y, round, g) => {
        const [h, a] = seeds.indexOf(x) < seeds.indexOf(y) ? [x, y] : [y, x];
        const sc = scoreGame(L, rt, PO_WEEK_BASE + PO_FIRST_ROUND + round, g, h, a, true);
        record(L, wkP + round, h, a, sc, true);
        return sc[0] > sc[1] ? h : a;
      };
      const w1 = play(seeds[0], seeds[3], 0, 0), w2 = play(seeds[1], seeds[2], 0, 1), ch = play(w1, w2, 1, 0);
      L.po = { seeds, ch, ru: ch === w1 ? w2 : w1 };
      L.ph = 'done'; L.wk = wkP + 2;
    }
    function playSeason(L) {
      L.res = []; L.teams.forEach((t) => { t.rc = [0, 0, 0, 0, 0]; });
      for (let w = 0; w < L.sch.length; w++) playWeek(L, w);
      playPlayoffs(L);
    }

    // ---- the offseason
    function offseason(L, ctx) {
      const rules = L.rules, s = L.ssn, R = rules.retire;
      // 1. this season's games and wins per team (regular season and playoffs), from the results
      const { games, wins } = tally(L);
      const report = L.teams.map((t, i) => ({ team: i, retired: [], rookies: [] }));
      L.hist.push({ s, ch: L.po.ch, ru: L.po.ru, st: L.teams.map((t) => t.rc.slice()) });
      // 2. fold career lines, age +1, yearly change (XP speeds up growth)
      const rngG = stream(L.rs, s, K.GROWTH);
      L.teams.forEach((t, ti) => t.ro.forEach((p) => {
        p.cr.push([s, games[ti]]); p.ag++;
        applyYear(p, rules, rules.xp.perGame * games[ti] + rules.xp.perWin * wins[ti], rngG);
      }));
      // 3. retire: age-based chance, higher if below the league median at his position; sure at 36 (QB, K 39)
      const med = {};
      for (const [pos] of rules.positions) { const v = L.teams.flatMap((t) => t.ro.filter((p) => p.ps === pos).map(overall)).sort((a, b) => a - b); med[pos] = v[Math.floor(v.length / 2)]; }
      const rngR = stream(L.rs, s, K.RETIRE), used = usedIds(L);
      let retired = 0;
      const taken = L.teams.map((t) => new Set(t.ro.map((p) => p.nm)));
      L.teams.forEach((t, ti) => t.ro.forEach((p, i) => {
        const late = R.lateShift[p.ps] || 0, eff = p.ag - late;
        let chance = p.ag >= (late ? R.forceAgeLate : R.forceAge) ? 1 : (R.chanceByAge[eff] || 0);
        if (chance < 1 && overall(p) < med[p.ps]) chance = Math.min(1, chance * R.belowMedianMultiplier);
        if (rngR() < chance) {
          // 4. the starter's slot is filled at once by a new rookie (there are no backups yet)
          L.rtd.push([s, p.id]); taken[ti].delete(p.nm);
          t.ro[i] = newRookie(rngR, rules, p.ps, p.sl, used, taken[ti], ctx);
          report[ti].retired.push({ id: p.id, nm: p.nm, ps: p.ps, sl: p.sl, ag: p.ag, ov: round3(overall(p)) });
          report[ti].rookies.push({ id: t.ro[i].id, nm: t.ro[i].nm, ps: t.ro[i].ps, sl: t.ro[i].sl, ag: t.ro[i].ag, ov: round3(overall(t.ro[i])), pt: t.ro[i].pt });
          retired++;
        }
      }));
      L.rtd = L.rtd.filter(([rs]) => rs > s - 10);
      // 5. team edge: pulled back toward 0, plus noise
      const rngE = stream(L.rs, s, K.EDGE), E_ = rules.edge;
      for (const t of L.teams) t.ed = round3(clamp(E_.keep * t.ed + E_.sd * rngE.gauss(), -E_.clamp, E_.clamp));
      // 6. next season
      L.ssn = s + 1; L.wk = 0; L.ph = 'reg'; L.po = null; L.res = [];
      L.teams.forEach((t) => { t.rc = [0, 0, 0, 0, 0]; });
      L.sch = makeSchedule(stream(L.rs, L.ssn, K.SCHED));
      return { retired, report };
    }

    // ---- the league maker
    // Makes the league, then runs `burnIn` hidden seasons so ages and retirements are steady
    // before season 1 is handed back. The season counter starts at 1 (hidden seasons are -9 to 0).
    // `rs` is the league's random seed (a number). It is NOT the game's L.seed (that is the playoff seed map).
    function makeLeague(rs, rules, ctx = newCtx()) {
      rules = clone(rules);
      const rng = stream(rs, 0, K.MAKER), used = new Set();
      const L = { v: 2, dp: 'std', fmt: 'p8', nm: 'PROOF 8', id: 'L' + E.seedFor(rs, 0, K.ID, 0).toString(36).slice(0, 5), cmr: null,
        ssn: 1 - rules.league.burnIn, wk: 0, ph: 'reg', burn: rules.league.burnIn, sch: [], po: null, hist: [], res: [], rs, rules, rtd: [], teams: [] };
      TEAM_DEFS.forEach(([nm, c, d], i) => {
        const taken = new Set(), ro = [];
        for (const [pos, n] of rules.positions) for (let sl = 0; sl < n; sl++) {
          // start as a rookie, then live through the same yearly change up to a random age 21 to 34
          const p = newRookie(rng, rules, pos, sl, used, taken, ctx), target = rng.int(21, 34);
          while (p.ag < target) { p.ag++; applyYear(p, rules, 35, rng); }
          ro.push(p);
        }
        L.teams.push({ id: i, nm, cf: 0, dv: i < 4 ? 0 : 1, ow: 'ai', lk: { c, d }, cr: 0, ed: 0, rc: [0, 0, 0, 0, 0], ro });
      });
      L.sch = makeSchedule(stream(rs, L.ssn, K.SCHED));
      for (let k = 0; k < rules.league.burnIn; k++) { playSeason(L); offseason(L, ctx); }
      // hand back season 1: no history, no career lines from the hidden seasons
      L.ssn = 1; L.hist = []; L.res = [];
      for (const t of L.teams) for (const p of t.ro) p.cr = [];
      return L;
    }


    // =========================================================================================================
    // ROUND 4: the shared WEEK / PLAYOFF / HUMAN logic. Everything is keyed by team INDEX (no "my team" here).
    // A human result is {a, b, pa, pb, src}: a and b are team indexes (either order), pa and pb their points, src 'hand' | 'pc' | 'sub'.
    // A finished game as stored (and as given to applyWeek / applyPlayoffRound) is {wk, h, a, sc: [home points, away points], src}
    // (the array form [h, a, homePoints, awayPoints, src] is accepted too). All errors are plain Errors that start with "lg-std:".
    // =========================================================================================================
    const HUMAN_SRC = ['hand', 'pc', 'sub'], ANY_SRC = ['sim', 'hand', 'pc', 'sub'];
    const bad = (msg) => { throw new Error('lg-std: ' + msg); };
    const isScore = (x) => Number.isInteger(x) && x >= 0;
    const teamIx = (L, x) => Number.isInteger(x) && x >= 0 && x < L.teams.length;

    // the XP a team earned for one game: 2 for starting it, 1 more for a win (rules.xp; never stored)
    function xpFor(L, won) { return L.rules.xp.perGame + (won ? L.rules.xp.perWin : 0); }
    // XP earned so far this season per team index (regular season and playoffs), worked out from the results. Same numbers the offseason uses.
    function xpSoFar(L) { const { games, wins } = tally(L); return L.teams.map((t, i) => L.rules.xp.perGame * games[i] + L.rules.xp.perWin * wins[i]); }

    // the pairs still to play: { kind: 'reg' | 'po' | 'done', week, round, pairs: [[home, away], ...] }
    //  'reg'  : regular season, week = L.wk, pairs = L.sch[week]
    //  'po'   : a playoff round (round 0 = semifinals 1 v 4 and 2 v 3, round 1 = the final), better seed at home; the seeds are drawn from
    //           the standings when the playoffs have not been opened yet (nothing is changed here)
    //  'done' : the playoffs are over (champion known): next is the offseason
    function nextGames(L) {
      const nG = L.sch.length;
      if (L.po && L.po.ch != null) return { kind: 'done', week: null, round: null, pairs: [] };
      if (!L.po && L.wk < nG) return { kind: 'reg', week: L.wk, round: null, pairs: L.sch[L.wk].map(([h, a]) => [h, a]) };
      const seeds = L.po ? L.po.seeds : rank(L, 0).slice(0, L.rules.league.playoffTeams);
      const r0 = L.res.filter((r) => r.wk === nG);
      if (r0.length < 2) return { kind: 'po', week: nG, round: 0, seeds, pairs: [[seeds[0], seeds[3]], [seeds[1], seeds[2]]] };
      const w = r0.map((r) => (r.sc[0] > r.sc[1] ? r.h : r.a)).sort((x, y) => seeds.indexOf(x) - seeds.indexOf(y));
      return { kind: 'po', week: nG + 1, round: 1, seeds, pairs: [[w[0], w[1]]] };
    }

    // the human entries checked and turned into a map "pair index" -> row. Throws on anything that is not a game of this week / round.
    function matchHum(L, hum, pairs, playoff) {
      const byGame = new Map();
      for (const e of hum || []) {
        if (!e || !teamIx(L, e.a) || !teamIx(L, e.b) || e.a === e.b) bad('a human result needs two different team indexes a and b');
        if (!isScore(e.pa) || !isScore(e.pb)) bad(`the score of the game ${e.a} v ${e.b} must be two whole numbers, 0 or more`);
        if (!HUMAN_SRC.includes(e.src)) bad(`the source of the game ${e.a} v ${e.b} must be hand, pc or sub (got ${e.src})`);
        if (playoff && e.pa === e.pb) bad(`a playoff game cannot end in a tie (${e.a} v ${e.b})`);
        const gi = pairs.findIndex(([h, a]) => (h === e.a && a === e.b) || (h === e.b && a === e.a));
        if (gi < 0) bad(`team ${e.a} v team ${e.b} is not a game of this ${playoff ? 'playoff round' : 'week'}`);
        if (byGame.has(gi)) bad(`the game ${e.a} v ${e.b} is given twice`);
        const [h] = pairs[gi];
        byGame.set(gi, { sc: h === e.a ? [e.pa, e.pb] : [e.pb, e.pa], src: e.src });

    // the human teams = every team whose owner is not 'ai' (the team record's own field) plus opts.humans (a list of team indexes)
    function humanSet(L, opts) {

    // which games of this week / round have a human team but no entry: [{gi, h, a}]
    function pendingOf(L, byGame, pairs, opts) {
      const hu = humanSet(L, opts), out = [];
      pairs.forEach(([h, a], gi) => { if (!byGame.has(gi) && (hu.has(h) || hu.has(a))) out.push({ gi, h, a }); });
      return out;
    }
    // the games of the plan, in pair order, ready to record: human ones as given, every other one from the engine (src 'sim')
    function resolve(L, pairs, byGame, pending, wkEngine, playoff) {
      const rt = ratingFn(L), skip = new Set(pending.map((p) => p.gi)), out = [];
      pairs.forEach(([h, a], gi) => {
        if (skip.has(gi)) return;
        const m = byGame.get(gi);
        out.push(m ? { gi, h, a, sc: m.sc, src: m.src } : { gi, h, a, sc: scoreGame(L, rt, wkEngine, gi, h, a, playoff), src: 'sim' });
      });
      return out;
    }
    const xpOfGames = (L, games) => { const xp = L.teams.map(() => 0); for (const g of games) { xp[g.h] += xpFor(L, g.sc[0] > g.sc[1]); xp[g.a] += xpFor(L, g.sc[0] < g.sc[1]); } return xp; };
    const rows = (wk, games) => games.map((g) => ({ wk, h: g.h, a: g.a, sc: [g.sc[0], g.sc[1]], src: g.src }));

    function openPlayoffs(L, seeds) { if (!L.po) L.po = { seeds, ch: null, ru: null }; }
    function closeRound(L, plan, games) {
      const nG = L.sch.length;
      if (plan.round === 1) {
        const f = games[0], ch = f.sc[0] > f.sc[1] ? f.h : f.a;

      } else { L.ph = 'reg'; L.wk = nG; }

    // ONE regular-season week (the week L.wk). hum = human results; opts = { humans: [team indexes], hold: bool }.
    // Human results are recorded as given; every other game is the engine's (week = schedule position, game = pair position).
    // A game with a human team and no entry is simulated with src 'sim'; with opts.hold it is NOT, and if any such game exists NOTHING is changed:
    // you get { held: true, pending: [{gi, h, a}] } back and can call again when the missing results are in.
    // Returns { held, week, games: [{wk, h, a, sc, src}], pending, autoSim, xp: [XP earned this week per team index] }
    // (autoSim = the human-team games that had no entry and were simulated; they are in games with src 'sim').
    function playWeekWith(L, hum, opts = {}) {
      const plan = nextGames(L);
      if (plan.kind !== 'reg') bad(plan.kind === 'done' ? 'the playoffs are over: run the offseason' : 'the regular season is over: play the playoffs');
      const w = plan.week, byGame = matchHum(L, hum, plan.pairs, false), pending = pendingOf(L, byGame, plan.pairs, opts);
      if (opts.hold && pending.length) return { held: true, week: w, games: [], pending, xp: L.teams.map(() => 0) };
      const games = resolve(L, plan.pairs, byGame, [], w, false);
      for (const g of games) record(L, w, g.h, g.a, g.sc, false, g.src);
      L.wk = w + 1; L.ph = 'reg';
      return { held: false, week: w, games: rows(w, games), pending: [], autoSim: pending, xp: xpOfGames(L, games) };
    }

    // ONE playoff round (round 0 = semifinals, round 1 = the final), the same way. Opens the playoffs (seeds from the standings) when needed.
    // The final sets champion and runner-up (L.po.ch, L.po.ru), ph 'done' and the week counter; the history row is added by the offseason, as always.
    // Returns { held, round, games, pending, autoSim, xp, done, ch, ru }.
    function playoffRoundWith(L, hum, opts = {}) {
      const plan = nextGames(L);
      if (plan.kind !== 'po') bad(plan.kind === 'done' ? 'the playoffs are over: run the offseason' : 'the regular season is not finished');
      const byGame = matchHum(L, hum, plan.pairs, true), pending = pendingOf(L, byGame, plan.pairs, opts);
      if (opts.hold && pending.length) return { held: true, round: plan.round, games: [], pending, xp: L.teams.map(() => 0), done: false, ch: null, ru: null };
      const games = resolve(L, plan.pairs, byGame, [], PO_WEEK_BASE + PO_FIRST_ROUND + plan.round, true);
      openPlayoffs(L, plan.seeds);
      for (const g of games) record(L, plan.week, g.h, g.a, g.sc, true, g.src);
      closeRound(L, plan, games);
      return { held: false, round: plan.round, games: rows(plan.week, games), pending: [], autoSim: pending, xp: xpOfGames(L, games), done: plan.round === 1, ch: L.po.ch, ru: L.po.ru };
    }

    // Which games of the next week or playoff round have a human team and no entry in hum (changes nothing). [{gi, h, a}]
    function pendingGames(L, hum, opts = {}) {
      const plan = nextGames(L);
      if (plan.kind === 'done') return [];
      return pendingOf(L, matchHum(L, hum, plan.pairs, plan.kind === 'po'), plan.pairs, opts);
    }

    // the games a caller hands to applyWeek / applyPlayoffRound, checked against the pairs (home first, same order not required)
    function matchGiven(L, given, pairs, playoff) {
      if (!Array.isArray(given)) bad('the games must be a list');
      if (given.length !== pairs.length) bad(`expected ${pairs.length} games, got ${given.length}`);
      const slot = new Array(pairs.length).fill(null);
      for (const raw of given) {
        const g = Array.isArray(raw) ? { h: raw[0], a: raw[1], sc: [raw[2], raw[3]], src: raw[4] } : raw;
        if (!g || !teamIx(L, g.h) || !teamIx(L, g.a)) bad('a game needs home and away team indexes h and a');
        if (!Array.isArray(g.sc) || g.sc.length !== 2 || !isScore(g.sc[0]) || !isScore(g.sc[1])) bad(`the score of ${g.h} v ${g.a} must be two whole numbers, 0 or more`);
        if (!ANY_SRC.includes(g.src)) bad(`the source of ${g.h} v ${g.a} must be sim, hand, pc or sub (got ${g.src})`);
        if (playoff && g.sc[0] === g.sc[1]) bad(`a playoff game cannot end in a tie (${g.h} v ${g.a})`);
        const gi = pairs.findIndex(([h, a]) => h === g.h && a === g.a);
        if (gi < 0) bad(`${g.h} (home) v ${g.a} is not a game of this ${playoff ? 'playoff round' : 'week'}`);
        if (slot[gi]) bad(`the game ${g.h} v ${g.a} is given twice`);
        slot[gi] = { gi, h: g.h, a: g.a, sc: [g.sc[0], g.sc[1]], src: g.src };
      }
      return slot;          // in pair order, so the stored rows are the same whatever order they arrive in
    }
    // Record a regular-season week whose games are GIVEN (e.g. the commissioner's stored week). Nothing is simulated.
    // The result is exactly what playWeekWith would have stored for the same games. Returns { week, games, xp }.
    function applyWeek(L, given) {
      const plan = nextGames(L);
      if (plan.kind !== 'reg') bad('there is no regular-season week to apply');
      const games = matchGiven(L, given, plan.pairs, false), w = plan.week;
      for (const g of games) record(L, w, g.h, g.a, g.sc, false, g.src);
      L.wk = w + 1; L.ph = 'reg';
      return { week: w, games: rows(w, games), xp: xpOfGames(L, games) };
    }
    // The same for a playoff round (semifinals or the final). The given games must be the round's pairs, better seed at home.
    function applyPlayoffRound(L, given) {
      const plan = nextGames(L);
      if (plan.kind !== 'po') bad('there is no playoff round to apply');
      const games = matchGiven(L, given, plan.pairs, true);
      openPlayoffs(L, plan.seeds);
      for (const g of games) record(L, plan.week, g.h, g.a, g.sc, true, g.src);
      closeRound(L, plan, games);
      return { round: plan.round, games: rows(plan.week, games), xp: xpOfGames(L, games), done: plan.round === 1, ch: L.po.ch, ru: L.po.ru };
    }

    return { stream, makeLeague, playWeek, gameAt, playPlayoffs, playSeason, offseason, applyYear, rank,
      playWeekWith, playoffRoundWith, applyWeek, applyPlayoffRound, nextGames, pendingGames, xpSoFar,
      derive, effective, overall, checkLeague, newCtx, engineLeague, engine: E, version: VERSION };
  }

  // ROUND 5: the engine-free helpers the Full league (lg-full.js) reuses, handed out as they are (no code in them changed).
  const parts = { K, TEAM_DEFS, mintId, makeName, stochRound, drawPotential, rookieRatings, newRookie, makeSchedule, usedIds, tally };
  return { make, derive, effective, overall, checkLeague, newCtx, engineLeague, parts, version: VERSION };

// lg-full.js  -  the FULL league (round 5, option 1: backups, draft, free agency; no money, no trades)
//

//   * L.fa  = the free-agent pool (a list of player records)

// Rules of this file (the same as lg-std.js):

//  * Nothing Node-only (no fs, process, require). The rules (rules.json with its "full" section) and the engine are handed in.

//
// How to use:   const FULL = LGFULL.make(LGSTD, LGE);           // LGSTD = lg-std.js, LGE = the game's engine
//               const L = FULL.makeFullLeague(918273, { rules });  // rules = rules.json (with "full")

const LGFULL = (function () {

    function value(p, rules) {

    }

    // ------------------------------------------------------------ the league maker
    // Same hidden 10 seasons as the Standard league, but with backups, the draft and free agency running in them.

    // backups come from kind 1012 (team index as n).
    function makeFullLeague(rs, options = {}) {

      const S = STD.makeLeague(rs, base, ctx);
      const L = { v: 2, dp: 'full', fmt: 'p8', nm: 'PROOF 8 FULL', id: 'F' + S.id.slice(1), cmr: null, ssn: 1 - burn, wk: 0, ph: 'reg', burn, sch: [], po: null, hist: [], res: [],
        rs, rules, rtd: [], fa: [], dr: null, teams: S.teams };
      const used = usedAll(L), taken = takenAll(L), nr = newRules(rules), F = rules.full;

      });

      for (let k = 0; k < burn; k++) { STD.playSeason(L); offseasonFull(L, { ctx }); }

      for (const p of L.fa) p.cr = [];

    }

    // ------------------------------------------------------------ stage 1: the season is over -> growth, retirement, the draft opens
    // Needs ph 'done' (champion known). Adds the history row, career lines (starters only), age + yearly change (XP for starters only),
    // retirement (all rostered players and the pool), builds the draft class (kind 1010) and the draft order (worst first, kind 1014 for ties).
    // Returns { retired, report: [{team, retired: [{id,nm,ps,sl,ag,ov}]}], pool: n retired from the pool, class: [prospects], order: [team indexes] }.
    function openOffseason(L, opts = {}) {

        const rules = L.rules, R = rules.retire, s = L.ssn, N = startersOf(rules), { games, wins } = P.tally(L);

        // growth: starters get the XP (2 per game started, 1 per win), backups and the pool none

        const med = {};
        for (const [pos] of rules.positions) { const v = L.teams.flatMap((t) => t.ro.filter((p) => p.ps === pos).map(overall)).sort((a, b) => a - b); med[pos] = v[Math.floor(v.length / 2)]; }

          }

    }

    // ------------------------------------------------------------ stage 2: the draft

    // opts = { humans: [team indexes], hold, ctx }. A team is human when it is in opts.humans or its team.ow is not 'ai'.
    // The AI teams pick the prospect with the biggest gain (design section 4). A human team with no entry: with hold the draft STOPS there
    // (everything before it is done and saved in L.dr; calling again with the same state and no new entry changes nothing), without hold it is picked for.
    // Returns { held, done, picks: [{n, round, t, src: 'ai'|'human'|'auto', id, nm, ps, ag, ov, pt}], pending: [{t, n, round}] }.
    function draftWith(L, humanPicks = [], opts = {}) {

          if (e.id !== null && typeof e.id !== 'string') bad('a pick needs the prospect id (or null to pick for me)');

    // A human team with no entry: with hold the stage STOPS there, without hold it is signed for like an AI team.

              if (ids.length > h + F.signs) bad(`team ${ti}: at most ${h + F.signs} signings (${h} holes + ${F.signs}), got ${ids.length}`);
              for (const id of ids) {

    }

    // ------------------------------------------------------------ stage 4: the roster check

    // Then every hole is filled from the pool (best value), then from a walk-on (kind 1011, team index as n). Turns in reverse order of finish.
    // A human team with nothing to cut needs no entry. A human team over its size with no entry: with hold the stage STOPS, without hold the
    // lowest-value players are cut like an AI team's. When all teams are done: the pool is trimmed to full.fa.poolSize (best value stay),

    // Returns { held, done, cut: [{t, id, nm, ps}], filled: [{t, from: 'pool'|'walkon', id, nm, ps}], pending: [{t, surplus, holes}], season }.

        for (const e of humanCuts || []) {

          if (!hu.has(e.t)) bad(`team ${e.t} is not a human team`);

        for (const ti of dr.ord) {

          if (hu.has(ti) && sur === 0 && by.has(ti) && by.get(ti).length) bad(`team ${ti} has nothing to cut but gave ${by.get(ti).length} players`);
          if (hu.has(ti) && sur > 0) {

 for(const m of[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]])for(let rep=0;rep<2;rep++){
  const r=[];for(let d=0;d<8;d++)for(const[a,b]of m)r.push([d*4+a,d*4+b]);rounds.push(r)}
 for(const r of rounds)for(const[a,b]of r)used.add(key(a,b));
 for(let k=0;k<6;k++){const r=[];for(let c=0;c<2;c++){const m=lgMatchSame(c*16,used);if(!m)return null;r.push(...m)}for(const[a,b]of r)used.add(key(a,b));rounds.push(r)}
 for(let k=0;k<5;k++){const m=lgMatchCross(used);if(!m)return null;for(const[a,b]of m)used.add(key(a,b));rounds.push(m)}
 return shuffle(rounds)}
/* v1.63 college schedule: 9 rounds of conference round-robin (circle method inside each conference of 10) + 3 rounds of
   non-conference games (the 6 conferences are paired off 3 different ways, teams matched at random inside each pairing) */
function lgSchedCol(c){
 const pc=c.per,rounds=[],cl=[];
 for(let k=0;k<c.nc;k++)cl.push(shuffle(Array.from({length:pc},(_,i)=>k*pc+i)));
 for(let r=0;r<pc-1;r++){const rd=[];
  for(let k=0;k<c.nc;k++){const a=cl[k];for(let i=0;i<pc/2;i++)rd.push([a[i],a[pc-1-i]]);cl[k]=[a[0],a[pc-1],...a.slice(1,pc-1)]}
  rounds.push(rd)}
 const co=shuffle(Array.from({length:c.nc},(_,i)=>i)),cr=[];
 for(let r=0;r<c.nc-1;r++){const rd=[];for(let i=0;i<c.nc/2;i++){const a=co[i],b=co[c.nc-1-i];rd.push([a,b])}cr.push(rd);co.splice(1,0,co.pop())}
 for(const rd of shuffle(cr).slice(0,c.games-(pc-1))){const g=[];
  for(const[a,b]of rd){const A=shuffle(Array.from({length:pc},(_,i)=>a*pc+i)),B=shuffle(Array.from({length:pc},(_,i)=>b*pc+i));for(let i=0;i<pc;i++)g.push([A[i],B[i]])}
  rounds.push(g)}
 return shuffle(rounds)}
/* v1.56: in every pair of a round the first team is the home team. Each team gets 8 or 9 home games and division rivals play once at each park. */
function lgOrient(s,c){c=c||LGF.NFL;const hc=new Array(lgN(c)).fill(0),seen={},hi=Math.ceil(c.games/2),lo=Math.floor(c.games/2);
 for(const rd of s)for(const g of rd){let[a,b]=g;const k=Math.min(a,b)+'-'+Math.max(a,b);let h;
  if(seen[k]!=null)h=seen[k]===a?b:a;else h=hc[a]!==hc[b]?(hc[a]<hc[b]?a:b):(Math.random()<.5?a:b);
  seen[k]=h;hc[h]++;g[0]=h;g[1]=h===a?b:a}
 /* balance: flip single (non-division) games from a team with too many home games to an opponent with fewer */
 const cnt={};for(const rd of s)for(const[a,b]of rd){const k=Math.min(a,b)+'-'+Math.max(a,b);cnt[k]=(cnt[k]||0)+1}
 for(let it=0;it<2000;it++){let moved=false;
  for(const rd of s)for(const g of rd){const k=Math.min(g[0],g[1])+'-'+Math.max(g[0],g[1]);if(cnt[k]>1)continue;
   if(hc[g[0]]-hc[g[1]]>=2||(hc[g[0]]>=hi&&hc[g[1]]<lo&&hc[g[0]]>hc[g[1]])){hc[g[0]]--;hc[g[1]]++;g.reverse();moved=true}}
  if(!moved)break}
 return s}
const lgHomeWk=w=>{const L=LG();return L.sched[w].some(g=>g[0]===L.me)};
function lgSchedule(L){const c=lgCfg(L),s=c.id==='COL'?lgSchedCol(c):lgSchedule0();return lgOrient(s,c)}
function lgSchedule0(){for(let i=0;i<80;i++){const r=lgTrySched();if(r)return r}
 /* fallback that cannot fail: plain rotation (should never be needed) */
 return Array.from({length:17},(_,r)=>Array.from({length:16},(_,i)=>[i,16+((i+r)%16)]))}
function lgOpp(w,id){for(const[a,b]of LG().sched[w]){if(a===id)return b;if(b===id)return a}return -1}
const lgKind=(a,b)=>{const L=LG(),t=L.teams,c=lgCfg(L);return t[a].conf!==t[b].conf?(c.nc>2?'NON-CONFERENCE':'INTERCONFERENCE'):c.dv>1&&t[a].div===t[b].div?'DIVISION RIVAL':'CONFERENCE'};

/* ----- ratings, games and standings ----- */
function lgRt(id){const L=LG(),R=S.r;if(id!==L.me)return L.teams[id];const o=RO(),q=(o.qb.arm+o.qb.acc)/2,rc=[...o.wr,o.te].reduce((a,x)=>a+x.spd+x.cat,0)/8;return{off:(q+rc+R.rb+R.ol)/4,def:R.def}}
/* v2.22: one game of the league sim = lgGameKey (which game of which week) + the engine's seeded stream. lgRecGame, lgOrder, lgDivIds, lgPct, lgCP are thin wrappers on the engine for the open league. */
const lgRecGame=(a,b,pa,pb)=>LGE.recGame(LG(),a,b,pa,pb);
const lgPct=LGE.pct,lgCP=LGE.cp;
const lgOrder=(ids,ov)=>S.std?stdOrder(ids):LGE.order(LG(),ids,ov);

function lgSync(){const r=LG().rec[LG().me];S.w=r.w;S.l=r.l;S.t=r.t}
function lgRank(id){const t=LG().teams[id],o=lgOrder(lgDivIds(t.conf,t.div)).indexOf(id)+1;return o+['TH','ST','ND','RD','TH'][o>3?0:o]}
/* record my game, simulate the other 15 of the week, move on */
function lgFinishWeek(w,mp,op,src){
 if(S.std)return stdFinishWeek(w,mp,op,src);   /* v2.23: Standard league */
 const L=LG(),opp=lgOpp(w,L.me);
 const games=LGE.playWeek(L,w,S.season,lgRt,[[L.me,opp,mp,op]]); /* v2.22: my result as a list of one; every other game from its own seeded stream */
 (L.res=L.res||[])[w]=(mp>op?'W ':mp<op?'L ':'T ')+mp+'-'+op;
 L.scores={w:w+1,games};S.week=w+1;lgSync()}

/* ----- playoffs: 7 seeds per conference, seed 1 gets a bye ----- */
const lgSeedPO=()=>LGE.seedPO(LG());
const lgPoGames=()=>S.std?stdPoPairs(S.std):LGE.poGames(LG());
const lgHum=win=>[{id:LG().me,win:!!win}];   /* the one human of this game, as the engine's list */
/* play one whole round; myWin decides my game if I am in it */
const lgPoRound=(myWin,mp,op,src)=>S.std?stdPoRound({mp,op,src}):LGE.poRound(LG(),S.season,lgRt,lgHum(myWin));
const lgSimRestPo=()=>S.std?stdSimRestPo():LGE.simRestPo(LG(),S.season,lgRt,lgHum(false));
function lgEndRegular(){

 if(!L.po.seeds.some(s=>s.includes(L.me))){lgSimRestPo();S.over='missed';return}

 S.round=L.po.round}

/* ----- hooks used by the game ----- */
function lgNextOpp(){
 const L=LG();let id;
 if(S.phase==='reg')id=lgOpp(S.week,L.me);
 else{const g=lgPoGames().find(g=>g.includes(L.me));id=g[0]===L.me?g[1]:g[0]}
 const t=L.teams[id];let home;
 if(S.phase==='reg')home=lgHomeWk(S.week);else{const g=lgPoGames().find(g=>g.includes(L.me));home=L.po.round>=lgCfg(L).homeRds?null:g[0]===L.me}

const lgLabel=()=>S.phase==='reg'?'WEEK '+(S.week+1)+' OF '+LGC().games:LGC().rnd[LG().po.round];
/* v2.35: a TIED playoff game of a LOCAL league. The league engine never lets one of its own playoff games end level: lgSim adds 3 points for one side, drawn by the game's own seeded stream
   (`if(noTie&&pa===pb){if(rng()<.5)pa+=3;else pb+=3}`, the first team of the pair when the draw is under .5). lg-std refuses a tied human playoff result, and the old league counted it as a loss, so a hand-played tie is settled with that same
   rule and that same stream: the stream of this game (week key 100 + round, pair index), the coin being the 7th draw (the two score rolls take six). Pure: the same answer every time it is asked. Returns {me:true when the 3 points are mine}, or null when this is not a tied local playoff game. */
function lgPoTie(mp,op){
 if(!S||!S.lg||S.lnk||S.phase!=='playoff'||mp!==op)return null;
 let ls,season,wk,pairs,me;
 if(S.std){const L=S.std,n=STD.nextGames(L);if(n.kind!=='po')return null;ls=L.rs;season=L.ssn;wk=100+n.round;pairs=n.pairs;me=S.stm}
 else{const L=LG();ls=LGE.leagueSeed(L);season=S.season;wk=100+L.po.round;pairs=lgPoGames();me=L.me}
 const gi=pairs.findIndex(g=>g[0]===me||g[1]===me);if(gi<0)return null;

/* v2.37: the engine's seeded coin of a tied playoff game (one function for the hand-played game and the linked sender): true = MY side gets the 3 points; `first` = my team is the first of its pair */
function lgPoCoin(ls,season,wk,gi,first){const rng=LGE.mulberry32(LGE.seedFor(ls,season,wk,gi));for(let i=0;i<6;i++)rng();return(rng()<.5)===!!first}
function lgAfterGame(win,tie,cr,mp,op,src){
 if(S.lnk)return lnAfterGame(win,tie,cr,mp,op,src);   /* v2.33: a linked league queues the result and waits for the commissioner */
 const L=LG();
 {const pt=lgPoTie(mp,op);if(pt){win=pt.me;tie=false;if(pt.me)mp+=3;else op+=3}}   /* v2.35: a tied playoff game gets the engine's winner (+3 for one side) */

 else{
  const final=L.po.round===LGC().rnd.length-1;lgPoRound(win,mp,op,src);   /* v2.23: the last round is the format's own (3 for NFL and college, 1 for Standard) */

  else{S.over='elim';lgSimRestPo()}}

/* v2.22: SIM GAME of my own game: the same seeded stream and the same pair order (first team = the pair's first team) as any other device would use for this game, so the result is the same everywhere. Returns [my score, their score]. */
function lgSimMy(po){
 if(S.std)return stdSimMy(po);
 const L=LG(),reg=S.phase==='reg',pairs=reg?L.sched[S.week]:lgPoGames(),gi=pairs.findIndex(g=>g[0]===L.me||g[1]===L.me),g=pairs[gi];

/* ---------- v2.23: STANDARD 8-TEAM league (the glue). The rules live in lg-std.js (the league tool's file, copied unchanged) and the seeded engine in lg-engine.js.
   A Standard league is its own record in the save: S.std (the league tool's record: 8 teams, 23 real starters each, rs, rules, schedule, results, history) and S.stm (my team's index 0..7).
   It is NOT handed to the game's league code (five field names clash: fmt, po, res, hist, teams). Every screen that reads S.lg reads a read-only ADAPTER built from S.std (stdView): a plain object in the game's own league shape,
   kept as S.lg but NON-ENUMERABLE, so it is never saved, never in a backup code or cloud copy, and rebuilt (in place) after every change (stdSync). Simple leagues (S.lg is a real saved object) never go through here.
   S.r, S.ro and S.names (what live play, the upgrade screen and STATS read) are DERIVED from my team's starters whenever the roster changes (stdDerive): the game's own team strength formula.
   A game's score = LGE.game(stub, rs, season, week, gameIndex, rt, home, away, playoff, true) with rt = the team strength plus its edge (STD.effective): the same call and the same numbering as the league tool, so the AI games equal the tool's.

const STD_RULES={"version":"round3","positions":[["QB",1],["RB",1],["WR",3],["TE",1],["OL",5],["DL",4],["LB",3],["DB",4],["K",1]],"ratingKeys":{"QB":["arm","acc"],"RB":["run"],"WR":["spd","cat"],"TE":["spd","cat"],"OL":["blk"],"DL":["def"],"LB":["def"],"DB":["def"],"K":["acc","rng"]},"league":{"target":3.7,"burnIn":10,"playoffTeams":4},"potential":{"mean":5,"sd":0.75,"min":3,"max":7.2,"posSdMult":{"QB":0.35,"RB":0.35,"WR":1,"TE":1,"OL":1,"DL":1,"LB":1,"DB":1,"K":1},"posShift":{"QB":-0.523,"RB":-0.523,"WR":-0.523,"TE":-0.523,"OL":-0.523,"DL":-0.15,"LB":-0.15,"DB":-0.15,"K":0},"star":{"min":7.5,"max":9.4,"curve":0.9,"chance":{"QB":0.03,"RB":0.03,"WR":0.16,"TE":0.16,"OL":0.03,"DL":0.04,"LB":0.04,"DB":0.045,"K":0.02}}},"rookie":{"ageMin":21,"ageMax":23,"ratingMin":2,"ratingMax":4.6,"potentialPull":0.3,"jitter":0.3,"floor":1.5},"growth":{"peakAge":26,"startAge":21,"maxShare":0.35,"ptLift":0.35,"ptLiftFrom":5,"shareCap":0.95,"noiseSd":0.075,"lateShift":{"QB":3,"K":3}},"decline":{"perYearPastPeak":[0,0.05,0.1,0.15,0.2,0.3,0.4,0.6],"floor":1},"xp":{"perGame":2,"perWin":1,"boostPer100":0.5,"maxBoost":0.6},"retire":{"chanceByAge":{"31":0.06,"32":0.12,"33":0.2,"34":0.32,"35":0.5},"belowMedianMultiplier":1.8,"forceAge":36,"forceAgeLate":39,"lateShift":{"QB":3,"K":3}},"edge":{"scale":1,"keep":0.4,"sd":0.17,"clamp":0.5}};
const STD=LGSTD.make(LGE);
const FULL=LGFULL.make(LGSTD,LGE);   /* v2.31: the shared lg-full.js is only LOADED here (bkShape uses FULL.checkFull). No Full league screen, menu entry or save field yet. */
const STD_STUB={fmt:'NFL'};    /* the engine's lgGame only asks lgCfg(L).noTie; the real lgCfg knows only NFL and COL, so it is handed this stand-in (the playoff games say po = true themselves) */
const STD_CFG={id:'STD',tag:'STANDARD LEAGUE',btn:'STANDARD: 8 TEAMS',nc:1,dv:2,per:4,games:14,byes:0,homeRds:2,noTie:false,spread:1,
 conf:['PIGSKIN LEAGUE'],div:['EAST','WEST'],rnd:['SEMIFINAL','PIGSKIN BOWL'],champ:'PIGSKIN BOWL CHAMPIONS!',
 info:'8 TEAMS WITH REAL PLAYERS - 2 DIVISIONS OF 4 - 14 GAMES - TOP 4 MAKE THE PLAYOFFS.',

function stdMean(a){return a.reduce((s,x)=>s+x,0)/(a.length||1)}

/* ----- the read-only adapter: a Standard league in the game's own league shape. Nothing in it is saved. ----- */
function stdView(s){
 const L=s.std,me=s.stm|0,nG=L.sch.length;
 const teams=L.teams.map((t,i)=>{const d=STD.derive(t);return{id:i,name:t.nm,conf:0,div:t.dv,off:d.off,def:d.def,col:{c:t.lk.c,d:t.lk.d}}});   /* strength WITHOUT the edge (the edge is sim only) */

 const res=[];let last=-1;
 for(const r of L.res){if(r.wk>=nG)continue;if(r.wk>last)last=r.wk;
  if(r.h===me||r.a===me){const mp=r.h===me?r.sc[0]:r.sc[1],op=r.h===me?r.sc[1]:r.sc[0];res[r.wk]=(mp>op?'W ':mp<op?'L ':'T ')+mp+'-'+op+(s.lnk&&r.src!=='sim'?' H':'')}}
 const scores=last>=0?{w:last+1,games:L.res.filter(r=>r.wk===last).map(r=>s.lnk?[r.h,r.a,r.sc[0],r.sc[1],r.src]:[r.h,r.a,r.sc[0],r.sc[1]])}:null;
 let po=null,champ=null;const seed={};
 const po0=L.po||(s.lnk&&L.wk>=nG?{seeds:STD.nextGames(L).seeds,ch:null}:null);   /* v2.33: a linked league's record is HQ's: after week 14 the playoffs are not opened yet (L.po null); the seeds come from the standings and nothing is changed */
 if(po0){const seeds=po0.seeds,pr=L.res.filter(r=>r.wk>=nG),r0=pr.filter(r=>r.wk===nG),win=r=>r.sc[0]>r.sc[1]?r.h:r.a;
  seeds.forEach((id,i)=>seed[id]=i+1);
  const round=po0.ch!=null?2:r0.length>=2?1:0;
  const alive=round===0?seeds.slice():round===1?r0.map(win).sort((x,y)=>seeds.indexOf(x)-seeds.indexOf(y)):[po0.ch];
  champ=po0.ch!=null?po0.ch:null;
  po={seeds:[seeds.slice()],alive:[alive],round}}

 if(champ!=null&&!hist.some(h=>h.s===L.ssn))hist.push({s:L.ssn,id:champ});

/* S.r, S.ro, S.names from my starters: QB arm and acc; RB; WR1 to 3 and TE speed and catching; K accuracy and range; the five linemen's average = the O-line number; the eleven defenders' average = the defense number (the game's own formula, the same arithmetic as STD.derive) */
function stdRatingsOf(t){     /* v2.24: one team's S.r / S.ro numbers from its starters (the formulas stdDerive always used); also used for the other teams */

 const d=STD.derive(t),q=(qb.rt.arm+qb.rt.acc)/2,rc=(wr.reduce((a,w)=>a+w.rt.spd+w.rt.cat,0)+te.rt.spd+te.rt.cat)/8,ol=stdMean(stdBy(t,'OL').slice(0,5).map(p=>p.rt.blk));
 return{r:{qb:q,wr:rc,rb:rb.rt.run,ol,def:d.def,k:(k.rt.acc+k.rt.rng)/2},
  ro:{qb:{arm:qb.rt.arm,acc:qb.rt.acc},wr:wr.map(w=>({spd:w.rt.spd,cat:w.rt.cat})),te:{spd:te.rt.spd,cat:te.rt.cat},k:{acc:k.rt.acc,rng:k.rt.rng}},
  names:{qb:qb.nm,rb:rb.nm,wr:wr.map(w=>w.nm),te:te.nm,k:k.nm}}}
function stdDerive(s){
 const x=stdRatingsOf(s.std.teams[s.stm|0]);s.r=x.r;s.ro=x.ro;s.names=x.names}
/* rebuild the adapter IN PLACE (code that holds the old object sees the new numbers) and re-derive my ratings */
function stdSync(s){
 const v=stdView(s),dsc=Object.getOwnPropertyDescriptor(s,'lg');
 if(dsc&&!dsc.enumerable&&s.lg)Object.assign(s.lg,v);else Object.defineProperty(s,'lg',{value:v,writable:true,configurable:true,enumerable:false});

function stdAttach(s){return s&&s.std&&typeof s.std==='object'&&s.std.teams?stdSync(s):s}

/* ----- creating a league: ONE Math.random draw (the league's rs); everything else comes from it ----- */
function stdDraft(name){
 const rs=(Math.random()*4294967296)>>>0,std=STD.makeLeague(rs,STD_RULES);std.nm=name||'PIXEL LEAGUE';

function stdNew(L,me){

 stdSync(S);save()}

/* ----- games ----- */
function stdRt(L){const e=L.teams.map(t=>STD.effective(t,L.rules));return id=>e[id]}     /* strength + edge: what every sim game uses */
const stdGame=(L,rt,wk,gi,h,a,po)=>LGE.game(STD_STUB,L.rs,L.ssn,wk,gi,rt,h,a,po,true);
/* v2.31: what to play next comes from the shared lg-std (STD.nextGames): the playoff round (0 = semifinals, 1 = the final) and its pairs, better seed first (the home team); [] when no playoff round is open */
const stdRound=L=>{const n=STD.nextGames(L);return n.kind==='po'?n.round:0};
function stdPoPairs(L){
 if(L.po?L.po.ch!=null:!(S&&S.lnk))return[];
 const n=STD.nextGames(L);return n.kind==='po'?n.pairs:[]}
/* my result goes into the week; every other game of the week is the engine's, from its own stream (week position, pair position). v2.31: the shared lg-std does the recording (STD.playWeekWith); a SIM GAME is simply no entry. */
function stdFinishWeek(w,mp,op,src){
 const L=S.std,me=S.stm,pr=L.sch[w].find(([h,a])=>h===me||a===me),opp=pr[0]===me?pr[1]:pr[0];
 STD.playWeekWith(L,src==='sim'?[]:[{a:me,b:opp,pa:mp,pb:op,src:src||'hand'}]);

function stdEndRegular(){
 const L=S.std;L.po={seeds:STD.rank(L,0).slice(0,L.rules.league.playoffTeams),ch:null,ru:null};L.wk=L.sch.length;stdSync(S);
 if(!L.po.seeds.includes(S.stm)){stdSimRestPo();S.over='missed';return}
 S.phase='playoff';S.round=0}
/* one whole playoff round; hum = my result {mp,op,src} when I am in it. v2.31: STD.playoffRoundWith records it, plays the other game and sets champion, runner-up, phase and week on the final. */
function stdPoRound(hum){
 const L=S.std,me=S.stm;let hs=[];
 if(hum&&hum.src!=='sim'){const pr=STD.nextGames(L).pairs.find(([h,a])=>h===me||a===me);if(pr)hs=[{a:me,b:pr[0]===me?pr[1]:pr[0],pa:hum.mp,pb:hum.op,src:hum.src||'hand'}]}
 STD.playoffRoundWith(L,hs);stdSync(S)}
function stdSimRestPo(){let g=0;while(S.std.po&&S.std.po.ch==null&&g++<4)stdPoRound(null)}
/* SIM GAME of my own game: the same stream and pair order the league tool (or another device) uses for it. Returns [my score, their score]. */
function stdSimMy(po){
 const L=S.std,me=S.stm,rt=stdRt(L),wk=po?100+stdRound(L):S.week,pairs=po?STD.nextGames(L).pairs:L.sch[S.week],gi=pairs.findIndex(g=>g[0]===me||g[1]===me),g=pairs[gi],sc=stdGame(L,rt,wk,gi,g[0],g[1],!!po);

/* standings order for the screens: the tool's own order (record, points difference, seeded draw), so the table and the playoff seeds always agree */
const stdOrder=ids=>STD.rank(S.std,0).filter(i=>ids.includes(i));

/* ----- the offseason (my team included): aging, growth, XP, retirement, rookies, edges. Returns nothing; the hub shows one line about my starters. ----- */
function stdNewSeason(){
 if(S.lnk)return;   /* v2.33: in a linked league the COMMISSIONER runs the offseason; the game only pulls it */
 const L=S.std,me=S.stm;
 if(L.po&&L.po.ch==null)stdSimRestPo();
 const rep=STD.offseason(L,STD.newCtx()).report[me],n=rep.rookies.length;   /* v2.31: the count comes from the offseason's own report */
 S.season=L.ssn;S.week=0;S.w=S.l=S.t=0;S.phase='reg';S.round=0;S.over=null;S.credits+=3;
 S.last='OFFSEASON - '+(n?n+' OF YOUR STARTERS RETIRED, '+n+(n>1?' ROOKIES JOINED':' ROOKIE JOINED'):'NONE OF YOUR STARTERS RETIRED');
 stdSync(S);save();renderHub()}

/* ----- credits: an upgrade raises the player (or EACH starter of a unit) by 1.0, never past his potential ----- */
function stdTarget(kind,key){
 const t=S.std.teams[S.stm];
 if(kind==='up'){
  if(key==='rb')return{ps:[stdBy(t,'RB')[0]],rk:'run'};
  if(key==='ol')return{ps:stdBy(t,'OL').slice(0,5),rk:'blk'};
  if(key==='def')return{ps:[...stdBy(t,'DL').slice(0,4),...stdBy(t,'LB').slice(0,3),...stdBy(t,'DB').slice(0,4)],rk:'def'}
  return null}
 const q=key.split('.'),rk=q[q.length-1];
 if(q[0]==='qb')return{ps:[stdBy(t,'QB')[0]],rk};
 if(q[0]==='wr')return{ps:[stdBy(t,'WR')[+q[1]]],rk};
 if(q[0]==='te')return{ps:[stdBy(t,'TE')[0]],rk};
 if(q[0]==='k')return{ps:[stdBy(t,'K')[0]],rk};
 return null}
const stdCanUp=(kind,key)=>{const x=stdTarget(kind,key);return!!x&&x.ps.every(Boolean)&&x.ps.some(p=>p.rt[x.rk]<p.pt-1e-9)};
/* returns true when bought (credits taken); false with a plain message when nobody in the target can rise */
function stdBuy(kind,key,cost){
 if(S.lnk)return lnBuy(kind,key,cost);   /* v2.33: a linked league spends credits through lk.js */
 const x=stdTarget(kind,key);
 if(!stdCanUp(kind,key)){notice(x&&x.ps.length>1?'ALL THESE PLAYERS ARE AT THEIR POTENTIAL':'THIS PLAYER IS AT HIS POTENTIAL');return false}
 for(const p of x.ps)p.rt[x.rk]=Math.min(10,stdR1(Math.min(p.pt,p.rt[x.rk]+1)));

/* ----- v2.24 TEAM POWER: what the opponent's difficulty shift reads in a Standard league = how far my team is above the league, in credits ----- */
/* the cost table for a rating that may have decimals: the same cumulative table as upSpent (4 = 0, 5 = 3, 6 = 7, 7 = 12 ...), straight line between the whole steps. Whole ratings give exactly the old numbers. (upSpent itself counts a whole step as soon as a rating is past a whole number: 4.1 already costs 3. Simple leagues only have whole ratings, so it is left as it is there.) */
function stdCost(v){if(!(v>4))return 0;let t=0,r=4;while(r+1<=v){t+=upCost(r);r++}return t+(v-r)*upCost(r)}

function stdSpent(x,f){f=f||stdCost;let t=f(x.r.rb)+f(x.r.ol)+f(x.r.def)+f(x.ro.qb.arm)+f(x.ro.qb.acc);for(let i=0;i<3;i++)t+=f(x.ro.wr[i].spd)+f(x.ro.wr[i].cat);return t}

function stdLeagueAvg(s){
 s=s||S;const rs=s.std.teams.filter((t,i)=>i!==(s.stm|0)).map(stdRatingsOf),av=f=>stdMean(rs.map(f));
 return{r:{qb:av(x=>x.r.qb),wr:av(x=>x.r.wr),rb:av(x=>x.r.rb),ol:av(x=>x.r.ol),def:av(x=>x.r.def),k:av(x=>x.r.k)},
  ro:{qb:{arm:av(x=>x.ro.qb.arm),acc:av(x=>x.ro.qb.acc)},wr:[0,1,2].map(i=>({spd:av(x=>x.ro.wr[i].spd),cat:av(x=>x.ro.wr[i].cat)})),te:{spd:av(x=>x.ro.te.spd),cat:av(x=>x.ro.te.cat)},k:{acc:av(x=>x.ro.k.acc),rng:av(x=>x.ro.k.rng)}}}}
/* v2.25 RELIEF: the per-league option "EASIER GAMES FOR A WEAK TEAM". It lives in its own save field S.stx = {relief: 0 or 1} (next to S.stm), not in S.std. A save without the field is OFF. */
function stdRelief(s){s=s||S;return!!(s&&s.std&&s.stx&&s.stx.relief)}
function stdSetRelief(on,s){s=s||S;s.stx=Object.assign({},s.stx,{relief:on?1:0}); /* v2.29: keeps S.stx.drv */if(s===S)try{save()}catch(e){}return s.stx.relief}
/* the cost table with RELIEF: under 4 the line goes on at the slope of its first step (upCost(4) = 3 credits per rating point: 3 = -3, 2 = -6, 1 = -9); 4 and above exactly stdCost */
function stdCostR(v){return v<4?upCost(4)*(v-4):stdCost(v)}
/* credits-equivalent of my team against the league average. RELIEF OFF (v2.24, unchanged): never below 0. RELIEF ON: signed, below 0 for a team weaker than the league, and equal to the OFF number when every rating (mine and the league's) is 4 or more. */
function stdPower(s){s=s||S;
 if(stdRelief(s))return stdSpent({r:s.r,ro:s.ro},stdCostR)-stdSpent(stdLeagueAvg(s),stdCostR);

/* v2.25: one line on the hub: the next opponent's OFF and DEF (the game's own numbers, no edge) and a word against my team. Strength = (OFF + DEF) / 2 for both; WEAKER or STRONGER when it is 0.3 or more apart, otherwise SIMILAR. */
const STD_NEAR=0.3;
function stdOppLine(o){const me=(hbOff()+S.r.def)/2,d=(o.off+o.def)/2-me,w=d<=-STD_NEAR?'WEAKER':d>=STD_NEAR?'STRONGER':'SIMILAR';

/* ---------- v2.33: LINKED LEAGUES, the PLAYER side (src/lk.js). A friend joins the commissioner's league by its 6-character code, plays his own team's games by hand,
   sends the results and spends credits on his team; the commissioner (HQ, a separate page) advances the weeks. The game stays fully playable alone, offline and with no login: nothing here runs
   for a league without S.lnk, and Simple and local Standard leagues never touch this file's code paths.
   The link lives in its OWN save field S.lnk = { lg, code, idx, uid, nm, lastMeta, lastSync, st, queue, cs, cw, note } (never inside the league record S.std), so the league record stays exactly what HQ's buildLeague makes.
   (1) LNC: lines copied UNCHANGED from HQ's cloud layer (D:\PigskinHQ\src\part-cloud.js, HQ 0.5): the errors, the Firestore adapter, the document <-> league functions (buildLeague with the shared lg-std),
       the paths, the code reader and the reader of all parts. A test compares the source text of every copied function with HQ's.
   (2) the player's own code: join, pull, derive the game's week state from the league, the screens, the hooks. Prefix ln / LNK; the old file ol.js already uses lk for the online link, so this file does not. ---------- */
const LNC=(function(){
var CLOUD_SDK_VERSION = '10.14.1';           /* the same Firebase web SDK version the game loads */
var CLOUD_FORMAT = 1;                        /* meta.v: the format of the cloud documents written by HQ */
/* the league code: 6 characters. The rules accept [A-HJKMNP-Z2-9]; HQ also leaves out B, S and Z (look like 8, 5 and 2) */
var CODE_ALPHABET = 'ACDEFGHJKMNPQRTUVWXY23456789';
var CODE_RULE = /^[A-HJKMNP-Z2-9]{6}$/;
var LG_ALPHABET = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
var NTEAMS = 8;
/* ---------- errors ---------- */
function CloudError(kind, text, cause){ var e = new Error(text); e.kind = kind; e.cause = cause || null; e.cloud = true; return e; }
function classify(e){
  if (e && e.cloud) return e.kind;
  var c = String((e && (e.code || e.name)) || ''), m = String((e && e.message) || '');
  if (/permission-denied|PERMISSION_DENIED/i.test(c + ' ' + m)) return 'denied';
  if (/resource-exhausted|quota/i.test(c + ' ' + m)) return 'quota';
  if (/already-exists/i.test(c)) return 'exists';
  if (/unauthenticated/i.test(c)) return 'denied';
  if (/unavailable|deadline-exceeded|network|offline|failed to fetch|timeout/i.test(c + ' ' + m)) return 'net';
  return 'other';
}
function kindText(kind){
  if (kind === 'denied') return 'The cloud refused this. Either you are not signed in the right way (the commissioner tools need a Google sign-in), or the rules for linked leagues are not published yet, or this change is not allowed.';
  if (kind === 'quota') return 'The free daily limit of the cloud was reached. Nothing is lost; try again tomorrow.';
  if (kind === 'net') return 'The connection to the cloud failed. Check the internet connection and try again.';
  return 'The cloud reported a problem.';
}
function cloudMsg(e){ return e && e.cloud && e.kind !== 'other' && e.message ? e.message : (kindText(classify(e)) + (e && e.message && classify(e) === 'other' ? ' (' + e.message + ')' : '')); }

/* ---------- (1) the adapter over the Firestore SDK (modular API: X = firebase-firestore) ---------- */
/* paths are plain strings 'lgs/ID/teams/3'. Every call returns plain data: { id, exists, data } and so on. */
function makeSdkAdapter(X, db){
  function ref(p){ return X.doc(db, p); }
  function snap(s){ var ex = s.exists(); return { id: s.id, exists: ex, data: ex ? s.data() : null }; }
  function applyOp(w, o){
    if (o.op === 'set') w.set(ref(o.path), o.data);
    else if (o.op === 'update') w.update(ref(o.path), o.data);
    else if (o.op === 'delete') w.delete(ref(o.path));
    else throw new Error('hq: unknown batch op ' + o.op);
    return w;
  }
  return {
    get: function(p){ return X.getDoc(ref(p)).then(snap); },
    list: function(p){ return X.getDocs(X.collection(db, p)).then(function(s){ return s.docs.map(function(d){ return { id: d.id, data: d.data() }; }); }); },
    set: function(p, data){ return X.setDoc(ref(p), data); },
    update: function(p, data){ return X.updateDoc(ref(p), data); },
    del: function(p){ return X.deleteDoc(ref(p)); },
    batch: function(ops){ var b = X.writeBatch(db); ops.forEach(function(o){ applyOp(b, o); }); return b.commit(); },
    transaction: function(fn){
      return X.runTransaction(db, function(t){
        return fn({
          get: function(p){ return t.get(ref(p)).then(snap); },
          set: function(p, data){ t.set(ref(p), data); },
          update: function(p, data){ t.update(ref(p), data); },
          del: function(p){ t.delete(ref(p)); }
        });
      });
    },
    onSnapshot: function(p, cb, errCb){ return X.onSnapshot(ref(p), function(s){ cb(snap(s)); }, errCb || function(){}); }
  };
}

/* ---------- (2) pure functions: Standard league <-> cloud documents ---------- */
function bad(msg){ return CloudError('data', 'hq: ' + msg); }
function encPlayer(p){
  var cr = []; p.cr.forEach(function(x){ cr.push(x[0], x[1]); });
  return { id: p.id, nm: p.nm, ps: p.ps, sl: p.sl, rt: Object.assign({}, p.rt), ag: p.ag, pt: p.pt, xp: p.xp, st: p.st, cr: cr };
}
function decPlayer(q, rules){
  var keys = rules.ratingKeys[q.ps];
  if (!keys || !q.rt || !Array.isArray(q.cr)) throw bad('a player record is damaged (' + q.id + ')');
  var rt = {};
  keys.forEach(function(k){ if (typeof q.rt[k] !== 'number') throw bad('a rating is missing (' + q.id + ' ' + k + ')'); rt[k] = q.rt[k]; });
  var cr = []; for (var i = 0; i + 1 < q.cr.length; i += 2) cr.push([q.cr[i], q.cr[i + 1]]);
  return { id: q.id, nm: q.nm, ps: q.ps, sl: q.sl, rt: rt, ag: q.ag, pt: q.pt, xp: q.xp, st: q.st, cr: cr };
}
/* a team chunk. id is a STRING in the cloud (the candidate rules need it); rc is always the season-start zeros (the season's
   results come from the week documents); rtd = ["season:playerId", ...] the retired ids this chunk keeps for the league */
/* bl = the BASELINE ratings of every player as the commissioner wrote them: { playerId: [rating values in rules.ratingKeys order] }.
   The slot owner may change only ro, cr and up (candidate rules), so bl is what the audit compares the roster with. */
function blOf(ro, rules){
  var bl = {};
  ro.forEach(function(p){ bl[p.id] = rules.ratingKeys[p.ps].map(function(k){ return p.rt[k]; }); });
  return bl;
}
function encTeam(t, rtd, up, rules){
  rules = rules || STD_RULES;
  var d = { id: String(t.id), nm: t.nm, cf: t.cf, dv: t.dv, ow: t.ow, lk: { c: t.lk.c, d: t.lk.d }, cr: t.cr, ed: t.ed,
    rc: [0, 0, 0, 0, 0], ro: t.ro.map(encPlayer), rtd: (rtd || []).slice(), bl: blOf(t.ro, rules) };
  if (up && up.length) d.up = up.slice();
  return d;
}
function decTeam(d, rules, idx){
  if (!d || String(d.id) !== String(idx) || !Array.isArray(d.ro) || !d.lk) throw bad('team chunk ' + idx + ' is damaged or missing');
  return { id: idx, nm: d.nm, cf: d.cf, dv: d.dv, ow: d.ow, lk: { c: d.lk.c, d: d.lk.d }, cr: d.cr, ed: d.ed, rc: [0, 0, 0, 0, 0],
    ro: d.ro.map(function(q){ return decPlayer(q, rules); }) };
}
function rtdStrings(pairs){ return pairs.map(function(x){ return x[0] + ':' + x[1]; }); }
function rulesOf(meta){
  var r = typeof meta.rules === 'string' ? JSON.parse(meta.rules) : meta.rules;
  if (!r || !r.ratingKeys) throw bad('the league rules are missing');
  return r;
}
function metaOf(L, uid, now){
  return { v: CLOUD_FORMAT, nm: L.nm, rs: L.rs, season: L.ssn, wk: L.wk, ph: L.ph, rules: JSON.stringify(L.rules), commish: uid,
    opts: {}, hold: false, ovr: [], updatedAt: now };
}
function weekKey(season, wk){ return season + '-' + wk; }
/* a finished week or playoff round as stored: rows are MAPS { a: home team, b: away team, pa: home points, pb: away points, src } */
function weekDocOf(rows, uid, now){
  return { games: rows.map(function(r){ return { a: r.h, b: r.a, pa: r.sc[0], pb: r.sc[1], src: r.src }; }), by: uid, t: now };
}
function gamesOfDoc(d){
  if (!d || !Array.isArray(d.games)) throw bad('a week document is damaged');
  return d.games.map(function(g){ return { h: g.a, a: g.b, sc: [g.pa, g.pb], src: g.src }; });
}
/* hist: one doc per finished season: { ch, ru, st: [ {w,l,t,pf,pa} x8 ], t } */
function histDocOf(row, now){
  return { ch: row.ch, ru: row.ru, st: row.st.map(function(x){ return { w: x[0], l: x[1], t: x[2], pf: x[3], pa: x[4] }; }), t: now };
}
function histRowOf(season, d){
  if (!d || !Array.isArray(d.st)) throw bad('a history document is damaged (season ' + season + ')');
  return { s: season, ch: d.ch, ru: d.ru, st: d.st.map(function(x){ return [x.w, x.l, x.t, x.pf, x.pa]; }) };
}

/* Rebuild the league record L (the shape of lg-std 1.2) from the cloud documents. Nothing is simulated: the stored weeks are applied.
   meta = the meta doc; teamDocs = 8 chunks (array, index = team); weekDocs = { 'season-week': doc }; histDocs = { 'season': doc } */
function buildLeague(meta, teamDocs, weekDocs, histDocs){
  var rules = rulesOf(meta), K = LGSTD.parts.K, season = meta.season;
  weekDocs = weekDocs || {}; histDocs = histDocs || {};
  var teams = [], rtdAll = [];
  for (var i = 0; i < NTEAMS; i++){
    var d = teamDocs[i];
    teams.push(decTeam(d, rules, i));
    (d.rtd || []).forEach(function(s){ var j = s.indexOf(':'); rtdAll.push({ s: Number(s.slice(0, j)), id: s.slice(j + 1), ti: teams.length - 1, n: rtdAll.length }); });
  }
  rtdAll.sort(function(a, b){ return a.s - b.s || a.ti - b.ti || a.n - b.n; });
  var L = { v: 2, dp: 'std', fmt: 'p8', nm: meta.nm, id: 'L' + LGE.seedFor(meta.rs, 0, K.ID, 0).toString(36).slice(0, 5), cmr: null,
    ssn: season, wk: 0, ph: 'reg', burn: rules.league.burnIn,
    sch: LGSTD.parts.makeSchedule(STD.stream(meta.rs, season, K.SCHED)), po: null, hist: [], res: [], rs: meta.rs, rules: rules,
    rtd: rtdAll.map(function(x){ return [x.s, x.id]; }), teams: teams };
  Object.keys(histDocs).map(Number).sort(function(a, b){ return a - b; }).forEach(function(s){ L.hist.push(histRowOf(s, histDocs[s])); });
  var nG = L.sch.length, w, applied = 0;
  for (w = 0; w < nG; w++){ var wd = weekDocs[weekKey(season, w)]; if (!wd) break; STD.applyWeek(L, gamesOfDoc(wd)); applied++; }
  for (w = applied; w < nG; w++) if (weekDocs[weekKey(season, w)]) throw bad('week ' + (applied + 1) + ' of season ' + season + ' is missing but a later week is stored');
  var r0 = weekDocs[weekKey(season, 100)], r1 = weekDocs[weekKey(season, 101)];
  if ((r0 || r1) && applied < nG) throw bad('a playoff round is stored before the regular season is complete');
  if (r0) STD.applyPlayoffRound(L, gamesOfDoc(r0));
  if (r1 && !r0) throw bad('the final is stored without the semifinals');
  if (r1) STD.applyPlayoffRound(L, gamesOfDoc(r1));
  if (L.wk !== meta.wk || L.ph !== meta.ph) throw bad('the league says week ' + meta.wk + ' (' + meta.ph + ') but the stored weeks give week ' + L.wk + ' (' + L.ph + ')');
  return L;
}

var PATH = {
  meta: function(lg){ return 'lgs/' + lg; },
  team: function(lg, i){ return 'lgs/' + lg + '/teams/' + i; },
  slots: function(lg){ return 'lgs/' + lg + '/slots'; },
  slot: function(lg, i){ return 'lgs/' + lg + '/slots/' + i; },
  week: function(lg, season, wk){ return 'lgs/' + lg + '/weeks/' + weekKey(season, wk); },
  sub: function(lg, season, wk, team){ return 'lgs/' + lg + '/subs/' + season + '-' + wk + '-' + team; },
  hist: function(lg, season){ return 'lgs/' + lg + '/hist/' + season; },
  code: function(code){ return 'leagueCodes/' + code; }
};
function normCode(s){ return String(s == null ? '' : s).toUpperCase().replace(/[\s-]+/g, ''); }

async function readCode(ad, code){
  code = normCode(code);
  if (!CODE_RULE.test(code)) throw CloudError('bad', 'A league code has 6 letters and digits (for example K7M2QX).');
  var g = await ad.get(PATH.code(code));
  return g.exists ? { code: code, lg: g.data.lg, commish: g.data.commish } : null;
}
/* everything needed to rebuild the league after the meta doc is known. cache = { weeks, hist } keeps documents that never change. */
async function readParts(ad, lg, meta, cache){
  cache = cache || { weeks: {}, hist: {} };
  var season = meta.season, i, p = [];
  for (i = 0; i < NTEAMS; i++) p.push(ad.get(PATH.team(lg, i)));
  var slotsP = ad.list(PATH.slots(lg));
  function want(key, path){ if (cache.weeks[key]) return null; return ad.get(path).then(function(g){ if (g.exists) cache.weeks[key] = g.data; }); }
  var wp = [], nG = 14;
  for (i = 0; i < Math.min(meta.wk, nG); i++) wp.push(want(weekKey(season, i), PATH.week(lg, season, i)));
  if (meta.wk >= nG) wp.push(want(weekKey(season, 100), PATH.week(lg, season, 100)));
  if (meta.wk >= nG + 2) wp.push(want(weekKey(season, 101), PATH.week(lg, season, 101)));
  for (var s = 1; s < season; s++) (function(s){
    if (!cache.hist[s]) wp.push(ad.get(PATH.hist(lg, s)).then(function(g){ if (g.exists) cache.hist[s] = g.data; }));
  })(s);
  var teamSnaps = await Promise.all(p), slotList = await slotsP;
  await Promise.all(wp.filter(Boolean));
  var teamDocs = teamSnaps.map(function(g, k){ if (!g.exists) throw CloudError('data', 'Team ' + (k + 1) + ' of this league is missing in the cloud. The creation of the league was probably interrupted: if you are the commissioner, press RESUME.'); return g.data; });
  var slots = {}; slotList.forEach(function(d){ slots[d.id] = d.data; });
  return { teamDocs: teamDocs, slots: slots, weeks: cache.weeks, hist: cache.hist };
}

function planWeekNo(plan){ return plan.kind === 'reg' ? plan.week : (plan.kind === 'po' ? 100 + plan.round : null); }
function ovrKey(season, wkNo, gi){ return season + '-' + wkNo + '-' + gi; }
return{CloudError:CloudError,classify:classify,cloudMsg:cloudMsg,makeSdkAdapter:makeSdkAdapter,buildLeague:buildLeague,decTeam:decTeam,encPlayer:encPlayer,decPlayer:decPlayer,blOf:blOf,
 rulesOf:rulesOf,weekKey:weekKey,weekDocOf:weekDocOf,gamesOfDoc:gamesOfDoc,histDocOf:histDocOf,histRowOf:histRowOf,PATH:PATH,normCode:normCode,readCode:readCode,readParts:readParts,
 planWeekNo:planWeekNo,ovrKey:ovrKey,CODE_RULE:CODE_RULE,CODE_ALPHABET:CODE_ALPHABET,NTEAMS:NTEAMS,bad:bad};
})();
