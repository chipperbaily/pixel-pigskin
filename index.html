function lgMatchCross(used){

  const r=[];for(let d=0;d<8;d++)for(const[a,b]of m)r.push([d*4+a,d*4+b]);rounds.push(r)}

  for(let k=0;k<c.nc;k++){const a=cl[k];for(let i=0;i<pc/2;i++)rd.push([a[i],a[pc-1-i]]);cl[k]=[a[0],a[pc-1],...a.slice(1,pc-1)]}

  for(const[a,b]of rd){const A=shuffle(Array.from({length:pc},(_,i)=>a*pc+i)),B=shuffle(Array.from({length:pc},(_,i)=>b*pc+i));for(let i=0;i<pc;i++)g.push([A[i],B[i]])}

  if(seen[k]!=null)h=seen[k]===a?b:a;else h=hc[a]!==hc[b]?(hc[a]<hc[b]?a:b):(Math.random()<.5?a:b);

function lgOrder(ids,ov){const R=LG().rec,cf=!ov&&lgCfg(LG()).id==='COL';return ids.slice().sort((a,b)=>(cf?lgCP(R[b])-lgCP(R[a]):0)||lgPct(R[b])-lgPct(R[a])||(R[b].pf-R[b].pa)-(R[a].pf-R[a].pa)||R[b].pf-R[a].pf||a-b)}
const lgDivIds=(c,d,cf)=>{cf=cf||LGC();return Array.from({length:cf.per},(_,i)=>c*cf.per*cf.dv+d*cf.per+i)};
function lgSync(){const r=LG().rec[LG().me];S.w=r.w;S.l=r.l;S.t=r.t}
function lgRank(id){const t=LG().teams[id],o=lgOrder(lgDivIds(t.conf,t.div)).indexOf(id)+1;return o+['TH','ST','ND','RD','TH'][o>3?0:o]}
/* record my game, simulate the other 15 of the week, move on */
function lgFinishWeek(w,mp,op){
 const L=LG(),opp=lgOpp(w,L.me),games=[[L.me,opp,mp,op]];
 lgRecGame(L.me,opp,mp,op);(L.res=L.res||[])[w]=(mp>op?'W ':mp<op?'L ':'T ')+mp+'-'+op;
 for(const[a,b]of L.sched[w]){if(a===L.me||b===L.me)continue;const[pa,pb]=lgSim(a,b,false,true);lgRecGame(a,b,pa,pb);games.push([a,b,pa,pb])}

/* ----- playoffs: 7 seeds per conference, seed 1 gets a bye ----- */
function lgSeedPO(){
 const L=LG(),cf=lgCfg(L),seeds=[[],[]];L.seed={};
 if(cf.id==='COL'){
  const champs=lgOrder(Array.from({length:cf.nc},(_,k)=>lgOrder(lgDivIds(k,0,cf))[0]),true);
  const rest=lgOrder(L.teams.map(t=>t.id).filter(i=>!champs.includes(i)),true).slice(0,12-cf.nc);
  const sd=[...champs.slice(0,cf.byes),...lgOrder([...champs.slice(cf.byes),...rest],true)];
  sd.forEach((id,i)=>L.seed[id]=i+1);L.po={seeds:[sd],alive:[sd.slice()],round:0,cc:champs};return}
 for(let c=0;c<2;c++){
  const win=[0,1,2,3].map(d=>lgOrder(lgDivIds(c,d))[0]),ws=lgOrder(win);
  const rest=lgOrder(Array.from({length:16},(_,i)=>c*16+i).filter(i=>!win.includes(i)));
  seeds[c]=[...ws,...rest.slice(0,3)];seeds[c].forEach((id,i)=>L.seed[id]=i+1)}
 L.po={seeds,alive:[seeds[0].slice(),seeds[1].slice()],round:0}}
function lgPoGames(){
 const L=LG(),P=L.po,r=P.round,a=P.alive,o=[];
 if(lgCfg(L).id==='COL'){const x=a[0],n=x.length,k=r===0?4:n/2;for(let i=0;i<k;i++)o.push(r===0?[x[4+i],x[11-i]]:[x[i],x[n-1-i]]);return o}
 if(r===3)o.push([a[0][0],a[1][0]]);
 else for(let c=0;c<2;c++){const x=a[c];if(r===0)o.push([x[1],x[6]],[x[2],x[5]],[x[3],x[4]]);else if(r===1)o.push([x[0],x[3]],[x[1],x[2]]);else o.push([x[0],x[1]])}
 return o}
/* play one whole round; myWin decides my game if I am in it */
function lgPoRound(myWin){
 const L=LG(),P=L.po,cf=lgCfg(L),win=new Set();
 for(const[a,b]of lgPoGames()){
  if(a===L.me||b===L.me)win.add(myWin?L.me:(a===L.me?b:a));
  else{const[pa,pb]=lgSim(a,b,true,P.round<cf.homeRds?true:null);win.add(pa>pb?a:b)}}
 if(P.round===3){L.champ=[...win][0];L.hist.push({s:S.season,id:L.champ})}
 else for(let c=0;c<P.alive.length;c++)P.alive[c]=P.alive[c].filter((i,ix)=>win.has(i)||(P.round===0&&ix<cf.byes)).sort((x,y)=>L.seed[x]-L.seed[y])
 P.round++}
function lgSimRestPo(){while(LG().po.round<=3)lgPoRound(false)}
function lgEndRegular(){
 const L=LG();lgSeedPO();
 if(!L.po.seeds.some(s=>s.includes(L.me))){lgSimRestPo();S.over='missed';return}
 S.phase='playoff';
 if(L.po.alive.some(x=>{const k=x.indexOf(L.me);return k>=0&&k<lgCfg(L).byes}))lgPoRound(false);          /* a bye seed: the rest of round 1 is simulated */
 S.round=L.po.round}

/* ----- hooks used by the game ----- */
function lgNextOpp(){
 const L=LG();let id;
 if(S.phase==='reg')id=lgOpp(S.week,L.me);
 else{const g=lgPoGames().find(g=>g.includes(L.me));id=g[0]===L.me?g[1]:g[0]}
 const t=L.teams[id];let home;
 if(S.phase==='reg')home=lgHomeWk(S.week);else{const g=lgPoGames().find(g=>g.includes(L.me));home=L.po.round>=lgCfg(L).homeRds?null:g[0]===L.me}
 return{name:t.name,off:t.off,def:t.def,col:t.col,uni:lgUni(t),id,home}}
const lgLabel=()=>S.phase==='reg'?'WEEK '+(S.week+1)+' OF '+LGC().games:LGC().rnd[LG().po.round];
function lgAfterGame(win,tie,cr,mp,op){
 const L=LG();
 if(S.phase==='reg'){lgFinishWeek(S.week,mp,op);if(S.week>=LGC().games)lgEndRegular()}
 else{
  const final=L.po.round===3;lgPoRound(win);
  if(win){if(final){S.over='champ';S.champs++;cr+=4}else S.round=L.po.round}
  else{S.over='elim';lgSimRestPo()}}
 S.credits+=cr;save();return cr}
function lgSimMine(){
 const L=LG(),po=S.phase==='playoff',o=lgNextOpp(),lbl=lgLabel();
 const[mp,op]=lgSim(L.me,o.id,po,o.home===true?true:o.home===false?false:null),win=mp>op,tie=mp===op&&!po;
 let cr=win?3:tie?2:1;if(po&&win)cr+=2;
 cr=lgAfterGame(win,tie,cr,mp,op);
 S.last=(win?'W ':tie?'T ':'L ')+mp+'-'+op+' VS '+o.name+' (SIM)';save();
 $('post').innerHTML=`<div class="sm">${lbl} - SIMULATED</div><h1 style="font-size:2em;${win?'color:#4ee08a;text-shadow:none':''}" class="${win?'win':tie?'':'lose'}">${win?'VICTORY!':tie?'TIE GAME':'DEFEAT'}</h1>
 <div style="font-size:1.4em">${S.name} ${mp} - ${op} ${o.name}</div><p style="color:#ffd400">+${cr} COACH CREDITS EARNED</p><button class="btn" id="bPostGo">CONTINUE</button>`;
 $('bPostGo').onclick=()=>{if(S.over)showSeasonEnd();else renderHub()};show('post')}
function lgNewSeason(){
 const L=LG();S.season++;
 for(const t of L.teams){const m=3.7+.25*(S.season-1);t.off=clamp(Math.round((t.off*.8+m*.2+lgGauss()*.5)*10)/10,2,9.4);t.def=clamp(Math.round((t.def*.8+m*.2+lgGauss()*.5)*10)/10,2,9.4)}
 L.ho=1;L.res=[];L.rec=lgBlank(L);L.sched=lgSchedule(L);L.scores=null;L.po=null;L.seed={};L.champ=null;
 S.week=0;S.w=S.l=S.t=0;S.phase='reg';S.round=0;S.over=null;S.credits+=3;S.last='';save();renderHub()}

/* ----- league backup: export / import codes (v1.73). Format: PPSAVE1:<g|r>:<checksum>:<base64url data>, data = JSON, gzipped when the browser can ----- */
const BK_PRE='PPSAVE1:',BK_WEEK=7*864e5,BK_DIS={};
let BK={mode:'',id:null,code:'',items:null,seq:0};
const bkHash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36)};
function bkB64(b){let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function bkUn64(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t),b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b}
const bkCanZip=()=>typeof CompressionStream!=='undefined'&&typeof DecompressionStream!=='undefined'&&typeof Blob!=='undefined'&&typeof Response!=='undefined';
async function bkPipe(bytes,Cls,fmt){return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new Cls(fmt))).arrayBuffer())}
async function bkPack(obj,raw){
 const json=JSON.stringify(obj);let bytes=new TextEncoder().encode(json),flag='r';
 if(!raw&&bkCanZip()){try{bytes=await bkPipe(bytes,CompressionStream,'gzip');flag='g'}catch(e){bytes=new TextEncoder().encode(json);flag='r'}}
 const data=bkB64(bytes);return BK_PRE+flag+':'+bkHash(data)+':'+data}
const bkBad=msg=>({ok:false,msg});
/* does the object look like one of our league saves? (teams, a season, a my-team id) */
function bkShape(d){
 if(!d||typeof d!=='object'||Array.isArray(d))return false;
 if(!(+d.season>=1))return false;
 if(d.lg){const L=d.lg;return!!(L&&Array.isArray(L.teams)&&L.teams.length>=2&&Number.isInteger(L.me)&&L.teams[L.me]&&typeof L.teams[L.me]==='object')}
 return typeof d.name==='string'&&Array.isArray(d.sched)&&!!d.r&&typeof d.r==='object'}
const bkInfo=d=>{const rec=(d.w|0)+'-'+(d.l|0)+(d.t?'-'+(d.t|0):'');return{name:String(d.lg?d.lg.name:d.name),team:String(d.name),season:d.season,rec,fmt:d.lg?lgCfg(d.lg).tag:'CLASSIC 8 GAMES'}};
/* text -> {ok,items:[{obj,info}]} or {ok:false,msg}; never touches storage */
async function bkUnpack(text){
 try{
  text=String(text==null?'':text);
  const i=text.indexOf(BK_PRE);
  if(i<0)return bkBad(/PPSAVE\d/.test(text)?'THIS BACKUP CODE IS FROM A DIFFERENT VERSION OF THE GAME.':'THAT IS NOT A PIXEL PIGSKIN BACKUP CODE. IT SHOULD START WITH PPSAVE1:');
  const code=text.slice(i).match(/^\S*/)[0],p=code.split(':');
  if(p.length<4||!p[3])return bkBad('THE CODE IS INCOMPLETE. COPY THE WHOLE CODE AND TRY AGAIN.');
  if(p.length>4||(p[1]!=='g'&&p[1]!=='r')||!/^[A-Za-z0-9_-]+$/.test(p[3]))return bkBad('THE CODE IS DAMAGED. COPY IT AGAIN IN FULL.');
  if(bkHash(p[3])!==p[2])return bkBad('THE CODE WAS CUT OFF OR CHANGED, SO IT DOES NOT MATCH ITS CHECKSUM. COPY IT AGAIN IN FULL.');
  let bytes=bkUn64(p[3]);
  if(p[1]==='g'){if(!bkCanZip())return bkBad('THIS BROWSER CANNOT OPEN COMPRESSED CODES. TRY A NEWER BROWSER.');bytes=await bkPipe(bytes,DecompressionStream,'gzip')}
  const obj=JSON.parse(new TextDecoder().decode(bytes));
  const list=obj&&obj.ppBackup==='all'&&Array.isArray(obj.slots)?obj.slots:[obj];
  if(!list.length)return bkBad('THIS BACKUP HAS NO LEAGUES IN IT.');
  const items=[];
  for(let d of list){
   if(!d||typeof d!=='object')return bkBad('THE BACKUP DATA COULD NOT BE READ.');
   if((+d.sv||0)>SAVE_VERSION)return bkBad('THIS BACKUP WAS MADE BY A NEWER VERSION OF THE GAME. UPDATE THE GAME FIRST.');
   d=migrate(d);
   if(!bkShape(d))return bkBad('THIS CODE OPENED, BUT IT IS NOT A COMPLETE LEAGUE (TEAMS, SEASON OR YOUR TEAM IS MISSING).');
   items.push({obj:d,info:bkInfo(d)})}
  return{ok:true,items}
 }catch(e){return bkBad('THE CODE COULD NOT BE READ. IT MAY BE DAMAGED OR CUT OFF. COPY IT AGAIN IN FULL.')}}
/* export: one league slot, or every slot ('all') in one code */
async function exportCode(id,opts){
 opts=opts||{};
 if(id==null||id==='all'){const slots=[];for(const e of rdIdx()){const d=loadSlot(e.id);if(d)slots.push(d)}return bkPack({ppBackup:'all',slots},opts.raw)}
 const d=loadSlot(id);if(!d)throw new Error('NO SUCH LEAGUE');return bkPack(d,opts.raw)}
/* import: always new slots with fresh ids, never overwrites; a repeated name gets " (2)", " (3)" ... */
function bkCommit(items){
 const ids=[],names=[];
 try{
  const taken=new Set(rdIdx().map(e=>e.name));
  for(const it of items){
   const d=JSON.parse(JSON.stringify(it.obj));let id,g=0;
   do{id=newId()}while((lsGet(SLOT+id)||rdIdx().some(e=>e.id===id))&&g++<50);
   let base=String(d.lg?d.lg.name:d.name),n=base,k=2;while(taken.has(n))n=base+' ('+(k++)+')';
   taken.add(n);if(d.lg)d.lg.name=n;else d.name=n;
   d.id=id;
   if(!writeSlot(d))return{ok:false,msg:"COULDN'T SAVE THE LEAGUE (STORAGE MAY BE FULL). NOTHING EXISTING WAS CHANGED.",ids,names};
   ids.push(id);names.push(n)}
  return{ok:true,ids,names}
 }catch(e){return{ok:false,msg:"COULDN'T SAVE THE LEAGUE. NOTHING EXISTING WAS CHANGED.",ids,names}}}
async function importCode(text){
 const r=await bkUnpack(text);if(!r.ok)return r;
 const c=bkCommit(r.items);if(c.ok){try{if(typeof HOME!=='undefined'&&$('menu').classList.contains('on'))renderHome()}catch(e){}}return c}

/* ---------- v1.99 PLAY A FRIEND (online exhibition, step 1) ----------
   Two phones, one room (Firestore doc rooms/{code}), turn based: the DEFENSE phone picks a DEFD scheme (the v1.83 pick screen), the OFFENSE phone then plays the snap live with the
   normal engine, writes the new state + recap in ONE write, and the roles swap whenever the ball changes hands. Nothing here touches leagues, saves, scoring, the game log, backup codes,
   cloud save or the mid-game snapshot: the game runs on a throwaway league (S.sbx) exactly like the v1.92 exhibition. The firebase SDK is only loaded when a button on the
   PLAY A FRIEND card is tapped. Every hook in the rest of the game is guarded by OL.on, so solo play is unchanged.
   Room doc (about 1.3 KB): schema, created, expires, settings{lv,dr,q}, teams{h,g}{n,c,u}, seats{h,g}{u,t}, n (+1 on every state write), phase (lobby|pick|pat|play|half|over),
   st (game state, s = write counter), pk{s,d} (defense pick), rc (latest recap), lv (who left).
   phase meaning: pick = the defense (st.po is the OFFENSE) must pick; play = the pick is in, the offense is playing the snap; pat = offense chooses XP or two; half = halftime shown by st.po. ---------- */
const OL_KEY='pixelPigskin.room',OL_URL='https://chipperbaily.github.io/pixel-pigskin/',OL_TTL=11.8*3600e3,OL_PICK=30,OL_PING=20000,OL_AWAY=60000,OL_NOPICK=45000;
const OL={on:false,code:'',seat:'',uid:'',exp:0,room:null,n:-1,s:0,snap:0,fp:'h',q:[],pumping:false,unsub:null,seq:0,off:false,rcSeen:0,rcPend:null,rcBusy:false,force:false,go:false,
 vk:'',vAt:0,pickAt:0,seen:{t:0,at:0},hbAt:0,tm:null,busy:false,pre:'',lc:0,over:false,fin:false,routed:false,wcount:0};
const olO=()=>OL.seat==='h'?'g':'h';
const olWaitMs=ms=>new Promise(r=>setTimeout(r,ms));
/* ----- codes: 6 characters from the same 31-character alphabet as the recovery codes, shown XXX-XXX ----- */
function olMake(){const ch=[];while(ch.length<6){const b=new Uint8Array(16);crypto.getRandomValues(b);for(const x of b){if(x<248&&ch.length<6)ch.push(CG_ALPHA[x%31])}}return ch.join('')}
function olNorm(t){const s=String(t||'').toUpperCase().replace(/[^A-Z0-9]/g,'');return s.length===6&&[...s].every(c=>CG_ALPHA.includes(c))?s:null}
const olFmt=c=>c.slice(0,3)+'-'+c.slice(3);
/* the one device-wide key. It is NOT part of any save, backup, export, cloud copy or problem report. */
function olKeyGet(){try{const o=JSON.parse(lsGet(OL_KEY)||'null');if(o&&o.v===1&&olNorm(o.c)&&(o.s==='h'||o.s==='g')&&o.x>Date.now())return o;if(o)lsDel(OL_KEY)}catch(e){}return null}
const olKeyPut=()=>{lsSet(OL_KEY,JSON.stringify({v:1,c:OL.code,s:OL.seat,x:OL.exp}))};
const olKeyDrop=()=>lsDel(OL_KEY);
/* ----- team identity from the room (anything that arrives from the other phone is cleaned before use) ----- */
const olHex=v=>typeof v==='string'&&/^#[0-9a-fA-F]{6}$/.test(v);
const olNm=v=>String(v==null?'':v).replace(/[^\x20-\x7e]/g,'').replace(/[<>&"]/g,'').trim().slice(0,22)||'TEAM';
const olTxt=(v,n)=>String(v==null?'':v).toUpperCase().replace(/[^A-Z0-9 +\-.'!?:,()\/\n]/g,'').slice(0,n||90);
const olCol=c=>c&&olHex(c.c)&&olHex(c.d)?{c:c.c,d:c.d}:{c:'#3b6fd8',d:'#1c3877'};
function olUni(u,col){const d=defaultUni(col),o={};
 for(const k of['helmet','jersey','pants','socks']){o[k]={};for(const f in d[k])o[k][f]=u&&u[k]&&olHex(u[k][f])?u[k][f]:d[k][f]}
 for(const k of['shoes','gloves','outline'])o[k]=u&&olHex(u[k])?u[k]:d[k];return o}
function olMe(){const sel=xhLeague();xhTeams(sel);const t=sel.L.teams[XH.me],c=olCol(t.col);return{n:olNm(t.name),c,u:olUni(lgUni(t),c)}}
const olTeam=k=>{const t=OL.room&&OL.room.teams&&OL.room.teams[k];return t?{name:olNm(t.n),col:olCol(t.c),uni:olUni(t.u,olCol(t.c))}:{name:'FRIEND',col:olCol(null),uni:olUni(null,olCol(null))}};
/* ----- the firebase calls (all through the v1.78 loader: lazy SDK, anonymous sign-in, 10 s limits) ----- */
async function olSdk(){if(!cgHostOK())throw{cgKind:'host'};const s=await cgT(cgLoad());OL.uid=await cgT(cgUid(s));return s}
function olErr(e){const k=cgKind(e);olMsg(k==='host'?'ONLINE PLAY ONLY WORKS ON THE GAME\'S OWN WEB ADDRESS':e&&e.olText?e.olText:k==='denied'?'THE CLOUD REFUSED THIS. CHECK THE DATE AND TIME ON YOUR DEVICE, THEN TRY AGAIN.':cgNoNet,true)}
function olMsg(t,bad){const m=$('olmsg');if(m){m.textContent=t||'';m.className='sm '+(bad?'bad':'good')}}
async function olFetch(code){const s=await olSdk();const sn=await cgT((s.X.getDocFromServer||s.X.getDoc)(s.X.doc(s.db,'rooms',code)));return sn.exists()?sn.data():null}
async function olTx(fn){const s=await olSdk(),ref=s.X.doc(s.db,'rooms',OL.code);
 return cgT(s.X.runTransaction(s.db,async tx=>{const sn=await tx.get(ref);if(!sn.exists())return{r:'gone'};
  const cur=sn.data(),o=fn(cur);if(o.r)return o;const up=Object.assign({},o.up);if(!o.hb)up.n=cur.n+1;tx.update(ref,up);return{r:'ok'}}),12000)}
/* the write queue: a snap never waits for the network. A result that cannot be written is kept and retried every few seconds (small OFFLINE chip). */
function olSend(job){OL.q.push(job);olPump()}
async function olPump(){
 if(OL.pumping)return;OL.pumping=true;
 try{while(OL.q.length&&OL.on){
  try{const r=await olTx(OL.q[0].fn);
   if(r.r==='gone'){olGone();break}
   OL.q.shift();OL.wcount++;olChip(false)}
  catch(e){if(cgKind(e)==='denied'){OL.q.shift();olGone();break}olChip(true);await olWaitMs(3000)}}}
 finally{OL.pumping=false}}
async function olFlush(ms){const t=Date.now();while(OL.q.length&&Date.now()-t<ms){olPump();await olWaitMs(100)}}
function olChip(on){OL.off=!!on;try{const c=$('olchip');if(c)c.style.display=on&&OL.on?'block':'none'}catch(e){}}
function olGone(){if(OL.fin)return;olKeyDrop();OL.q=[];olFin('THIS GAME IS NO LONGER AVAILABLE (IT MAY HAVE EXPIRED).')}
async function olSub(){
 const q=++OL.seq;if(OL.unsub){try{OL.unsub()}catch(e){}OL.unsub=null}
 const retry=()=>setTimeout(()=>{if(OL.on&&q===OL.seq)olSub()},4000);
 try{const s=await olSdk();if(q!==OL.seq||!OL.on)return;
  OL.unsub=s.X.onSnapshot(s.X.doc(s.db,'rooms',OL.code),sn=>{if(q!==OL.seq)return;olChip(false);if(sn.exists())olIn(sn.data());else olGone()},()=>{if(q!==OL.seq)return;OL.unsub=null;olChip(true);retry()})
 }catch(e){olChip(true);retry()}}
function olStop(){OL.seq++;if(OL.unsub){try{OL.unsub()}catch(e){}OL.unsub=null}if(OL.tm){clearInterval(OL.tm);OL.tm=null}}
function olResume(){if(!OL.on||document.hidden||OL.fin)return;
 olFetch(OL.code).then(d=>{if(d)olIn(d)}).catch(()=>{});olSub();olPump()}
document.addEventListener('visibilitychange',olResume);window.addEventListener('pageshow',olResume);
/* ----- create / join / rejoin ----- */
async function olCreate(){
 if(OL.busy||OL.on)return;OL.busy=true;olMsg('CONNECTING...');
 try{const me=olMe(),s=await olSdk(),now=Date.now(),exp=now+OL_TTL;
  for(let i=0;i<5;i++){
   const code=olMake(),ref=s.X.doc(s.db,'rooms',code);
   const doc={schema:1,created:now,expires:s.X.Timestamp.fromMillis(exp),settings:{lv:XH.diff,dr:!!XH.flip,q:XH.q},teams:{h:me},seats:{h:{u:OL.uid,t:now},g:{u:'',t:0}},n:0,phase:'lobby'};
   const ok=await cgT(s.X.runTransaction(s.db,async tx=>{const sn=await tx.get(ref);if(sn.exists())return false;tx.set(ref,doc);return true}));
   if(ok){olEnter(code,'h',exp,doc);return}}
  throw{cgKind:'net'}
 }catch(e){olErr(e)}finally{OL.busy=false}}
function olEnter(code,seat,exp,doc){
 Object.assign(OL,{on:true,code,seat,exp,room:doc,n:-1,s:0,snap:0,fp:'h',q:[],rcSeen:0,rcPend:null,rcBusy:false,vk:'',over:false,fin:false,routed:false,wcount:0,hbAt:0,seen:{t:0,at:Date.now()},lc:0});
 olKeyPut();olSub();if(!OL.tm)OL.tm=setInterval(olTick,1000);olIn(doc)}
async function olPreview(){ /* JOIN GAME: look at the room, show the host's team, let the guest pick their own */
 if(OL.busy||OL.on)return;const inp=$('olin'),code=olNorm(inp&&inp.value);
 if(!code){olMsg('THAT CODE LOOKS WRONG. IT HAS 6 LETTERS AND NUMBERS.',true);return}
 OL.busy=true;olMsg('CONNECTING...');
 try{const d=await olFetch(code);
  if(!d||!d.teams||!d.seats||(d.expires&&d.expires.toMillis&&d.expires.toMillis()<Date.now()))throw{olText:'NO GAME WITH THAT CODE, OR IT HAS EXPIRED.'};
  if(d.seats.h.u===OL.uid||d.seats.g.u===OL.uid){olEnter(code,d.seats.h.u===OL.uid?'h':'g',d.expires.toMillis(),d);return} /* your own room: that is a rejoin */
  if(d.phase!=='lobby'||d.seats.g.u)throw{olText:d.seats.g.u?'THAT GAME ALREADY HAS TWO PLAYERS.':'THAT GAME HAS ALREADY STARTED.'};
  OL.pv={code,d};olJoinView()

async function olJoin(){

  const r=await olTx(cur=>{if(cur.phase!=='lobby'||cur.seats.g.u)return{r:'taken'};return{up:{'teams.g':me,'seats.g':{u:OL.uid,t:now}}}});
  if(r.r==='gone')throw{olText:'NO GAME WITH THAT CODE, OR IT HAS EXPIRED.'};

  const d=await olFetch(pv.code);OL.pv=null;olEnter(pv.code,'g',d.expires.toMillis(),d)

 try{OL.code=k.c;const d=await olFetch(k.c);
  if(!d||!d.seats||!d.seats[k.s]||d.seats[k.s].u!==OL.uid||(d.expires&&d.expires.toMillis()<Date.now())){olKeyDrop();OL.code='';renderHome();olMsg('THAT GAME IS GONE.',true);return}

function olSt(po){const me=OL.seat,mh=me==='h',a=G.qs.me.slice(0,5),b=G.qs.op.slice(0,5);
 return{s:++OL.s,po,h:mh?G.me:G.op,g:mh?G.op:G.me,qh:mh?a:b,qg:mh?b:a,q:Math.round(G.clock*10)/10,l:Math.round(G.los),d:G.down,f:Math.round(G.fd),hf:G.half?1:0,ot:G.ot?1:0,pt:G.pat?1:0,fp:OL.fp}}

/* ----- routing ----- */
function olRoute(){
 if(OL.rcBusy)return;
 const d=OL.room;if(!d)return;
 if(d.phase==='lobby'){olLobby();return}
 if(d.phase==='over'&&!d.st){olFin(d.lv&&d.lv!==OL.seat?'YOUR FRIEND LEFT.':'');return}
 const st=d.st;if(!st)return;
 if(!G||!G.online){if(d.phase==='over'){olFin();return}olStart(d)}
 if(d.phase==='over'&&OL.over)return;
 const me=OL.seat,mine=st.po===me,rd=st.s>OL.s;
 if(rd){olApply(st);OL.s=st.s}
 const rc=d.rc;
 if(rd&&rc&&rc.s===st.s&&rc.s>OL.rcSeen){OL.rcSeen=rc.s;olRecap(rc,d);return}
 olView(d,rd)}
function olView(d,rd){

 else if(d.phase==='play'){if(mine){if(OL.snap!==st.s)olSnapGo(d)}else{OL.snap=st.s;olWatchView(key,'IS RUNNING THE PLAY')}}
 else if(d.phase==='half'){if(mine){if(rd&&G.mode!=='half'){OL.vk='';show(null);OL.quiet=true;try{showHalf(secondHalf)}finally{OL.quiet=false}}}else olWatchView(key,'HALFTIME',true)}}

 }catch(e){}

/* ---------- v1.87 pass rush against the line. Each rusher is paired with a lineman and the two lock up (drawn leaning into each other, the lineman pushed back a little as the rusher wins).
   The longer the play lasts the better each rusher's chance to win: the chance of winning per second grows in step with the time (a Rayleigh clock), and the numbers are set so that the FIRST
   rusher to get through reaches the QB at the sack timer p.T on average (p.T already holds the O-line rating, defense rating, rusher count, difficulty and home or away).
   A rusher's win time is drawn once at the snap from that clock; the pressure bar shows the closest rusher's progress. ---------- */

const SW=12,SH=18;let ANIM_DT=0; /* v1.59: frame time for the run cycle */

 /* v1.94: smaller jersey numbers: two rows tall (was three) and a 1 is one pixel wide, so a number like 81 or 12 is only 4 pixels across */

 for(const d of gl){for(let r=0;r<2;r++)for(let c=0;c<d[r].length;c++)if(d[r][c]==='1')put(nx+c,8+r,u.jersey.number);nx+=d[0].length+1}

   x,y are the alignment (x in yards from the line of scrimmage, negative = behind it; y is the
   field width 0..40). t is a route type from the route tree, d its depth, f = 1 flips the break

   routePath(spec,x,y) turns a spec into game-ready points, the hook for play calling later. */
const RT=[

 {t:'curl',n:4,l:'CURL',d:10},{t:'out',n:5,l:'OUT',d:10},{t:'in',n:6,l:'IN',d:10},

/* route tree -> points. Break direction: "outside" is toward the nearest sideline, FLIP reverses it */
function routePath(sp,x,y){
 const D=sp.d,o=(y<20?-1:1)*(sp.f?-1:1),pts=[];let cont=true,px=x,py=y;
 const add=(dx,dy)=>{px+=dx;py=clamp(py+dy,2,38);pts.push({x:px,y:py})};
 switch(sp.t){
  case'go':add(D,0);break;
  case'flat':add(1.5,0);add(1.5,o*D);break;
  case'slant':add(2,0);add(D*.8,-o*D*.5);break;
  case'hitch':add(D,0);add(-1.5,0);cont=false;break;
  case'curl':add(D,0);add(-3.5,-o*1.5);cont=false;break;
  case'comeback':add(D,0);add(-4.5,o*3);cont=false;break;
  case'out':add(D,0);add(0,o*8);break;
  case'in':add(D,0);add(0,-o*12);break;

 if(d.s!=null){DS.sel=+d.s;dsPanel()}
 else if(d.t)setRoute(d.t);
 else if(d.a==='back')closeDesigner();
 else if(d.a==='dm')dsDepth(-1);
 else if(d.a==='dp')dsDepth(1);
 else if(d.a==='flip')dsFlip();
 else if(d.a==='new'&&pl.length<MAXP){pl.push(mkPlay('PLAY '+(pl.length+1),['go','go','go','flat','curl']));DS.i=pl.length-1;DS.sel=0;dsEdit()}
 else if(d.a==='copy'&&pl.length<MAXP){const c=JSON.parse(JSON.stringify(curPlay()));c.name=(c.name+' 2').slice(0,14);pl.push(c);DS.i=pl.length-1;dsEdit()}
 else if(d.a==='use'){S.call=DS.i;save();dsPanel()}
 else if(d.a==='del'&&pl.length>1){if(S.call===DS.i)S.call=-1;else if(S.call>DS.i)S.call--;pl.splice(DS.i,1);DS.i=Math.min(DS.i,pl.length-1);DS.sel=0;dsEdit()}
 else if(d.a==='prev'){DS.prev=DS.prev?null:{t:-.4};dsPanel()}}
$('pd').addEventListener('click',e=>{const b=e.target.closest('button');if(b&&DS.on)dsAct(b)});
$('pd').addEventListener('input',e=>{if(!DS.on||e.target.id!=='pdName')return;
 const v=e.target.value.toUpperCase().replace(/[^A-Z0-9 \-]/g,'');if(v!==e.target.value)e.target.value=v;
 curPlay().name=v||'UNNAMED';save();const o=$('pdSel').options[DS.i];if(o)o.textContent=(DS.i+1)+'. '+curPlay().name});
$('pd').addEventListener('change',e=>{if(DS.on&&e.target.id==='pdSel'){DS.i=+e.target.value;DS.sel=0;DS.prev=null;dsPanel()}});

/* ----- input (called from the canvas handlers) ----- */
function dsDown(e){
 const q=pt(e);DS.prev=null;let bi=-1,bd=22;
 curPlay().p.forEach((s,i)=>{const d=Math.hypot(DX(s.x)-q.x,sy(s.y)-8-q.y);if(d<bd){bd=d;bi=i}});
 if(bi<0)return;
 const s=curPlay().p[bi];DS.sel=bi;DS.drag={i:bi,ox:q.x-DX(s.x),oy:q.y-sy(s.y),moved:false};
 try{cv.setPointerCapture(e.pointerId)}catch(_){}
 dsPanel()}
function dsMove(e){
 const d=DS.drag;if(!d)return;const q=pt(e),s=curPlay().p[d.i];
 const nx=clamp(Math.round(((q.x-d.ox)/DSC-10)*2)/2,-9,-1),ny=clamp(Math.round(((q.y-d.oy-FT)/UNIT)*2)/2,2,38);
 if((nx!==s.x||ny!==s.y)&&legal(d.i,nx,ny)){s.x=nx;s.y=ny;d.moved=true}}
function dsUp(){if(DS.drag){if(DS.drag.moved)save();DS.drag=null}}
function dsKey(e){
 const tg=e.target&&e.target.tagName;if(tg==='INPUT'||tg==='SELECT')return;
 const k=e.key.toLowerCase();
 if(k==='escape')closeDesigner();
 else if(/^[1-9]$/.test(k))setRoute(RT[+k-1].t);
 else if(k==='0')setRoute('hitch');
 else if(k==='b')setRoute('block');
 else if(k==='tab'||k==='n'){DS.sel=(DS.sel+1)%5;dsPanel();e.preventDefault()}
 else if(k==='+'||k==='=')dsDepth(1);
 else if(k==='-')dsDepth(-1);
 else if(k==='f')dsFlip();
 else if(k===' '){DS.prev=DS.prev?null:{t:-.4};dsPanel();e.preventDefault()}}

/* ----- drawing ----- */
function dsPos(s,dist){
 const r=routePath(s,s.x,s.y),P=[{x:s.x,y:s.y},...r.pts];let left=dist,vx=1,vy=0;
 for(let k=1;k<P.length;k++){const a=P[k-1],b=P[k],L=Math.hypot(b.x-a.x,b.y-a.y);if(L<1e-6)continue;
  vx=(b.x-a.x)/L;vy=(b.y-a.y)/L;if(left<=L)return{x:a.x+vx*left,y:a.y+vy*left,m:1,vx};left-=L}
 const e=P[P.length-1];
 if(r.cont&&P.length>1){const x=e.x+vx*left,y=clamp(e.y+vy*left,1.5,38.5);return{x:Math.min(x,25.5),y,m:x<25.5?1:0,vx}}
 return{x:e.x,y:e.y,m:0,vx:1}}
function dsRoute(s,i,alpha,w){
 const r=routePath(s,s.x,s.y),ax=DX(s.x),ay=sy(s.y)-5;
 cx.strokeStyle=cx.fillStyle=RC[i];cx.globalAlpha=alpha;cx.lineWidth=w;cx.lineJoin='round';
 if(!r.pts.length){cx.fillRect(ax+9,ay-7,3,14);cx.fillRect(ax+9,ay-1,6,2);cx.globalAlpha=1;return}
 cx.beginPath();cx.moveTo(ax,ay);let lx=ax,ly=ay,px=ax,py=ay;
 for(const p of r.pts){px=lx;py=ly;lx=DX(p.x);ly=sy(p.y)-5;cx.lineTo(lx,ly)}
 cx.stroke();
 const a=Math.atan2(ly-py,lx-px);
 if(r.cont){cx.beginPath();cx.moveTo(lx+Math.cos(a)*6,ly+Math.sin(a)*6);cx.lineTo(lx+Math.cos(a+2.5)*6,ly+Math.sin(a+2.5)*6);cx.lineTo(lx+Math.cos(a-2.5)*6,ly+Math.sin(a-2.5)*6);cx.fill()}
 else{cx.beginPath();cx.moveTo(lx+Math.cos(a+1.571)*5,ly+Math.sin(a+1.571)*5);cx.lineTo(lx+Math.cos(a-1.571)*5,ly+Math.sin(a-1.571)*5);cx.stroke()}
 cx.globalAlpha=1}
function dsEnt(e,x,y,fr,face){cx.fillStyle='rgba(0,0,0,.3)';cx.fillRect(x-5,y-1,11,3);cx.drawImage(getSprite(e,fr,face),x-7,y-19)}
function drawDesigner(){

 const pl=curPlay(),E=DS.ents;
 cx.fillStyle='#15202f';cx.fillRect(0,0,W,H);
 for(let yd=-10;yd<26;yd+=5){cx.fillStyle=((yd+10)/5)%2?'#2e7d32':'#2a7030';cx.fillRect(DX(yd),FT,Math.min(5*DSC+1,DX(26)-DX(yd)),FB-FT)}
 for(let yd=5;yd<=25;yd+=5){cx.fillStyle='rgba(255,255,255,.35)';cx.fillRect(DX(yd),FT,1,FB-FT);txt(''+yd,DX(yd)+2,FT+9,5,'rgba(255,255,255,.55)')}
 cx.fillStyle='rgba(255,255,255,.25)';for(let x=-10;x<26;x++){cx.fillRect(DX(x),sy(14),1,2);cx.fillRect(DX(x),sy(26),1,2)}
 cx.fillStyle='#4aa3ff';cx.fillRect(DX(0)-1,FT,2,FB-FT);txt('LOS',DX(0)+3,FB-5,5,'#9cc8ff');
 cx.fillStyle='#fff';cx.fillRect(0,FT-1,DX(26),2);cx.fillRect(0,FB-1,DX(26),2);
 txt('PLAY DESIGNER',8,22,10,'#ffd400');txt(pl.name,8,42,8,'#fff');
 txt('DRAG A PLAYER TO MOVE HIM. PICK HIS ROUTE AT RIGHT.',8,336,5,'#b8c4dc');txt('PLAYS SAVE AUTOMATICALLY.',8,350,5,'#b8c4dc');
 const pv=DS.prev;
 if(pv){pv.t+=dt;if(pv.t>3.6)pv.t=-.7}
 const items=[];
 items.push({y:20,e:E.qb,x:DX(-5),py:sy(20),fr:0,face:1});
 E.ol.forEach((o,i)=>items.push({y:o.y,e:o,x:DX(-1),py:sy(o.y),fr:0,face:1}));
 pl.p.forEach((s,i)=>{
  if(pv){const q=dsPos(s,Math.max(0,pv.t)*PSPD);items.push({y:q.y,e:E.recs[i],x:DX(q.x),py:sy(q.y),fr:pv.t>0&&q.m?1+Math.floor(pv.t*9+i)%2:0,face:q.vx<-.2?-1:1,i})}
  else items.push({y:s.y,e:E.recs[i],x:DX(s.x),py:sy(s.y),fr:0,face:1,i})});
 for(let i=0;i<4;i++)if(i!==DS.sel)dsRoute(pl.p[i],i,pv?.35:.75,2);
 dsRoute(pl.p[DS.sel],DS.sel,pv?.5:1,3);
 items.sort((a,b)=>a.y-b.y);
 for(const it of items){dsEnt(it.e,Math.round(it.x),Math.round(it.py),it.fr,it.face);
  if(it.i!=null&&!pv){txt(''+(it.i+1),Math.round(it.x),Math.round(it.py)-24,7,RC[it.i],'center');

/* ---------- play calling ----------
   Before each snap you can open the call sheet (PLAYS button or C) and pick a play from the
   playbook, or RANDOM. S.call is the playbook index of the called play (-1 or missing = random).
   The call sticks from down to down. setRoutes() lines the receivers up and gives them their routes. */
const PC={on:false},DEFA=[[-1,5],[-1,35],[-1.2,28],[-5,15.5],[-1,11]];
function callPlay(){
 if(!Array.isArray(S.plays)||!S.plays.length){S.plays=seedPlays();save()}
 fixPlays();return S.call>=0&&S.call<S.plays.length?S.plays[S.call]:null}
const callName=()=>{const p=callPlay();return p?p.name:'RANDOM'+(G&&G.cpt?': '+G.cpt.name:'')};
function setRoutes(){
 const pl=callPlay()||(G.cpt=pick(NFLC.filter(q=>q.name!=='HAIL MARY'))),l=G.los;if(callPlay())G.cpt=null;
 G.recs.forEach((r,i)=>{
  if(pl){const q=playToRoute(pl,i,l);r.x=r.x0=clamp(q.x,-9.5,108);r.y=r.y0=q.y;r.path=q.path;r.cont=q.cont;r.pi=0;r.route=q.route}
  else{r.x=r.x0=Math.max(-9.5,l+DEFA[i][0]);r.y=r.y0=DEFA[i][1];mkRoute(r,i)}})}

function thumb(c,play){
 const x=c.getContext('2d'),w=c.width,h=c.height,X=v=>(v+9.5)*3,Y=v=>v*h/40;
 x.fillStyle='#2e7d32';x.fillRect(0,0,w,h);x.fillStyle='#2a7030';for(let k=1;k<7;k+=2)x.fillRect(X(-9.5+k*5)+.5,0,15,h);
 if(!play){x.fillStyle='#ffd400';x.font='28px "Press Start 2P",monospace';x.textAlign='center';x.fillText('?',w/2,h/2+10);return}
 x.fillStyle='#4aa3ff';x.fillRect(X(0)-1,0,2,h);
 x.fillStyle=myC().d;for(const y of[14,17,20,23,26])x.fillRect(X(-1)-2,Y(y)-2,5,5);
 x.fillStyle='#f4f4f8';x.fillRect(X(-5)-2,Y(20)-2,5,5);
 play.p.forEach((s,i)=>{
  const r=routePath(s,s.x,s.y);x.strokeStyle=x.fillStyle=RC[i];x.lineWidth=1.6;
  x.fillRect(X(s.x)-2.5,Y(s.y)-2.5,6,6);
  if(!r.pts.length){x.fillRect(X(s.x)+4,Y(s.y)-4,2,8);return}
  x.beginPath();x.moveTo(X(s.x),Y(s.y));let px=X(s.x),py=Y(s.y),lx=px,ly=py;
  for(const p of r.pts){px=lx;py=ly;lx=X(p.x);ly=Y(p.y);x.lineTo(lx,ly)}x.stroke();
  const a=Math.atan2(ly-py,lx-px);
  if(r.cont){x.beginPath();x.moveTo(lx+Math.cos(a)*4,ly+Math.sin(a)*4);x.lineTo(lx+Math.cos(a+2.5)*4,ly+Math.sin(a+2.5)*4);x.lineTo(lx+Math.cos(a-2.5)*4,ly+Math.sin(a-2.5)*4);x.fill()}
  else{x.beginPath();x.moveTo(lx+Math.cos(a+1.571)*3.5,ly+Math.sin(a+1.571)*3.5);x.lineTo(lx+Math.cos(a-1.571)*3.5,ly+Math.sin(a-1.571)*3.5);x.stroke()}})}

/* ---------- defenses ----------
   The AI picks one of five schemes at random before every snap (G.def). A scheme gives each of the
   3 linebackers and 4 defensive backs an alignment (al) and an assignment (as):
     as:null     -> rushes the passer (the 4 linemen always rush)
     as:{m:i}    -> man coverage on receiver i (0-2 = WR 1-3, 3 = the RB, 4 = the TE, who is only covered by zones or left open)
     as:{z:[depth,y,halfWidth]} -> drops to a zone `depth` yards past the line, centered at y; a receiver
                    who enters the zone gets covered, otherwise the defender holds the spot
   dbw / lbw = how many seconds after the snap the backs and linebackers hold before closing on a run.
   The shape of every scheme is in this table so more can be added, or the user can call them later. */

const RUSHT=[1,1,1,1,1,.9,.8,.7];   /* sack-clock multiplier by number of rushers */
let DEFFORCE=null,LOOKFORCE=null;
function pickWeighted(){let t=0;for(const s of DEFD)t+=s.w||1;let r=Math.random()*t;for(const s of DEFD){r-=s.w||1;if(r<=0)return s}return DEFD[0]}
/* ---------- difficulty (v1.51): 1-10, 5 is the normal game. It only changes the defense ---------- */
const DIFF=()=>clamp(Math.round(S.diff||5),1,10),DK=()=>DIFF()-5;
const DNAMES=['ROOKIE','ROOKIE','EASY','EASY','PRO','HARD','HARD','ALL-PRO','ALL-PRO','LEGEND'],dName=()=>DNAMES[DIFF()-1];
const dTrk=()=>1+.03*DK();      /* how fast defenders close on the ball in the air */
const dSpd=()=>1+.035*DK();     /* top speed of every defender */
const dReact=()=>1-.06*DK();    /* defenders' reaction delay multiplier */
const dSack=()=>1-.05*DK();     /* sack clock multiplier: lower = quicker pass rush */
