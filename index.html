<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Pigskin Football</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#070a12;color:#fff;font-family:'Press Start 2P',monospace;overflow:hidden;touch-action:manipulation;user-select:none}
#wrap{height:100%;display:flex;align-items:center;justify-content:center}
#app{position:relative;background:#101820;overflow:hidden;box-shadow:0 0 0 .3em #1d2a44}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}#c{touch-action:none}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,12,24,.96);padding:1.2em;gap:.9em;text-align:center;overflow:auto;line-height:1.5}
.screen.on{display:flex}
h1{font-size:2.4em;color:#ffd400;text-shadow:.12em .12em 0 #a04000;line-height:1.2}
h3{font-size:.9em;color:#ffd400;margin-bottom:.6em}
p,.sm{font-size:.7em;color:#b8c4dc}
.btn{background:#ffd400;color:#111;border:0;padding:.7em 1.1em;font:inherit;font-size:.85em;cursor:pointer;box-shadow:0 .25em 0 #a07f00}
.btn.alt{background:#2b3a55;color:#fff;box-shadow:0 .25em 0 #141c2c}
.btn.on{outline:.15em solid #fff}
.btn:disabled{opacity:.35;cursor:default}
.btn:active:not(:disabled){transform:translateY(.15em)}
.btn.xs{padding:.4em .6em;font-size:.65em}
input{font:inherit;font-size:.9em;padding:.5em;background:#16213a;color:#fff;border:.15em solid #3a4d78;text-align:center;width:18em}
#sw{display:flex;gap:.5em;flex-wrap:wrap;justify-content:center}
#sw i{width:2em;height:2em;border:.15em solid #000;cursor:pointer}
#sw i.on{outline:.2em solid #fff}
.cols{display:flex;gap:1em;width:100%;justify-content:center;align-items:stretch}
.card{background:#16213a;border:.2em solid #2e4170;padding:.9em;flex:1;max-width:24em;text-align:left;font-size:.8em}
.card .big{font-size:1.2em;margin:.4em 0}
.up{display:flex;align-items:center;justify-content:space-between;gap:.5em;margin:.45em 0;font-size:.75em}
.up b{width:6.5em;font-weight:normal}
.pips{display:flex;gap:.15em;flex:1}
.pips s{width:.7em;height:1em;background:#2b3a55;text-decoration:none}
.pips s.f{background:#4ee08a}
.row{display:flex;gap:.7em;align-items:center;justify-content:center;flex-wrap:wrap}
#ctl{position:absolute;left:0;right:0;bottom:0;height:11.5%;display:flex;gap:.6em;align-items:center;justify-content:center;pointer-events:none}
#ctl .btn{pointer-events:auto;padding:.45em .8em;font-size:.8em}
#ctl .btn.hide{display:none}
#pd{background:transparent;pointer-events:none;flex-direction:row;justify-content:flex-end;align-items:stretch;padding:0;gap:0;overflow:visible}
#pdp{pointer-events:auto;width:30%;height:100%;background:rgba(8,12,24,.97);border-left:.2em solid #2e4170;padding:.6em;display:flex;flex-direction:column;gap:.5em;overflow:auto;text-align:left}
#pdp .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.35em}
#pdp .btn.xs{padding:.45em .3em;font-size:.65em}
#pdp .row{gap:.35em;justify-content:flex-start}
#pdp select{font:inherit;font-size:.7em;padding:.45em;background:#16213a;color:#fff;border:.15em solid #3a4d78;width:100%}
#pdp input{width:100%;font-size:.75em}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:.6em;width:100%}
.btn.pc{box-shadow:none;border:.2em solid #2e4170;padding:.3em;display:flex;flex-direction:column;align-items:center;gap:.4em;font-size:.6em;background:#16213a;min-width:0}
.btn.pc.on{border-color:#ffd400;outline:none}
.btn.pc canvas{width:100%;height:auto;image-rendering:pixelated}
.btn.pc span{font-size:1em;word-break:break-word}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:.6em;width:100%;max-width:56em}.rg .card{text-align:left}
.screen.top{justify-content:flex-start;gap:.6em;padding:1em}
h1.mh{font-size:1.5em}
#mbody{width:100%;display:flex;flex-direction:column;gap:.7em;align-items:center}
.lst{width:100%;max-width:46em;display:flex;flex-direction:column;gap:.4em}
.slot{display:flex;align-items:center;gap:.6em;background:#16213a;border:.2em solid #2e4170;padding:.6em .8em;font-size:.8em}
.slot b{font-weight:normal;color:#ffd400}
.dvg{display:grid;grid-template-columns:1fr 1fr;gap:.8em;width:100%;max-width:60em}
.dv{background:#16213a;border:.2em solid #2e4170;padding:.6em;text-align:left;font-size:.7em}
.dv h4{font-size:1em;color:#ffd400;font-weight:normal;margin-bottom:.4em}
.dv table{width:100%;border-collapse:collapse;font-size:.9em}.dv td{padding:.25em .3em}.dv td:nth-child(n+2){text-align:right;color:#b8c4dc}
.dv tr.czg2{display:grid;grid-template-columns:1fr 1fr;gap:.8em;width:100%;max-width:50em;align-items:start}
#lock .lkc{width:100%;image-rendering:pixelated;background:#2f6b3a;border:.15em solid #000}
.me{background:#2e4170}.dv tr.ld td:first-child{color:#ffd400}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:.3em}
.tb{font:inherit;font-size:.8em;background:#0e1628;color:#fff;border:.15em solid #2b3a55;padding:.35em;text-align:left;cursor:pointer;display:flex;gap:.4em;align-items:center;min-width:0}
.tb.on{border-color:#ffd400;background:#2b3a55}
.tb i{width:.8em;height:.8em;flex:none;border:.15em solid}
.czg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.6em;width:100%;align-items:start}
.card.cz{max-width:none;font-size:.7em}
.cpg{display:grid;grid-template-columns:1fr 1fr;gap:.4em}
.cp{display:flex;align-items:center;gap:.4em;font-size:.8em;color:#b8c4dc;cursor:pointer}
.cp input{width:2.6em;height:2em;padding:0;border:.15em solid #000;background:none}
select{font:inherit;font-size:.7em;padding:.4em;background:#16213a;color:#fff;border:.15em solid #3a4d78;max-width:16em}
.card.cz input[type=text],.card.cz input:not([type]){font-size:.9em;padding:.35em;text-align:left}
.czg2{display:grid;grid-template-columns:1fr 1fr;gap:.8em;width:100%;max-width:50em;align-items:start}
#lock .lkc{width:100%;image-rendering:pixelated;background:#2f6b3a;border:.15em solid #000}
.me{background:#2e4170}.now{color:#ffd400}
.win{color:#4ee08a}.lose{color:#ff6b6b}
</style></head><body>
<div id="wrap"><div id="app">
<canvas id="c" width="640" height="360"></canvas>
<div id="ctl">
 <button class="btn hide" id="bPass">PASS [P]</button>
 <button class="btn alt hide" id="bRun">RUN [R]</button>
 <button class="btn alt hide" id="bCall">PLAYS [C]</button>
 <button class="btn alt hide" id="bPunt">PUNT [K]</button>
 <button class="btn alt hide" id="bFG">FIELD GOAL [F]</button>
 <button class="btn alt hide" id="bBullet">BULLET: OFF [B]</button>
 <button class="btn hide" id="bJuke">JUKE [SPACE]</button>
 <button class="btn hide" id="bXP">KICK XP +1 [1]</button>
 <button class="btn alt hide" id="b2PT">GO FOR 2 [2]</button>
</div>
<div class="screen top on" id="menu">
 <h1 class="mh">PIXEL PIGSKIN</h1>
 <div class="row" id="mtabs"></div>
 <div id="mbody"></div>
 <div class="row" id="mrot"></div>
</div>
<div class="screen top" id="stand"></div>
<div class="screen top" id="lock"></div>
<div class="screen top" id="half"></div>
<div class="screen top" id="roster"></div>
<div class="screen top" id="exh"></div>
<div class="screen" id="hub"></div>
<div class="screen" id="post"></div>
<div class="screen" id="season"></div>
<div class="screen top" id="pcs"></div>
<div class="screen" id="pd"><div id="pdp"></div></div>
</div></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),cx=cv.getContext('2d');cx.imageSmoothingEnabled=false; /* v1.60: rotated tackle poses stay crisp */
const W=640,H=360,PPY=12,FT=58,FB=316,UNIT=(FB-FT)/40,VW=W/PPY;
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const dst=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const COLORS=[{c:'#e23b4a',d:'#7a1522'},{c:'#3b7cff',d:'#163a8c'},{c:'#2fc16f',d:'#14633a'},{c:'#ffc324',d:'#8a6200'},{c:'#a45cf0',d:'#4e1c8a'},{c:'#ff7a1a',d:'#8a3a00'},{c:'#18b8a8',d:'#0a5e56'},{c:'#f25cb0',d:'#8a1f5c'}];
const OPPN=['HARBOR HAWKS','PRAIRIE FOXES','GRANITE GIANTS','MESA SCORPIONS','LAKESIDE LOONS','SUMMIT YETIS','BAYOU BARONS','REDWOOD RANGERS','NEON KNIGHTS','IRON OXEN','COASTAL COMETS','CANYON COBRAS','TIMBER BADGERS','DESERT DRAGONS'];
const FN=['J','M','T','D','K','R','A','C','L','B','Z','N'],LN=['RIVERA','OKAFOR','BROOKS','TANAKA','VOSS','DELGADO','HALE','NOVAK','PRUITT','SATO','MERCER','ODUYA','BISHOP','CASTILLO','DUNN'];
const RK=['rb','ol','def'],RL={qb:'QB ARM',wr:'RECEIVERS',rb:'RUNNING BK',ol:'O-LINE',def:'DEFENSE',k:'KICKER'};
/* v1.46: individual players. S.ro holds the QB (arm, acc), the three WRs and the TE (spd, cat) and the kicker (acc, rng); built from the old unit ratings the first time it is needed */
function ensureRo(){const r=S.r;if(!S.ro)S.ro={qb:{arm:r.qb,acc:r.qb},wr:[0,1,2].map(()=>({spd:r.wr,cat:r.wr})),te:{spd:r.wr,cat:r.wr},k:{acc:r.k,rng:r.k}};
 if(!S.names)S.names={};if(!S.names.te)S.names.te=nm();if(!S.names.k)S.names.k=nm();return S.ro}
const RO=()=>S.ro||ensureRo();
/* saves: every league or season is its own slot, with a small index for the home page (v1.40) */
const IDX='pixelPigskin.idx',SLOT='pixelPigskin.s.',OLDKEY='pixelPigskin.v1';
let S=null,G=null,ci=0,FLIP=false;
const newId=()=>'L'+Date.now().toString(36)+ri(0,46655).toString(36);
/* ---- v1.63 save hardening. Keys are unchanged: pixelPigskin.idx, pixelPigskin.s.<id> and the old pixelPigskin.v1 migration.
   New side keys per slot: <key>.bak (the previous good value) and <key>.next (staging, removed after use). ---- */
const SAVE_VERSION=1,SAVE_GAP=1000;
const MIGRATIONS=[d=>d];                      /* MIGRATIONS[v] upgrades a version-v save to v+1; v0 -> v1 only adds `sv`, every field is kept */
function migrate(d){if(!d||typeof d!=='object')return d;let v=+d.sv||0;
 while(v<SAVE_VERSION){const f=MIGRATIONS[v];if(f)d=f(d)||d;v++;d.sv=v}
 return d}
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){return false}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch(e){}};
const parseSave=t=>{try{const d=JSON.parse(t);return d&&typeof d==='object'&&!Array.isArray(d)?d:null}catch(e){return null}};
/* small non-blocking notice (shown inside #app so it follows the rotation, never takes clicks) */
let noteEl=null,noteT=0;
function notice(t){try{const host=document.getElementById('app')||document.body;
 if(!noteEl){noteEl=document.createElement('div');noteEl.id='saveNote';noteEl.setAttribute('role','status');
  noteEl.style.cssText='position:absolute;left:50%;bottom:.8em;transform:translateX(-50%);z-index:99;pointer-events:none;background:rgba(8,12,24,.92);color:#ffd400;border:.15em solid #2e4170;padding:.5em .9em;font-size:.7em;white-space:nowrap;opacity:0;transition:opacity .25s'}
 if(noteEl.parentNode!==host)host.appendChild(noteEl);
 noteEl.textContent=t;noteEl.style.opacity='1';clearTimeout(noteT);noteT=setTimeout(()=>{noteEl.style.opacity='0'},2800)}catch(e){}}
/* the slot index; if it exists but is unreadable, rebuild it from the slots themselves instead of starting empty */
function rebuildIdx(){const out=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);
  if(k&&k.indexOf(SLOT)===0&&!/\.(bak|next)$/.test(k)){const d=parseSave(lsGet(k));if(d){if(!d.id)d.id=k.slice(SLOT.length);out.push(slotInfo(d))}}}}catch(e){}
 out.sort((a,b)=>(b.upd||0)-(a.upd||0));wrIdx(out);return out}
const rdIdx=()=>{const t=lsGet(IDX);if(t==null)return[];try{const a=JSON.parse(t);if(Array.isArray(a))return a}catch(e){}return rebuildIdx()};
const wrIdx=a=>lsSet(IDX,JSON.stringify(a));
const slotInfo=s=>({id:s.id,name:s.lg?s.lg.name:s.name,team:s.name,fmt:s.lg?lgCfg(s.lg).tag:'CLASSIC 8 GAMES',season:s.season,w:s.w,l:s.l,t:s.t,champs:s.champs||0,upd:Date.now()});
/* write one slot safely: stage in .next and read it back, then rotate the old good value into .bak, then write the real key */
function writeSlot(o){
 const key=SLOT+o.id,nx=key+'.next';let json;
 o.sv=Math.max(+o.sv||0,SAVE_VERSION);
 try{json=JSON.stringify(o)}catch(e){return false}
 if(!lsSet(nx,json)){lsDel(nx);return false}
 const back=lsGet(nx),chk=parseSave(back);
 lsDel(nx);                                              /* staged copy is no longer needed, frees quota before the next writes */
 if(back!==json||!chk||chk.id!==o.id)return false;
 const cur=lsGet(key);
 if(cur&&parseSave(cur))lsSet(key+'.bak',cur);           /* only a good value becomes the backup; a failed backup write is not fatal */
 if(!lsSet(key,json))return false;
 const ix=rdIdx(),k=ix.findIndex(e=>e.id===o.id);
 if(k<0)ix.unshift(slotInfo(o));else ix[k]=slotInfo(o);
 return wrIdx(ix)}
/* save() is debounced per slot: the first call writes now, further calls inside SAVE_GAP are merged into one trailing write */
const PEND={},LASTW={};let saveTimer=0;
function flushSlot(id){const o=PEND[id];if(!o)return true;delete PEND[id];LASTW[id]=Date.now();
 const ok=writeSlot(o);if(!ok)notice("COULDN'T SAVE");return ok}
function saveTick(){saveTimer=0;const now=Date.now();let next=0;
 for(const id of Object.keys(PEND)){const w=(LASTW[id]||0)+SAVE_GAP-now;if(w<=0)flushSlot(id);else next=next?Math.min(next,w):w}
 if(next)saveTimer=setTimeout(saveTick,next)}
function save(){if(!S)return;if(!S.id)S.id=newId();const id=S.id;PEND[id]=S;
 const w=(LASTW[id]||0)+SAVE_GAP-Date.now();
 if(w<=0)flushSlot(id);else if(!saveTimer)saveTimer=setTimeout(saveTick,w)}
/* write everything pending right now (page hiding: no time to wait) and the active game too */
function saveNow(){if(S){if(!S.id)S.id=newId();PEND[S.id]=S}clearTimeout(saveTimer);saveTimer=0;Object.keys(PEND).forEach(flushSlot)}
function loadSlot(id){
 if(PEND[id])flushSlot(id);                              /* a read must see the latest edit even if its write was merged */
 const key=SLOT+id;let raw=lsGet(key),d=parseSave(raw),restored=false;
 if(!d){const b=lsGet(key+'.bak'),bd=parseSave(b);if(bd){d=bd;raw=b;restored=true}}
 if(!d)return null;
 try{d=migrate(d)}catch(e){return null}
 if(restored){lsSet(key,raw);notice('RESTORED FROM BACKUP')}
 return d}
function delSlot(id){delete PEND[id];[SLOT+id,SLOT+id+'.bak',SLOT+id+'.next'].forEach(lsDel);wrIdx(rdIdx().filter(e=>e.id!==id))}
let PERSISTED=null;
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().then(r=>{PERSISTED=r;console.log('[pixelPigskin] storage.persist() ->',r)},e=>console.log('[pixelPigskin] storage.persist() failed',e))}catch(e){}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveNow()});
addEventListener('pagehide',saveNow);
function saveInfo(){const ix=rdIdx(),b={},enc=typeof TextEncoder!=='undefined'?new TextEncoder():null;
 ix.forEach(e=>{const v=lsGet(SLOT+e.id);b[e.id]=v?(enc?enc.encode(v).length:v.length):0});
 return{version:SAVE_VERSION,slotCount:ix.length,bytesPerSlot:b,persisted:PERSISTED}}
queueMicrotask(()=>{try{if(window.__pp)window.__pp.saveInfo=saveInfo}catch(e){}});   /* window.__pp is assigned later in the same script, so attach after it runs */
function migrateOld(){try{const o=localStorage.getItem(OLDKEY);if(o&&!localStorage.getItem('pixelPigskin.migrated')){const s=JSON.parse(o);s.id=newId();localStorage.setItem(SLOT+s.id,JSON.stringify(s));const ix=rdIdx();ix.push(slotInfo(s));wrIdx(ix);localStorage.setItem('pixelPigskin.migrated','1')}}catch(e){}}
const nm=()=>pick(FN)+'. '+pick(LN);
let AC=null,muted=false;
function sfx(n){if(muted)return;try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C()}
 const T={snap:[[200,.05]],throw:[[420,.08]],catch:[[660,.06],[880,.08]],tackle:[[110,.12,'sawtooth']],td:[[523,.1],[659,.1],[784,.25]],bad:[[160,.25,'square']],juke:[[740,.05]]}[n]||[];
 let t=AC.currentTime;for(const[f,d,ty]of T){const o=AC.createOscillator(),g=AC.createGain();o.type=ty||'square';o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d}}catch(e){}}

/* ---------- franchise / season ---------- */
function mkOpp(name,lvl){const f=()=>clamp(Math.round((lvl+rnd(-1,1.3))*10)/10,2,9.8);let c;do{c=ri(0,7)}while(c===S.ci);return{name,off:f(),def:f(),ci:c}}
function genSched(season){const n=shuffle(OPPN.slice()),b=3+(season-1)*.5;return Array.from({length:8},(_,i)=>mkOpp(n[i],b+i*.2))}
function genPO(){const n=shuffle(OPPN.slice()),b=3+(S.season-1)*.5+2.2;return[mkOpp(n[0],b),mkOpp(n[1],b+.8)]}
function newFranchise(name,c){S={name:name||'PIXEL PIGSKINS',ci:c,season:1,week:0,w:0,l:0,t:0,credits:3,r:{qb:4,wr:4,rb:4,ol:4,def:4,k:4},names:{qb:nm(),rb:nm(),wr:[nm(),nm(),nm()]},phase:'reg',round:0,over:null,champs:0,qLen:90,last:''};S.sched=genSched(1);save()}
const myC=()=>S.lg?S.lg.teams[S.lg.me].col:(S.col||COLORS[S.ci]);
const siteTxt=h=>h===true?'HOME':h===false?'AWAY':'NEUTRAL SITE';
const homeOf=o=>S.lg?o.home:S.phase==='reg'?S.week%2===0:S.round===0?true:null; /* classic: home on even weeks, the semifinal at home, the final neutral */
const nextOpp=()=>S.lg?lgNextOpp():S.phase==='reg'?S.sched[S.week]:S.po[S.round];
const nextLabel=()=>S.lg?lgLabel():S.phase==='reg'?'WEEK '+(S.week+1)+' OF 8':(S.round?'CHAMPIONSHIP':'SEMIFINAL');
const upCost=r=>Math.ceil(r*.7);
const pips=(v,n)=>'<span class="pips">'+Array.from({length:n||10},(_,i)=>'<s class="'+(i<Math.round(v)?'f':'')+'"></s>').join('')+'</span>';
function show(id){['menu','hub','post','season','stand','lock','half','roster','exh','pd','pcs'].forEach(s=>$(s).classList.toggle('on',s===id))}

function renderHub(){
 if(S.lg)return lgHub();
 const o=nextOpp(),oc=COLORS[o.ci];
 $('hub').innerHTML=`<div class="sm">${S.name} - SEASON ${S.season} - RECORD ${S.w}-${S.l}${S.t?'-'+S.t:''}${S.champs?' - TITLES '+S.champs:''}</div>
 <div class="cols"><div class="card"><h3>${nextLabel()} - ${siteTxt(homeOf(o))}</h3><div class="big" style="color:${oc.c}">${o.name}</div>
 <div class="up"><b>OFFENSE</b>${pips(o.off)}</div><div class="up"><b>DEFENSE</b>${pips(o.def)}</div>
 <p style="margin-top:.8em">${S.last?'LAST: '+S.last:'FIRST GAME OF THE SEASON'}</p></div>
 <div class="card"><h3>COACH ROOM - CREDITS ${S.credits}</h3>${RK.map(k=>{const r=S.r[k],mx=r>=10;return`<div class="up"><b>${RL[k]}</b>${pips(r)}<button class="btn xs" data-up="${k}" ${mx||S.credits<upCost(r)?'disabled':''}>${mx?'MAX':'+'+upCost(r)}</button></div>`}).join('')}</div></div>
 <div class="row"><span class="sm">DRIVE:</span><button class="btn xs ${S.flip!==false?'alt':''}" data-dir="0">RIGHT &gt;</button><button class="btn xs ${S.flip!==false?'':'alt'}" data-dir="1">&lt; LEFT</button><span class="sm">LEVEL:</span><button class="btn xs alt" data-dl="-1">-</button><span class="sm">${DIFF()} ${dName()}</span><button class="btn xs alt" data-dl="1">+</button><span class="sm">QUARTER:</span>${[60,90,150].map(q=>`<button class="btn xs ${S.qLen===q?'':'alt'}" data-q="${q}">${q}S</button>`).join('')}<button class="btn" data-act="play">PLAY GAME</button><button class="btn xs alt" data-act="exh">EXHIBITION</button><button class="btn xs alt" data-act="roster">ROSTER</button><button class="btn xs alt" data-act="designer">PLAYBOOK</button><button class="btn xs alt" data-act="menu">MENU</button></div>`;
 show('hub')}
/* ---------- exhibition game (v1.52): one game against any opponent, nothing counts ---------- */
let EXH=null;const EXS={team:null,name:null,lvl:5,site:true};

/* ----- the schedule: 17 rounds, in each of them all 32 teams play ----- */
function lgMatchSame(base,used){
 const ids=shuffle(Array.from({length:16},(_,i)=>base+i)),out=[];
 const go=rest=>{if(!rest.length)return true;const a=rest[0];for(const b of shuffle(rest.slice(1))){const k=a<b?a*32+b:b*32+a;if(used.has(k))continue;out.push([a,b]);if(go(rest.filter(x=>x!==a&&x!==b)))return true;out.pop()}return false};
 return go(ids)?out:null}
function lgMatchCross(used){
 const A=shuffle(Array.from({length:16},(_,i)=>i)),B=shuffle(Array.from({length:16},(_,i)=>16+i)),out=[],taken=new Set();
 const go=i=>{if(i===16)return true;const a=A[i];for(const b of shuffle(B.slice())){if(taken.has(b)||used.has(a*32+b))continue;taken.add(b);out.push([a,b]);if(go(i+1))return true;out.pop();taken.delete(b)}return false};
 return go(0)?out:null}
function lgTrySched(){
 const used=new Set(),rounds=[],key=(a,b)=>a<b?a*32+b:b*32+a;
 for(const m of[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]])for(let rep=0;rep<2;rep++){
  const r=[];for(let d=0;d<8;d++)for(const[a,b]of m)r.push([d*4+a,d*4+b]);rounds.push(r)}
 for(const r of rounds)for(const[a,b]of r)used.add(key(a,b));
 for(let k=0;k<6;k++){const r=[];for(let c=0;c<2;c++){const m=lgMatchSame(c*16,used);if(!m)return null;r.push(...m)}for(const[a,b]of r)used.add(key(a,b));rounds.push(r)}
 for(let k=0;k<5;k++){const m=lgMatchCross(used);if(!m)return null;for(const[a,b]of m)used.add(key(a,b));rounds.push(m)}
 return shuffle(rounds)}
/* v1.63 college schedule: 9 rounds of conference round-robin (circle method inside each conference of 10) + 3 rounds of
   non-conference games (the 6 conferences are paired off 3 different ways, teams matched at random inside each pairing) */
function lgSchedCol(c){
 const pc=c.per,rounds=[],cl=[];
 for(let k=0;k<c.nc;k++)cl.push(shuffle(Array.from({length:pc},(_,i)=>k*pc+i)));
 for(let r=0;r<pc-1;r++){const rd=[];
  for(let k=0;k<c.nc;k++){const a=cl[k];for(let i=0;i<pc/2;i++)rd.push([a[i],a[pc-1-i]]);cl[k]=[a[0],a[pc-1],...a.slice(1,pc-1)]}
  rounds.push(rd)}
 const co=shuffle(Array.from({length:c.nc},(_,i)=>i)),cr=[];
 for(let r=0;r<c.nc-1;r++){const rd=[];for(let i=0;i<c.nc/2;i++){const a=co[i],b=co[c.nc-1-i];rd.push([a,b])}cr.push(rd);co.splice(1,0,co.pop())}
 for(const rd of shuffle(cr).slice(0,c.games-(pc-1))){const g=[];
  for(const[a,b]of rd){const A=shuffle(Array.from({length:pc},(_,i)=>a*pc+i)),B=shuffle(Array.from({length:pc},(_,i)=>b*pc+i));for(let i=0;i<pc;i++)g.push([A[i],B[i]])}
  rounds.push(g)}
 return shuffle(rounds)}
/* v1.56: in every pair of a round the first team is the home team. Each team gets 8 or 9 home games and division rivals play once at each park. */
function lgOrient(s,c){c=c||LGF.NFL;const hc=new Array(lgN(c)).fill(0),seen={},hi=Math.ceil(c.games/2),lo=Math.floor(c.games/2);
 for(const rd of s)for(const g of rd){let[a,b]=g;const k=Math.min(a,b)+'-'+Math.max(a,b);let h;
  if(seen[k]!=null)h=seen[k]===a?b:a;else h=hc[a]!==hc[b]?(hc[a]<hc[b]?a:b):(Math.random()<.5?a:b);
  seen[k]=h;hc[h]++;g[0]=h;g[1]=h===a?b:a}
 /* balance: flip single (non-division) games from a team with too many home games to an opponent with fewer */
 const cnt={};for(const rd of s)for(const[a,b]of rd){const k=Math.min(a,b)+'-'+Math.max(a,b);cnt[k]=(cnt[k]||0)+1}
 for(let it=0;it<2000;it++){let moved=false;
  for(const rd of s)for(const g of rd){const k=Math.min(g[0],g[1])+'-'+Math.max(g[0],g[1]);if(cnt[k]>1)continue;
   if(hc[g[0]]-hc[g[1]]>=2||(hc[g[0]]>=hi&&hc[g[1]]<lo&&hc[g[0]]>hc[g[1]])){hc[g[0]]--;hc[g[1]]++;g.reverse();moved=true}}
  if(!moved)break}
 return s}
const lgHomeWk=w=>{const L=LG();return L.sched[w].some(g=>g[0]===L.me)};
function lgSchedule(L){const c=lgCfg(L),s=c.id==='COL'?lgSchedCol(c):lgSchedule0();return lgOrient(s,c)}
function lgSchedule0(){for(let i=0;i<80;i++){const r=lgTrySched();if(r)return r}
 /* fallback that cannot fail: plain rotation (should never be needed) */
 return Array.from({length:17},(_,r)=>Array.from({length:16},(_,i)=>[i,16+((i+r)%16)]))}
function lgOpp(w,id){for(const[a,b]of LG().sched[w]){if(a===id)return b;if(b===id)return a}return -1}
const lgKind=(a,b)=>{const L=LG(),t=L.teams,c=lgCfg(L);return t[a].conf!==t[b].conf?(c.nc>2?'NON-CONFERENCE':'INTERCONFERENCE'):c.dv>1&&t[a].div===t[b].div?'DIVISION RIVAL':'CONFERENCE'};

/* ----- ratings, games and standings ----- */
function lgRt(id){const L=LG(),R=S.r;if(id!==L.me)return L.teams[id];const o=RO(),q=(o.qb.arm+o.qb.acc)/2,rc=[...o.wr,o.te].reduce((a,x)=>a+x.spd+x.cat,0)/8;return{off:(q+rc+R.rb+R.ol)/4,def:R.def}}
function lgSim(a,b,po,hfa){ /* hfa: true = a is the home team, false = b is, null/undefined = neutral (v1.56) */
 const A=lgRt(a),B=lgRt(b),mu=(o,d)=>clamp(22+(o-d)*2.4,6,40),h=hfa===true?1.2:hfa===false?-1.2:0;
 let pa=clamp(Math.round(mu(A.off,B.def)+h+lgGauss()*6),0,56),pb=clamp(Math.round(mu(B.off,A.def)-h+lgGauss()*6),0,56);
 if((po||lgCfg(LG()).noTie)&&pa===pb){if(Math.random()<.5)pa+=3;else pb+=3}
 return[pa,pb]}
function lgRecGame(a,b,pa,pb){const L=LG(),R=L.rec;R[a].pf+=pa;R[a].pa+=pb;R[b].pf+=pb;R[b].pa+=pa;
 if(pa>pb){R[a].w++;R[b].l++}else if(pb>pa){R[b].w++;R[a].l++}else{R[a].t++;R[b].t++}
 if(L.teams[a].conf===L.teams[b].conf){if(pa>pb){R[a].cw=(R[a].cw||0)+1;R[b].cl=(R[b].cl||0)+1}else if(pb>pa){R[b].cw=(R[b].cw||0)+1;R[a].cl=(R[a].cl||0)+1}}}
const lgPct=r=>{const g=r.w+r.l+r.t;return g?(r.w+r.t/2)/g:0};
const lgCP=r=>{const g=(r.cw||0)+(r.cl||0);return g?(r.cw||0)/g:0};
function lgOrder(ids,ov){const R=LG().rec,cf=!ov&&lgCfg(LG()).id==='COL';return ids.slice().sort((a,b)=>(cf?lgCP(R[b])-lgCP(R[a]):0)||lgPct(R[b])-lgPct(R[a])||(R[b].pf-R[b].pa)-(R[a].pf-R[a].pa)||R[b].pf-R[a].pf||a-b)}
const lgDivIds=(c,d,cf)=>{cf=cf||LGC();return Array.from({length:cf.per},(_,i)=>c*cf.per*cf.dv+d*cf.per+i)};
function lgSync(){const r=LG().rec[LG().me];S.w=r.w;S.l=r.l;S.t=r.t}
function lgRank(id){const t=LG().teams[id],o=lgOrder(lgDivIds(t.conf,t.div)).indexOf(id)+1;return o+['TH','ST','ND','RD','TH'][o>3?0:o]}
/* record my game, simulate the other 15 of the week, move on */
function lgFinishWeek(w,mp,op){
 const L=LG(),opp=lgOpp(w,L.me),games=[[L.me,opp,mp,op]];
 lgRecGame(L.me,opp,mp,op);(L.res=L.res||[])[w]=(mp>op?'W ':mp<op?'L ':'T ')+mp+'-'+op;
 for(const[a,b]of L.sched[w]){if(a===L.me||b===L.me)continue;const[pa,pb]=lgSim(a,b,false,true);lgRecGame(a,b,pa,pb);games.push([a,b,pa,pb])}
 L.scores={w:w+1,games};S.week=w+1;lgSync()}

/* ----- playoffs: 7 seeds per conference, seed 1 gets a bye ----- */
function lgSeedPO(){
 const L=LG(),cf=lgCfg(L),seeds=[[],[]];L.seed={};
 if(cf.id==='COL'){
  const champs=lgOrder(Array.from({length:cf.nc},(_,k)=>lgOrder(lgDivIds(k,0,cf))[0]),true);
  const rest=lgOrder(L.teams.map(t=>t.id).filter(i=>!champs.includes(i)),true).slice(0,12-cf.nc);
  const sd=[...champs.slice(0,cf.byes),...lgOrder([...champs.slice(cf.byes),...rest],true)];
  sd.forEach((id,i)=>L.seed[id]=i+1);L.po={seeds:[sd],alive:[sd.slice()],round:0,cc:champs};return}
 for(let c=0;c<2;c++){
  const win=[0,1,2,3].map(d=>lgOrder(lgDivIds(c,d))[0]),ws=lgOrder(win);
  const rest=lgOrder(Array.from({length:16},(_,i)=>c*16+i).filter(i=>!win.includes(i)));
  seeds[c]=[...ws,...rest.slice(0,3)];seeds[c].forEach((id,i)=>L.seed[id]=i+1)}
 L.po={seeds,alive:[seeds[0].slice(),seeds[1].slice()],round:0}}
function lgPoGames(){
 const L=LG(),P=L.po,r=P.round,a=P.alive,o=[];
 if(lgCfg(L).id==='COL'){const x=a[0],n=x.length,k=r===0?4:n/2;for(let i=0;i<k;i++)o.push(r===0?[x[4+i],x[11-i]]:[x[i],x[n-1-i]]);return o}
 if(r===3)o.push([a[0][0],a[1][0]]);
 else for(let c=0;c<2;c++){const x=a[c];if(r===0)o.push([x[1],x[6]],[x[2],x[5]],[x[3],x[4]]);else if(r===1)o.push([x[0],x[3]],[x[1],x[2]]);else o.push([x[0],x[1]])}
 return o}
/* play one whole round; myWin decides my game if I am in it */
function lgPoRound(myWin){
 const L=LG(),P=L.po,cf=lgCfg(L),win=new Set();
 for(const[a,b]of lgPoGames()){
  if(a===L.me||b===L.me)win.add(myWin?L.me:(a===L.me?b:a));
  else{const[pa,pb]=lgSim(a,b,true,P.round<cf.homeRds?true:null);win.add(pa>pb?a:b)}}
 if(P.round===3){L.champ=[...win][0];L.hist.push({s:S.season,id:L.champ})}
 else for(let c=0;c<P.alive.length;c++)P.alive[c]=P.alive[c].filter((i,ix)=>win.has(i)||(P.round===0&&ix<cf.byes)).sort((x,y)=>L.seed[x]-L.seed[y])
 P.round++}
function lgSimRestPo(){while(LG().po.round<=3)lgPoRound(false)}
function lgEndRegular(){
 const L=LG();lgSeedPO();
 if(!L.po.seeds.some(s=>s.includes(L.me))){lgSimRestPo();S.over='missed';return}
 S.phase='playoff';
 if(L.po.alive.some(x=>{const k=x.indexOf(L.me);return k>=0&&k<lgCfg(L).byes}))lgPoRound(false);          /* a bye seed: the rest of round 1 is simulated */
 S.round=L.po.round}

/* ----- hooks used by the game ----- */
function lgNextOpp(){
 const L=LG();let id;
 if(S.phase==='reg')id=lgOpp(S.week,L.me);
 else{const g=lgPoGames().find(g=>g.includes(L.me));id=g[0]===L.me?g[1]:g[0]}
 const t=L.teams[id];let home;
 if(S.phase==='reg')home=lgHomeWk(S.week);else{const g=lgPoGames().find(g=>g.includes(L.me));home=L.po.round>=lgCfg(L).homeRds?null:g[0]===L.me}
 return{name:t.name,off:t.off,def:t.def,col:t.col,uni:lgUni(t),id,home}}
const lgLabel=()=>S.phase==='reg'?'WEEK '+(S.week+1)+' OF '+LGC().games:LGC().rnd[LG().po.round];
function lgAfterGame(win,tie,cr,mp,op){
 const L=LG();
 if(S.phase==='reg'){lgFinishWeek(S.week,mp,op);if(S.week>=LGC().games)lgEndRegular()}
 else{
  const final=L.po.round===3;lgPoRound(win);
  if(win){if(final){S.over='champ';S.champs++;cr+=4}else S.round=L.po.round}
  else{S.over='elim';lgSimRestPo()}}

function lgSimMine(){
 const L=LG(),po=S.phase==='playoff',o=lgNextOpp(),lbl=lgLabel();
 const[mp,op]=lgSim(L.me,o.id,po,o.home===true?true:o.home===false?false:null),win=mp>op,tie=mp===op&&!po;

 cr=lgAfterGame(win,tie,cr,mp,op);
 S.last=(win?'W ':tie?'T ':'L ')+mp+'-'+op+' VS '+o.name+' (SIM)';save();
 $('post').innerHTML=`<div class="sm">${lbl} - SIMULATED</div><h1 style="font-size:2em;${win?'color:#4ee08a;text-shadow:none':''}" class="${win?'win':tie?'':'lose'}">${win?'VICTORY!':tie?'TIE GAME':'DEFEAT'}</h1>
 <div style="font-size:1.4em">${S.name} ${mp} - ${op} ${o.name}</div><p style="color:#ffd400">+${cr} COACH CREDITS EARNED</p><button class="btn" id="bPostGo">CONTINUE</button>`;
 $('bPostGo').onclick=()=>{if(S.over)showSeasonEnd();else renderHub()};show('post')}
function lgNewSeason(){
 const L=LG();S.season++;
 for(const t of L.teams){const m=3.7+.25*(S.season-1);t.off=clamp(Math.round((t.off*.8+m*.2+lgGauss()*.5)*10)/10,2,9.4);t.def=clamp(Math.round((t.def*.8+m*.2+lgGauss()*.5)*10)/10,2,9.4)}
 L.ho=1;L.res=[];L.rec=lgBlank(L);L.sched=lgSchedule(L);L.scores=null;L.po=null;L.seed={};L.champ=null;
 S.week=0;S.w=S.l=S.t=0;S.phase='reg';S.round=0;S.over=null;S.credits+=3;S.last='';save();renderHub()}

   x,y are the alignment (x in yards from the line of scrimmage, negative = behind it; y is the
   field width 0..40). t is a route type from the route tree, d its depth, f = 1 flips the break

   routePath(spec,x,y) turns a spec into game-ready points, the hook for play calling later. */
const RT=[
 {t:'flat',n:1,l:'FLAT',d:10},{t:'slant',n:2,l:'SLANT',d:9},{t:'comeback',n:3,l:'COMEBACK',d:14},

 {t:'corner',n:7,l:'CORNER',d:12},{t:'post',n:8,l:'POST',d:12},{t:'go',n:9,l:'GO',d:22},

/* route tree -> points. Break direction: "outside" is toward the nearest sideline, FLIP reverses it */
function routePath(sp,x,y){

 const add=(dx,dy)=>{px+=dx;py=clamp(py+dy,2,38);pts.push({x:px,y:py})};
 switch(sp.t){
  case'go':add(D,0);break;
  case'flat':add(1.5,0);add(1.5,o*D);break;
  case'slant':add(2,0);add(D*.8,-o*D*.5);break;
  case'hitch':add(D,0);add(-1.5,0);cont=false;break;
  case'curl':add(D,0);add(-3.5,-o*1.5);cont=false;break;
  case'comeback':add(D,0);add(-4.5,o*3);cont=false;break;
  case'out':add(D,0);add(0,o*8);break;
  case'in':add(D,0);add(0,-o*12);break;
  case'corner':add(D,0);add(8,o*9);break;
  case'post':add(D,0);add(10,-o*6);break;

 if(r.cont&&P.length>1){const x=e.x+vx*left,y=clamp(e.y+vy*left,1.5,38.5);return{x:Math.min(x,25.5),y,m:x<25.5?1:0,vx}}

 const two=d.hi>=2?1:0;let s=0;
 if(c.togo>=8)s+=.8*two+.1*Z-1*R;else if(c.togo<=3)s+=.6*R+.3*M-.8*two;
 if(c.los>=88)s+=.4*M-.6*two+.3*R;

function pickDef(){
 if(DEFFORCE)return DEFD.find(d=>d.id===DEFFORCE)||pickWeighted();

 const c={togo:Math.max(0,G.fd-G.los),los:G.los,depth:playDepth()};
 const cand=DEFD.map(d=>({d,s:defScore(d,c)+Math.random()*.3})).sort((a,b)=>b.s-a.s);
 if(k>0){if(Math.random()<Math.min(.75,k*.15))return cand[Math.random()<.7?0:1].d}
 else if(Math.random()<-k*.12)return cand[cand.length-1-(Math.random()<.5?1:0)].d; /* an easy defense sometimes makes a bad call */

/* DISGUISE: before the snap the defense lines up in a "look" (the alignment of another scheme) and at the
   snap the defenders rotate into the scheme they really play (G.def). Roughly half the snaps are disguised.
   LOOKS lists believable looks for each real scheme: two-high shells rotate into one-high and the reverse. */
const DISGUISE=.5;
/* looks are always a plain base shell. A two-high real defense (hi 2) usually shows a one-high look and the
   reverse; blitzes, man and zero schemes show a base shell too, so pressure comes from a normal-looking front */
const SHELLS=['c1','c3','t2','c4','c2'];
function pickLook(real){
 if(LOOKFORCE==='none')return real;
 if(real.db.some(s=>!s.as))return real;   /* a back who rushes is already at linebacker depth: no disguise */
 if(LOOKFORCE){const f=DEFD.find(d=>d.id===LOOKFORCE);return f||real}
 if(Math.random()>=dDisg())return real;
 const hi=id=>DEFD.find(d=>d.id===id).hi>=2,rh=real.hi>=2;
 const opp=SHELLS.filter(id=>id!==real.id&&hi(id)!==rh),any=SHELLS.filter(id=>id!==real.id);

function alignDef(){

 const put=(d,a)=>{const q=a(l,G.recs);d.x=d.x0=cl(q.x);d.y=d.y0=clamp(q.y,1.5,38.5);d.vx=d.vy=0};

/* hand out the assignments at the snap of a pass */
function assignDef(){

 D.lb.forEach((s,i)=>go(G.lb[i],s.as));D.db.forEach((s,i)=>go(G.db[i],s.as));
 /* v1.46: if no defender is on the RB, the linebacker closest to him drops his zone and covers him man to man */
 const rb=G.recs[3];
 if(!G.cover.some(c=>c[1]===rb)){let best=null,bd=99;for(const z of G.zone){if(!G.lb.includes(z[0]))continue;const q=Math.abs(z[0].y-rb.y);if(q<bd){bd=q;best=z}}
  if(best){G.zone.splice(G.zone.indexOf(best),1);G.cover.push([best[0],rb])}}
 /* v1.62: the tight end gets a defender too. Measured before: he was the open man twice as often as a wide receiver (49% vs about 24% more than 4.5 yards from anyone, 70 to 84% against the blitzing schemes) because no scheme covers him man to man. The nearest linebacker who is in a zone drops it and covers him; if every linebacker is rushing or on the RB, the nearest blitzer comes off the rush (as long as 5 or more still rush) */

 if(!G.cover.some(c=>c[1]===te)){let best=null,bd=99;
  for(const z of G.zone){if(!G.lb.includes(z[0]))continue;const q=Math.abs(z[0].y-te.y);if(q<bd){bd=q;best=z}}
  if(best){G.zone.splice(G.zone.indexOf(best),1);G.cover.push([best[0],te])}
  else{let bl=null,b2=99;for(const lb of G.lb)if(G.rush.includes(lb)){const q=Math.abs(lb.y-te.y);if(q<b2){b2=q;bl=lb}}
   if(bl&&G.rush.length>=5){G.rush.splice(G.rush.indexOf(bl),1);G.cover.push([bl,te])}}}}
