const LNK={ad:null,adDb:null,test:null,w:null,pp:null,busy:false,fun:false,sure:null,fl:null};   /* LNK.test = {ad, uid}: the tests hand in an adapter (HQ's in-memory store or the emulator) and a uid */
const lnPath=LNC.PATH;
const lnHostOK=()=>!!LNK.test||cgHostOK();
const lnKind=e=>e&&e.cgKind?e.cgKind:LNC.classify(e);
function lnMsg(e){const k=lnKind(e);
 if(e&&e.cloud&&e.kind!=='other'&&e.kind!=='net'&&e.kind!=='denied'&&e.message)return String(e.message).replace(/^hq: /,'').toUpperCase();
 return k==='denied'?'THE CLOUD REFUSED THIS. THE RULES FOR LINKED LEAGUES MAY NOT BE PUBLISHED YET.':k==='quota'?'THE FREE DAILY LIMIT OF THE CLOUD WAS REACHED. TRY AGAIN TOMORROW.':k==='net'?'NO CONNECTION. TRY AGAIN WHEN YOU ARE ONLINE.':'THE CLOUD REPORTED A PROBLEM. TRY AGAIN LATER.'}
/* the connection: the real SDK through the game's own loader and anonymous sign-in (each step has its 10 s limit), or the adapter a test handed in */
async function lnConn(){
 if(LNK.test)return{ad:LNK.test.ad,uid:LNK.test.uid};
 if(!cgHostOK())throw{cgKind:'net'};
 const s=await cgT(cgLoad()),uid=await cgT(cgUid(s));
 if(!LNK.ad||LNK.adDb!==s.db){const a=LNC.makeSdkAdapter(s.X,s.db),lim=f=>(...x)=>cgT(f(...x));
  LNK.ad={get:lim(a.get),list:lim(a.list),set:lim(a.set),update:lim(a.update),del:lim(a.del),batch:lim(a.batch),transaction:a.transaction,onSnapshot:a.onSnapshot};LNK.adDb=s.db}
 return{ad:LNK.ad,uid}}
const lnMetaOf=m=>({season:m.season,wk:m.wk,ph:m.ph,ovr:(m.ovr||[]).slice(),hold:!!m.hold,nm:m.nm,u:m.updatedAt||0});
const lnClock=ms=>{const d=new Date(ms);return isFinite(d)&&ms?cgP2(d.getHours())+':'+cgP2(d.getMinutes()):'NEVER'};
const lnNG=L=>L.sch.length;
const lnWkNo=(L,n)=>n.kind==='reg'?n.week:100+n.round;      /* the number in a week document's key: a regular week is its own number, the semifinals 100, the final 101 */

/* ---------- the week state of the game, worked out from the league record (nothing in the record is changed) ---------- */
function lnDerive(s){
 const L=s.std,me=s.stm|0,n=STD.nextGames(L),nG=lnNG(L),k=s.lnk||{cs:L.ssn};   /* a league that left the link counts no title again */
 s.season=L.ssn;
 if(n.kind==='reg'){s.phase='reg';s.week=L.wk;s.round=0;s.over=null}
 else{
  const seeds=n.kind==='po'?n.seeds:L.po.seeds;s.week=nG;
  if(n.kind==='done')s.over=L.po.ch===me?'champ':seeds.includes(me)?'elim':'missed';
  else if(!seeds.includes(me)){s.phase='reg';s.round=0;s.over='missed'}
  else if(n.round===0){s.phase='playoff';s.round=0;s.over=null}
  else if(n.pairs[0].includes(me)){s.phase='playoff';s.round=1;s.over=null}
  else{s.phase='playoff';s.round=1;s.over='elim'}
  if(s.over==='champ'&&k.cs!==L.ssn){k.cs=L.ssn;s.champs=(s.champs|0)+1}}
 const r=L.teams[me].rc;s.w=r[0];s.l=r[1];s.t=r[2];
 return s}
/* my latest result of this season, as the hub's LAST line */
function lnLast(s){
 const L=s.std,me=s.stm|0;
 for(let i=L.res.length-1;i>=0;i--){const r=L.res[i];if(r.h!==me&&r.a!==me)continue;
  const mp=r.h===me?r.sc[0]:r.sc[1],op=r.h===me?r.sc[1]:r.sc[0],o=L.teams[r.h===me?r.a:r.h].nm;
  return(mp>op?'W ':mp<op?'L ':'T ')+mp+'-'+op+' VS '+o+(r.src==='sim'?' (SIM)':'')}
 return''}
/* the game I play in the league's current week or round: {season, wkNo, gi, opp, home, label} or null (the season is over for me) */
function lnCur(s){
 s=s||S;const L=s.std,me=s.stm|0,n=STD.nextGames(L);
 if(n.kind==='done'||s.over)return null;
 const gi=n.pairs.findIndex(p=>p[0]===me||p[1]===me);if(gi<0)return null;
 const p=n.pairs[gi];
 return{season:L.ssn,wkNo:lnWkNo(L,n),gi:gi,opp:p[0]===me?p[1]:p[0],home:p[0]===me,po:n.kind==='po'}}
const lnSimMarked=(s,c)=>!!(c&&s.lnk&&s.lnk.lastMeta&&(s.lnk.lastMeta.ovr||[]).includes(LNC.ovrKey(c.season,c.wkNo,c.gi)));

/* ---------- JOIN ---------- */
/* a code -> what the join screen shows: the league, the teams with who has them */
async function lnFind(codeRaw){
 const{ad,uid}=await lnConn(),c=await LNC.readCode(ad,codeRaw);
 if(!c)throw LNC.CloudError('bad','There is no league with this code. Check the 6 characters.');
 const mg=await ad.get(lnPath.meta(c.lg));
 if(!mg.exists)throw LNC.CloudError('missing','This league is no longer in the cloud.');
 const meta=mg.data,[sl,ts]=await Promise.all([ad.list(lnPath.slots(c.lg)),Promise.all([0,1,2,3,4,5,6,7].map(i=>ad.get(lnPath.team(c.lg,i))))]);
 const slots={};sl.forEach(d=>{slots[d.id]=d.data});
 const teams=ts.map((g,i)=>({i:i,nm:g.exists?g.data.nm:'TEAM '+(i+1),slot:slots[String(i)]||null,mine:!!(slots[String(i)]&&slots[String(i)].uid===uid)}));
 return{code:c.code,lg:c.lg,meta:meta,teams:teams,uid:uid}}
const lnName=x=>String(x==null?'':x).replace(/\s+/g,' ').trim().toUpperCase().slice(0,40);
const LN_CLOSED='THE COMMISSIONER HAS CLOSED JOINING FOR THIS LEAGUE. ASK HIM TO OPEN IT.';
const lnClosed=m=>!!(m&&m.opts&&m.opts.closed===true);
async function lnJoin(info,idx,nmRaw){
 const{ad,uid}=await lnConn(),nm=lnName(nmRaw);
 if(!nm)throw LNC.CloudError('bad','Type a name for yourself first.');
 const tm=info.teams[idx];if(!tm)throw LNC.CloudError('bad','Pick a team first.');
 const sp=lnPath.slot(info.lg,idx);
 let cur=await ad.get(sp);
 if(cur.exists&&cur.data.uid!==uid)throw LNC.CloudError('taken','Someone just took this team. The list is refreshed.');
 if(!cur.exists){
  /* v2.36: the commissioner can close joining (HQ 0.6: opts.closed === true in the main document). Only a NEW slot is refused; a player who already has his slot never gets here. A fresh read, not the one from lnFind, which may be old. */
  const m0=await ad.get(lnPath.meta(info.lg));if(m0.exists&&lnClosed(m0.data))throw LNC.CloudError('closed',LN_CLOSED);
  try{await ad.set(sp,{uid:uid,g:null,nm:nm,since:Date.now()})}
  catch(e){let g2=null;try{g2=await ad.get(sp)}catch(e2){}
   if(g2&&g2.exists&&g2.data.uid===uid){/* it was written; only the answer was lost */}
   else if(g2&&g2.exists)throw LNC.CloudError('taken','Someone just took this team. The list is refreshed.');
   else{/* the create was refused and there is no slot: when a fresh read says joining is closed, that is the reason */
    let m1=null;try{m1=await ad.get(lnPath.meta(info.lg))}catch(e3){}
    if(m1&&m1.exists&&lnClosed(m1.data))throw LNC.CloudError('closed',LN_CLOSED);
    throw e}}}
 const mg=await ad.get(lnPath.meta(info.lg));if(!mg.exists)throw LNC.CloudError('missing','This league is no longer in the cloud.');
 const meta=mg.data,parts=await LNC.readParts(ad,info.lg,meta,null),L=LNC.buildLeague(meta,parts.teamDocs,parts.weeks,parts.hist),ch=parts.teamDocs[idx];
 const cr0=typeof ch.cr==='number'&&ch.cr>0?ch.cr:(Array.isArray(ch.up)&&ch.up.length?0:3);       /* a fresh team starts with 3 credits like a new local league; a team that already spent is not given them again */
 const s={name:L.teams[idx].nm,ci:0,season:L.ssn,week:0,w:0,l:0,t:0,credits:cr0,phase:'reg',round:0,over:null,champs:0,qLen:90,last:'',std:L,stm:idx,stx:{relief:1},
  lnk:{lg:info.lg,code:info.code,idx:idx,uid:uid,nm:nm,lastMeta:lnMetaOf(meta),lastSync:Date.now(),st:null,queue:[],cs:0,cw:'',note:'',un:Array.isArray(ch.up)?ch.up.length:0}};
 stdSync(s);lnDerive(s);s.last=lnLast(s);
 S=s;saveNow();return s}

/* ---------- PULL ---------- */
/* the weeks and rounds the local record already has, as the week documents readParts keeps in its cache (same keys, same rows) */
function lnWeeksOf(L){
 const w={},nG=lnNG(L);
 L.res.forEach(r=>{const k=LNC.weekKey(L.ssn,r.wk>=nG?100+(r.wk-nG):r.wk);(w[k]=w[k]||{games:[]}).games.push({a:r.h,b:r.a,pa:r.sc[0],pb:r.sc[1],src:r.src})});
 return w}
const lnHistOf=L=>{const h={};L.hist.forEach(x=>{h[x.s]=LNC.histDocOf(x,0)});return h};
function lnFail(s,e){const k=lnKind(e);if(s&&s.lnk&&k!=='net'&&k!=='denied')s.lnk.err=lnMsg(e);return{kind:'err',err:k,msg:lnMsg(e)}}
/* one pull: the meta, the slot, and, when the week or season moved (or force), the league rebuilt from the cloud. Never throws. */
function lnPull(o){
 o=o||{};const s=S;
 if(!s||!s.lnk)return Promise.resolve({kind:'none'});
 if(LNK.pp&&LNK.pp.s===s)return LNK.pp.p;
 const p=(async()=>{
  const k=s.lnk;let c;
  try{c=await lnConn()}catch(e){return lnFail(s,e)}
  const ad=c.ad,uid=c.uid;
  try{
   const mg=o.meta?{exists:true,data:o.meta}:await ad.get(lnPath.meta(k.lg));
   if(!mg.exists){k.st='gone';save();return{kind:'gone'}}
   const meta=mg.data,sg=await ad.get(lnPath.slot(k.lg,k.idx));
   if(!sg.exists){k.st='freed';save();return{kind:'freed'}}
   if(sg.data.uid!==uid){k.st='claimed';save();return{kind:'claimed'}}
   k.st=null;k.err='';
   const L=s.std;let same=meta.season===L.ssn&&meta.wk===L.wk&&meta.ph===L.ph;
   if(same&&L.wk>=lnNG(L)&&meta.updatedAt!==(k.lastMeta||{}).u){   /* the playoffs: the meta's week number does not change between the semifinals and the final, so look for the round's document itself (one read) */
    const n=STD.nextGames(L);
    if(n.kind==='po'){const g=await ad.get(lnPath.week(k.lg,L.ssn,lnWkNo(L,n)));if(g.exists)same=false}}
   if(same&&!o.force){

    k.lastMeta=lnMetaOf(meta);k.lastSync=Date.now();save();return{kind:'same'}}
   const seasonMoved=meta.season!==L.ssn,old={season:L.ssn,wk:L.wk,ph:L.ph},res0=L.res.length;
   const cache={weeks:seasonMoved?{}:lnWeeksOf(L),hist:lnHistOf(L)};

/* the rebuilt league replaces the local one. A season change means the commissioner ran the offseason: the local offseason is never run in a linked league. */
function lnTake(s,nL,meta,old,seasonMoved,chunk){
 const k=s.lnk,ch0=s.champs|0;
 k.note='';
 if(seasonMoved){s.credits+=3;lnSeasonMoved(s)}          /* the 3 credits the local offseason would have given; unsent results and upgrades of the old season are dropped here */
 s.std=nL;
 k.un=chunk&&Array.isArray(chunk.up)?chunk.up.length:0;
 lnReapply(s,chunk);                                       /* my upgrades that are not in the cloud yet go back onto the pulled roster */
 stdSync(s);lnDerive(s);s.last=lnLast(s)||s.last;
 if((s.champs|0)>ch0)s.credits+=4*((s.champs|0)-ch0);      /* the title bonus of a local league, given when the pulled season shows my team as the champion */

const lnNote=(k,t)=>{k.note=(k.note?k.note+' | ':'')+t;if(k.note.length>300)k.note=k.note.slice(0,297)+'...'};
/* a new season: results and upgrades still waiting to be sent belong to the old season and are dropped (credits for the upgrades come back) */
function lnSeasonMoved(s){
 const k=s.lnk,q=k.queue||[];let ups=0,refund=0,subs=0;
 q.forEach(it=>{if(it.k==='up'){ups++;refund+=it.cost|0}else if(it.k==='sub'&&(it.st==='wait'||it.st==='fail'))subs++});
 s.credits+=refund;k.queue=[];
 if(ups)lnNote(k,'NEW SEASON: UPGRADES YOU HAD NOT SENT YET WERE DISCARDED ('+ups+'). '+refund+' CREDITS GIVEN BACK.');
 if(subs)lnNote(k,'NEW SEASON: A RESULT YOU HAD NOT SENT WAS DISCARDED.')}
/* my upgrades that are still queued are put back onto the roster that was just pulled. A line whose player is not at its "from" value any more is stale: the whole purchase is dropped and its credits come back. A line the cloud already has (it was sent, only the answer was lost) is skipped. */
function lnReapply(s,chunk){
 const k=s.lnk,t=s.std.teams[s.stm|0],cu=chunk&&Array.isArray(chunk.up)?chunk.up:[],keep=[];let drop=0,refund=0;
 const same=(a,b)=>a&&b&&a.s===b.s&&a.id===b.id&&a.k===b.k&&a.from===b.from&&a.to===b.to;
 for(const it of k.queue||[]){
  if(it.k!=='up'){keep.push(it);continue}
  let ok=!it.bad&&it.s===s.std.ssn;const todo=[];
  if(ok)for(const ln of it.lines){
   const p=t.ro.find(x=>x.id===ln.id);
   if(!p){ok=false;break}
   if(p.rt[ln.k]===ln.from)todo.push([p,ln]);
   else if(p.rt[ln.k]===ln.to&&cu.some(e=>same(e,ln))){}          /* already in the cloud */
   else{ok=false;break}}
  if(!ok){drop++;refund+=it.cost|0;continue}
  if(!todo.length&&it.lines.length&&it.lines.every(ln=>cu.some(e=>same(e,ln))))continue;      /* sent; nothing is left to do for it */
  todo.forEach(([p,ln])=>{p.rt[ln.k]=ln.to});keep.push(it)}
 k.queue=keep;
 if(drop){s.credits+=refund;lnNote(k,'AN UPGRADE COULD NOT BE KEPT BECAUSE YOUR TEAM CHANGED IN THE CLOUD ('+drop+'). '+refund+' CREDITS GIVEN BACK.')}}
/* after a pull: what the commissioner made of the results I queued. A result that is now in the league is compared with mine; a difference shows the REAL score. */
function lnReconcile(s,seasonMoved){
 const k=s.lnk,L=s.std,me=s.stm|0,nG=lnNG(L),keep=[];
 for(const it of k.queue||[]){
  if(it.k!=='sub'){keep.push(it);continue}
  if(it.s!==L.ssn){continue}
  const wk=it.w>=100?nG+(it.w-100):it.w,r=L.res.find(x=>x.wk===wk&&(x.h===me||x.a===me));
  if(!r){keep.push(it);continue}
  const mp=r.h===me?r.sc[0]:r.sc[1],op=r.h===me?r.sc[1]:r.sc[0],real=mp+'-'+op;
  if(it.st==='sent'||it.st==='wait'||it.st==='fail'){
   if(!(it.pa===mp&&it.pb===op)||it.st!=='sent'){
    lnNote(k,it.st==='sent'?'THE COMMISSIONER\'S RESULT STANDS: '+(it.w>=100?'PLAYOFFS':'WEEK '+(it.w+1))+' WAS '+real+' (YOU SENT '+it.pa+'-'+it.pb+')':'THE COMMISSIONER MOVED ON BEFORE YOUR RESULT WAS SENT. THE REAL RESULT: '+real)}}
  else if(it.st==='void'&&!(it.pa===mp&&it.pb===op))lnNote(k,'THE COMMISSIONER\'S RESULT STANDS: '+(it.w>=100?'PLAYOFFS':'WEEK '+(it.w+1))+' WAS '+real)}
 k.queue=keep}

/* ----- league backup: export / import codes (v1.73). Format: PPSAVE1:<g|r>:<checksum>:<base64url data>, data = JSON, gzipped when the browser can ----- */
const BK_PRE='PPSAVE1:',BK_WEEK=7*864e5,BK_DIS={};
let BK={mode:'',id:null,code:'',items:null,seq:0};
const bkHash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36)};
function bkB64(b){let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function bkUn64(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t),b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b}
const bkCanZip=()=>typeof CompressionStream!=='undefined'&&typeof DecompressionStream!=='undefined'&&typeof Blob!=='undefined'&&typeof Response!=='undefined';
async function bkPipe(bytes,Cls,fmt){return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new Cls(fmt))).arrayBuffer())}
async function bkPack(obj,raw){
 const json=JSON.stringify(obj);let bytes=new TextEncoder().encode(json),flag='r';
 if(!raw&&bkCanZip()){try{bytes=await bkPipe(bytes,CompressionStream,'gzip');flag='g'}catch(e){bytes=new TextEncoder().encode(json);flag='r'}}
 const data=bkB64(bytes);return BK_PRE+flag+':'+bkHash(data)+':'+data}
const bkBad=msg=>({ok:false,msg});
/* does the object look like one of our league saves? (teams, a season, a my-team id) */
function bkShape(d){
 if(!d||typeof d!=='object'||Array.isArray(d))return false;
 try{styFix(d)}catch(e){}   /* v2.37: team style records are normalized or dropped here too */
 if(!(+d.season>=1))return false;
 if(d.std){try{const L=d.std;return!!(L&&typeof L.rs==='number'&&L.rules&&Array.isArray(L.sch)&&L.sch.length===STD_CFG.games&&L.sch.every(x=>Array.isArray(x)&&x.length===4)&&Array.isArray(L.teams)&&L.teams.length===8&&Number.isInteger(d.stm)&&d.stm>=0&&d.stm<8&&(d.stx===undefined||(!!d.stx&&typeof d.stx==='object'&&(d.stx.relief===0||d.stx.relief===1||(d.stx.relief===undefined&&(d.stx.drv===0||d.stx.drv===1)))&&(d.stx.drv===undefined||d.stx.drv===0||d.stx.drv===1)))&&(d.lnk===undefined||lnShape(d))&&typeof d.name==='string'&&(L.dp==='full'?FULL.checkFull(L):STD.checkLeague(L)).length===0&&stdView(d))}catch(e){return false}}   /* v2.23: a Standard league: 8 teams, 23 starters each, valid ratings */
 if(d.lg){const L=d.lg;return!!(L&&Array.isArray(L.teams)&&L.teams.length>=2&&Number.isInteger(L.me)&&L.teams[L.me]&&typeof L.teams[L.me]==='object')}
 return typeof d.name==='string'&&Array.isArray(d.sched)&&!!d.r&&typeof d.r==='object'}
const bkInfo=d=>{const rec=(d.w|0)+'-'+(d.l|0)+(d.t?'-'+(d.t|0):''),L=d.lg||(d.std?stdView(d):null);return{name:String(L?L.name:d.name),team:String(d.name),season:d.season,rec,fmt:L?lgCfg(L).tag:'CLASSIC 8 GAMES'}};
/* text -> {ok,items:[{obj,info}]} or {ok:false,msg}; never touches storage */
async function bkUnpack(text){
 try{
  text=String(text==null?'':text);
  const i=text.indexOf(BK_PRE);
  if(i<0)return bkBad(/PPSAVE\d/.test(text)?'THIS BACKUP CODE IS FROM A DIFFERENT VERSION OF THE GAME.':'THAT IS NOT A PIXEL PIGSKIN BACKUP CODE. IT SHOULD START WITH PPSAVE1:');
  const code=text.slice(i).match(/^\S*/)[0],p=code.split(':');
  if(p.length<4||!p[3])return bkBad('THE CODE IS INCOMPLETE. COPY THE WHOLE CODE AND TRY AGAIN.');
  if(p.length>4||(p[1]!=='g'&&p[1]!=='r')||!/^[A-Za-z0-9_-]+$/.test(p[3]))return bkBad('THE CODE IS DAMAGED. COPY IT AGAIN IN FULL.');
  if(bkHash(p[3])!==p[2])return bkBad('THE CODE WAS CUT OFF OR CHANGED, SO IT DOES NOT MATCH ITS CHECKSUM. COPY IT AGAIN IN FULL.');
  let bytes=bkUn64(p[3]);
  if(p[1]==='g'){if(!bkCanZip())return bkBad('THIS BROWSER CANNOT OPEN COMPRESSED CODES. TRY A NEWER BROWSER.');bytes=await bkPipe(bytes,DecompressionStream,'gzip')}
  const obj=JSON.parse(new TextDecoder().decode(bytes));
  const list=obj&&obj.ppBackup==='all'&&Array.isArray(obj.slots)?obj.slots:[obj];
  if(!list.length)return bkBad('THIS BACKUP HAS NO LEAGUES IN IT.');
  const items=[];
  for(let d of list){
   if(!d||typeof d!=='object')return bkBad('THE BACKUP DATA COULD NOT BE READ.');
   if((+d.sv||0)>SAVE_VERSION)return bkBad('THIS BACKUP WAS MADE BY A NEWER VERSION OF THE GAME. UPDATE THE GAME FIRST.');
   d=migrate(d);
   if(!bkShape(d))return bkBad('THIS CODE OPENED, BUT IT IS NOT A COMPLETE LEAGUE (TEAMS, SEASON OR YOUR TEAM IS MISSING).');
   items.push({obj:d,info:bkInfo(d)})}
  return{ok:true,items}
 }catch(e){return bkBad('THE CODE COULD NOT BE READ. IT MAY BE DAMAGED OR CUT OFF. COPY IT AGAIN IN FULL.')}}

/* import: always new slots with fresh ids, never overwrites; a repeated name gets " (2)", " (3)" ... */
function bkCommit(items){
 const ids=[],names=[];
 try{
  const taken=new Set(rdIdx().map(e=>e.name));
  for(const it of items){
   const d=JSON.parse(JSON.stringify(it.obj));let id,g=0;

   taken.add(n);if(d.std)d.std.nm=n;else if(d.lg)d.lg.name=n;else d.name=n;
   d.id=id;
   if(!writeSlot(d))return{ok:false,msg:"COULDN'T SAVE THE LEAGUE (STORAGE MAY BE FULL). NOTHING EXISTING WAS CHANGED.",ids,names};
   ids.push(id);names.push(n)}

/* ----- CLOUD SAVE (v1.78). Manual only: nothing here runs at startup, the Firebase SDK is loaded when the player taps a cloud button.

   The slot -> code map lives ONLY in localStorage 'pixelPigskin.cloud' (never in a league save, an export code or a report).

const CG_KEY='pixelPigskin.cloud',CG_ALPHA='ABCDEFGHJKMNPQRSTUVWXYZ23456789',CG_TMO=10000,CG_MAX=100000; /* data must be UNDER 100000 characters (the rules) */
const CG={sdk:null,sdkP:null,busy:false,view:'list',pend:null,seq:0};
function cgHostOK(){try{const h=location.hostname;return h==='chipperbaily.github.io'||h==='localhost'}catch(e){return false}}

/* ---- recovery codes: same generator as cloud-test.html. 31-character alphabet (no 0 O 1 I L), 16 characters = about 79 random bits,

function cgMake(){

function cgNorm(t){const s=String(t||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
 if(s.length!==16||[...s].some(c=>!CG_ALPHA.includes(c)))return null;return s.slice(0,4)+'-'+s.slice(4,8)+'-'+s.slice(8,12)+'-'+s.slice(12)}

/* ---- the slot -> code map (separate key) ---- */
function cgRead(){try{const o=JSON.parse(localStorage.getItem(CG_KEY)||'null');if(o&&o.v===1&&o.m&&typeof o.m==='object')return o}catch(e){}return{v:1,m:{}}}
const cgWrite=o=>{try{localStorage.setItem(CG_KEY,JSON.stringify(o));return true}catch(e){return false}};
const cgGet=id=>{const e=cgRead().m[id];return e&&typeof e.c==='string'&&cgNorm(e.c)?e:null};
function cgPut(id,code,up){const o=cgRead();o.m[id]={c:code,u:up};return cgWrite(o)}
function cgDrop(id){const o=cgRead();if(o.m[id]){delete o.m[id];cgWrite(o)}}
const cgWhen=ms=>{const d=new Date(+ms);if(!isFinite(d))return'';return d.toLocaleString([],{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}).toUpperCase()};
const cgP2=n=>String(n).padStart(2,'0');

function cgReportLine(){

 if(!S||!S.id)return'NO LEAGUE LOADED';

 const d=new Date(+e.u);return isFinite(d)?'YES, LAST UPLOADED '+d.getFullYear()+'-'+cgP2(d.getMonth()+1)+'-'+cgP2(d.getDate())+' '+cgP2(d.getHours())+':'+cgP2(d.getMinutes()):'YES'}

/* ---- Firebase, loaded lazily. Every cloud call has its own 10 second limit. A failure never throws out of this file. ---- */
const cgT=(p,ms)=>new Promise((res,rej)=>{const t=setTimeout(()=>rej({cgKind:'net'}),ms||CG_TMO);Promise.resolve(p).then(v=>{clearTimeout(t);res(v)},e=>{clearTimeout(t);rej(e)})});
function cgLoad(){
 if(CG.sdk)return Promise.resolve(CG.sdk);

  try{saveNow()}catch(e){}cgMsg('RESTARTING THE GAME TO TRY AGAIN...',false);setTimeout(()=>{try{location.reload()}catch(e){}},300);return new Promise(()=>{})}

  const base='https://www.gstatic.com/firebasejs/'+CLOUD_SDK+'/';
  CG.sdkP=(async()=>{
   try{await fetch(base+'firebase-app.js',{mode:'no-cors'})}catch(e){throw{cgKind:'net'}} /* probe first: a plain fetch leaves nothing behind when the network is down, so a later retry works */
   let A,F,X;
   try{[A,F,X]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')])}catch(e){CG.stale=true;throw{cgKind:'net'}}
   const app=A.initializeApp(CLOUD_CONFIG),auth=F.getAuth(app),db=X.getFirestore(app);
   try{X.setLogLevel('silent')}catch(e){} /* the SDK's own console messages can contain document paths */
   try{ /* local testing only: ?cloudemu=<firestore port>:<auth port>, honoured on localhost and nowhere else */
    const q=location.hostname==='localhost'?new URLSearchParams(location.search).get('cloudemu'):null;
    if(q){const[fp,ap]=q.split(':');F.connectAuthEmulator(auth,'http://127.0.0.1:'+(+ap||9099),{disableWarnings:true});X.connectFirestoreEmulator(db,'127.0.0.1',+fp||8080)}

async function cgCreate(id){

async function cgUpload(id,code){

async function cgFetch(code){

/* ----- STATS UPLOAD (v2.16). Quiet, no screen, no setting. Every game played by hand (it is in S.gl) is sent ONCE as one document in gameStats:

    u: the anonymous uid, t: server time, s: 1, x: upSpent() when the record was written, or -1}. Never a name, slot id, code, storage key or device detail.
   Device key pixelPigskin.statsq = {v:1,on:1,m:{slotId:{l,s:[sent keys],x:{key:n}}}} (a key = "season:week"). It is NEVER in a save, backup, cloud copy or report (the report shows counts only).
   Runs: after a hand-played game is saved, when a league is opened, when the page becomes visible, when the browser comes back online. Oldest first, at most 10 per run,
   one at a time, 10 s per step (cgWith), a record counts as sent only after the write is confirmed; after a failure nothing for 60 s. Only on the cloud save's hosts and only online;
   anywhere else, or with on=0, NO Firebase request at all. It reuses cgLoad/cgUid/cgWith; it never shows an error and never throws. window.__SQOFF=true switches it off (tests). ----- */
/* v2.26 STATS V2: a game with detail goes out in the new shape {d,v,f,l,u,t,s:2}: d is ONE JSON string (at most 30000 characters; the stored detail is kept under 8000) built when the record is written (sqNote -> sqDetail)
   and kept in the same device key next to x: e.d[key]. Everything about a game goes inside d, so a new stat never changes the rules or the export script. A record WITHOUT detail (older, back-filled, detail lost) goes out in the v2.16
   shape exactly as before. A Standard league (f = "s") sends only games with detail (the v2.16 shape does not know "s"). d holds names of players (cut to 24 characters), no league name, no team name, no slot id, no save text or code. ----- */
const SQ_KEY='pixelPigskin.statsq',SQ_GAP=60000,SQ_MAX=10,SQ_DMAX=8000,SQ_D30=30000;
const SQ={busy:0,next:0,ids:{},slow:{}};

function sqEnt(o,id){let e=o.m[id];if(!e||typeof e!=='object'||Array.isArray(e))e=o.m[id]={};

/* ----- GAME LOG and STATS (v1.84). Every game the player plays by hand adds ONE small record to S.gl (kept inside the league / classic save, so backup codes and
   the cloud copy carry it; it is NOT in REPORT A PROBLEM and NOT in the mid-game snapshot). Records are flat arrays of numbers, newest last, at most GL_MAX.
   Not logged: SIM GAME (lgSimMine never reaches endGame), exhibitions, abandoned games (no endGame), a game left with SAVE AND EXIT (logged when finished after RESUME).
   Record fields (indexes):
    0 season  1 week (1.. regular season, -1.. playoff round 1..)  2 opponent (league: team id, classic: name)  3 home (1 home, 0 away, 2 neutral)
    4 my points  5 their points  6 overtime (0/1)  7 difficulty level  8 game speed step (0..4: SLOWER, SLOW, MEDIUM, FAST, FASTER; v2.30: the old step nearest the 1..10 slider, SPD_STEP in hp.js)  9 CALL YOUR DEFENSE on (0/1)
    10 first downs  11 turnovers  12 sacks taken  13 completions  14 attempts  15 pass yards  16 pass TDs  17 interceptions (13..17 = the passer's line)
    18 rush attempts  19 rush yards  20 rush TDs  21 FG made  22 FG tried
    23..26 top rusher: slot, attempts, yards, TDs   27..30 top receiver: slot, catches, yards, TDs
   Slots: 0 QB 1 RB 2 WR1 3 WR2 4 WR3 5 TE 6 K (so a renamed player keeps his stats; screens show the CURRENT names).

 if(!spdLoaded)spdLoad();
 const sp=SPD_STEP[spdN-1]|0;
 return[S.season|0,wk,opp,G.home===true?1:G.home===false?0:2,n(G.me),n(G.op),G.ot?1:0,DIFF(),sp,dcIsOn()?1:0,

/* ---------- v1.99 PLAY A FRIEND (online exhibition, step 1) ----------

   normal engine, writes the new state + recap in ONE write, and the roles swap whenever the ball changes hands. Nothing here touches leagues, saves, scoring, the game log, backup codes,
   cloud save or the mid-game snapshot: the game runs on a throwaway league (S.sbx) exactly like the v1.92 exhibition. The firebase SDK is only loaded when a button on the
   PLAY A FRIEND card is tapped. Every hook in the rest of the game is guarded by OL.on, so solo play is unchanged.

   st (game state, s = write counter), pk{s,d} (defense pick), rc (latest recap), lv (who left).
   phase meaning: pick = the defense (st.po is the OFFENSE) must pick; play = the pick is in, the offense is playing the snap; pat = offense chooses XP or two; half = halftime shown by st.po. ---------- */

function olMake(){const d=[];while(d.length<5){const b=new Uint8Array(16);crypto.getRandomValues(b);for(const x of b){if(d.length>=5)break;if(!d.length){if(x<243)d.push(1+x%9)}else if(x<250)d.push(x%10)}}return d.join('')} /* no modulo bias: 243 = 27 x 9, 250 = 25 x 10 */

function olKeyGet(){try{const o=JSON.parse(lsGet(OL_KEY)||'null');if(o&&o.v===1&&olNorm(o.c)&&(o.s==='h'||o.s==='g')&&o.x>Date.now())return o;if(o)lsDel(OL_KEY)}catch(e){}return null}

const olKeyDrop=()=>lsDel(OL_KEY);

const olHex=v=>typeof v==='string'&&/^#[0-9a-fA-F]{6}$/.test(v);

function olErr(e){const k=cgKind(e);olMsg(k==='host'?'ONLINE PLAY ONLY WORKS ON THE GAME\'S OWN WEB ADDRESS':e&&e.olText?e.olText:k==='denied'?'THE CLOUD REFUSED THIS. CHECK THE DATE AND TIME ON YOUR DEVICE, THEN TRY AGAIN.':cgNoNet,true)}

  const cur=sn.data(),o=fn(cur);if(o.r)return o;const up=Object.assign({},o.up);if(!o.hb)up.n=cur.n+1;tx.update(ref,up);return{r:'ok'}}),12000)}

   if(r.r==='gone'){olGone();break}

  catch(e){if(cgKind(e)==='denied'){OL.q.shift();olGone();break}olChip(true);await olWaitMs(3000)}}}

function olGone(){if(OL.fin)return;olKeyDrop();OL.q=[];olFin('THIS GAME IS NO LONGER AVAILABLE (IT MAY HAVE EXPIRED).')}
async function olSub(){

  OL.unsub=s.X.onSnapshot(s.X.doc(s.db,'rooms',OL.code),sn=>{if(q!==OL.seq)return;olChip(false);if(sn.exists())olIn(sn.data());else olGone()},()=>{if(q!==OL.seq)return;OL.unsub=null;olChip(true);retry()})
 }catch(e){olChip(true);retry()}}

async function olCreate(){

   const doc={schema:1,created:now,expires:s.X.Timestamp.fromMillis(exp),settings:{lv:XH.diff,dr:!!XH.flip,q:XH.q},teams:{h:me},seats:{h:{u:OL.uid,t:now},g:{u:'',t:0}},n:0,phase:'lobby'};
   const ok=await cgT(s.X.runTransaction(s.db,async tx=>{const sn=await tx.get(ref);if(sn.exists())return false;tx.set(ref,doc);return true}));
   if(ok){olEnter(code,'h',exp,doc);return}}
  throw{cgKind:'net'}

  if(!d||!d.teams||!d.seats||(d.expires&&d.expires.toMillis&&d.expires.toMillis()<Date.now()))throw{olText:'NO GAME WITH THAT CODE, OR IT HAS EXPIRED.'};

  const d=await olFetch(pv.code);OL.pv=null;olEnter(pv.code,'g',d.expires.toMillis(),d)

async function olRejoin(){

  if(!d||!d.seats||!d.seats[k.s]||d.seats[k.s].u!==OL.uid||(d.expires&&d.expires.toMillis()<Date.now())){olKeyDrop();OL.code='';renderHome();olMsg('THAT GAME IS GONE.',true);return}

function olApply(st){
 const me=OL.seat,mh=me==='h';
 G.me=mh?st.h:st.g;G.op=mh?st.g:st.h;G.qs.me=(mh?st.qh:st.qg).slice(0,5);G.qs.op=(mh?st.qg:st.qh).slice(0,5);

function olSt(po){const me=OL.seat,mh=me==='h',a=G.qs.me.slice(0,5),b=G.qs.op.slice(0,5);
 return{s:++OL.s,po,h:mh?G.me:G.op,g:mh?G.op:G.me,qh:mh?a:b,qg:mh?b:a,q:Math.round(G.clock*10)/10,l:Math.round(G.los),d:G.down,f:Math.round(G.fd),hf:G.half?1:0,ot:G.ot?1:0,pt:G.pat?1:0,fp:OL.fp}}

/* ----- routing ----- */
function olRoute(){
 if(OL.rcBusy)return;
 if(lvHold())return; /* v2.12: a live view on screen holds the new state (and its banner) until the play has been drawn, 3 s at most */
 const d=OL.room;if(!d)return;
 if(d.phase==='lobby'){olLobby();return}
 if(d.phase==='over'&&!d.st){olFin(d.lv&&d.lv!==OL.seat?'YOUR FRIEND LEFT.':'');return}

/* ---------- v2.12 LIVE LINK + LIVE VIEW ----------
   One WebRTC link per game between the two phones, set up in the background while the room is still in the lobby (handshake through Firestore rtclink/{code}: 2 writes, no trickle ICE, STUN only).
   The phone with the ball is still the referee: while it plays a snap it sends the position of the 22 players and the ball about 20 times a second on an unreliable data channel (id 0, one 105-byte frame),
   and SNAP / END as JSON on a reliable one (id 1). The DEFENSE phone draws that stream on the real game screen (show(null), render(), the DOM banner) through a ghost object (LV.g: Object.create of the real G, with its own players);
   the real G of the defense phone is never written. If the link is missing, drops, or goes quiet for 1.5 s, the old still frame is shown (nothing else changes). Nothing here is saved or sent anywhere else.
   Frame (little endian): u8 type=1 | u16 seq | u32 host ms | u16 state counter (OL.snap) | 22 x (int16 x*10, int16 y*10) in the order 5 OL, QB, WR1 WR2 WR3 RB TE, 4 DL, 3 LB, 4 DB | ball int16 x*10, y*10, z*10 | u16 clock*10.
   Defender steering later: add a second frame type in lkRxSt/lkEnc below. ---------- */
const LK_BUF=100,LK_N=22,LK_HZ=20,LK_STALE=1500,LK_GIVEUP=25000,LK_HDR=9,LK_LEN=LK_HDR+LK_N*4+6+2;

function lkEnc(ents,ball,clock,s){
 const b=new ArrayBuffer(LK_LEN),v=new DataView(b);

 let o=LK_HDR;for(let i=0;i<LK_N;i++){v.setInt16(o,Math.round(ents[i].x*10),true);v.setInt16(o+2,Math.round(ents[i].y*10),true);o+=4}
 v.setInt16(o,Math.round(ball.x*10),true);v.setInt16(o+2,Math.round(ball.y*10),true);v.setInt16(o+4,Math.round((ball.z||0)*10),true);o+=6;
 v.setUint16(o,Math.max(0,Math.min(65535,Math.round(clock*10))),true);return b}
function lkDec(buf){
 if(!buf||buf.byteLength!==LK_LEN)return null;const v=new DataView(buf);if(v.getUint8(0)!==1)return null;

 const ball=[v.getInt16(o,true)/10,v.getInt16(o+2,true)/10,v.getInt16(o+4,true)/10];o+=6;
 return{seq:v.getUint16(1,true),ht:v.getUint32(3,true),s:v.getUint16(7,true),pos,ball,clock:v.getUint16(o,true)/10}}
/* --- the link --- */
const lkUp=()=>!!(LK.st&&LK.st.readyState==='open'&&LK.ev&&LK.ev.readyState==='open');
function lkPC(){
 const o=window.__ppIce,pc=new RTCPeerConnection({iceServers:Array.isArray(o)?o:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]}); /* window.__ppIce = [] is a test hook (no STUN) */
 const st=pc.createDataChannel('st',{negotiated:true,id:0,ordered:false,maxRetransmits:0}),ev=pc.createDataChannel('ev',{negotiated:true,id:1});
 st.binaryType='arraybuffer';st.onmessage=e=>{try{lkRxSt(e.data)}catch(x){}};ev.onmessage=e=>{try{lkRxEv(e.data)}catch(x){}};
 LK.pc=pc;LK.st=st;LK.ev=ev;return pc}

 try{if(LK.st)LK.st.onmessage=null;if(LK.ev)LK.ev.onmessage=null;if(LK.st)LK.st.close();if(LK.ev)LK.ev.close();if(LK.pc)LK.pc.close()}catch(e){}

 if(LK.code===OL.code||typeof RTCPeerConnection==='undefined'||window.__ppNoLink)return;
 lkClose();LK.code=OL.code;const code=OL.code;
 (OL.seat==='h'?lkHost:lkGuest)(code).catch(()=>{if(LK.code===code)lkClose()});

/* --- the offense phone: stream the snap --- */
function lkEnts(){return[...G.ol,G.qb,...G.recs,...G.dl,...G.lb,...G.db]}
function lkSendSt(){try{if(LK.st&&LK.st.readyState==='open'&&OL.on&&G&&G.online){const e=lkEnts();if(e.length===LK_N)LK.st.send(lkEnc(e,curBall(),G.clock,OL.snap))}}catch(x){}}
function lkEvSend(o){try{if(LK.ev&&LK.ev.readyState==='open')LK.ev.send(JSON.stringify(o))}catch(x){}}
function lkSnapEv(){try{if(!OL.on||!G||!G.online||!lkUp())return;LK.snapOn=true;LK.acc=0;lkEvSend({n:'SNAP',s:OL.snap,t:Math.round(performance.now())});lkSendSt()}catch(x){}} /* called by snap() in p2.js */
function lkTick(dt){if(!LK.snapOn)return;LK.acc+=dt;if(LK.acc<1/LK_HZ)return;LK.acc%=1/LK_HZ;lkSendSt()} /* called by update() in p4.js while G.mode is live (real time, not GAME SPEED) */
function lkEndEv(){try{if(!LK.snapOn)return;LK.snapOn=false;lkSendSt();lkEvSend({n:'END',s:OL.snap,t:Math.round(performance.now())})}catch(x){}} /* called at the top of endPlay() in p3.js */
/* --- the defense phone: receive --- */
function lvReset(s){LV.s=s;LV.snaps=[];LV.offs=[];LV.endT=null;LV.drawnAt=0;LV.holdAt=0;LV.last=0}
function lkRxSt(buf){
 const f=lkDec(buf);if(!f||!OL.on||!G||!G.online)return;
 const d=OL.room,st=d&&d.st;if(!st||d.phase!=='play'||st.po===OL.seat||(st.s&0xffff)!==f.s||LV.deadS===st.s)return; /* only the snap I am watching */

 const last=LV.snaps[LV.snaps.length-1];if(last&&f.ht<=last.ht)return; /* a late or duplicate frame */

function lkRxEv(txt){
 const e=JSON.parse(txt),d=OL.room,st=d&&d.st;if(!e||!OL.on||!st||st.s!==e.s)return;

/* --- the ghost: the same entities the engine has, dressed for the defense phone's view. The offense is the OTHER team (side op: G.opp's uniform, after the v2.09 swap and outline rule), my defenders are side me. Frame of the offense: it drives the same way on both phones (FLIP is one room setting). --- */
function lvGhost(){
 const g=Object.create(G),mkp=(k,i,side,fc)=>{const e=mk(k,0,20);dress(e,side,i);e.fc=fc;return e};
 g.ol=[0,1,2,3,4].map(i=>mkp('OL',i,'op',1));g.qb=mkp('QB',0,'op',1);
 g.recs=['WR','WR','WR','RB','TE'].map((k,i)=>{const e=mkp(k,i,'op',1);e.n=i+1;return e});
 g.dl=[0,1,2,3].map(i=>mkp('DL',i,'me',-1));g.lb=[0,1,2].map(i=>mkp('LB',i,'me',-1));g.db=[0,1,2,3].map(i=>mkp('DB',i,'me',-1));
 g.defs=[...g.dl,...g.lb,...g.db];g.play={phase:'lv'};g.mode='live';g.lv=1;g.lvr=G;g.hold=false;g.bp={x:G.los,y:20,z:0};g.clock=G.clock;return g}
const lvEnts=g=>[...g.ol,g.qb,...g.recs,...g.dl,...g.lb,...g.db];
function lvTag(on){const t=$('lvtag');if(t)t.classList.toggle('on',!!on)}
function lvStart(){
 if(LV.on||!G||!G.online||!OL.on||!LV.snaps.length)return;
 LV.real=G;LV.g=lvGhost();LV.on=true;LV.f=null;LV.drawnAt=0;LV.holdAt=0;
 show(null);lvStep();cam.x=camTarget();lvTag(true)}
function lvStop(){LV.on=false;LV.g=null;LV.f=null;LV.real=null;if(LV.ht){clearTimeout(LV.ht);LV.ht=0}lvTag(false)}
function lvFall(){ /* back to the still frame, silently; this snap is not tried again */
 LV.deadS=LV.s;lvStop();OL.vk='';if(OL.on&&OL.room)olRoute()}
/* the camera: the engine's own follow rules, guessed from where the ball is (the stream has no phase) */
function lvCamF(g,b){
 const near=(e,r)=>Math.hypot(e.x-b.x,e.y-b.y)<r;
 if(b.z<.4){const car=g.recs.find(r=>near(r,1.4));if(car&&!near(g.qb,1.6))return car.x+9;if(near(g.qb,1.6))return g.qb.x+16;const d=g.defs.find(e=>near(e,1.4));if(d)return d.x-5}

/* one step per frame (called by update() in p4.js while the live view is on) */
function lvStep(){

 g.bp=bl;g.clock=a.clock+(b.clock-a.clock)*f;
 if(!LV.drawnAt){LV.f=lvCamF(g,bl);if(LV.endT!=null&&pt>=LV.endT){LV.drawnAt=T;g.play.phase='done';g.hold=true;if(LV.holdAt){if(LV.ht)clearTimeout(LV.ht);LV.ht=setTimeout(()=>{LV.ht=0;if(OL.on)olRoute()},510)}}} /* the END is on screen: a held banner may go half a second later */

/* the real G is swapped for the ghost for the length of one render + banner update, and nothing else (p4.js frame) */
function lvDraw(){const real=G;G=LV.g;try{render();ghUpdate()}finally{G=real}}
/* the banner waits for the live play: when the new state arrives while the ghost is on, hold it (and the apply that goes with it) until the END has been drawn + 0.5 s, never longer than 3 s after the state arrived. Called at the top of olRoute. */

/* ---------- game setup ---------- */
const cam={x:0},ctrl={dir:0,ptr:false,ty:20};
let fx=[];
const pop=(t,x,y,c)=>fx.push({t,x,y,c:c||'#fff',life:1});
function mk(k,x,y,ex){return Object.assign({k,x,y,x0:x,y0:y,vx:0,vy:0,stun:0,cool:0,wait:0,inv:0,stumble:0,ph:Math.random()*2},ex)}
function startGame(){

/* odApply(out,c): out is simOpp's result (out.sub = 'td' | 'fg' | 'fgm' | 'punt' | 'to'); c = {start,edge,k,late,trail,lead,style}. Rewrites out.plays, out.time, out.yd (drive yards) and adds out.log (one string per play) and out.plt (game seconds per play). */

/* v2.21 odCut(out): AN OPPONENT DRIVE ENDS WHEN THE HALF OR THE GAME RUNS OUT. Called by oppDrive right after simOpp, before the drive's stats, score or clock are touched, so the report screen and the banner both get it.

/* v2.14: UPGRADES MAKE THE OPPONENT'S DRIVES BEHAVE AS IF THE LEVEL WERE HIGHER. upSpent() = the credits spent on the ratings that decide the opponent's drives: RUNNING BK, O-LINE and DEFENSE (S.r.rb, S.r.ol, S.r.def) and the roster's QB arm and accuracy and WR1, WR2, WR3 speed and catching (S.ro, if it exists; it is never created here). TE and kicker are not counted. A rating v has cost the sum of upCost(r) for r = 4 .. v-1 (4 = 0, 5 = 3, 6 = 7, 7 = 12, 8 = 17, 9 = 23, 10 = 30); 4 or less counts 0. Worked out from the current ratings at every drive; nothing is saved. */
const UPSHIFT=4.5; /* levels of extra difficulty per 100 credits spent */

const RELIEF_SLOPE=10;  /* v2.28: was 4.5 (bots chat measurement).  levels of EASIER play per 100 credits-equivalent below the league average (the same as UPSHIFT to start) */
const RELIEF_CAP=-3;    /* the most extra levels of relief (a negative shift) */
function upSpent(){

/* v2.24: teamPower() = the ONE number the opponent's difficulty shift reads (credits-equivalent). Simple leagues (NFL, college, anything that is not Standard): exactly upSpent(), the same code as before (the AI teams sit at rating 4 = 0 credits, so "above the league" and "credits spent" are the same). Standard league: my team above the AVERAGE of the other 7 teams, in credits, never below 0 (std.js stdPower). Worked out fresh at every drive; nothing is saved. */
function teamPower(){return S&&S.std?stdPower():upSpent()}

function simOpp(start,call){

const RUSHT=[1,1,1,1,1,.9,.8,.7];   /* sack-clock multiplier by number of rushers */
let DEFFORCE=null,LOOKFORCE=null;
function pickWeighted(){let t=0;for(const s of DEFD)t+=s.w||1;let r=Math.random()*t;for(const s of DEFD){r-=s.w||1;if(r<=0)return s}return DEFD[0]}
/* ---------- difficulty (v1.51): 1-10, 5 is the normal game. It only changes the defense ---------- */
const DIFF=()=>clamp(Math.round(S.diff||5),1,10),DK=()=>DIFF()-5;
const DNAMES=['ROOKIE','ROOKIE','EASY','EASY','PRO','HARD','HARD','ALL-PRO','ALL-PRO','LEGEND'],dName=()=>DNAMES[DIFF()-1];
const dTrk=()=>1+.03*DK();      /* how fast defenders close on the ball in the air */
const dSpd=()=>1+.035*DK();     /* top speed of every defender */
const dReact=()=>1-.06*DK();    /* defenders' reaction delay multiplier */
const dSack=()=>1-.05*DK();     /* sack clock multiplier: lower = quicker pass rush */
const dDisg=()=>clamp(DISGUISE+.08*DK(),.1,.92);  /* how often the defense shows a disguised look */
/* smarter play calls: a defense score from the down, the distance, the field position and how deep your called play goes */
function playDepth(){let m=0;for(const r of G.recs){if(!r.path)continue;let x=r.x0;for(const p of r.path)x=Math.max(x,p.x);m=Math.max(m,x-G.los)}return m}
function defScore(d,c){
 let R=0,M=0,Z=0;for(const s of[...d.lb,...d.db]){if(!s.as)R++;else if(s.as.m!=null)M++;else Z++}
 const two=d.hi>=2?1:0;let s=0;
 if(c.togo>=8)s+=.8*two+.1*Z-1*R;else if(c.togo<=3)s+=.6*R+.3*M-.8*two;
 if(c.los>=88)s+=.4*M-.6*two+.3*R;
 if(c.depth>=20)s+=.7*two-.6*R;else if(c.depth<=10)s+=.4*M+.4*R;
 return s}
function pickDef(){
 if(DEFFORCE)return DEFD.find(d=>d.id===DEFFORCE)||pickWeighted();
 const k=DK();if(k===0||!G.recs)return pickWeighted();
 const c={togo:Math.max(0,G.fd-G.los),los:G.los,depth:playDepth()};
 const cand=DEFD.map(d=>({d,s:defScore(d,c)+Math.random()*.3})).sort((a,b)=>b.s-a.s);
 if(k>0){if(Math.random()<Math.min(.75,k*.15))return cand[Math.random()<.7?0:1].d}
 else if(Math.random()<-k*.12)return cand[cand.length-1-(Math.random()<.5?1:0)].d; /* an easy defense sometimes makes a bad call */
 return pickWeighted()}
/* DISGUISE: before the snap the defense lines up in a "look" (the alignment of another scheme) and at the
   snap the defenders rotate into the scheme they really play (G.def). Roughly half the snaps are disguised.
   LOOKS lists believable looks for each real scheme: two-high shells rotate into one-high and the reverse. */
const DISGUISE=.5;
/* looks are always a plain base shell. A two-high real defense (hi 2) usually shows a one-high look and the
   reverse; blitzes, man and zero schemes show a base shell too, so pressure comes from a normal-looking front */
const SHELLS=['c1','c3','t2','c4','c2'];
function pickLook(real){
 if(LOOKFORCE==='none')return real;
 if(real.db.some(s=>!s.as))return real;   /* a back who rushes is already at linebacker depth: no disguise */
 if(LOOKFORCE){const f=DEFD.find(d=>d.id===LOOKFORCE);return f||real}
 if(Math.random()>=dDisg())return real;
 const hi=id=>DEFD.find(d=>d.id===id).hi>=2,rh=real.hi>=2;
 const opp=SHELLS.filter(id=>id!==real.id&&hi(id)!==rh),any=SHELLS.filter(id=>id!==real.id);
 const id=pick(opp.length&&Math.random()<.7+.04*DK()?opp:any);return DEFD.find(d=>d.id===id)||real}
function alignDef(){
 const l=G.los,D=G.look||G.def,cl=x=>Math.min(x,109);
 const put=(d,a)=>{const q=a(l,G.recs);d.x=d.x0=cl(q.x);d.y=d.y0=clamp(q.y,1.5,38.5);d.vx=d.vy=0};
 D.lb.forEach((s,i)=>put(G.lb[i],s.al));D.db.forEach((s,i)=>put(G.db[i],s.al))}
/* hand out the assignments at the snap of a pass */
function assignDef(){
 const D=G.def;G.cover=[];G.zone=[];G.rush=[...G.dl];
 const go=(d,a)=>{if(a&&a.m!=null)G.cover.push([d,G.recs[a.m]]);else if(a&&a.z)G.zone.push([d,{dep:a.z[0],y:a.z[1],w:a.z[2]}]);else G.rush.push(d)};
 D.lb.forEach((s,i)=>go(G.lb[i],s.as));D.db.forEach((s,i)=>go(G.db[i],s.as));
 /* v1.46: if no defender is on the RB, the linebacker closest to him drops his zone and covers him man to man */
 const rb=G.recs[3];
 if(!G.cover.some(c=>c[1]===rb)){let best=null,bd=99;for(const z of G.zone){if(!G.lb.includes(z[0]))continue;const q=Math.abs(z[0].y-rb.y);if(q<bd){bd=q;best=z}}
  if(best){G.zone.splice(G.zone.indexOf(best),1);G.cover.push([best[0],rb])}}
 /* v1.62: the tight end gets a defender too. Measured before: he was the open man twice as often as a wide receiver (49% vs about 24% more than 4.5 yards from anyone, 70 to 84% against the blitzing schemes) because no scheme covers him man to man. The nearest linebacker who is in a zone drops it and covers him; if every linebacker is rushing or on the RB, the nearest blitzer comes off the rush (as long as 5 or more still rush) */
 const te=G.recs[4];
 if(!G.cover.some(c=>c[1]===te)){let best=null,bd=99;
  for(const z of G.zone){if(!G.lb.includes(z[0]))continue;const q=Math.abs(z[0].y-te.y);if(q<bd){bd=q;best=z}}
  if(best){G.zone.splice(G.zone.indexOf(best),1);G.cover.push([best[0],te])}
  else{let bl=null,b2=99;for(const lb of G.lb)if(G.rush.includes(lb)){const q=Math.abs(lb.y-te.y);if(q<b2){b2=q;bl=lb}}
   if(bl&&G.rush.length>=5){G.rush.splice(G.rush.indexOf(bl),1);G.cover.push([bl,te])}}}}
/* zone defenders: cover a receiver who enters the zone, else drop to the spot */
function zoneStep(d,z,p,dt){
 const l=G.los;
 if(p.phase==='air'&&p.dtrks&&p.dtrks.includes(d)){steer(d,p.land.x,p.land.y,G.wrS*1.15*PRE_DEF,45,dt);mv(d,dt);return}
 if(p.phase==='air'&&dst(d,p.land)<6){steer(d,p.land.x,p.land.y,d.spd*.8,26,dt);mv(d,dt);return}
 const deep=z.dep>=15,xa=deep?l+z.dep-9:l+1,xb=l+z.dep+(deep?14:4);
 let tgt=null,bd=99;
 /* v1.62: a deep zone defender picks the deepest receiver in his area (not just the nearest), stays 2.5 yards over the top of him and closes at 90% speed (was 55%); shallow zones close at 65% */
 if(p.t>d.delay+.3)for(const r of G.recs)if(Math.abs(r.y-z.y)<z.w&&r.x>=xa&&r.x<=xb){const q=dst(d,r),sc=deep?q-(r.x-l)*.12:q;if(q<(deep?9:6)&&sc<bd){bd=sc;tgt=r}}
 if(tgt)steer(d,tgt.x+(deep?2.5:.5),tgt.y,d.spd*(deep?.9:.65),24,dt);
 else steer(d,Math.min(l+z.dep,d.x0+p.t*6,108),z.y,d.spd*.7,22,dt);
 mv(d,dt)}
